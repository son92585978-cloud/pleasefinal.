:"A: Is there an ATM near here?\nB: Yes, inside the convenience store.","caution":"","dialogues":["A: Is there an ATM near here?\nB: Yes, inside the convenience store.","A: Is there an ATM that accepts foreign cards?\nB: Yes, there is one next to the bank entrance."],"similar":"","note":"","ko_dialogue":"A: 이 근처에 현금인출기가 있나요?\nB: 네, 편의점 안에 있어요.","dialogue_pairs":[{"en":"A: Is there an ATM near here?\nB: Yes, inside the convenience store.","ko":"A: 이 근처에 현금인출기가 있나요?\nB: 네, 편의점 안에 있어요."},{"en":"A: Is there an ATM that accepts foreign cards?\nB: Yes, there is one next to the bank entrance.","ko":"A: 해외 카드를 받는 ATM이 있나요?\nB: 네, 은행 입구 옆에 하나 있습니다."}],"pronunciation":"에이티엠","id":78},{"day":8,"num":10,"word":"withdraw","meaning":"인출하다","hint":"","mnemonic":"withdraw [위드드로] → “위에서 드르륵 돈이 나와!”\nATM에서 돈이 위쪽 출구로 드르륵 빠져나오는 모습을 붙입니다.\n위 + 드르륵 ≈ 위드드로.\n→ withdraw = 인출하다","dialogue":"A: Can I withdraw cash with this card?\nB: Yes. Insert it and choose your language.","caution":"ATM에서는 withdraw cash가 기본 표현. withdraw money도 가능하지만 cash가 더 자연스럽습니다.","dialogues":["A: Can I withdraw cash with this card?\nB: Yes. Insert it and choose your language.","A: I need to withdraw some cash before we leave town.\nB: There is an ATM across from the station."],"similar":"withdraw = 인출하다 / withdrawal = 인출(명사) / deposit = 입금·보증금","note":"ATM에서는 withdraw cash가 기본 표현. withdraw money도 가능하지만 cash가 더 자연스럽습니다.","ko_dialogue":"A: 이 카드로 현금을 인출할 수 있나요?\nB: 네. 카드를 넣고 언어를 선택하세요.","dialogue_pairs":[{"en":"A: Can I withdraw cash with this card?\nB: Yes. Insert it and choose your language.","ko":"A: 이 카드로 현금을 인출할 수 있나요?\nB: 네. 카드를 넣고 언어를 선택하세요."},{"en":"A: I need to withdraw some cash before we leave town.\nB: There is an ATM across from the station.","ko":"A: 시내를 떠나기 전에 현금을 좀 인출해야 해요.\nB: 역 맞은편에 ATM이 있습니다."}],"pronunciation":"위드드로","id":79},{"day":9,"num":1,"word":"confirm","meaning":"확인하다","hint":"","mnemonic":"confirm [컨펌] → “최종 컨펌 받았어?” = 확인·확정됐어?\nfirm = 확고한 → 내용을 확고하게 만든다.\n→ confirm = 확인하다 / 확정하다","dialogue":"A: I would like to confirm my reservation for tonight.\nB: Certainly. What name is it under?","caution":"confirm은 이미 잡힌 내용이 맞는지 확인·확정할 때 자주 씁니다. verify는 신분·정보가 진짜인지 검증하는 느낌이 더 강합니다.","dialogues":["A: I would like to confirm my reservation for tonight.\nB: Certainly. What name is it under?","A: Could you confirm my pickup time for tomorrow?\nB: Yes, the driver will be here at seven thirty."],"similar":"check = 확인하다 / verify = 사실인지 검증하다 / make sure = 확실히 하다 / approve = 승인하다","note":"confirm은 이미 잡힌 내용이 맞는지 확인·확정할 때 자주 씁니다. verify는 신분·정보가 진짜인지 검증하는 느낌이 더 강합니다.","ko_dialogue":"A: 오늘 밤 예약을 확인하고 싶어요.\nB: 네. 어떤 이름으로 예약하셨나요?","dialogue_pairs":[{"en":"A: I would like to confirm my reservation for tonight.\nB: Certainly. What name is it under?","ko":"A: 오늘 밤 예약을 확인하고 싶어요.\nB: 네. 어떤 이름으로 예약하셨나요?"},{"en":"A: Could you confirm my pickup time for tomorrow?\nB: Yes, the driver will be here at seven thirty.","ko":"A: 내일 픽업 시간을 확인해주시겠어요?\nB: 네, 기사님이 7시 30분에 올 예정입니다."}],"pronunciation":"컨펌","id":80},{"day":9,"num":2,"word":"entrance","meaning":"입구","hint":"","mnemonic":"entrance [엔트런스] → “엔터를 누르니 들어간다!”\n키보드의 엔터(enter) 키가 사람만큼 큰 문이 되었습니다. 엔터를 누르자 문이 열리고 건물 안으로 들어갑니다.\n엔터 → 들어가다 → 들어가는 문 → entrance = 입구.","dialogue":"A: Is this the entrance to the museum?\nB: Yes. Please have your ticket ready.","caution":"","dialogues":["A: Is this the entrance to the museum?\nB: Yes. Please have your ticket ready.","A: I cannot find the museum entrance.\nB: It is around the corner on the left."],"similar":"","note":"","ko_dialogue":"A: 여기가 박물관 입구인가요?\nB: 네. 표를 준비해주세요.","dialogue_pairs":[{"en":"A: Is this the entrance to the museum?\nB: Yes. Please have your ticket ready.","ko":"A: 여기가 박물관 입구인가요?\nB: 네. 표를 준비해주세요."},{"en":"A: I cannot find the museum entrance.\nB: It is around the corner on the left.","ko":"A: 박물관 입구를 못 찾겠어요.\nB: 왼쪽 모퉁이를 돌면 있습니다."}],"pronunciation":"엔트런스","id":81},{"day":9,"num":3,"word":"last","meaning":"마지막의, 지난, 지속되다","hint":"","mnemonic":"last [래스트] → 줄의 맨 끝에 마지막 하나가 남아 있다.\n→ last = 마지막의\n시간 앞에서는 ‘지난’ → last week = 지난주","dialogue":"A: What time is the last bus?\nB: At eleven thirty tonight.","caution":"","dialogues":["A: What time is the last bus?\nB: At eleven thirty tonight.","A: How long does the show last?\nB: About an hour."],"similar":"","note":"","ko_dialogue":"A: 막차가 몇 시인가요?\nB: 오늘 밤 11시 30분입니다.","dialogue_pairs":[{"en":"A: What time is the last bus?\nB: At eleven thirty tonight.","ko":"A: 막차가 몇 시인가요?\nB: 오늘 밤 11시 30분입니다."},{"en":"A: How long does the show last?\nB: About an hour.","ko":"A: 공연은 얼마나 오래 진행되나요?\nB: 약 한 시간이에요."}],"pronunciation":"래스트","id":82},{"day":9,"num":4,"word":"break","meaning":"쉬다, 깨뜨리다, 잔돈으로 바꾸다","hint":"","mnemonic":"break [브레이크] → ‘깨다/끊다’.\n물건을 깨고, 일의 흐름을 끊고 쉬고, 큰돈을 쪼갠다.\n→ break = 깨다 / 쉬다 / 쪼개다","dialogue":"A: Can we take a break here?\nB: Sure. Let us sit down for a few minutes.","caution":"","dialogues":["A: Can we take a break here?\nB: Sure. Let us sit down for a few minutes.","A: Let us take a break before we climb the hill.\nB: Good idea. There is a cafe over there."],"similar":"","note":"","ko_dialogue":"A: 여기에서 잠깐 쉬어도 될까요?\nB: 그럼요. 몇 분간 앉아서 쉬어요.","dialogue_pairs":[{"en":"A: Can we take a break here?\nB: Sure. Let us sit down for a few minutes.","ko":"A: 여기에서 잠깐 쉬어도 될까요?\nB: 그럼요. 몇 분간 앉아서 쉬어요."},{"en":"A: Let us take a break before we climb the hill.\nB: Good idea. There is a cafe over there.","ko":"A: 언덕 올라가기 전에 잠깐 쉬어요.\nB: 좋아요. 저쪽에 카페가 있네요."}],"pronunciation":"브레이크","id":83},{"day":9,"num":5,"word":"party","meaning":"파티, 일행","hint":"","mnemonic":"party [파티] → “같은 파티에 온 사람은 한 일행!”\n생일 파티에 친구 네 명이 함께 왔습니다. 직원이 인원을 묻자 네 명이 동시에 손을 듭니다.\n같은 파티에 함께 온 무리 → party = 파티 / 일행.","dialogue":"A: How many people are in your party?\nB: Four, including two children.","caution":"","dialogues":["A: How many people are in your party?\nB: Four, including two children.","A: How many people are in your party?\nB: There are five of us."],"similar":"","note":"","ko_dialogue":"A: 일행이 몇 분이세요?\nB: 아이 두 명을 포함해서 네 명이에요.","dialogue_pairs":[{"en":"A: How many people are in your party?\nB: Four, including two children.","ko":"A: 일행이 몇 분이세요?\nB: 아이 두 명을 포함해서 네 명이에요."},{"en":"A: How many people are in your party?\nB: There are five of us.","ko":"A: 일행이 몇 분이신가요?\nB: 저희는 다섯 명입니다."}],"pronunciation":"파티","id":84},{"day":9,"num":6,"word":"exhibit","meaning":"전시하다, 전시품","hint":"","mnemonic":"exhibit [이그지빗] → “이거, 집에 두지 말고 보여줘!”\n멋진 그림을 집 안에만 두자 친구가 말합니다. “이거 집에 숨겨두지 말고 밖에 걸어 보여줘!” 그림을 꺼내 사람들이 보게 전시합니다.\n이거 + 집에 → 이그지… → 밖에 꺼내 전시하다.\n→ exhibit = 전시하다 / 전시품","dialogue":"A: Where is the dinosaur exhibit?\nB: On the second floor, next to the stairs.","caution":"","dialogues":["A: Where is the dinosaur exhibit?\nB: On the second floor, next to the stairs.","A: Which floor has the photography exhibit?\nB: The exhibit is on the second floor."],"similar":"","note":"","ko_dialogue":"A: 공룡 전시는 어디에 있나요?\nB: 2층 계단 옆에 있어요.","dialogue_pairs":[{"en":"A: Where is the dinosaur exhibit?\nB: On the second floor, next to the stairs.","ko":"A: 공룡 전시는 어디에 있나요?\nB: 2층 계단 옆에 있어요."},{"en":"A: Which floor has the photography exhibit?\nB: The exhibit is on the second floor.","ko":"A: 사진 전시는 몇 층에 있나요?\nB: 전시는 2층에 있습니다."}],"pronunciation":"이그지빗","id":85},{"day":9,"num":7,"word":"take a picture","meaning":"사진을 찍다","hint":"","mnemonic":"take a picture [테이크 어 픽처] → 사진 한 장을 ‘취한다(take)’.\n→ take a picture = 사진을 찍다","dialogue":"A: Could you take a picture of us?\nB: Of course. Stand a little closer together.","caution":"","dialogues":["A: Could you take a picture of us?\nB: Of course. Stand a little closer together.","A: Could you take a picture of us in front of the temple?\nB: Of course. Stand a little closer together."],"similar":"","note":"","ko_dialogue":"A: 저희 사진을 찍어주시겠어요?\nB: 물론이죠. 서로 조금 더 가까이 서세요.","dialogue_pairs":[{"en":"A: Could you take a picture of us?\nB: Of course. Stand a little closer together.","ko":"A: 저희 사진을 찍어주시겠어요?\nB: 물론이죠. 서로 조금 더 가까이 서세요."},{"en":"A: Could you take a picture of us in front of the temple?\nB: Of course. Stand a little closer together.","ko":"A: 사원 앞에서 저희 사진 좀 찍어주시겠어요?\nB: 물론이죠. 조금 더 가까이 서세요."}],"pronunciation":"테이크 어 픽처","id":86},{"day":9,"num":8,"word":"refundable","meaning":"환불 가능한","hint":"","mnemonic":"refundable [리펀더블] → refund(환불) + able(~할 수 있는).\n→ refundable = 환불 가능한","dialogue":"A: Is this ticket refundable?\nB: Yes, if you cancel before Friday.","caution":"refundable = 환불 가능. non-refundable = 환불 불가. 호텔 예약에서 매우 자주 보입니다.","dialogues":["A: Is this ticket refundable?\nB: Yes, if you cancel before Friday.","A: Is this ticket refundable if my plans change?\nB: Yes, until twenty-four hours before departure."],"similar":"","note":"refundable = 환불 가능. non-refundable = 환불 불가. 호텔 예약에서 매우 자주 보입니다.","ko_dialogue":"A: 이 표는 환불이 가능한가요?\nB: 네, 금요일 전에 취소하시면 가능합니다.","dialogue_pairs":[{"en":"A: Is this ticket refundable?\nB: Yes, if you cancel before Friday.","ko":"A: 이 표는 환불이 가능한가요?\nB: 네, 금요일 전에 취소하시면 가능합니다."},{"en":"A: Is this ticket refundable if my plans change?\nB: Yes, until twenty-four hours before departure.","ko":"A: 일정이 바뀌면 이 표는 환불 가능한가요?\nB: 네, 출발 24시간 전까지 가능합니다."}],"pronunciation":"리펀더블","id":87},{"day":9,"num":9,"word":"provide","meaning":"제공하다","hint":"","mnemonic":"provide [프로바이드] → “프로가 필요한 바를 다 제공!”\n프로 가이드가 빈손으로 온 여행객에게 지도도 주고 물도 줍니다. “필요한 바를 다 준비했어요.”\n프로 + 바를 + 다 → 프로바이드 → 필요한 것을 제공하다.","dialogue":"A: Do you provide towels at the pool?\nB: Yes. You can get one at the entrance.","caution":"","dialogues":["A: Do you provide towels at the pool?\nB: Yes. You can get one at the entrance.","A: Does the hotel provide airport transportation?\nB: Yes, we have a shuttle every hour."],"similar":"","note":"","ko_dialogue":"A: 수영장에서 수건을 제공하나요?\nB: 네. 입구에서 받으실 수 있어요.","dialogue_pairs":[{"en":"A: Do you provide towels at the pool?\nB: Yes. You can get one at the entrance.","ko":"A: 수영장에서 수건을 제공하나요?\nB: 네. 입구에서 받으실 수 있어요."},{"en":"A: Does the hotel provide airport transportation?\nB: Yes, we have a shuttle every hour.","ko":"A: 호텔에서 공항 교통편을 제공하나요?\nB: 네, 매시간 셔틀이 있습니다."}],"pronunciation":"프로바이드","id":88},{"day":9,"num":10,"word":"tourist attraction","meaning":"관광명소","hint":"","mnemonic":"tourist attraction [투어리스트 어트랙션]\ntourist = 관광객, attraction = 끌어당기는 것.\n관광객을 끌어당기는 곳.\n→ tourist attraction = 관광명소","dialogue":"A: Which tourist attraction is closest to the hotel?\nB: The palace. It is a ten-minute walk.","caution":"","dialogues":["A: Which tourist attraction is closest to the hotel?\nB: The palace. It is a ten-minute walk.","A: What is the most popular tourist attraction nearby?\nB: The old castle is only ten minutes away."],"similar":"","note":"","ko_dialogue":"A: 호텔에서 가장 가까운 관광명소가 어디인가요?\nB: 궁전이요. 걸어서 10분 거리입니다.","dialogue_pairs":[{"en":"A: Which tourist attraction is closest to the hotel?\nB: The palace. It is a ten-minute walk.","ko":"A: 호텔에서 가장 가까운 관광명소가 어디인가요?\nB: 궁전이요. 걸어서 10분 거리입니다."},{"en":"A: What is the most popular tourist attraction nearby?\nB: The old castle is only ten minutes away.","ko":"A: 근처에서 가장 인기 있는 관광명소가 어디인가요?\nB: 오래된 성이 10분 거리에 있습니다."}],"pronunciation":"투어리스트 어트랙션","id":89},{"day":10,"num":1,"word":"crowded","meaning":"붐비는","hint":"","mnemonic":"crowded [크라우디드] → “크~ 와르르 몰려 꽉 찼네!”\n거리 공연을 보려고 사람들이 와르르 몰립니다. 사람 무리(crowd)가 골목을 가득 메워 지나가기도 어렵습니다.\n크 + 와르르 → crowd, 그 무리로 가득한 상태 → crowded = 붐비는.","dialogue":"A: Is the market crowded on weekends?\nB: Yes. It is quieter early in the morning.","caution":"crowded는 사람이 많아 붐비는 상태. busy는 장소가 분주하다는 뜻으로도 씁니다.","dialogues":["A: Is the market crowded on weekends?\nB: Yes. It is quieter early in the morning.","A: Is the market always this crowded on weekends?\nB: Yes, mornings are usually a little quieter."],"similar":"busy = 붐비는 / packed = 꽉 찬 / empty = 비어 있는","note":"crowded는 사람이 많아 붐비는 상태. busy는 장소가 분주하다는 뜻으로도 씁니다.","ko_dialogue":"A: 주말에 시장이 붐비나요?\nB: 네. 이른 아침에는 더 한산해요.","dialogue_pairs":[{"en":"A: Is the market crowded on weekends?\nB: Yes. It is quieter early in the morning.","ko":"A: 주말에 시장이 붐비나요?\nB: 네. 이른 아침에는 더 한산해요."},{"en":"A: Is the market always this crowded on weekends?\nB: Yes, mornings are usually a little quieter.","ko":"A: 주말에는 시장이 항상 이렇게 붐비나요?\nB: 네, 보통 아침이 조금 덜 붐빕니다."}],"pronunciation":"크라우디드","id":90},{"day":10,"num":2,"word":"celebrate","meaning":"축하하다, 기념하다","hint":"","mnemonic":"celebrate [셀러브레이트] → “셀럽의 생일을 다 같이 축하!”\n셀럽이 생일 케이크 앞에 서자 사람들이 박수를 치고 축하 노래를 부릅니다. 케이크의 촛불이 번쩍입니다.\n셀럽을 향한 축하 → 셀러브… → celebrate = 축하하다, 기념하다.","dialogue":"A: We are here to celebrate our anniversary.\nB: Congratulations! Would you like a table by the window?","caution":"","dialogues":["A: We are here to celebrate our anniversary.\nB: Congratulations! Would you like a table by the window?","A: We are here to celebrate our anniversary.\nB: Congratulations. I can arrange a small dessert for you."],"similar":"","note":"","ko_dialogue":"A: 기념일을 축하하러 왔어요.\nB: 축하드려요! 창가 자리를 원하시나요?","dialogue_pairs":[{"en":"A: We are here to celebrate our anniversary.\nB: Congratulations! Would you like a table by the window?","ko":"A: 기념일을 축하하러 왔어요.\nB: 축하드려요! 창가 자리를 원하시나요?"},{"en":"A: We are here to celebrate our anniversary.\nB: Congratulations. I can arrange a small dessert for you.","ko":"A: 저희는 결혼기념일을 기념하러 왔어요.\nB: 축하드립니다. 작은 디저트를 준비해드릴 수 있어요."}],"pronunciation":"셀러브레이트","id":91},{"day":10,"num":3,"word":"be in the mood","meaning":"~할 기분이다","hint":"","mnemonic":"be in the mood [비 인 더 무드] → 그 기분(mood) 안에 있다.\n→ be in the mood = ~할 기분이다","dialogue":"A: What are you in the mood for?\nB: I am in the mood for some noodles.","caution":"","dialogues":["A: What are you in the mood for?\nB: I am in the mood for some noodles.","A: I am in the mood for something spicy tonight.\nB: Then you should try the curry place nearby."],"similar":"","note":"","ko_dialogue":"A: 무엇을 먹고 싶은 기분이에요?\nB: 국수가 먹고 싶어요.","dialogue_pairs":[{"en":"A: What are you in the mood for?\nB: I am in the mood for some noodles.","ko":"A: 무엇을 먹고 싶은 기분이에요?\nB: 국수가 먹고 싶어요."},{"en":"A: I am in the mood for something spicy tonight.\nB: Then you should try the curry place nearby.","ko":"A: 오늘 저녁은 매운 게 당겨요.\nB: 그럼 근처 카레집을 가보세요."}],"pronunciation":"비 인 더 무드","id":92},{"day":10,"num":4,"word":"walking distance","meaning":"걸어서 갈 수 있는 거리","hint":"","mnemonic":"walking distance [워킹 디스턴스]\nwalking = 걸어서, distance = 거리.\n→ walking distance = 걸어서 갈 수 있는 거리","dialogue":"A: Is the beach within walking distance?\nB: Yes, it is about ten minutes on foot.","caution":"within walking distance = 걸어서 갈 수 있는 거리. 호텔 위치 설명에서 자주 나옵니다.","dialogues":["A: Is the beach within walking distance?\nB: Yes, it is about ten minutes on foot.","A: Is the night market within walking distance?\nB: Yes, it is about fifteen minutes on foot."],"similar":"","note":"within walking distance = 걸어서 갈 수 있는 거리. 호텔 위치 설명에서 자주 나옵니다.","ko_dialogue":"A: 해변은 걸어서 갈 수 있는 거리인가요?\nB: 네, 걸어서 약 10분이에요.","dialogue_pairs":[{"en":"A: Is the beach within walking distance?\nB: Yes, it is about ten minutes on foot.","ko":"A: 해변은 걸어서 갈 수 있는 거리인가요?\nB: 네, 걸어서 약 10분이에요."},{"en":"A: Is the night market within walking distance?\nB: Yes, it is about fifteen minutes on foot.","ko":"A: 야시장이 걸어서 갈 수 있는 거리인가요?\nB: 네, 걸어서 약 15분입니다."}],"pronunciation":"워킹 디스턴스","id":93},{"day":10,"num":5,"word":"down the street","meaning":"길 따라 조금 내려가면","hint":"","mnemonic":"down the street [다운 더 스트리트] → 길(street)을 따라 쭉 내려간다.\n→ down the street = 길을 따라 조금 내려가서","dialogue":"A: Where is the bakery?\nB: Just down the street, on your left.","caution":"","dialogues":["A: Where is the bakery?\nB: Just down the street, on your left.","A: There is a bakery just down the street.\nB: Great, let us stop there for breakfast."],"similar":"","note":"","ko_dialogue":"A: 빵집은 어디에 있나요?\nB: 길을 따라 조금 가시면 왼쪽에 있어요.","dialogue_pairs":[{"en":"A: Where is the bakery?\nB: Just down the street, on your left.","ko":"A: 빵집은 어디에 있나요?\nB: 길을 따라 조금 가시면 왼쪽에 있어요."},{"en":"A: There is a bakery just down the street.\nB: Great, let us stop there for breakfast.","ko":"A: 길 따라 조금 내려가면 빵집이 있어요.\nB: 좋아요, 아침 먹으러 들러요."}],"pronunciation":"다운 더 스트리트","id":94},{"day":10,"num":6,"word":"want to","meaning":"~하고 싶다","hint":"","mnemonic":"want to [원트 투] → want(원하다) + to(할).\n→ want to = ~하고 싶다","dialogue":"A: Do you want to visit the museum today?\nB: Yes, but let us have lunch first.","caution":"want to + 동사원형. 더 공손하게는 I'd like to ~.","dialogues":["A: Do you want to visit the museum today?\nB: Yes, but let us have lunch first.","A: I want to see the city from the river.\nB: Then you should take the evening boat tour."],"similar":"","note":"want to + 동사원형. 더 공손하게는 I'd like to ~.","ko_dialogue":"A: 오늘 박물관에 가고 싶으세요?\nB: 네. 그런데 먼저 점심을 먹어요.","dialogue_pairs":[{"en":"A: Do you want to visit the museum today?\nB: Yes, but let us have lunch first.","ko":"A: 오늘 박물관에 가고 싶으세요?\nB: 네. 그런데 먼저 점심을 먹어요."},{"en":"A: I want to see the city from the river.\nB: Then you should take the evening boat tour.","ko":"A: 강에서 도시를 보고 싶어요.\nB: 그럼 저녁 보트 투어를 타보세요."}],"pronunciation":"원트 투","id":95},{"day":10,"num":7,"word":"public transportation","meaning":"대중교통","hint":"","mnemonic":"public transportation [퍼블릭 트랜스포테이션]\npublic = 공공, transportation = 교통/운송.\n→ public transportation = 대중교통","dialogue":"A: Can I get to the airport by public transportation?\nB: Yes. The subway goes straight there.","caution":"미국에서는 public transportation, 영국에서는 public transport가 더 흔합니다.","dialogues":["A: Can I get to the airport by public transportation?\nB: Yes. The subway goes straight there.","A: Is public transportation easy to use here?\nB: Yes, one travel card works on buses and trains."],"similar":"","note":"미국에서는 public transportation, 영국에서는 public transport가 더 흔합니다.","ko_dialogue":"A: 대중교통으로 공항에 갈 수 있나요?\nB: 네. 지하철이 바로 갑니다.","dialogue_pairs":[{"en":"A: Can I get to the airport by public transportation?\nB: Yes. The subway goes straight there.","ko":"A: 대중교통으로 공항에 갈 수 있나요?\nB: 네. 지하철이 바로 갑니다."},{"en":"A: Is public transportation easy to use here?\nB: Yes, one travel card works on buses and trains.","ko":"A: 여기 대중교통 이용하기 쉬운가요?\nB: 네, 교통카드 하나로 버스와 기차를 모두 탈 수 있어요."}],"pronunciation":"퍼블릭 트랜스포테이션","id":96},{"day":10,"num":8,"word":"station","meaning":"역, 정거장","hint":"","mnemonic":"station [스테이션] → “잠깐 스테이하고 다시 가는 곳!”\n기차가 잠시 머무르자 사람들이 내리고 올라탑니다. 잠깐의 스테이(stay)가 끝나면 다시 출발합니다.\n기차가 머무르는 곳 → 스테이션 → 역.\n※ stay는 기억을 돕는 소리 연결입니다.","dialogue":"A: How far is the station?\nB: About five minutes on foot.","caution":"","dialogues":["A: How far is the station?\nB: About five minutes on foot.","A: Which station is closest to the old town?\nB: Central Station. It is about a ten-minute walk."],"similar":"station = 역 / stop = 정류장 / terminal = 터미널","note":"","ko_dialogue":"A: 역은 얼마나 먼가요?\nB: 걸어서 약 5분이에요.","dialogue_pairs":[{"en":"A: How far is the station?\nB: About five minutes on foot.","ko":"A: 역은 얼마나 먼가요?\nB: 걸어서 약 5분이에요."},{"en":"A: Which station is closest to the old town?\nB: Central Station. It is about a ten-minute walk.","ko":"A: 구시가지에서 가장 가까운 역은 어디인가요?\nB: 중앙역입니다. 걸어서 약 10분이에요."}],"pronunciation":"스테이션","id":97},{"day":10,"num":9,"word":"stop","meaning":"정류장, 멈추다","hint":"","mnemonic":"stop [스탑] = 멈추다.\n버스가 멈추는 곳도 bus stop.\n→ stop = 멈추다 / 정류장","dialogue":"A: Which stop should I get off at?\nB: The next stop, Central Market.","caution":"","dialogues":["A: Which stop should I get off at?\nB: The next stop, Central Market.","A: Is this the right stop for the museum?\nB: No, get off at the next stop."],"similar":"stop = 정류장 / station = 역 / terminal = 터미널","note":"","ko_dialogue":"A: 어느 정류장에서 내려야 하나요?\nB: 다음 정류장인 센트럴 마켓에서요.","dialogue_pairs":[{"en":"A: Which stop should I get off at?\nB: The next stop, Central Market.","ko":"A: 어느 정류장에서 내려야 하나요?\nB: 다음 정류장인 센트럴 마켓에서요."},{"en":"A: Is this the right stop for the museum?\nB: No, get off at the next stop.","ko":"A: 박물관 가려면 이 정류장에서 내리나요?\nB: 아니요, 다음 정류장에서 내리세요."}],"pronunciation":"스탑","id":98},{"day":10,"num":10,"word":"catch","meaning":"잡다, (버스·기차를) 타다","hint":"","mnemonic":"catch [캐치] = 잡다.\n떠나기 전 버스·기차를 ‘잡아탄다’.\n→ catch = 잡다 / (교통편을) 타다","dialogue":"A: Can we still catch the nine o’clock train?\nB: Yes, if we leave now.","caution":"","dialogues":["A: Can we still catch the nine o’clock train?\nB: Yes, if we leave now.","A: We need to catch the last train back to the city.\nB: Then we should leave by ten."],"similar":"","note":"","ko_dialogue":"A: 9시 기차를 아직 탈 수 있을까요?\nB: 네, 지금 출발하면요.","dialogue_pairs":[{"en":"A: Can we still catch the nine o’clock train?\nB: Yes, if we leave now.","ko":"A: 9시 기차를 아직 탈 수 있을까요?\nB: 네, 지금 출발하면요."},{"en":"A: We need to catch the last train back to the city.\nB: Then we should leave by ten.","ko":"A: 시내로 돌아가는 막차를 타야 해요.\nB: 그럼 10시까지는 출발해야겠네요."}],"pronunciation":"캐치","id":99},{"day":11,"num":1,"word":"head to","meaning":"~로 향하다","hint":"","mnemonic":"head to [헤드 투] → 머리(head)와 몸의 방향을 목적지 쪽으로 둔다.\n→ head to = ~로 향하다","dialogue":"A: Shall we head to the hotel?\nB: Yes. I would like to drop off my bags.","caution":"head to + 장소. head for도 가능하지만 head to가 더 배우기 쉽고 흔합니다.","dialogues":["A: Shall we head to the hotel?\nB: Yes. I would like to drop off my bags.","A: We are heading to the airport after breakfast.\nB: I can call a taxi for you at eight."],"similar":"","note":"head to + 장소. head for도 가능하지만 head to가 더 배우기 쉽고 흔합니다.","ko_dialogue":"A: 호텔로 갈까요?\nB: 네. 짐을 맡기고 싶어요.","dialogue_pairs":[{"en":"A: Shall we head to the hotel?\nB: Yes. I would like to drop off my bags.","ko":"A: 호텔로 갈까요?\nB: 네. 짐을 맡기고 싶어요."},{"en":"A: We are heading to the airport after breakfast.\nB: I can call a taxi for you at eight.","ko":"A: 아침 먹고 공항으로 갈 거예요.\nB: 8시에 택시를 불러드릴게요."}],"pronunciation":"헤드 투","id":100},{"day":11,"num":2,"word":"cost","meaning":"비용이 들다, 비용","hint":"","mnemonic":"cost [코스트] → “여행 코스마다 돈이 든다!”\n박물관 코스, 배 타는 코스, 식사 코스를 하나씩 고를 때마다 지갑에서 돈이 나갑니다.\n코스마다 드는 돈 → 코스트 → 비용 / 비용이 들다.","dialogue":"A: How much does the airport shuttle cost?\nB: Twelve dollars each way.","caution":"","dialogues":["A: How much does the airport shuttle cost?\nB: Twelve dollars each way.","A: How much does it cost to rent a bike for the day?\nB: It is eighteen dollars including a helmet."],"similar":"fee = 수수료·서비스 요금 / fare = 교통요금 / price = 가격 / cost = 비용","note":"","ko_dialogue":"A: 공항 셔틀 요금은 얼마인가요?\nB: 편도 12달러입니다.","dialogue_pairs":[{"en":"A: How much does the airport shuttle cost?\nB: Twelve dollars each way.","ko":"A: 공항 셔틀 요금은 얼마인가요?\nB: 편도 12달러입니다."},{"en":"A: How much does it cost to rent a bike for the day?\nB: It is eighteen dollars including a helmet.","ko":"A: 자전거를 하루 빌리는 데 얼마예요?\nB: 헬멧 포함 18달러입니다."}],"pronunciation":"코스트","id":101},{"day":11,"num":3,"word":"keep","meaning":"유지하다, 보관하다","hint":"","mnemonic":"keep [킵] → 계속 가지고 있는다.\n계속 가진다 → 유지한다 / 보관한다.\n→ keep = 유지하다 / 보관하다","dialogue":"A: Should I keep this receipt?\nB: Yes, you need it to collect your luggage.","caution":"","dialogues":["A: Should I keep this receipt?\nB: Yes, you need it to collect your luggage.","A: Can I keep this key until tomorrow morning?\nB: Yes, just return it when you check out."],"similar":"store = 보관하다 / keep = 보관하다 / storage = 보관","note":"","ko_dialogue":"A: 이 영수증을 보관해야 하나요?\nB: 네, 짐을 찾을 때 필요합니다.","dialogue_pairs":[{"en":"A: Should I keep this receipt?\nB: Yes, you need it to collect your luggage.","ko":"A: 이 영수증을 보관해야 하나요?\nB: 네, 짐을 찾을 때 필요합니다."},{"en":"A: Can I keep this key until tomorrow morning?\nB: Yes, just return it when you check out.","ko":"A: 이 열쇠를 내일 아침까지 가지고 있어도 되나요?\nB: 네, 체크아웃할 때 반납하시면 됩니다."}],"pronunciation":"킵","id":102},{"day":11,"num":4,"word":"rent","meaning":"빌리다, 임대하다","hint":"","mnemonic":"렌터카를 빌릴 때의 rent.\nrent a car = 차를 빌리다. 돈을 내고 일정 기간 사용하는 뜻이에요.","dialogue":"A: I would like to rent a bicycle for two hours.\nB: Sure. Please choose one over here.","caution":"","dialogues":["A: I would like to rent a bicycle for two hours.\nB: Sure. Please choose one over here.","A: Where can we rent two bicycles?\nB: There is a rental shop beside the park."],"similar":"","note":"","ko_dialogue":"A: 자전거를 두 시간 빌리고 싶어요.\nB: 네. 이쪽에서 한 대 고르세요.","dialogue_pairs":[{"en":"A: I would like to rent a bicycle for two hours.\nB: Sure. Please choose one over here.","ko":"A: 자전거를 두 시간 빌리고 싶어요.\nB: 네. 이쪽에서 한 대 고르세요."},{"en":"A: Where can we rent two bicycles?\nB: There is a rental shop beside the park.","ko":"A: 자전거 두 대를 어디에서 빌릴 수 있나요?\nB: 공원 옆에 대여점이 있습니다."}],"pronunciation":"렌트","id":103},{"day":11,"num":5,"word":"rate","meaning":"요금, 비율, 평가하다","hint":"","mnemonic":"rate [레이트] → “하루가 늦어지니 하루 요금이 더!”\n호텔에서 하루 더 머물기로 했습니다. 출발이 하루 늦어져(late) 하루치 숙박 요금을 더 계산합니다.\n늦어진 하루 ↔ 하루당 얼마인지 정해진 rate → 요금.\nlate는 소리 연상일 뿐이며, rate 자체가 ‘늦다’라는 뜻은 아닙니다.","dialogue":"A: What is the nightly rate?\nB: Eighty dollars, including tax.","caution":"","dialogues":["A: What is the nightly rate?\nB: Eighty dollars, including tax.","A: What is the nightly rate for a double room?\nB: It is one hundred and forty dollars before tax."],"similar":"rate = 요율·객실요금 / price = 가격 / fare = 교통요금","note":"","ko_dialogue":"A: 1박 요금이 얼마인가요?\nB: 세금을 포함해서 80달러입니다.","dialogue_pairs":[{"en":"A: What is the nightly rate?\nB: Eighty dollars, including tax.","ko":"A: 1박 요금이 얼마인가요?\nB: 세금을 포함해서 80달러입니다."},{"en":"A: What is the nightly rate for a double room?\nB: It is one hundred and forty dollars before tax.","ko":"A: 더블룸 1박 요금이 얼마인가요?\nB: 세금 전 140달러입니다."}],"pronunciation":"레이트","id":104},{"day":11,"num":6,"word":"get to","meaning":"도착하다, ~에 이르다","hint":"","mnemonic":"get to [겟 투] → get(이르다) + to(~에).\n→ get to = ~에 도착하다","dialogue":"A: How do I get to the old town?\nB: Take bus number five from this stop.","caution":"이 표현 뒤에는 보통 동사원형이 옵니다. 여행에서 바로 문장으로 붙여 쓰는 연습을 하세요.","dialogues":["A: How do I get to the old town?\nB: Take bus number five from this stop.","A: What is the easiest way to get to the airport?\nB: Take the express train from Central Station."],"similar":"arrive = 도착하다 / reach = 도착하다 / get to = ~에 도착하다","note":"이 표현 뒤에는 보통 동사원형이 옵니다. 여행에서 바로 문장으로 붙여 쓰는 연습을 하세요.","ko_dialogue":"A: 구시가지에는 어떻게 가나요?\nB: 이 정류장에서 5번 버스를 타세요.","dialogue_pairs":[{"en":"A: How do I get to the old town?\nB: Take bus number five from this stop.","ko":"A: 구시가지에는 어떻게 가나요?\nB: 이 정류장에서 5번 버스를 타세요."},{"en":"A: What is the easiest way to get to the airport?\nB: Take the express train from Central Station.","ko":"A: 공항까지 가장 쉽게 가는 방법이 무엇인가요?\nB: 중앙역에서 급행열차를 타세요."}],"pronunciation":"겟 투","id":105},{"day":11,"num":7,"word":"come with","meaning":"함께 오다, 포함되다","hint":"","mnemonic":"come with [컴 위드] → 함께(with) 온다(come).\n→ come with = ~이 딸려오다 / 함께 오다","dialogue":"A: Does this sandwich come with fries?\nB: Yes, and a small drink.","caution":"","dialogues":["A: Does this sandwich come with fries?\nB: Yes, and a small drink.","A: Does this room come with breakfast?\nB: Yes, breakfast for two is included."],"similar":"","note":"","ko_dialogue":"A: 이 샌드위치에는 감자튀김이 같이 나오나요?\nB: 네, 작은 음료도 함께 나옵니다.","dialogue_pairs":[{"en":"A: Does this sandwich come with fries?\nB: Yes, and a small drink.","ko":"A: 이 샌드위치에는 감자튀김이 같이 나오나요?\nB: 네, 작은 음료도 함께 나옵니다."},{"en":"A: Does this room come with breakfast?\nB: Yes, breakfast for two is included.","ko":"A: 이 객실에는 조식이 포함되나요?\nB: 네, 2인 조식이 포함되어 있습니다."}],"pronunciation":"컴 위드","id":106},{"day":11,"num":8,"word":"driver's license","meaning":"운전면허증","hint":"","mnemonic":"driver's license [드라이버즈 라이선스]\ndriver = 운전자, license = 면허.\n→ driver's license = 운전면허증","dialogue":"A: May I see your driver’s license?\nB: Yes. Here it is, along with my passport.","caution":"미국에서는 driver’s license, 영국에서는 driving licence라고 씁니다.","dialogues":["A: May I see your driver’s license?\nB: Yes. Here it is, along with my passport.","A: Do I need an international driver's license to rent a car?\nB: Yes, please bring it with your passport."],"similar":"","note":"미국에서는 driver’s license, 영국에서는 driving licence라고 씁니다.","ko_dialogue":"A: 운전면허증을 보여주시겠어요?\nB: 네. 여권과 함께 여기 있습니다.","dialogue_pairs":[{"en":"A: May I see your driver’s license?\nB: Yes. Here it is, along with my passport.","ko":"A: 운전면허증을 보여주시겠어요?\nB: 네. 여권과 함께 여기 있습니다."},{"en":"A: Do I need an international driver's license to rent a car?\nB: Yes, please bring it with your passport.","ko":"A: 렌터카를 빌리려면 국제운전면허증이 필요한가요?\nB: 네, 여권과 함께 가져오세요."}],"pronunciation":"드라이버즈 라이선스","id":107},{"day":11,"num":9,"word":"include","meaning":"포함하다","hint":"","mnemonic":"include [인클루드]\nin = 안에\nclude [클루드] → “끌어둬!”\n안으로 끌어다가 같이 둡니다.\n→ include = 포함하다","dialogue":"A: Does the room price include breakfast?\nB: Yes, for two people.","caution":"","dialogues":["A: Does the room price include breakfast?\nB: Yes, for two people.","A: Does the price include the ferry ticket?\nB: Yes, the ferry and lunch are both included."],"similar":"","note":"","ko_dialogue":"A: 객실 요금에 아침 식사가 포함되나요?\nB: 네, 두 분 조식이 포함됩니다.","dialogue_pairs":[{"en":"A: Does the room price include breakfast?\nB: Yes, for two people.","ko":"A: 객실 요금에 아침 식사가 포함되나요?\nB: 네, 두 분 조식이 포함됩니다."},{"en":"A: Does the price include the ferry ticket?\nB: Yes, the ferry and lunch are both included.","ko":"A: 가격에 페리 표가 포함되나요?\nB: 네, 페리와 점심 모두 포함되어 있습니다."}],"pronunciation":"인클루드","id":108},{"day":11,"num":10,"word":"insert","meaning":"넣다","hint":"","mnemonic":"insert [인서트] → 영상의 ‘인서트 컷’처럼 중간에 끼워 넣는다.\n→ insert = 삽입하다 / 넣다","dialogue":"A: Where should I insert my card?\nB: In the slot at the bottom.","caution":"","dialogues":["A: Where should I insert my card?\nB: In the slot at the bottom.","A: Insert your ticket into the machine here.\nB: Do I get the same ticket back?"],"similar":"","note":"","ko_dialogue":"A: 카드는 어디에 넣어야 하나요?\nB: 아래쪽 투입구에 넣으세요.","dialogue_pairs":[{"en":"A: Where should I insert my card?\nB: In the slot at the bottom.","ko":"A: 카드는 어디에 넣어야 하나요?\nB: 아래쪽 투입구에 넣으세요."},{"en":"A: Insert your ticket into the machine here.\nB: Do I get the same ticket back?","ko":"A: 여기에 표를 기계에 넣으세요.\nB: 같은 표가 다시 나오나요?"}],"pronunciation":"인서트","id":109},{"day":12,"num":1,"word":"fine","meaning":"좋은, 괜찮은 / 벌금","hint":"","mnemonic":"fine [파인] → “파인 곳에 주차했다가 벌금!”\n주차 금지 구역의 움푹 파인 자리에도 차를 세웠습니다. 돌아오니 벌금 고지서가 붙어 있습니다.\n파인 곳에 세웠다가 벌금 → fine = 벌금.\n익숙한 I am fine.의 fine은 ‘괜찮은’이라는 별도의 뜻입니다.","dialogue":"A: Is this table okay?\nB: Yes, it is fine. Thank you.","caution":"","dialogues":["A: Is this table okay?\nB: Yes, it is fine. Thank you.","A: What is this fine for?\nB: For parking in a restricted area."],"similar":"","note":"","ko_dialogue":"A: 이 자리 괜찮으세요?\nB: 네, 괜찮아요. 감사합니다.","dialogue_pairs":[{"en":"A: Is this table okay?\nB: Yes, it is fine. Thank you.","ko":"A: 이 자리 괜찮으세요?\nB: 네, 괜찮아요. 감사합니다."},{"en":"A: What is this fine for?\nB: For parking in a restricted area.","ko":"A: 이 벌금은 무엇 때문인가요?\nB: 주차 제한 구역에 주차하셨기 때문입니다."}],"pronunciation":"파인","id":110},{"day":12,"num":2,"word":"get on","meaning":"타다","hint":"","mnemonic":"get on [겟 온] → 탈것 위(on)로 올라간다.\n→ get on = 타다","dialogue":"A: Where do we get on the airport bus?\nB: Outside exit three.","caution":"","dialogues":["A: Where do we get on the airport bus?\nB: Outside exit three.","A: Where do I get on the airport bus?\nB: At stop number five outside the terminal."],"similar":"","note":"","ko_dialogue":"A: 공항버스는 어디에서 타나요?\nB: 3번 출구 밖에서요.","dialogue_pairs":[{"en":"A: Where do we get on the airport bus?\nB: Outside exit three.","ko":"A: 공항버스는 어디에서 타나요?\nB: 3번 출구 밖에서요."},{"en":"A: Where do I get on the airport bus?\nB: At stop number five outside the terminal.","ko":"A: 공항버스는 어디에서 타나요?\nB: 터미널 밖 5번 정류장에서 타세요."}],"pronunciation":"겟 온","id":111},{"day":12,"num":3,"word":"miss","meaning":"놓치다, 그리워하다","hint":"","mnemonic":"miss [미스] → 목표를 맞히지 못하고 놓친다.\n버스·기차도 놓치면 miss.\n→ miss = 놓치다 / 그리워하다","dialogue":"A: I missed my train. Can I use this ticket on the next one?\nB: Let me check your ticket type.","caution":"","dialogues":["A: I missed my train. Can I use this ticket on the next one?\nB: Let me check your ticket type.","A: I think we are going to miss our connection.\nB: Let us ask the airline desk for help."],"similar":"","note":"","ko_dialogue":"A: 기차를 놓쳤어요. 이 표로 다음 기차를 탈 수 있나요?\nB: 표 종류를 확인해볼게요.","dialogue_pairs":[{"en":"A: I missed my train. Can I use this ticket on the next one?\nB: Let me check your ticket type.","ko":"A: 기차를 놓쳤어요. 이 표로 다음 기차를 탈 수 있나요?\nB: 표 종류를 확인해볼게요."},{"en":"A: I think we are going to miss our connection.\nB: Let us ask the airline desk for help.","ko":"A: 환승편을 놓칠 것 같아요.\nB: 항공사 데스크에 도움을 요청해봐요."}],"pronunciation":"미스","id":112},{"day":12,"num":4,"word":"transfer","meaning":"갈아타다, 환승하다","hint":"","mnemonic":"transfer [트랜스퍼] → trans-(건너) + fer(나르다).\n한 곳에서 다른 곳으로 옮겨 탄다.\n→ transfer = 환승하다 / 옮기다","dialogue":"A: Do I need to transfer?\nB: Yes. Change to the blue line at Central Station.","caution":"","dialogues":["A: Do I need to transfer?\nB: Yes. Change to the blue line at Central Station.","A: Do I need to transfer to another line at City Hall?\nB: Yes, change to the blue line there."],"similar":"","note":"","ko_dialogue":"A: 환승해야 하나요?\nB: 네. 중앙역에서 파란색 노선으로 갈아타세요.","dialogue_pairs":[{"en":"A: Do I need to transfer?\nB: Yes. Change to the blue line at Central Station.","ko":"A: 환승해야 하나요?\nB: 네. 중앙역에서 파란색 노선으로 갈아타세요."},{"en":"A: Do I need to transfer to another line at City Hall?\nB: Yes, change to the blue line there.","ko":"A: 시청역에서 다른 노선으로 갈아타야 하나요?\nB: 네, 거기서 파란색 노선으로 갈아타세요."}],"pronunciation":"트랜스퍼","id":113},{"day":12,"num":5,"word":"behind schedule","meaning":"예정보다 늦은","hint":"","mnemonic":"behind schedule [비하인드 스케줄]\nbehind = 뒤에, schedule = 일정.\n일정보다 뒤처져 있다.\n→ behind schedule = 예정보다 늦게","dialogue":"A: Are we behind schedule?\nB: Yes, about fifteen minutes because of traffic.","caution":"behind schedule = 지연, ahead of schedule = 예정보다 빠름, on schedule = 예정대로.","dialogues":["A: Are we behind schedule?\nB: Yes, about fifteen minutes because of traffic.","A: The tour bus is running behind schedule.\nB: We should arrive about twenty minutes late."],"similar":"","note":"behind schedule = 지연, ahead of schedule = 예정보다 빠름, on schedule = 예정대로.","ko_dialogue":"A: 예정보다 늦어지고 있나요?\nB: 네, 교통 체증 때문에 약 15분 늦어지고 있어요.","dialogue_pairs":[{"en":"A: Are we behind schedule?\nB: Yes, about fifteen minutes because of traffic.","ko":"A: 예정보다 늦어지고 있나요?\nB: 네, 교통 체증 때문에 약 15분 늦어지고 있어요."},{"en":"A: The tour bus is running behind schedule.\nB: We should arrive about twenty minutes late.","ko":"A: 투어 버스가 예정보다 늦게 운행되고 있어요.\nB: 약 20분 늦게 도착할 것 같습니다."}],"pronunciation":"비하인드 스케줄","id":114},{"day":12,"num":6,"word":"right on schedule","meaning":"정시에","hint":"","mnemonic":"right on schedule [라이트 온 스케줄]\nright = 정확히, on schedule = 일정대로.\n→ right on schedule = 정확히 예정대로","dialogue":"A: Is the tour leaving late?\nB: No, we are right on schedule.","caution":"","dialogues":["A: Is the tour leaving late?\nB: No, we are right on schedule.","A: The train left right on schedule.\nB: Good, we should reach the airport on time."],"similar":"","note":"","ko_dialogue":"A: 투어가 늦게 출발하나요?\nB: 아니요, 정확히 예정대로 진행되고 있어요.","dialogue_pairs":[{"en":"A: Is the tour leaving late?\nB: No, we are right on schedule.","ko":"A: 투어가 늦게 출발하나요?\nB: 아니요, 정확히 예정대로 진행되고 있어요."},{"en":"A: The train left right on schedule.\nB: Good, we should reach the airport on time.","ko":"A: 기차가 정확히 정시에 출발했어요.\nB: 좋아요, 공항에 제시간에 도착하겠네요."}],"pronunciation":"라이트 온 스케줄","id":115},{"day":12,"num":7,"word":"ahead of schedule","meaning":"예정보다 빠른","hint":"","mnemonic":"ahead of schedule [어헤드 어브 스케줄]\nahead = 앞서, schedule = 일정.\n→ ahead of schedule = 예정보다 일찍","dialogue":"A: We arrived ahead of schedule.\nB: Great. We have time for coffee.","caution":"","dialogues":["A: We arrived ahead of schedule.\nB: Great. We have time for coffee.","A: We arrived ahead of schedule.\nB: Great, we have time for coffee before check-in."],"similar":"","note":"","ko_dialogue":"A: 예정보다 일찍 도착했네요.\nB: 좋아요. 커피 마실 시간이 있겠어요.","dialogue_pairs":[{"en":"A: We arrived ahead of schedule.\nB: Great. We have time for coffee.","ko":"A: 예정보다 일찍 도착했네요.\nB: 좋아요. 커피 마실 시간이 있겠어요."},{"en":"A: We arrived ahead of schedule.\nB: Great, we have time for coffee before check-in.","ko":"A: 예정보다 일찍 도착했어요.\nB: 잘됐네요, 체크인 전에 커피 마실 시간이 있어요."}],"pronunciation":"어헤드 어브 스케줄","id":116},{"day":12,"num":8,"word":"available","meaning":"이용 가능한, 남아 있는","hint":"","mnemonic":"available [어베일러블] → “어, 비어! 빌릴 수 있네!”\n숙소를 찾다가 빈방 하나를 발견했습니다. 직원이 열쇠를 내밀자 “어, 비어 있네! 오늘 빌릴 수 있겠네!” 합니다.\n어 + 비어 + 빌릴 → 어베일러블 → 이용 가능한, 남아 있는.\n사람에게 쓰면 그 시간에 다른 일정이 없어 시간을 낼 수 있다는 뜻도 됩니다.","dialogue":"A: Do you have any rooms available tonight?\nB: Yes, we have one double room left.","caution":"available은 방·좌석·상품·사람의 시간까지 넓게 씁니다. vacant는 주로 방·좌석처럼 ‘비어 있음’에 가깝습니다.","dialogues":["A: Do you have any rooms available tonight?\nB: Yes, we have one double room left.","A: Are any window seats still available?\nB: Yes, there is one in row eighteen."],"similar":"vacant = 비어 있는 / free = 무료인·시간이 비는 / open = 열려 있는 / in stock = 재고가 있는","note":"available은 방·좌석·상품·사람의 시간까지 넓게 씁니다. vacant는 주로 방·좌석처럼 ‘비어 있음’에 가깝습니다.","ko_dialogue":"A: 오늘 밤 이용 가능한 객실이 있나요?\nB: 네, 더블룸 하나가 남아 있어요.","dialogue_pairs":[{"en":"A: Do you have any rooms available tonight?\nB: Yes, we have one double room left.","ko":"A: 오늘 밤 이용 가능한 객실이 있나요?\nB: 네, 더블룸 하나가 남아 있어요."},{"en":"A: Are any window seats still available?\nB: Yes, there is one in row eighteen.","ko":"A: 창가 좌석이 아직 남아 있나요?\nB: 네, 18열에 한 자리 있습니다."}],"pronunciation":"어베일러블","id":117},{"day":12,"num":9,"word":"request","meaning":"요청하다, 요청","hint":"","mnemonic":"request [리퀘스트] → “우리, 이거 해주겠어?”\n상대에게 무언가를 해달라고 부탁합니다.\n리…해주겠어? → 리퀘스트 소리와 요청하는 말을 연결.\n→ request = 요청하다 / 요청","dialogue":"A: Could I request a quiet room?\nB: Certainly. I will check what is available.","caution":"","dialogues":["A: Could I request a quiet room?\nB: Certainly. I will check what is available.","A: I would like to request a room away from the elevator.\nB: I will add that request to your booking."],"similar":"","note":"","ko_dialogue":"A: 조용한 객실을 요청해도 될까요?\nB: 네. 가능한 객실을 확인해볼게요.","dialogue_pairs":[{"en":"A: Could I request a quiet room?\nB: Certainly. I will check what is available.","ko":"A: 조용한 객실을 요청해도 될까요?\nB: 네. 가능한 객실을 확인해볼게요."},{"en":"A: I would like to request a room away from the elevator.\nB: I will add that request to your booking.","ko":"A: 엘리베이터에서 먼 객실을 요청하고 싶어요.\nB: 예약에 그 요청을 추가해드릴게요."}],"pronunciation":"리퀘스트","id":118},{"day":12,"num":10,"word":"if possible","meaning":"가능하다면","hint":"","mnemonic":"if possible [이프 파서블] → if(만약) + possible(가능한).\n→ if possible = 가능하다면","dialogue":"A: I would like a window seat, if possible.\nB: Let me see if we have one.","caution":"","dialogues":["A: I would like a window seat, if possible.\nB: Let me see if we have one.","A: Could we sit outside, if possible?\nB: Certainly. A patio table will be free in a few minutes."],"similar":"","note":"","ko_dialogue":"A: 가능하다면 창가 좌석으로 부탁드려요.\nB: 남아 있는지 확인해볼게요.","dialogue_pairs":[{"en":"A: I would like a window seat, if possible.\nB: Let me see if we have one.","ko":"A: 가능하다면 창가 좌석으로 부탁드려요.\nB: 남아 있는지 확인해볼게요."},{"en":"A: Could we sit outside, if possible?\nB: Certainly. A patio table will be free in a few minutes.","ko":"A: 가능하다면 밖에 앉을 수 있을까요?\nB: 물론입니다. 몇 분 뒤 야외 자리가 납니다."}],"pronunciation":"이프 파서블","id":119},{"day":13,"num":1,"word":"run out of","meaning":"~이 떨어지다","hint":"","mnemonic":"run out of [런 아웃 어브] → 안에 있던 것이 전부 밖으로(run out) 빠져나가 없다.\n→ run out of = ~이 떨어지다 / 다 써버리다","dialogue":"A: We have run out of toilet paper.\nB: Sorry about that. I will send some up now.","caution":"run out of water = 물이 떨어지다. 사람이 다 떨어지는 게 아니라 ‘재고가 없어짐’.","dialogues":["A: We have run out of toilet paper.\nB: Sorry about that. I will send some up now.","A: We ran out of cash at the night market.\nB: There is an ATM near the entrance."],"similar":"","note":"run out of water = 물이 떨어지다. 사람이 다 떨어지는 게 아니라 ‘재고가 없어짐’.","ko_dialogue":"A: 화장지가 다 떨어졌어요.\nB: 죄송합니다. 지금 객실로 보내드릴게요.","dialogue_pairs":[{"en":"A: We have run out of toilet paper.\nB: Sorry about that. I will send some up now.","ko":"A: 화장지가 다 떨어졌어요.\nB: 죄송합니다. 지금 객실로 보내드릴게요."},{"en":"A: We ran out of cash at the night market.\nB: There is an ATM near the entrance.","ko":"A: 야시장에서 현금이 다 떨어졌어요.\nB: 입구 근처에 ATM이 있습니다."}],"pronunciation":"런 아웃 어브","id":120},{"day":13,"num":2,"word":"work","meaning":"일하다, 작동하다","hint":"","mnemonic":"work [워크] → “워크숍에서 사람도 일하고 기계도 돌아간다!”\n워크숍의 작업대에서 사람이 일을 합니다. 옆 기계도 윙윙 돌아가며 일을 합니다. 기계가 멈추면 더는 일을 못 합니다.\n사람이 work → 일하다. 기계가 work → 작동하다.\n워크숍 안의 사람과 기계를 함께 연결합니다.","dialogue":"A: The air conditioner does not work.\nB: I am sorry. I will send someone to check it.","caution":"","dialogues":["A: The air conditioner does not work.\nB: I am sorry. I will send someone to check it.","A: Does this card work on the subway?\nB: Yes, it works on buses too."],"similar":"","note":"","ko_dialogue":"A: 에어컨이 작동하지 않아요.\nB: 죄송합니다. 점검할 직원을 보내드릴게요.","dialogue_pairs":[{"en":"A: The air conditioner does not work.\nB: I am sorry. I will send someone to check it.","ko":"A: 에어컨이 작동하지 않아요.\nB: 죄송합니다. 점검할 직원을 보내드릴게요."},{"en":"A: Does this card work on the subway?\nB: Yes, it works on buses too.","ko":"A: 이 카드는 지하철에서도 쓸 수 있나요?\nB: 네, 버스에서도 쓸 수 있어요."}],"pronunciation":"워크","id":121},{"day":13,"num":3,"word":"front desk","meaning":"프런트 데스크","hint":"","mnemonic":"front desk [프런트 데스크]\nfront = 앞, desk = 데스크.\n호텔 앞쪽에서 손님을 맞는 데스크.\n→ front desk = 프런트 데스크","dialogue":"A: Where is the front desk?\nB: On the ground floor, beside the entrance.","caution":"호텔에서는 front desk가 자연스럽고, reception/reception desk도 자주 씁니다.","dialogues":["A: Where is the front desk?\nB: On the ground floor, beside the entrance.","A: Could you leave this package at the front desk?\nB: Sure, we will keep it there for you."],"similar":"","note":"호텔에서는 front desk가 자연스럽고, reception/reception desk도 자주 씁니다.","ko_dialogue":"A: 프런트 데스크는 어디에 있나요?\nB: 지상층 입구 옆에 있어요.","dialogue_pairs":[{"en":"A: Where is the front desk?\nB: On the ground floor, beside the entrance.","ko":"A: 프런트 데스크는 어디에 있나요?\nB: 지상층 입구 옆에 있어요."},{"en":"A: Could you leave this package at the front desk?\nB: Sure, we will keep it there for you.","ko":"A: 이 소포를 프런트 데스크에 맡겨도 될까요?\nB: 네, 보관해드리겠습니다."}],"pronunciation":"프런트 데스크","id":122},{"day":13,"num":4,"word":"ID","meaning":"신분증","hint":"","mnemonic":"ID [아이디] = identification의 줄임말.\n나를 확인(identify)하는 것.\n→ ID = 신분증 / 신원 확인","dialogue":"A: Do I need to show my ID?\nB: Yes, a passport is fine.","caution":"","dialogues":["A: Do I need to show my ID?\nB: Yes, a passport is fine.","A: Do I need to show ID to pick up the tickets?\nB: Yes, a passport or driver's license is fine."],"similar":"","note":"","ko_dialogue":"A: 신분증을 보여드려야 하나요?\nB: 네, 여권이면 됩니다.","dialogue_pairs":[{"en":"A: Do I need to show my ID?\nB: Yes, a passport is fine.","ko":"A: 신분증을 보여드려야 하나요?\nB: 네, 여권이면 됩니다."},{"en":"A: Do I need to show ID to pick up the tickets?\nB: Yes, a passport or driver's license is fine.","ko":"A: 표를 찾으려면 신분증을 보여줘야 하나요?\nB: 네, 여권이나 운전면허증이면 됩니다."}],"pronunciation":"아이디","id":123},{"day":13,"num":5,"word":"smoking","meaning":"흡연","hint":"","mnemonic":"smoking [스모킹] → smoke(담배 피우다) + -ing.\n→ smoking = 흡연","dialogue":"A: Is there a smoking area?\nB: Yes, outside at the back of the building.","caution":"","dialogues":["A: Is there a smoking area?\nB: Yes, outside at the back of the building.","A: Is there a smoking area near this gate?\nB: No, the nearest one is outside security."],"similar":"","note":"","ko_dialogue":"A: 흡연 구역이 있나요?\nB: 네, 건물 뒤쪽 밖에 있어요.","dialogue_pairs":[{"en":"A: Is there a smoking area?\nB: Yes, outside at the back of the building.","ko":"A: 흡연 구역이 있나요?\nB: 네, 건물 뒤쪽 밖에 있어요."},{"en":"A: Is there a smoking area near this gate?\nB: No, the nearest one is outside security.","ko":"A: 이 탑승구 근처에 흡연 구역이 있나요?\nB: 아니요, 가장 가까운 곳은 보안검색대 밖에 있습니다."}],"pronunciation":"스모킹","id":124},{"day":13,"num":6,"word":"upgrade","meaning":"업그레이드하다, 상향 조정","hint":"","mnemonic":"upgrade [업그레이드] → up(위로) + grade(등급).\n등급을 위로 올린다.\n→ upgrade = 업그레이드하다 / 상향하다","dialogue":"A: Can I upgrade to a room with a sea view?\nB: Yes, for an extra thirty dollars per night.","caution":"","dialogues":["A: Can I upgrade to a room with a sea view?\nB: Yes, for an extra thirty dollars per night.","A: How much would it cost to upgrade to a larger room?\nB: It is thirty dollars more per night."],"similar":"","note":"","ko_dialogue":"A: 바다가 보이는 객실로 업그레이드할 수 있나요?\nB: 네, 1박에 30달러 추가됩니다.","dialogue_pairs":[{"en":"A: Can I upgrade to a room with a sea view?\nB: Yes, for an extra thirty dollars per night.","ko":"A: 바다가 보이는 객실로 업그레이드할 수 있나요?\nB: 네, 1박에 30달러 추가됩니다."},{"en":"A: How much would it cost to upgrade to a larger room?\nB: It is thirty dollars more per night.","ko":"A: 더 큰 객실로 업그레이드하려면 얼마 더 내야 하나요?\nB: 1박에 30달러가 추가됩니다."}],"pronunciation":"업그레이드","id":125},{"day":13,"num":7,"word":"business center","meaning":"비즈니스 센터","hint":"","mnemonic":"business center [비즈니스 센터]\nbusiness = 업무, center = 공간.\n→ business center = 업무용 공간 / 비즈니스 센터","dialogue":"A: Is there a printer in the business center?\nB: Yes. You can print your tickets there.","caution":"","dialogues":["A: Is there a printer in the business center?\nB: Yes. You can print your tickets there.","A: Is the business center open all night?\nB: Yes, you can use the computers anytime."],"similar":"","note":"","ko_dialogue":"A: 비즈니스 센터에 프린터가 있나요?\nB: 네. 그곳에서 표를 출력하실 수 있어요.","dialogue_pairs":[{"en":"A: Is there a printer in the business center?\nB: Yes. You can print your tickets there.","ko":"A: 비즈니스 센터에 프린터가 있나요?\nB: 네. 그곳에서 표를 출력하실 수 있어요."},{"en":"A: Is the business center open all night?\nB: Yes, you can use the computers anytime.","ko":"A: 비즈니스 센터가 밤새 열려 있나요?\nB: 네, 언제든 컴퓨터를 이용하실 수 있습니다."}],"pronunciation":"비즈니스 센터","id":126},{"day":13,"num":8,"word":"complimentary","meaning":"무료 제공의","hint":"","mnemonic":"complimentary [컴플리멘터리] → “컵 플리즈! 맨, 더 드리!”\n컵을 달라고 하자 직원이 “더 드릴게요. 이건 서비스예요.”라고 합니다.\n컵 플리즈, 맨, 더 드리 ≈ complimentary.\n→ complimentary = 무료 제공의","dialogue":"A: Is this bottled water complimentary?\nB: Yes, the two bottles on the desk are free.","caution":"호텔·항공에서는 complimentary가 ‘무료 제공’이라는 뜻으로 아주 흔합니다. compliment(칭찬)와 철자가 비슷하지만 뜻은 다릅니다.","dialogues":["A: Is this bottled water complimentary?\nB: Yes, the two bottles on the desk are free.","A: Is the bottled water complimentary?\nB: Yes, two bottles are free each day."],"similar":"free = 무료 / included = 포함된 / on the house = 가게 서비스로 무료","note":"호텔·항공에서는 complimentary가 ‘무료 제공’이라는 뜻으로 아주 흔합니다. compliment(칭찬)와 철자가 비슷하지만 뜻은 다릅니다.","ko_dialogue":"A: 이 생수는 무료 제공인가요?\nB: 네, 책상 위의 두 병은 무료입니다.","dialogue_pairs":[{"en":"A: Is this bottled water complimentary?\nB: Yes, the two bottles on the desk are free.","ko":"A: 이 생수는 무료 제공인가요?\nB: 네, 책상 위의 두 병은 무료입니다."},{"en":"A: Is the bottled water complimentary?\nB: Yes, two bottles are free each day.","ko":"A: 생수는 무료 제공인가요?\nB: 네, 매일 두 병이 무료입니다."}],"pronunciation":"컴플리멘터리","id":127},{"day":13,"num":9,"word":"serve","meaning":"제공하다, 서빙하다","hint":"","mnemonic":"serve [서브] → server가 하는 행동.\n음식·서비스를 내준다.\n→ serve = 제공하다 / 서빙하다","dialogue":"A: Do you serve breakfast before seven?\nB: Yes, we start at six thirty.","caution":"","dialogues":["A: Do you serve breakfast before seven?\nB: Yes, we start at six thirty.","A: What time do you serve breakfast?\nB: From six thirty until ten."],"similar":"","note":"","ko_dialogue":"A: 7시 전에도 아침 식사를 제공하나요?\nB: 네, 6시 30분부터 시작합니다.","dialogue_pairs":[{"en":"A: Do you serve breakfast before seven?\nB: Yes, we start at six thirty.","ko":"A: 7시 전에도 아침 식사를 제공하나요?\nB: 네, 6시 30분부터 시작합니다."},{"en":"A: What time do you serve breakfast?\nB: From six thirty until ten.","ko":"A: 아침 식사는 몇 시부터 제공하나요?\nB: 오전 6시 30분부터 10시까지입니다."}],"pronunciation":"서브","id":128},{"day":13,"num":10,"word":"extend","meaning":"연장하다","hint":"","mnemonic":"extend [익스텐드] → ex-(밖으로) + tend(뻗다).\n밖으로 길게 뻗게 만든다.\n→ extend = 연장하다 / 늘리다","dialogue":"A: Could I extend my stay by one night?\nB: Let me check if your room is available tomorrow.","caution":"","dialogues":["A: Could I extend my stay by one night?\nB: Let me check if your room is available tomorrow.","A: Can I extend my stay by one more night?\nB: Yes, your room is available tomorrow."],"similar":"","note":"","ko_dialogue":"A: 숙박을 하루 더 연장할 수 있을까요?\nB: 내일도 같은 객실을 이용하실 수 있는지 확인해볼게요.","dialogue_pairs":[{"en":"A: Could I extend my stay by one night?\nB: Let me check if your room is available tomorrow.","ko":"A: 숙박을 하루 더 연장할 수 있을까요?\nB: 내일도 같은 객실을 이용하실 수 있는지 확인해볼게요."},{"en":"A: Can I extend my stay by one more night?\nB: Yes, your room is available tomorrow.","ko":"A: 숙박을 하루 더 연장할 수 있나요?\nB: 네, 내일도 같은 객실을 이용할 수 있습니다."}],"pronunciation":"익스텐드","id":129},{"day":14,"num":1,"word":"Let me ~.","meaning":"제가 ~할게요","hint":"","mnemonic":"Let me [렛 미] → “나를 ~하게 두세요.”\n자연스럽게 “제가 ~할게요.”\n→ Let me ~. = 제가 ~할게요","dialogue":"A: I cannot find my booking email.\nB: Let me look up your reservation by name.","caution":"","dialogues":["A: I cannot find my booking email.\nB: Let me look up your reservation by name.","A: Let me check the map before we leave.\nB: Good idea. I do not want to get lost again."],"similar":"","note":"","ko_dialogue":"A: 예약 이메일을 못 찾겠어요.\nB: 제가 성함으로 예약을 조회해볼게요.","dialogue_pairs":[{"en":"A: I cannot find my booking email.\nB: Let me look up your reservation by name.","ko":"A: 예약 이메일을 못 찾겠어요.\nB: 제가 성함으로 예약을 조회해볼게요."},{"en":"A: Let me check the map before we leave.\nB: Good idea. I do not want to get lost again.","ko":"A: 출발하기 전에 제가 지도를 확인해볼게요.\nB: 좋아요. 또 길을 잃고 싶지 않아요."}],"pronunciation":"렛 미","id":130},{"day":14,"num":2,"word":"deposit","meaning":"보증금, 입금하다","hint":"","mnemonic":"deposit [디파짓] → “뒤에 빠질 때 돌려받을 돈!”\n호텔에 들어가며 돈을 먼저 맡깁니다. 나중에 방을 확인하고 나갈 때 그 돈을 돌려받습니다.\n뒤에 + 빠질 때 → 디파짓 → 먼저 맡겨두는 보증금.\n은행에 돈을 맡겨 넣는 ‘입금’도 deposit입니다.","dialogue":"A: Do I need to pay a deposit?\nB: Yes, we hold fifty dollars on your card.","caution":"","dialogues":["A: Do I need to pay a deposit?\nB: Yes, we hold fifty dollars on your card.","A: How much is the security deposit for the rental car?\nB: We hold two hundred dollars on your card."],"similar":"","note":"","ko_dialogue":"A: 보증금을 내야 하나요?\nB: 네, 카드에 50달러를 임시로 잡아둡니다.","dialogue_pairs":[{"en":"A: Do I need to pay a deposit?\nB: Yes, we hold fifty dollars on your card.","ko":"A: 보증금을 내야 하나요?\nB: 네, 카드에 50달러를 임시로 잡아둡니다."},{"en":"A: How much is the security deposit for the rental car?\nB: We hold two hundred dollars on your card.","ko":"A: 렌터카 보증금은 얼마인가요?\nB: 카드에 200달러를 보류합니다."}],"pronunciation":"디파짓","id":131},{"day":14,"num":3,"word":"local","meaning":"현지의, 지역의","hint":"","mnemonic":"local [로컬] → “로컬 맛집” = 현지 사람들이 가는 곳.\n→ local = 현지의 / 지역의","dialogue":"A: Is there a local market nearby?\nB: Yes, it is a five-minute walk from here.","caution":"","dialogues":["A: Is there a local market nearby?\nB: Yes, it is a five-minute walk from here.","A: Where can I try some local food?\nB: The market across the river is a good place."],"similar":"","note":"","ko_dialogue":"A: 근처에 현지 시장이 있나요?\nB: 네, 여기에서 걸어서 5분 거리예요.","dialogue_pairs":[{"en":"A: Is there a local market nearby?\nB: Yes, it is a five-minute walk from here.","ko":"A: 근처에 현지 시장이 있나요?\nB: 네, 여기에서 걸어서 5분 거리예요."},{"en":"A: Where can I try some local food?\nB: The market across the river is a good place.","ko":"A: 현지 음식을 어디에서 먹어볼 수 있나요?\nB: 강 건너 시장이 좋아요."}],"pronunciation":"로컬","id":132},{"day":14,"num":4,"word":"feel free to","meaning":"편하게 ~하세요","hint":"","mnemonic":"feel free to [필 프리 투] → free = 자유로운.\n“자유롭게 ~하세요.”\n→ feel free to = 편하게 ~하세요","dialogue":"A: Feel free to use the kitchen.\nB: Thank you. Where can I find the cups?","caution":"허락·권유의 부드러운 표현. Feel free to ask. = 편하게 물어보세요.","dialogues":["A: Feel free to use the kitchen.\nB: Thank you. Where can I find the cups?","A: Feel free to leave your bags here until your room is ready.\nB: Thank you. That helps a lot."],"similar":"","note":"허락·권유의 부드러운 표현. Feel free to ask. = 편하게 물어보세요.","ko_dialogue":"A: 주방을 편하게 이용하세요.\nB: 감사합니다. 컵은 어디에 있나요?","dialogue_pairs":[{"en":"A: Feel free to use the kitchen.\nB: Thank you. Where can I find the cups?","ko":"A: 주방을 편하게 이용하세요.\nB: 감사합니다. 컵은 어디에 있나요?"},{"en":"A: Feel free to leave your bags here until your room is ready.\nB: Thank you. That helps a lot.","ko":"A: 객실이 준비될 때까지 짐을 편하게 여기 두셔도 됩니다.\nB: 감사합니다. 정말 도움이 되네요."}],"pronunciation":"필 프리 투","id":133},{"day":14,"num":5,"word":"let me show","meaning":"제가 보여드릴게요","hint":"","mnemonic":"let me show [렛 미 쇼]\nlet me = 제가 ~할게요, show = 보여주다.\n→ let me show = 제가 보여드릴게요","dialogue":"A: I cannot find our hotel on this map.\nB: Let me show you. It is right here.","caution":"","dialogues":["A: I cannot find our hotel on this map.\nB: Let me show you. It is right here.","A: Let me show you the fastest route on the map.\nB: Thanks, I was about to go the wrong way."],"similar":"","note":"","ko_dialogue":"A: 이 지도에서 저희 호텔을 못 찾겠어요.\nB: 제가 보여드릴게요. 바로 여기예요.","dialogue_pairs":[{"en":"A: I cannot find our hotel on this map.\nB: Let me show you. It is right here.","ko":"A: 이 지도에서 저희 호텔을 못 찾겠어요.\nB: 제가 보여드릴게요. 바로 여기예요."},{"en":"A: Let me show you the fastest route on the map.\nB: Thanks, I was about to go the wrong way.","ko":"A: 지도에서 가장 빠른 길을 보여드릴게요.\nB: 고마워요. 반대 방향으로 갈 뻔했네요."}],"pronunciation":"렛 미 쇼","id":134},{"day":14,"num":6,"word":"tax","meaning":"세금","hint":"","mnemonic":"tax [택스] → “택배에도 세금이 붙었네!”\n해외에서 주문한 택배가 왔습니다. 물건값만 생각했는데 세금이 더 붙어 그 돈도 냅니다.\n택배에 붙은 세금 → 택스 → tax = 세금.\n모든 택배에 세금이 붙는다는 뜻은 아니며, 소리를 붙인 한 사례입니다.","dialogue":"A: Does this price include tax?\nB: Yes, that is the final price.","caution":"","dialogues":["A: Does this price include tax?\nB: Yes, that is the final price.","A: Is tax included in this room rate?\nB: No, tax will be added at checkout."],"similar":"","note":"","ko_dialogue":"A: 이 가격에 세금이 포함되어 있나요?\nB: 네, 최종 가격입니다.","dialogue_pairs":[{"en":"A: Does this price include tax?\nB: Yes, that is the final price.","ko":"A: 이 가격에 세금이 포함되어 있나요?\nB: 네, 최종 가격입니다."},{"en":"A: Is tax included in this room rate?\nB: No, tax will be added at checkout.","ko":"A: 이 객실 요금에 세금이 포함되어 있나요?\nB: 아니요, 체크아웃할 때 세금이 추가됩니다."}],"pronunciation":"택스","id":135},{"day":14,"num":7,"word":"on sale","meaning":"세일 중인","hint":"","mnemonic":"on sale → “세일 무대에 올라온 물건!”\n원래 매대에 있던 신발을 할인 행사 무대 위(on)로 올립니다. 그 순간 가격이 내려가고 손님들이 모여듭니다.\n세일 상태 위에 올라와 있음 → on sale = 할인 판매 중.\n문맥에 따라 단순히 ‘판매 중’이라는 뜻도 있습니다.","dialogue":"A: Are these shoes on sale?\nB: Yes, they are twenty percent off today.","caution":"","dialogues":["A: Are these shoes on sale?\nB: Yes, they are twenty percent off today.","A: Are these travel adapters on sale?\nB: Yes, they are twenty percent off today."],"similar":"","note":"","ko_dialogue":"A: 이 신발은 할인 중인가요?\nB: 네, 오늘은 20퍼센트 할인입니다.","dialogue_pairs":[{"en":"A: Are these shoes on sale?\nB: Yes, they are twenty percent off today.","ko":"A: 이 신발은 할인 중인가요?\nB: 네, 오늘은 20퍼센트 할인입니다."},{"en":"A: Are these travel adapters on sale?\nB: Yes, they are twenty percent off today.","ko":"A: 이 여행용 어댑터는 세일 중인가요?\nB: 네, 오늘 20% 할인입니다."}],"pronunciation":"온 세일","id":136},{"day":14,"num":8,"word":"special offer","meaning":"특별 행사, 특별 할인","hint":"","mnemonic":"special offer [스페셜 오퍼]\nspecial = 특별한, offer = 제안/혜택.\n→ special offer = 특별 혜택 / 특가","dialogue":"A: Do you have a special offer for two nights?\nB: Yes, breakfast is free with that booking.","caution":"","dialogues":["A: Do you have a special offer for two nights?\nB: Yes, breakfast is free with that booking.","A: Do you have a special offer for three nights?\nB: Yes, the third night is half price."],"similar":"","note":"","ko_dialogue":"A: 2박 예약에 특별 혜택이 있나요?\nB: 네, 그 예약에는 조식이 무료예요.","dialogue_pairs":[{"en":"A: Do you have a special offer for two nights?\nB: Yes, breakfast is free with that booking.","ko":"A: 2박 예약에 특별 혜택이 있나요?\nB: 네, 그 예약에는 조식이 무료예요."},{"en":"A: Do you have a special offer for three nights?\nB: Yes, the third night is half price.","ko":"A: 3박 숙박에 특별 할인이 있나요?\nB: 네, 셋째 날은 반값입니다."}],"pronunciation":"스페셜 오퍼","id":137},{"day":14,"num":9,"word":"cash","meaning":"현금","hint":"","mnemonic":"cash [캐시] → “게임 캐시가 진짜 지폐로!”\n게임 속 캐시 숫자를 누르자 화면 밖으로 지폐와 동전이 쏟아지는 상상을 붙입니다. 손에 직접 쥐고 계산대에 냅니다.\n익숙한 캐시 → 손에 쥔 돈 → cash = 현금.","dialogue":"A: Can I pay in cash?\nB: Yes, but we only accept local currency.","caution":"","dialogues":["A: Can I pay in cash?\nB: Yes, but we only accept local currency.","A: I only have cash. Can I still buy a ticket here?\nB: Yes, this machine accepts both cash and cards."],"similar":"","note":"","ko_dialogue":"A: 현금으로 결제할 수 있나요?\nB: 네. 다만 현지 화폐만 받습니다.","dialogue_pairs":[{"en":"A: Can I pay in cash?\nB: Yes, but we only accept local currency.","ko":"A: 현금으로 결제할 수 있나요?\nB: 네. 다만 현지 화폐만 받습니다."},{"en":"A: I only have cash. Can I still buy a ticket here?\nB: Yes, this machine accepts both cash and cards.","ko":"A: 현금만 있는데 여기서 표를 살 수 있나요?\nB: 네, 이 기계는 현금과 카드 둘 다 받습니다."}],"pronunciation":"캐시","id":138},{"day":14,"num":10,"word":"credit card","meaning":"신용카드","hint":"","mnemonic":"credit card [크레딧 카드]\ncredit = 신용, card = 카드.\n→ credit card = 신용카드","dialogue":"A: Do you accept credit cards?\nB: Yes, you can tap your card here.","caution":"","dialogues":["A: Do you accept credit cards?\nB: Yes, you can tap your card here.","A: My credit card was declined. Can I try another one?\nB: Of course. Please insert the new card."],"similar":"","note":"","ko_dialogue":"A: 신용카드 결제가 되나요?\nB: 네, 여기에 카드를 대시면 돼요.","dialogue_pairs":[{"en":"A: Do you accept credit cards?\nB: Yes, you can tap your card here.","ko":"A: 신용카드 결제가 되나요?\nB: 네, 여기에 카드를 대시면 돼요."},{"en":"A: My credit card was declined. Can I try another one?\nB: Of course. Please insert the new card.","ko":"A: 제 신용카드가 결제되지 않았어요. 다른 카드를 써도 될까요?\nB: 물론입니다. 새 카드를 넣어주세요."}],"pronunciation":"크레딧 카드","id":139},{"day":15,"num":1,"word":"store policy","meaning":"매장 정책","hint":"","mnemonic":"store policy → “매장 안의 폴리스가 지키는 규칙!”\n매장 안에 작은 경찰관(police)이 서서 반품 기간과 교환 조건을 지키게 합니다. 직원도 손님도 그 규칙에 맞춰 행동합니다.\nstore(매장) + 폴리스와 닮은 policy 소리 → 매장에서 지키는 규정.\npolicy는 규정, police는 경찰로 서로 다른 단어입니다.","dialogue":"A: Can I return this without a receipt?\nB: Our store policy requires a receipt for returns.","caution":"환불·교환 규정 질문할 때 store policy라는 표현을 자주 씁니다.","dialogues":["A: Can I return this without a receipt?\nB: Our store policy requires a receipt for returns.","A: What is your store policy on returns?\nB: Unused items can be returned within fourteen days."],"similar":"","note":"환불·교환 규정 질문할 때 store policy라는 표현을 자주 씁니다.","ko_dialogue":"A: 영수증 없이 반품할 수 있나요?\nB: 매장 규정상 반품에는 영수증이 필요합니다.","dialogue_pairs":[{"en":"A: Can I return this without a receipt?\nB: Our store policy requires a receipt for returns.","ko":"A: 영수증 없이 반품할 수 있나요?\nB: 매장 규정상 반품에는 영수증이 필요합니다."},{"en":"A: What is your store policy on returns?\nB: Unused items can be returned within fourteen days.","ko":"A: 반품에 대한 매장 정책이 어떻게 되나요?\nB: 사용하지 않은 상품은 14일 안에 반품할 수 있습니다."}],"pronunciation":"스토어 폴리시","id":140},{"day":15,"num":2,"word":"return","meaning":"반품하다, 돌아오다","hint":"","mnemonic":"return [리턴] → “다시 턴해서 돌아간다!”\n잘못 산 물건을 들고 가던 길을 다시(re) 돌아(turn) 가게로 갑니다. 물건을 샀던 곳으로 돌려줍니다.\n다시 + 턴 → 리턴 → 돌아오다 / 돌려주다 / 반품하다.","dialogue":"A: I would like to return this shirt.\nB: Of course. Do you have the receipt?","caution":"","dialogues":["A: I would like to return this shirt.\nB: Of course. Do you have the receipt?","A: I need to return this jacket because it is too small.\nB: Do you have the receipt?"],"similar":"return = 물건을 돌려주다 / refund = 환불하다 / exchange = 교환하다","note":"","ko_dialogue":"A: 이 셔츠를 반품하고 싶어요.\nB: 네. 영수증이 있으신가요?","dialogue_pairs":[{"en":"A: I would like to return this shirt.\nB: Of course. Do you have the receipt?","ko":"A: 이 셔츠를 반품하고 싶어요.\nB: 네. 영수증이 있으신가요?"},{"en":"A: I need to return this jacket because it is too small.\nB: Do you have the receipt?","ko":"A: 이 재킷이 너무 작아서 반품하고 싶어요.\nB: 영수증이 있으신가요?"}],"pronunciation":"리턴","id":141},{"day":15,"num":3,"word":"customer service","meaning":"고객 서비스","hint":"","mnemonic":"customer service [커스터머 서비스]\ncustomer = 고객, service = 서비스.\n→ customer service = 고객 서비스","dialogue":"A: Where is the customer service desk?\nB: On the first floor, next to the escalator.","caution":"customer service desk = 고객 서비스 데스크. hotel에서는 front desk와 역할이 다를 수 있습니다.","dialogues":["A: Where is the customer service desk?\nB: On the first floor, next to the escalator.","A: Where is the customer service desk?\nB: On the ground floor beside the escalator."],"similar":"","note":"customer service desk = 고객 서비스 데스크. hotel에서는 front desk와 역할이 다를 수 있습니다.","ko_dialogue":"A: 고객 서비스 데스크는 어디인가요?\nB: 1층 에스컬레이터 옆에 있어요.","dialogue_pairs":[{"en":"A: Where is the customer service desk?\nB: On the first floor, next to the escalator.","ko":"A: 고객 서비스 데스크는 어디인가요?\nB: 1층 에스컬레이터 옆에 있어요."},{"en":"A: Where is the customer service desk?\nB: On the ground floor beside the escalator.","ko":"A: 고객 서비스 데스크는 어디인가요?\nB: 1층 에스컬레이터 옆에 있습니다."}],"pronunciation":"커스터머 서비스","id":142},{"day":15,"num":4,"word":"gift card","meaning":"상품권, 기프트카드","hint":"","mnemonic":"gift card [기프트 카드]\ngift = 선물, card = 카드.\n→ gift card = 선물용 금액 카드","dialogue":"A: Can I use this gift card here?\nB: Yes. I will check the balance for you.","caution":"gift card는 금액이 충전된 카드. coupon은 할인권이라 다릅니다.","dialogues":["A: Can I use this gift card here?\nB: Yes. I will check the balance for you.","A: Can I use this gift card at any branch?\nB: Yes, it works at all of our stores."],"similar":"","note":"gift card는 금액이 충전된 카드. coupon은 할인권이라 다릅니다.","ko_dialogue":"A: 여기에서 이 기프트카드를 쓸 수 있나요?\nB: 네. 잔액을 확인해드릴게요.","dialogue_pairs":[{"en":"A: Can I use this gift card here?\nB: Yes. I will check the balance for you.","ko":"A: 여기에서 이 기프트카드를 쓸 수 있나요?\nB: 네. 잔액을 확인해드릴게요."},{"en":"A: Can I use this gift card at any branch?\nB: Yes, it works at all of our stores.","ko":"A: 이 기프트카드를 어느 지점에서나 사용할 수 있나요?\nB: 네, 모든 매장에서 사용할 수 있습니다."}],"pronunciation":"기프트 카드","id":143},{"day":15,"num":5,"word":"I will take the bus.","meaning":"버스로 갈게요","hint":"","mnemonic":"take the bus = 버스를 타다.\nI will take the bus. = 버스로 갈게요. the를 빼지 마세요.","dialogue":"A: Are you taking a taxi to the airport?\nB: No, I will take the bus.","caution":"take the bus / go by bus. take 뒤에서는 보통 the를 붙이고, by 뒤에서는 붙이지 않습니다.","dialogues":["A: Are you taking a taxi to the airport?\nB: No, I will take the bus.","A: A taxi is expensive, so I will take the bus.\nB: The airport bus leaves from bay three."],"similar":"","note":"take the bus / go by bus. take 뒤에서는 보통 the를 붙이고, by 뒤에서는 붙이지 않습니다.","ko_dialogue":"A: 공항에 택시를 타고 가세요?\nB: 아니요, 버스로 갈 거예요.","dialogue_pairs":[{"en":"A: Are you taking a taxi to the airport?\nB: No, I will take the bus.","ko":"A: 공항에 택시를 타고 가세요?\nB: 아니요, 버스로 갈 거예요."},{"en":"A: A taxi is expensive, so I will take the bus.\nB: The airport bus leaves from bay three.","ko":"A: 택시는 비싸니까 버스로 갈게요.\nB: 공항버스는 3번 승차장에서 출발합니다."}],"pronunciation":"아이 윌 테이크 더 버스","id":144},{"day":15,"num":6,"word":"in particular","meaning":"특히","hint":"","mnemonic":"in particular → “여럿 중 딱 한 부분을 집는다!”\n메뉴가 열 개나 놓였는데 손가락이 한 접시만 콕 집습니다. “다 맛있지만 특히 이거!”\nparticular의 part(부분) 모양을 단서로, 여러 부분 중 하나만 콕 집는 모습을 연결합니다.\n→ in particular = 특히","dialogue":"A: Are you looking for anything in particular?\nB: Yes, a light jacket for the evening.","caution":"","dialogues":["A: Are you looking for anything in particular?\nB: Yes, a light jacket for the evening.","A: Is there anything in particular you want to see?\nB: I would really like to visit the old temple."],"similar":"","note":"","ko_dialogue":"A: 특별히 찾으시는 것이 있나요?\nB: 네, 저녁에 입을 가벼운 재킷이요.","dialogue_pairs":[{"en":"A: Are you looking for anything in particular?\nB: Yes, a light jacket for the evening.","ko":"A: 특별히 찾으시는 것이 있나요?\nB: 네, 저녁에 입을 가벼운 재킷이요."},{"en":"A: Is there anything in particular you want to see?\nB: I would really like to visit the old temple.","ko":"A: 특별히 보고 싶은 곳이 있나요?\nB: 오래된 사원에 꼭 가보고 싶어요."}],"pronunciation":"인 퍼티큘러","id":145},{"day":15,"num":7,"word":"look around","meaning":"둘러보다","hint":"","mnemonic":"look around [룩 어라운드] → around(주변)을 look(보다).\n→ look around = 둘러보다","dialogue":"A: Can I help you find anything?\nB: Thank you, but I would just like to look around.","caution":"look around = 둘러보다. browse = 구경하며 천천히 보다, 특히 쇼핑에서 자주 씁니다.","dialogues":["A: Can I help you find anything?\nB: Thank you, but I would just like to look around.","A: Can we look around before deciding what to buy?\nB: Of course. Take your time."],"similar":"","note":"look around = 둘러보다. browse = 구경하며 천천히 보다, 특히 쇼핑에서 자주 씁니다.","ko_dialogue":"A: 찾으시는 것을 도와드릴까요?\nB: 감사하지만, 그냥 둘러보고 싶어요.","dialogue_pairs":[{"en":"A:
