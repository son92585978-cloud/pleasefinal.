e":"","ko_dialogue":"A: 서둘러야 하나요?\nB: 네, 버스가 5분 뒤에 출발해요.","dialogue_pairs":[{"en":"A: Do we need to hurry?\nB: Yes, the bus leaves in five minutes.","ko":"A: 서둘러야 하나요?\nB: 네, 버스가 5분 뒤에 출발해요."},{"en":"A: We need to hurry or we will miss boarding.\nB: The gate is just around the corner.","ko":"A: 서두르지 않으면 탑승을 놓치겠어요.\nB: 탑승구는 바로 모퉁이 너머에 있어요."}],"pronunciation":"허리","id":237},{"day":24,"num":9,"word":"vacant","meaning":"비어 있는, 빈","hint":"","mnemonic":"vacant [베이컨트] → “베이컨 통이 텅!”\n조식 식당의 베이컨 통을 열었더니 다 먹고 아무것도 남지 않았습니다. 통 안이 텅 비었습니다.\n베이컨 + 텅 → 베이컨트 → 비어 있는.\n방이나 자리 등이 비어 있다는 뜻에 사용합니다.","dialogue":"A: Is the restroom vacant now?\nB: Yes, you can go in.","dialogues":["A: Is the restroom vacant now?\nB: Yes, you can go in.","A: Is there a vacant room for tonight?\nB: Yes, we have one double room left."],"caution":"","past":true,"similar":"available = 이용 가능한 / empty = 내용물이 없는 / occupied = 사용 중인","note":"","ko_dialogue":"A: 지금 화장실이 비어 있나요?\nB: 네, 들어가셔도 돼요.","dialogue_pairs":[{"en":"A: Is the restroom vacant now?\nB: Yes, you can go in.","ko":"A: 지금 화장실이 비어 있나요?\nB: 네, 들어가셔도 돼요."},{"en":"A: Is there a vacant room for tonight?\nB: Yes, we have one double room left.","ko":"A: 오늘 밤 빈 객실이 있나요?\nB: 네, 더블룸 한 개 남아 있습니다."}],"pronunciation":"베이컨트","id":238},{"day":24,"num":10,"word":"reservation","meaning":"예약","hint":"","mnemonic":"reservation [레저베이션] → “미리 저 자리를 비워둔 기록!”\n식당에 “저 자리를 미리 비워주세요”라고 부탁했습니다. 직원이 이름과 시간을 적어 자리를 남겨놓았습니다. 그 예약 기록이 reservation입니다.\n미리 저 자리 비워둬 → reserve(예약하다) → reservation(예약).","dialogue":"A: Do you have a reservation?\nB: Yes, for two people under Son.","dialogues":["A: Do you have a reservation?\nB: Yes, for two people under Son.","A: I have a reservation for two nights under Lee.\nB: Yes, I found your booking."],"caution":"","past":true,"similar":"reserve = 예약하다 / book = 예약하다 / reservation = 예약(명사)","note":"","ko_dialogue":"A: 예약하셨나요?\nB: 네, 손이라는 이름으로 두 명 예약했어요.","dialogue_pairs":[{"en":"A: Do you have a reservation?\nB: Yes, for two people under Son.","ko":"A: 예약하셨나요?\nB: 네, 손이라는 이름으로 두 명 예약했어요."},{"en":"A: I have a reservation for two nights under Lee.\nB: Yes, I found your booking.","ko":"A: Lee 이름으로 2박 예약이 되어 있어요.\nB: 네, 예약을 찾았습니다."}],"pronunciation":"레저베이션","id":239},{"day":25,"num":1,"word":"baggage claim","meaning":"수하물 찾는 곳","hint":"","mnemonic":"baggage(수하물) + claim(자기 것을 찾아가다).\n내 짐을 찾아가는 곳 → baggage claim.","dialogue":"A: Where is baggage claim?\nB: Downstairs. Follow the signs for arrivals.","dialogues":["A: Where is baggage claim?\nB: Downstairs. Follow the signs for arrivals.","A: Which baggage claim is for flight 402?\nB: Carousel seven on the lower level."],"caution":"claim은 여기서 ‘주장하다’보다 ‘내 것이라고 찾아가다’의 느낌입니다.","past":true,"similar":"","note":"claim은 여기서 ‘주장하다’보다 ‘내 것이라고 찾아가다’의 느낌입니다.","ko_dialogue":"A: 수하물 찾는 곳은 어디인가요?\nB: 아래층이에요. 도착 안내 표지를 따라가세요.","dialogue_pairs":[{"en":"A: Where is baggage claim?\nB: Downstairs. Follow the signs for arrivals.","ko":"A: 수하물 찾는 곳은 어디인가요?\nB: 아래층이에요. 도착 안내 표지를 따라가세요."},{"en":"A: Which baggage claim is for flight 402?\nB: Carousel seven on the lower level.","ko":"A: 402편 수하물 찾는 곳이 어디인가요?\nB: 아래층 7번 벨트입니다."}],"pronunciation":"배기지 클레임","id":240},{"day":25,"num":2,"word":"preference","meaning":"선호, 취향","hint":"","mnemonic":"preference [프레퍼런스] → “프리한 여행 쪽으로 기우는 취향!”\n같은 두 여행 상품을 보여줘도 나는 늘 자유여행 쪽을 고릅니다. 한 번의 선택이 아니라 내가 더 좋아하는 쪽, 내 취향입니다.\n프리하게 다니는 여행을 prefer(선호하다) → 그 선호가 preference.","dialogue":"A: Do you have a seating preference?\nB: A table outside, if possible.","dialogues":["A: Do you have a seating preference?\nB: A table outside, if possible.","A: Do you have a seating preference?\nB: A window seat would be great."],"caution":"preference는 취향/선호. prefer는 동사 ‘더 좋아하다’.","past":true,"similar":"","note":"preference는 취향/선호. prefer는 동사 ‘더 좋아하다’.","ko_dialogue":"A: 선호하시는 자리가 있나요?\nB: 가능하다면 야외 테이블로 부탁드려요.","dialogue_pairs":[{"en":"A: Do you have a seating preference?\nB: A table outside, if possible.","ko":"A: 선호하시는 자리가 있나요?\nB: 가능하다면 야외 테이블로 부탁드려요."},{"en":"A: Do you have a seating preference?\nB: A window seat would be great.","ko":"A: 선호하는 좌석이 있으신가요?\nB: 창가 자리면 좋겠습니다."}],"pronunciation":"프레퍼런스","id":241},{"day":25,"num":3,"word":"belongings","meaning":"소지품","hint":"","mnemonic":"belongings [빌롱잉즈] → “내 이름표가 줄줄이 달린 내 물건들!”\n가방·우산·휴대전화에 모두 내 이름표가 붙어 있습니다. 다른 사람 것은 남기고 나에게 속한 물건만 한데 모아 챙깁니다.\nbelong to me(나에게 속하다) → 나에게 속한 물건들 → belongings = 소지품.","dialogue":"A: Please take all your belongings with you.\nB: Thank you. I nearly forgot my phone.","dialogues":["A: Please take all your belongings with you.\nB: Thank you. I nearly forgot my phone.","A: Please check that you have all your belongings before leaving.\nB: Thanks. I almost forgot my umbrella."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 소지품을 모두 챙겨주세요.\nB: 감사합니다. 휴대전화를 두고 갈 뻔했어요.","dialogue_pairs":[{"en":"A: Please take all your belongings with you.\nB: Thank you. I nearly forgot my phone.","ko":"A: 소지품을 모두 챙겨주세요.\nB: 감사합니다. 휴대전화를 두고 갈 뻔했어요."},{"en":"A: Please check that you have all your belongings before leaving.\nB: Thanks. I almost forgot my umbrella.","ko":"A: 나가기 전에 소지품을 모두 챙겼는지 확인해 주세요.\nB: 감사합니다. 우산을 두고 갈 뻔했네요."}],"pronunciation":"빌롱잉즈","id":242},{"day":25,"num":4,"word":"refill","meaning":"리필, 다시 채우다","hint":"","mnemonic":"refill [리필] → re-(다시) + fill(채우다).\n→ refill = 리필 / 다시 채우다","dialogue":"A: Is the first refill free?\nB: Yes, for coffee and tea.","dialogues":["A: Is the first refill free?\nB: Yes, for coffee and tea.","A: Could you refill my water bottle?\nB: Sure, the fountain is right here."],"caution":"","past":true,"similar":"refill = 다시 채우기 / top up = 보충하다 / replace = 교체하다","note":"","ko_dialogue":"A: 첫 리필은 무료인가요?\nB: 네, 커피와 차는 무료입니다.","dialogue_pairs":[{"en":"A: Is the first refill free?\nB: Yes, for coffee and tea.","ko":"A: 첫 리필은 무료인가요?\nB: 네, 커피와 차는 무료입니다."},{"en":"A: Could you refill my water bottle?\nB: Sure, the fountain is right here.","ko":"A: 제 물병에 물을 다시 채워주시겠어요?\nB: 네, 급수대가 바로 여기 있습니다."}],"pronunciation":"리필","id":243},{"day":25,"num":5,"word":"portion","meaning":"1인분, 양","hint":"","mnemonic":"portion [포션] → “수프 한 포, 내 몫 한 그릇!”\n여럿이 먹을 큰 수프 냄비에서 내 몫을 덜어 한 포장에 담습니다. 모두가 자기 몫 하나씩 받아갑니다.\n한 포에 나눈 한 몫 → 포션 → portion = 음식의 한 몫, 분량.\n항상 정해진 크기의 1인분이라는 뜻은 아니며 large portion처럼 양을 말할 수도 있습니다.","dialogue":"A: Is one portion enough for two people?\nB: It is quite large, so you could share it.","dialogues":["A: Is one portion enough for two people?\nB: It is quite large, so you could share it.","A: Is this portion large enough to share?\nB: Yes, two people can easily share it."],"caution":"","past":true,"similar":"portion = 1인분 양 / serving = 1회 제공량 / size = 크기","note":"","ko_dialogue":"A: 1인분으로 두 사람이 먹기에 충분한가요?\nB: 양이 꽤 많아서 나눠 드셔도 돼요.","dialogue_pairs":[{"en":"A: Is one portion enough for two people?\nB: It is quite large, so you could share it.","ko":"A: 1인분으로 두 사람이 먹기에 충분한가요?\nB: 양이 꽤 많아서 나눠 드셔도 돼요."},{"en":"A: Is this portion large enough to share?\nB: Yes, two people can easily share it.","ko":"A: 이 양은 나눠 먹기에 충분히 큰가요?\nB: 네, 두 분이 충분히 나눠 드실 수 있어요."}],"pronunciation":"포션","id":244},{"day":25,"num":6,"word":"platform","meaning":"승강장","hint":"","mnemonic":"platform [플랫폼] → 사람들이 올라서는 평평한 단.\n기차역에서는 열차를 타는 승강장.\n→ platform = 승강장 / 플랫폼","dialogue":"A: Which platform does the airport train leave from?\nB: Platform four. Take the stairs on your right.","dialogues":["A: Which platform does the airport train leave from?\nB: Platform four. Take the stairs on your right.","A: Which platform does the airport train leave from?\nB: Platform nine."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 공항행 열차는 몇 번 승강장에서 출발하나요?\nB: 4번입니다. 오른쪽 계단으로 가세요.","dialogue_pairs":[{"en":"A: Which platform does the airport train leave from?\nB: Platform four. Take the stairs on your right.","ko":"A: 공항행 열차는 몇 번 승강장에서 출발하나요?\nB: 4번입니다. 오른쪽 계단으로 가세요."},{"en":"A: Which platform does the airport train leave from?\nB: Platform nine.","ko":"A: 공항 열차는 어느 승강장에서 출발하나요?\nB: 9번 승강장입니다."}],"pronunciation":"플랫폼","id":245},{"day":25,"num":7,"word":"toward","meaning":"~쪽으로","hint":"","mnemonic":"toward [투워드] → to(~로) + -ward(방향).\n→ toward = ~쪽으로","dialogue":"A: Which way should I walk?\nB: Head toward the river, then turn left.","dialogues":["A: Which way should I walk?\nB: Head toward the river, then turn left.","A: Walk toward the river and turn left at the bridge.\nB: Got it. Thank you."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 어느 쪽으로 걸어가야 하나요?\nB: 강 쪽으로 가다가 왼쪽으로 도세요.","dialogue_pairs":[{"en":"A: Which way should I walk?\nB: Head toward the river, then turn left.","ko":"A: 어느 쪽으로 걸어가야 하나요?\nB: 강 쪽으로 가다가 왼쪽으로 도세요."},{"en":"A: Walk toward the river and turn left at the bridge.\nB: Got it. Thank you.","ko":"A: 강 쪽으로 걸어가서 다리에서 왼쪽으로 도세요.\nB: 알겠습니다. 감사합니다."}],"pronunciation":"투워드","id":246},{"day":25,"num":8,"word":"included","meaning":"포함된","hint":"","mnemonic":"included [인클루디드] → “안으로 끌어 넣어둔 상태!”\n숙박 상자 안에 아침 식사권도, 수영장 이용권도 함께 끌어 넣어뒀습니다. 상자를 받으면 그 안의 이용권도 함께 받습니다.\n안에 끌어 둠 → include(포함하다) → included(포함된).","dialogue":"A: Is breakfast included?\nB: Yes, it is served from seven to ten.","dialogues":["A: Is breakfast included?\nB: Yes, it is served from seven to ten.","A: Is breakfast included in the room price?\nB: Yes, breakfast and Wi-Fi are included."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 아침 식사가 포함되어 있나요?\nB: 네, 7시부터 10시까지 제공됩니다.","dialogue_pairs":[{"en":"A: Is breakfast included?\nB: Yes, it is served from seven to ten.","ko":"A: 아침 식사가 포함되어 있나요?\nB: 네, 7시부터 10시까지 제공됩니다."},{"en":"A: Is breakfast included in the room price?\nB: Yes, breakfast and Wi-Fi are included.","ko":"A: 객실 요금에 아침 식사가 포함되어 있나요?\nB: 네, 조식과 와이파이가 포함되어 있습니다."}],"pronunciation":"인클루디드","id":247},{"day":25,"num":9,"word":"wrong","meaning":"틀린, 잘못된","hint":"","mnemonic":"wrong [롱] → “롱~하게 갔는데 길을 잘못 들었네!”\n잘못된 길로 한참 길게 가버립니다.\n롱~ 멀리 감 → 방향을 잘못 잡음.\n→ wrong = 틀린 / 잘못된","dialogue":"A: I think we are on the wrong bus.\nB: Let us ask the driver at the next stop.","dialogues":["A: I think we are on the wrong bus.\nB: Let us ask the driver at the next stop.","A: I think we are on the wrong platform.\nB: Yes, our train leaves from platform four."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 저희가 버스를 잘못 탄 것 같아요.\nB: 다음 정류장에서 기사님께 물어봐요.","dialogue_pairs":[{"en":"A: I think we are on the wrong bus.\nB: Let us ask the driver at the next stop.","ko":"A: 저희가 버스를 잘못 탄 것 같아요.\nB: 다음 정류장에서 기사님께 물어봐요."},{"en":"A: I think we are on the wrong platform.\nB: Yes, our train leaves from platform four.","ko":"A: 저희가 잘못된 승강장에 온 것 같아요.\nB: 맞아요, 우리 기차는 4번 승강장에서 출발해요."}],"pronunciation":"롱","id":248},{"day":25,"num":10,"word":"owe","meaning":"빚지다, 지불할 의무가 있다","hint":"","mnemonic":"owe [오우] → “오우! 외상값 아직 안 갚았네!”\n남이 먼저 내준 돈을 아직 돌려주지 못했습니다.\n오우 → 외상값이 남아 있음.\n→ owe = 빚지다 / 돈을 갚아야 하다","dialogue":"A: How much do I owe you for the taxi?\nB: Ten dollars. We are splitting it equally.","dialogues":["A: How much do I owe you for the taxi?\nB: Ten dollars. We are splitting it equally.","A: How much do I owe you for the tickets?\nB: Twenty dollars is fine."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 택시비로 얼마를 드리면 되나요?\nB: 10달러요. 똑같이 나누면 돼요.","dialogue_pairs":[{"en":"A: How much do I owe you for the taxi?\nB: Ten dollars. We are splitting it equally.","ko":"A: 택시비로 얼마를 드리면 되나요?\nB: 10달러요. 똑같이 나누면 돼요."},{"en":"A: How much do I owe you for the tickets?\nB: Twenty dollars is fine.","ko":"A: 표값으로 제가 얼마 드리면 되나요?\nB: 20달러면 됩니다."}],"pronunciation":"오우","id":249},{"day":26,"num":1,"word":"allergic","meaning":"알레르기가 있는","hint":"","mnemonic":"allergic [얼러직] → “먹으면 앓지!”\n안 맞는 음식을 먹으면 몸이 심하게 반응해 앓습니다.\n얼러직 ≈ 앓지.\n→ allergic = 알레르기가 있는","dialogue":"A: Are you allergic to any foods?\nB: Yes, shellfish. Could you check with the kitchen?","dialogues":["A: Are you allergic to any foods?\nB: Yes, shellfish. Could you check with the kitchen?","A: I am allergic to nuts. Can you recommend something safe?\nB: Yes, I will show you the nut-free dishes."],"caution":"","past":true,"similar":"allergic = 알레르기가 있는 / allergy = 알레르기 / sensitive to = ~에 민감한","note":"","ko_dialogue":"A: 알레르기가 있는 음식이 있나요?\nB: 네, 조개류와 갑각류요. 주방에 확인해주시겠어요?","dialogue_pairs":[{"en":"A: Are you allergic to any foods?\nB: Yes, shellfish. Could you check with the kitchen?","ko":"A: 알레르기가 있는 음식이 있나요?\nB: 네, 조개류와 갑각류요. 주방에 확인해주시겠어요?"},{"en":"A: I am allergic to nuts. Can you recommend something safe?\nB: Yes, I will show you the nut-free dishes.","ko":"A: 저는 견과류 알레르기가 있어요. 안전한 메뉴를 추천해주시겠어요?\nB: 네, 견과류가 없는 메뉴를 보여드릴게요."}],"pronunciation":"얼러직","id":250},{"day":26,"num":2,"word":"tap","meaning":"가볍게 두드리다, 갖다 대다","hint":"","mnemonic":"tap [탭]\n“탭!” 하고 가볍게 톡 건드린다.\n→ tap = 가볍게 두드리다 / 갖다 대다","dialogue":"A: Should I insert my card?\nB: You can just tap it here.","dialogues":["A: Should I insert my card?\nB: You can just tap it here.","A: Just tap your card on the reader.\nB: Okay, I see the contactless symbol."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 카드를 넣어야 하나요?\nB: 여기에 가볍게 대시면 돼요.","dialogue_pairs":[{"en":"A: Should I insert my card?\nB: You can just tap it here.","ko":"A: 카드를 넣어야 하나요?\nB: 여기에 가볍게 대시면 돼요."},{"en":"A: Just tap your card on the reader.\nB: Okay, I see the contactless symbol.","ko":"A: 카드를 단말기에 가볍게 대기만 하세요.\nB: 네, 비접촉 결제 표시가 보이네요."}],"pronunciation":"탭","id":251},{"day":26,"num":3,"word":"drop off","meaning":"내려주다, 맡기다","hint":"","mnemonic":"drop off [드롭 오프] → drop(내려놓다) + off(떨어져).\n차가 사람을 내려놓고 떠난다.\n→ drop off = 내려주다","dialogue":"A: Could you drop me off at the hotel entrance?\nB: Sure. It is just around the corner.","dialogues":["A: Could you drop me off at the hotel entrance?\nB: Sure. It is just around the corner.","A: Can the taxi drop us off at the museum entrance?\nB: Yes, there is a drop-off zone there."],"caution":"drop off는 사람을 내려주다/물건을 맡기다. pick up은 데리러 가다/찾아가다.","past":true,"similar":"","note":"drop off는 사람을 내려주다/물건을 맡기다. pick up은 데리러 가다/찾아가다.","ko_dialogue":"A: 호텔 입구에서 내려주시겠어요?\nB: 네. 모퉁이를 돌면 바로 있어요.","dialogue_pairs":[{"en":"A: Could you drop me off at the hotel entrance?\nB: Sure. It is just around the corner.","ko":"A: 호텔 입구에서 내려주시겠어요?\nB: 네. 모퉁이를 돌면 바로 있어요."},{"en":"A: Can the taxi drop us off at the museum entrance?\nB: Yes, there is a drop-off zone there.","ko":"A: 택시가 박물관 입구에 내려줄 수 있나요?\nB: 네, 거기에 하차 구역이 있습니다."}],"pronunciation":"드롭 오프","id":252},{"day":26,"num":4,"word":"pick up","meaning":"데리러 가다, 집다, 찾아가다","hint":"","mnemonic":"pick up [픽 업] → pick(집다) + up(위로).\n사람·짐을 집어 데려온다.\n→ pick up = 데리러 가다 / 찾아오다","dialogue":"A: Where will you pick us up tomorrow?\nB: Outside the hotel at eight thirty.","dialogues":["A: Where will you pick us up tomorrow?\nB: Outside the hotel at eight thirty.","A: What time will the shuttle pick us up?\nB: At six forty-five in front of the hotel."],"caution":"pick up은 ‘집다, 데리러 가다, 찾아가다’ 등 뜻이 많습니다. 여행에서는 사람·짐을 데리러/찾으러 가는 뜻이 자주 나옵니다.","past":true,"similar":"","note":"pick up은 ‘집다, 데리러 가다, 찾아가다’ 등 뜻이 많습니다. 여행에서는 사람·짐을 데리러/찾으러 가는 뜻이 자주 나옵니다.","ko_dialogue":"A: 내일 저희를 어디로 데리러 오시나요?\nB: 8시 30분에 호텔 밖으로 갈게요.","dialogue_pairs":[{"en":"A: Where will you pick us up tomorrow?\nB: Outside the hotel at eight thirty.","ko":"A: 내일 저희를 어디로 데리러 오시나요?\nB: 8시 30분에 호텔 밖으로 갈게요."},{"en":"A: What time will the shuttle pick us up?\nB: At six forty-five in front of the hotel.","ko":"A: 셔틀이 몇 시에 저희를 데리러 오나요?\nB: 6시 45분에 호텔 앞에서요."}],"pronunciation":"픽 업","id":253},{"day":26,"num":5,"word":"spare","meaning":"여분의","hint":"","mnemonic":"spare [스페어] → “쓰고 남은 건 빼어!”\n필요한 만큼 쓰고 남는 것은 따로 빼어 둡니다.\n스 + 페어 ≈ 쓰고 + 빼어.\n→ spare = 여분의 / 남는","dialogue":"A: Do you have a spare room key?\nB: Yes. I can make another one for you.","dialogues":["A: Do you have a spare room key?\nB: Yes. I can make another one for you.","A: Do you have a spare umbrella I could borrow?\nB: Yes, we keep a few at the front desk."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 여분의 객실 키가 있나요?\nB: 네. 하나 더 만들어드릴 수 있어요.","dialogue_pairs":[{"en":"A: Do you have a spare room key?\nB: Yes. I can make another one for you.","ko":"A: 여분의 객실 키가 있나요?\nB: 네. 하나 더 만들어드릴 수 있어요."},{"en":"A: Do you have a spare umbrella I could borrow?\nB: Yes, we keep a few at the front desk.","ko":"A: 빌릴 수 있는 여분 우산이 있나요?\nB: 네, 프런트 데스크에 몇 개 있습니다."}],"pronunciation":"스페어","id":254},{"day":26,"num":6,"word":"avoid","meaning":"피하다","hint":"","mnemonic":"avoid [어보이드] → “어, 보이네! 피해!”\n앞에 큰 물웅덩이가 보입니다. “어, 보이네!” 하고 발을 옆으로 옮겨 물웅덩이를 피해 갑니다.\n어 + 보이네 + 피해 → 어보이드 → 피하다.","dialogue":"A: When should we go to avoid the crowds?\nB: Before nine in the morning.","dialogues":["A: When should we go to avoid the crowds?\nB: Before nine in the morning.","A: Take the side street to avoid the traffic.\nB: Good idea. The main road looks packed."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 인파를 피하려면 언제 가는 게 좋을까요?\nB: 오전 9시 전에요.","dialogue_pairs":[{"en":"A: When should we go to avoid the crowds?\nB: Before nine in the morning.","ko":"A: 인파를 피하려면 언제 가는 게 좋을까요?\nB: 오전 9시 전에요."},{"en":"A: Take the side street to avoid the traffic.\nB: Good idea. The main road looks packed.","ko":"A: 교통 체증을 피하려면 골목길로 가세요.\nB: 좋은 생각이에요. 큰길이 많이 막혀 보이네요."}],"pronunciation":"어보이드","id":255},{"day":26,"num":7,"word":"damage","meaning":"손상, 손상시키다","hint":"","mnemonic":"damage [대미지] → 게임에서 ‘데미지 입었다’ = 손상됐다.\n→ damage = 손상 / 손상시키다","dialogue":"A: There is some damage to my suitcase.\nB: Please bring it to the baggage service desk.","dialogues":["A: There is some damage to my suitcase.\nB: Please bring it to the baggage service desk.","A: I noticed damage on my suitcase after the flight.\nB: Please report it before leaving the baggage area."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 제 여행가방에 손상이 있어요.\nB: 수하물 서비스 데스크로 가져와주세요.","dialogue_pairs":[{"en":"A: There is some damage to my suitcase.\nB: Please bring it to the baggage service desk.","ko":"A: 제 여행가방에 손상이 있어요.\nB: 수하물 서비스 데스크로 가져와주세요."},{"en":"A: I noticed damage on my suitcase after the flight.\nB: Please report it before leaving the baggage area.","ko":"A: 비행 후에 여행가방이 손상된 걸 발견했어요.\nB: 수하물 구역을 나가기 전에 신고해 주세요."}],"pronunciation":"대미지","id":256},{"day":26,"num":8,"word":"enough","meaning":"충분한","hint":"","mnemonic":"enough [이너프] → “이 안에 푹 찼어, 이제 충분해!”\n여행가방 안에 필요한 물건을 다 넣었습니다. 더 넣으려 하자 “이 안에 필요한 건 다 있어. 충분해!” 하고 지퍼를 닫습니다.\n이 안에 푹 채움 → 이너프 → 필요한 만큼 충분한.\n가득 참 자체보다 ‘필요한 만큼 있다’는 데 뜻의 중심이 있습니다.","dialogue":"A: Do we have enough time for lunch?\nB: Yes, boarding does not start for another hour.","dialogues":["A: Do we have enough time for lunch?\nB: Yes, boarding does not start for another hour.","A: Do we have enough time to visit the market before our train?\nB: Yes, we have almost two hours."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 점심 먹을 시간이 충분한가요?\nB: 네, 탑승 시작까지 한 시간이나 남았어요.","dialogue_pairs":[{"en":"A: Do we have enough time for lunch?\nB: Yes, boarding does not start for another hour.","ko":"A: 점심 먹을 시간이 충분한가요?\nB: 네, 탑승 시작까지 한 시간이나 남았어요."},{"en":"A: Do we have enough time to visit the market before our train?\nB: Yes, we have almost two hours.","ko":"A: 기차 타기 전에 시장에 갈 시간이 충분한가요?\nB: 네, 거의 두 시간 남았습니다."}],"pronunciation":"이너프","id":257},{"day":26,"num":9,"word":"refund","meaning":"환불, 환불하다","hint":"","mnemonic":"refund [리펀드] → “리! 푼돈 다시 돌려줘!”\n냈던 돈이 다시 내 쪽으로 돌아옵니다.\n리(다시) + 푼돈 ≈ 리펀드.\n→ refund = 환불 / 환불하다","dialogue":"A: Could I get a refund for this canceled tour?\nB: Yes. We will return the payment to your card.","dialogues":["A: Could I get a refund for this canceled tour?\nB: Yes. We will return the payment to your card.","A: Can I get a refund if the tour is canceled?\nB: Yes, you will receive a full refund."],"caution":"return은 물건을 돌려주는 행동, refund는 돈을 돌려받는 결과에 초점이 있습니다.","past":true,"similar":"return = 물건을 돌려주다 / exchange = 교환하다 / refund = 돈을 돌려받다","note":"return은 물건을 돌려주는 행동, refund는 돈을 돌려받는 결과에 초점이 있습니다.","ko_dialogue":"A: 취소된 이 투어를 환불받을 수 있을까요?\nB: 네. 결제하신 카드로 환불해드릴게요.","dialogue_pairs":[{"en":"A: Could I get a refund for this canceled tour?\nB: Yes. We will return the payment to your card.","ko":"A: 취소된 이 투어를 환불받을 수 있을까요?\nB: 네. 결제하신 카드로 환불해드릴게요."},{"en":"A: Can I get a refund if the tour is canceled?\nB: Yes, you will receive a full refund.","ko":"A: 투어가 취소되면 환불받을 수 있나요?\nB: 네, 전액 환불됩니다."}],"pronunciation":"리펀드","id":258},{"day":26,"num":10,"word":"fund","meaning":"자금, 기금","hint":"","mnemonic":"fund [펀드] → “푼돈을 모아 큰돈으로!”\n조금씩 모은 푼돈이 여행에 쓸 자금이 됩니다.\n펀드 ≈ 푼돈.\n→ fund = 자금 / 기금 / 자금을 대다","dialogue":"A: What is this donation box for?\nB: It is for the museum’s restoration fund.","dialogues":["A: What is this donation box for?\nB: It is for the museum’s restoration fund.","A: The city uses this tax to fund public transportation.\nB: That explains why the buses are so affordable."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 기부함은 무엇을 위한 건가요?\nB: 박물관 복원 기금을 위한 거예요.","dialogue_pairs":[{"en":"A: What is this donation box for?\nB: It is for the museum’s restoration fund.","ko":"A: 이 기부함은 무엇을 위한 건가요?\nB: 박물관 복원 기금을 위한 거예요."},{"en":"A: The city uses this tax to fund public transportation.\nB: That explains why the buses are so affordable.","ko":"A: 이 도시는 이 세금으로 대중교통에 자금을 댑니다.\nB: 그래서 버스 요금이 저렴한 거군요."}],"pronunciation":"펀드","id":259},{"day":27,"num":1,"word":"display","meaning":"보여주다, 진열하다, 화면","hint":"","mnemonic":"display [디스플레이] → “디스(this), 플레이(play)! 이거 재생해서 보여줘!”\n친구가 여행 영상을 가리킵니다. “이거 플레이해줘!” 재생 버튼을 누르자 큰 화면에 영상이 나타나 모두에게 보입니다.\n디스 + 플레이 → 디스플레이 → 보여주다 / 보여주는 화면.\n가게에서 물건을 사람들에게 보이게 펼쳐놓는 것도 display → 진열하다.\n※ this와 play는 발음을 연결하는 암기용 말이며 실제 어원 분해는 아닙니다.","dialogue":"A: Can I buy the bag on display?\nB: Yes. Let me get it down for you.","dialogues":["A: Can I buy the bag on display?\nB: Yes. Let me get it down for you.","A: The screen will display your gate number after check-in.\nB: Great, I will check it again later."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 진열된 가방을 살 수 있나요?\nB: 네. 내려드릴게요.","dialogue_pairs":[{"en":"A: Can I buy the bag on display?\nB: Yes. Let me get it down for you.","ko":"A: 진열된 가방을 살 수 있나요?\nB: 네. 내려드릴게요."},{"en":"A: The screen will display your gate number after check-in.\nB: Great, I will check it again later.","ko":"A: 체크인 후 화면에 탑승구 번호가 표시됩니다.\nB: 좋아요, 나중에 다시 확인할게요."}],"pronunciation":"디스플레이","id":260},{"day":27,"num":2,"word":"attraction","meaning":"관광명소, 매력","hint":"","mnemonic":"attraction [어트랙션] → “트랙터처럼 관광객을 끌어당기는 명소!”\n멋진 성이 커다란 트랙터처럼 관광객들의 관심을 자기 쪽으로 끌어당깁니다. 사람들이 성을 보려고 모여듭니다.\n트랙터의 끌어당기는 힘 → attract(끌다) → attraction(매력·명소).","dialogue":"A: What is the main attraction in this town?\nB: The old castle by the river.","dialogues":["A: What is the main attraction in this town?\nB: The old castle by the river.","A: Is the castle the main attraction in this town?\nB: Yes, most visitors go there first."],"caution":"tourist attraction = 관광명소. attraction 단독으로는 매력이라는 뜻도 있습니다.","past":true,"similar":"","note":"tourist attraction = 관광명소. attraction 단독으로는 매력이라는 뜻도 있습니다.","ko_dialogue":"A: 이 마을의 주요 명소는 어디인가요?\nB: 강 옆의 오래된 성이에요.","dialogue_pairs":[{"en":"A: What is the main attraction in this town?\nB: The old castle by the river.","ko":"A: 이 마을의 주요 명소는 어디인가요?\nB: 강 옆의 오래된 성이에요."},{"en":"A: Is the castle the main attraction in this town?\nB: Yes, most visitors go there first.","ko":"A: 이 마을의 대표 관광명소가 그 성인가요?\nB: 네, 대부분의 방문객이 먼저 그곳에 갑니다."}],"pronunciation":"어트랙션","id":261},{"day":27,"num":3,"word":"attract","meaning":"끌어당기다","hint":"","mnemonic":"attract [어트랙트] → “어, 트랙터가 끌어당긴다!”\n트랙터가 무거운 짐을 힘껏 끌어당깁니다. 멋진 여행 사진도 같은 힘으로 내 관심을 끌어당겨 그곳에 가고 싶게 만듭니다.\n어 + 트랙터 → 어트랙트 → 끌어당기다, 관심을 끌다.","dialogue":"A: Why does this beach attract so many visitors?\nB: The water is clear, and it is easy to reach.","dialogues":["A: Why does this beach attract so many visitors?\nB: The water is clear, and it is easy to reach.","A: What attracts so many visitors to this island?\nB: The beaches and hiking trails are the main reasons."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 해변에는 왜 방문객이 많이 오나요?\nB: 물이 맑고 오기 쉬워서요.","dialogue_pairs":[{"en":"A: Why does this beach attract so many visitors?\nB: The water is clear, and it is easy to reach.","ko":"A: 이 해변에는 왜 방문객이 많이 오나요?\nB: 물이 맑고 오기 쉬워서요."},{"en":"A: What attracts so many visitors to this island?\nB: The beaches and hiking trails are the main reasons.","ko":"A: 무엇이 이렇게 많은 방문객을 이 섬으로 끌어들이나요?\nB: 해변과 등산로가 가장 큰 이유입니다."}],"pronunciation":"어트랙트","id":262},{"day":27,"num":4,"word":"crowd","meaning":"군중, 사람들이 몰리다","hint":"","mnemonic":"crowd [크라우드] → “크~ 와르르 몰렸다!”\n거리 공연이 시작되자 사람들이 사방에서 와르르 몰려옵니다. 조용하던 자리가 순식간에 사람 무리로 가득 찹니다.\n크 + 와르르 → 크라우드 → 군중.\n그렇게 사람으로 붐비는 상태는 crowded입니다.","dialogue":"A: There is a big crowd at the entrance.\nB: Let us come back after lunch.","dialogues":["A: There is a big crowd at the entrance.\nB: Let us come back after lunch.","A: A large crowd is gathering near the stage.\nB: The festival parade must be starting soon."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 입구에 사람이 많이 모여 있네요.\nB: 점심 먹고 다시 와요.","dialogue_pairs":[{"en":"A: There is a big crowd at the entrance.\nB: Let us come back after lunch.","ko":"A: 입구에 사람이 많이 모여 있네요.\nB: 점심 먹고 다시 와요."},{"en":"A: A large crowd is gathering near the stage.\nB: The festival parade must be starting soon.","ko":"A: 무대 근처에 많은 군중이 모이고 있어요.\nB: 축제 퍼레이드가 곧 시작하나 봐요."}],"pronunciation":"크라우드","id":263},{"day":27,"num":5,"word":"breakable","meaning":"깨지기 쉬운","hint":"","mnemonic":"breakable [브레이커블] → break(깨지다) + able(~할 수 있는).\n깨질 수 있는.\n→ breakable = 깨지기 쉬운","dialogue":"A: Is there anything breakable in this bag?\nB: Yes, two glass bottles.","dialogues":["A: Is there anything breakable in this bag?\nB: Yes, two glass bottles.","A: Are there any breakable items in your suitcase?\nB: Yes, there are two glass bottles inside."],"caution":"fragile과 비슷하지만 breakable은 ‘깨질 수 있음’, fragile은 ‘깨지기 쉬워 조심해야 함’ 뉘앙스가 더 강합니다.","past":true,"similar":"","note":"fragile과 비슷하지만 breakable은 ‘깨질 수 있음’, fragile은 ‘깨지기 쉬워 조심해야 함’ 뉘앙스가 더 강합니다.","ko_dialogue":"A: 이 가방에 깨지기 쉬운 것이 있나요?\nB: 네, 유리병 두 개가 있어요.","dialogue_pairs":[{"en":"A: Is there anything breakable in this bag?\nB: Yes, two glass bottles.","ko":"A: 이 가방에 깨지기 쉬운 것이 있나요?\nB: 네, 유리병 두 개가 있어요."},{"en":"A: Are there any breakable items in your suitcase?\nB: Yes, there are two glass bottles inside.","ko":"A: 여행가방 안에 깨지기 쉬운 물건이 있나요?\nB: 네, 유리병 두 개가 들어 있습니다."}],"pronunciation":"브레이커블","id":264},{"day":27,"num":6,"word":"fragile items","meaning":"깨지기 쉬운 물건들","hint":"","mnemonic":"fragile items [프래절 아이템즈]\nfragile [프래절] → “프래절? 깨질!”\n깨질 수 있는 물건들.\n→ fragile items = 깨지기 쉬운 물건들","dialogue":"A: I have some fragile items in this suitcase.\nB: We can add a fragile tag for you.","dialogues":["A: I have some fragile items in this suitcase.\nB: We can add a fragile tag for you.","A: Please pack fragile items in the center of the suitcase.\nB: I will wrap them in clothes first."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 여행가방에 깨지기 쉬운 물건이 있어요.\nB: 파손주의 태그를 붙여드릴 수 있어요.","dialogue_pairs":[{"en":"A: I have some fragile items in this suitcase.\nB: We can add a fragile tag for you.","ko":"A: 이 여행가방에 깨지기 쉬운 물건이 있어요.\nB: 파손주의 태그를 붙여드릴 수 있어요."},{"en":"A: Please pack fragile items in the center of the suitcase.\nB: I will wrap them in clothes first.","ko":"A: 깨지기 쉬운 물건은 여행가방 가운데에 넣으세요.\nB: 먼저 옷으로 감싸둘게요."}],"pronunciation":"프래절 아이템즈","id":265},{"day":27,"num":7,"word":"fragile sticker","meaning":"파손주의 스티커","hint":"","mnemonic":"fragile sticker [프래절 스티커]\nfragile [프래절] → “프래절? 깨질!”\n깨질 물건에 붙이는 sticker.\n→ fragile sticker = 파손주의 스티커","dialogue":"A: Could you put a fragile sticker on this box?\nB: Of course. Please place it on the counter.","dialogues":["A: Could you put a fragile sticker on this box?\nB: Of course. Please place it on the counter.","A: Could you put a fragile sticker on this box?\nB: Sure, I will mark it on two sides."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 상자에 파손주의 스티커를 붙여주시겠어요?\nB: 네. 카운터에 올려주세요.","dialogue_pairs":[{"en":"A: Could you put a fragile sticker on this box?\nB: Of course. Please place it on the counter.","ko":"A: 이 상자에 파손주의 스티커를 붙여주시겠어요?\nB: 네. 카운터에 올려주세요."},{"en":"A: Could you put a fragile sticker on this box?\nB: Sure, I will mark it on two sides.","ko":"A: 이 상자에 파손주의 스티커를 붙여주시겠어요?\nB: 네, 양쪽 면에 표시해드릴게요."}],"pronunciation":"프래절 스티커","id":266},{"day":27,"num":8,"word":"boarding gate","meaning":"탑승구","hint":"","mnemonic":"boarding gate [보딩 게이트]\nboarding = 탑승, gate = 문/게이트.\n→ boarding gate = 탑승구","dialogue":"A: Where is boarding gate twenty?\nB: Past the café, on the right.","dialogues":["A: Where is boarding gate twenty?\nB: Past the café, on the right.","A: Where is the boarding gate for flight 615?\nB: Gate C14, about five minutes from here."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 20번 탑승구는 어디인가요?\nB: 카페를 지나 오른쪽에 있어요.","dialogue_pairs":[{"en":"A: Where is boarding gate twenty?\nB: Past the café, on the right.","ko":"A: 20번 탑승구는 어디인가요?\nB: 카페를 지나 오른쪽에 있어요."},{"en":"A: Where is the boarding gate for flight 615?\nB: Gate C14, about five minutes from here.","ko":"A: 615편 탑승구가 어디인가요?\nB: C14번이며 여기서 약 5분 거리입니다."}],"pronunciation":"보딩 게이트","id":267},{"day":27,"num":9,"word":"boarding time","meaning":"탑승 시간","hint":"","mnemonic":"boarding time [보딩 타임]\nboarding = 탑승, time = 시간.\n→ boarding time = 탑승 시간","dialogue":"A: What is the boarding time?\nB: Nine twenty. Please be at the gate before then.","dialogues":["A: What is the boarding time?\nB: Nine twenty. Please be at the gate before then.","A: What is the boarding time on my ticket?\nB: Boarding starts at 6:20."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 탑승 시간은 언제인가요?\nB: 9시 20분입니다. 그 전에 탑승구에 와주세요.","dialogue_pairs":[{"en":"A: What is the boarding time?\nB: Nine twenty. Please be at the gate before then.","ko":"A: 탑승 시간은 언제인가요?\nB: 9시 20분입니다. 그 전에 탑승구에 와주세요."},{"en":"A: What is the boarding time on my ticket?\nB: Boarding starts at 6:20.","ko":"A: 제 표에 적힌 탑승 시간이 몇 시인가요?\nB: 6시 20분에 탑승이 시작됩니다."}],"pronunciation":"보딩 타임","id":268},{"day":27,"num":10,"word":"Now boarding","meaning":"지금 탑승 중","hint":"","mnemonic":"now(지금) + boarding(탑승 중).\nNow boarding = 지금 탑승 중이라는 안내 표현.","dialogue":"A: Is our flight now boarding?\nB: Yes. Please have your boarding pass ready.","dialogues":["A: Is our flight now boarding?\nB: Yes. Please have your boarding pass ready.","A: The screen says, “Now boarding.” Should we line up?\nB: Yes, our group has just been called."],"caution":"Now boarding은 주로 탑승 안내에 쓰이는 표현입니다.","past":true,"similar":"","note":"Now boarding은 주로 탑승 안내에 쓰이는 표현입니다.","ko_dialogue":"A: 저희 항공편이 지금 탑승 중인가요?\nB: 네. 탑승권을 준비해주세요.","dialogue_pairs":[{"en":"A: Is our flight now boarding?\nB: Yes. Please have your boarding pass ready.","ko":"A: 저희 항공편이 지금 탑승 중인가요?\nB: 네. 탑승권을 준비해주세요."},{"en":"A: The screen says, “Now boarding.” Should we line up?\nB: Yes, our group has just been called.","ko":"A: 화면에 ‘지금 탑승 중’이라고 나오는데 줄 서야 하나요?\nB: 네, 방금 저희 그룹이 호출됐어요."}],"pronunciation":"나우 보딩","id":269},{"day":28,"num":1,"word":"hold my luggage","meaning":"제 짐을 맡아두다","hint":"","mnemonic":"hold(맡아두다) + my luggage(제 짐).\nCould you hold my luggage?처럼 부탁 문장에 넣어 쓰세요.","dialogue":"A: Could you hold my luggage until three?\nB: Certainly. Here is your claim ticket.","dialogues":["A: Could you hold my luggage until three?\nB: Certainly. Here is your claim ticket.","A: Could you hold my luggage after I check out?\nB: Of course, you can pick it up this evening."],"caution":"hold my luggage만 말하면 명령처럼 들릴 수 있습니다. Could you hold my luggage?로 부탁하세요.","past":true,"similar":"","note":"hold my luggage만 말하면 명령처럼 들릴 수 있습니다. Could you hold my luggage?로 부탁하세요.","ko_dialogue":"A: 3시까지 제 짐을 맡아주시겠어요?\nB: 네. 여기 짐 찾는 표입니다.","dialogue_pairs":[{"en":"A: Could you hold my luggage until three?\nB: Certainly. Here is your claim ticket.","ko":"A: 3시까지 제 짐을 맡아주시겠어요?\nB: 네. 여기 짐 찾는 표입니다."},{"en":"A: Could you hold my luggage after I check out?\nB: Of course, you can pick it up this evening.","ko":"A: 체크아웃 후에 제 짐을 맡아  off here."],"caution":"","past":true,"similar":"final = 최종의 / last = 마지막 / latest = 최신의","note":"","ko_dialogue":"A: 이것이 최종 가격인가요?\nB: 네, 세금과 수수료가 모두 포함되어 있어요.","dialogue_pairs":[{"en":"A: Is this the final price?\nB: Yes, it includes all taxes and fees.","ko":"A: 이것이 최종 가격인가요?\nB: 네, 세금과 수수료가 모두 포함되어 있어요."},{"en":"A: Is this the final stop on the line?\nB: Yes, everyone needs to get off here.","ko":"A: 여기가 이 노선의 종점인가요?\nB: 네, 모두 여기서 내려야 합니다."}],"pronunciation":"파이널","id":288},{"day":29,"num":10,"word":"latest","meaning":"최신의, 가장 최근의","hint":"","mnemonic":"latest [레이티스트] → “늦게 나온 것이 가장 최근 것!”\n오래된 잡지들이 먼저 쌓여 있고, 가장 늦게 도착한 새 잡지가 맨 위에 놓입니다. 발행 시점이 가장 뒤인 그 잡지가 최신호입니다.\nlate(시간상 뒤의) + -est(가장) → latest = 가장 최근의, 최신의.","dialogue":"A: Do you have the latest bus timetable?\nB: Yes. This one was updated yesterday.","dialogues":["A: Do you have the latest bus timetable?\nB: Yes. This one was updated yesterday.","A: Where can I find the latest train schedule?\nB: The station app has the most recent times."],"caution":"latest train이 아니라 last train이 ‘막차’입니다. latest는 ‘최신의/가장 최근의’.","past":true,"similar":"latest = 최신의 / last = 지난·마지막 / newest = 가장 새로운","note":"latest train이 아니라 last train이 ‘막차’입니다. latest는 ‘최신의/가장 최근의’.","ko_dialogue":"A: 최신 버스 시간표가 있나요?\nB: 네. 이것은 어제 갱신됐어요.","dialogue_pairs":[{"en":"A: Do you have the latest bus timetable?\nB: Yes. This one was updated yesterday.","ko":"A: 최신 버스 시간표가 있나요?\nB: 네. 이것은 어제 갱신됐어요."},{"en":"A: Where can I find the latest train schedule?\nB: The station app has the most recent times.","ko":"A: 최신 기차 시간표는 어디에서 볼 수 있나요?\nB: 역 앱에 가장 최근 시간이 나옵니다."}],"pronunciation":"레이티스트","id":289},{"day":30,"num":1,"word":"How long does it last?","meaning":"얼마나 오래 지속돼요?","hint":"","mnemonic":"How long does it last? [하우 롱 더즈 잇 래스트]\nhow long = 얼마나 오래, last = 지속되다.\n→ 얼마나 오래 지속되나요?","dialogue":"A: I am interested in the boat tour. How long does it last?\nB: About ninety minutes.","dialogues":["A: I am interested in the boat tour. How long does it last?\nB: About ninety minutes.","A: How long does it last?\nB: The boat tour takes about ninety minutes."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 보트 투어에 관심이 있어요. 얼마나 오래 진행되나요?\nB: 약 90분입니다.","dialogue_pairs":[{"en":"A: I am interested in the boat tour. How long does it last?\nB: About ninety minutes.","ko":"A: 보트 투어에 관심이 있어요. 얼마나 오래 진행되나요?\nB: 약 90분입니다."},{"en":"A: How long does it last?\nB: The boat tour takes about ninety minutes.","ko":"A: 얼마나 오래 걸리나요?\nB: 보트 투어는 약 90분 동안 진행됩니다."}],"pronunciation":"하우 롱 더즈 잇 래스트","id":290},{"day":30,"num":2,"word":"take a break","meaning":"쉬다, 휴식을 취하다","hint":"","mnemonic":"take a break [테이크 어 브레이크]\nbreak = 흐름을 끊다.\n일을 잠깐 끊고 쉰다.\n→ take a break = 휴식하다","dialogue":"A: Can we take a break before the next museum?\nB: Of course. There is a café over there.","dialogues":["A: Can we take a break before the next museum?\nB: Of course. There is a café over there.","A: Let us take a break after this museum.\nB: Sure, there is a cafe in the courtyard."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 다음 박물관에 가기 전에 잠깐 쉴 수 있을까요?\nB: 그럼요. 저기에 카페가 있어요.","dialogue_pairs":[{"en":"A: Can we take a break before the next museum?\nB: Of course. There is a café over there.","ko":"A: 다음 박물관에 가기 전에 잠깐 쉴 수 있을까요?\nB: 그럼요. 저기에 카페가 있어요."},{"en":"A: Let us take a break after this museum.\nB: Sure, there is a cafe in the courtyard.","ko":"A: 이 박물관을 보고 나서 잠깐 쉬어요.\nB: 좋아요, 안뜰에 카페가 있어요."}],"pronunciation":"테이크 어 브레이크","id":291},{"day":30,"num":3,"word":"break down","meaning":"고장 나다","hint":"","mnemonic":"break down [브레이크 다운]\nbreak = 망가지다, down = 멈춰 내려앉다.\n→ break down = 고장 나다","dialogue":"A: Did your rental car break down?\nB: Yes. I am waiting for roadside assistance.","dialogues":["A: Did your rental car break down?\nB: Yes. I am waiting for roadside assistance.","A: What happens if the rental car breaks down?\nB: Call this number and roadside assistance will come."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 렌터카가 고장 났나요?\nB: 네. 긴급 출동 서비스를 기다리고 있어요.","dialogue_pairs":[{"en":"A: Did your rental car break down?\nB: Yes. I am waiting for roadside assistance.","ko":"A: 렌터카가 고장 났나요?\nB: 네. 긴급 출동 서비스를 기다리고 있어요."},{"en":"A: What happens if the rental car breaks down?\nB: Call this number and roadside assistance will come.","ko":"A: 렌터카가 고장 나면 어떻게 해야 하나요?\nB: 이 번호로 전화하면 긴급출동 서비스가 옵니다."}],"pronunciation":"브레이크 다운","id":292},{"day":30,"num":4,"word":"break a bill","meaning":"큰돈을 잔돈으로 바꾸다","hint":"","mnemonic":"break a bill [브레이크 어 빌]\n큰 지폐(bill)를 작은 돈으로 쪼갠다(break).\n→ break a bill = 큰돈을 잔돈으로 바꾸다","dialogue":"A: Could you break a fifty-dollar bill?\nB: Yes. Would you like some smaller notes?","dialogues":["A: Could you break a fifty-dollar bill?\nB: Yes. Would you like some smaller notes?","A: Could you break a fifty-dollar bill for me?\nB: Sure. Do you want tens and fives?"],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 50달러 지폐를 잔돈으로 바꿔주시겠어요?\nB: 네. 작은 지폐도 드릴까요?","dialogue_pairs":[{"en":"A: Could you break a fifty-dollar bill?\nB: Yes. Would you like some smaller notes?","ko":"A: 50달러 지폐를 잔돈으로 바꿔주시겠어요?\nB: 네. 작은 지폐도 드릴까요?"},{"en":"A: Could you break a fifty-dollar bill for me?\nB: Sure. Do you want tens and fives?","ko":"A: 50달러 지폐를 잔돈으로 바꿔주시겠어요?\nB: 네. 10달러와 5달러짜리로 드릴까요?"}],"pronunciation":"브레이크 어 빌","id":293},{"day":30,"num":5,"word":"exhibition","meaning":"전시회","hint":"","mnemonic":"exhibition → “집에 숨겨둔 작품을 꺼내 모두에게!”\n“이거 집에 두지 말고 보여줘!”라는 말을 듣고 그림 여러 점을 밖으로 꺼냅니다. 한 공간에 걸고 사람들을 초대하니 전시회가 열립니다.\n이거 + 집에 → exhibit(전시하다) → 작품을 모아 보여주는 exhibition(전시회).","dialogue":"A: When does the exhibition close?\nB: At six. Last admission is at five thirty.","dialogues":["A: When does the exhibition close?\nB: At six. Last admission is at five thirty.","A: When does the photography exhibition close?\nB: It runs until the end of the month."],"caution":"exhibit = 전시하다/전시품, exhibition = 전시회.","past":true,"similar":"","note":"exhibit = 전시하다/전시품, exhibition = 전시회.","ko_dialogue":"A: 전시회는 몇 시에 닫나요?\nB: 6시입니다. 마지막 입장은 5시 30분이에요.","dialogue_pairs":[{"en":"A: When does the exhibition close?\nB: At six. Last admission is at five thirty.","ko":"A: 전시회는 몇 시에 닫나요?\nB: 6시입니다. 마지막 입장은 5시 30분이에요."},{"en":"A: When does the photography exhibition close?\nB: It runs until the end of the month.","ko":"A: 사진 전시는 언제 끝나나요?\nB: 이달 말까지 열립니다."}],"pronunciation":"엑시비션","id":294},{"day":30,"num":6,"word":"museum","meaning":"박물관","hint":"","mnemonic":"museum [뮤지엄] → “뮤~ 하고 울던 옛 동물도 여기!”\n아주 오래전 동물의 뼈와 옛사람들이 쓰던 그릇이 한 건물 안에 모여 있습니다. 동물 울음소리 ‘뮤~’를 듣는 듯하며 옛것들을 둘러봅니다.\n뮤~ + 오래된 유물들을 모아놓은 곳 → 뮤지엄 → 박물관.","dialogue":"A: Is the museum open on Mondays?\nB: No, it is closed every Monday.","dialogues":["A: Is the museum open on Mondays?\nB: No, it is closed every Monday.","A: Is the museum free on Fridays?\nB: Yes, admission is free after five."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 박물관은 월요일에 운영하나요?\nB: 아니요, 매주 월요일은 휴관입니다.","dialogue_pairs":[{"en":"A: Is the museum open on Mondays?\nB: No, it is closed every Monday.","ko":"A: 박물관은 월요일에 운영하나요?\nB: 아니요, 매주 월요일은 휴관입니다."},{"en":"A: Is the museum free on Fridays?\nB: Yes, admission is free after five.","ko":"A: 금요일에는 박물관이 무료인가요?\nB: 네, 5시 이후에는 무료 입장입니다."}],"pronunciation":"뮤지엄","id":295},{"day":30,"num":7,"word":"gallery","meaning":"미술관, 갤러리","hint":"","mnemonic":"gallery [갤러리] → “그림 걸어, 여기!”\n벽에 그림을 하나씩 걸어 사람들이 보게 합니다.\n걸어, 여기! ≈ 갤러리.\n→ gallery = 미술관 / 갤러리","dialogue":"A: Is there an art gallery near here?\nB: Yes, beside the public library.","dialogues":["A: Is there an art gallery near here?\nB: Yes, beside the public library.","A: This gallery has a lot of local art.\nB: Yes, most of the artists live in this city."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 근처에 미술관이 있나요?\nB: 네, 공공도서관 옆에 있어요.","dialogue_pairs":[{"en":"A: Is there an art gallery near here?\nB: Yes, beside the public library.","ko":"A: 이 근처에 미술관이 있나요?\nB: 네, 공공도서관 옆에 있어요."},{"en":"A: This gallery has a lot of local art.\nB: Yes, most of the artists live in this city.","ko":"A: 이 미술관에는 지역 작품이 많네요.\nB: 네, 대부분의 작가가 이 도시에 살아요."}],"pronunciation":"갤러리","id":296},{"day":30,"num":8,"word":"special exhibit","meaning":"특별 전시","hint":"","mnemonic":"special exhibit → “이 작품은 집에 숨기기 아까워, 특별히 보여줘!”\n평소에는 잘 꺼내지 않는 귀한 작품을 딱 한 기간만 공개합니다. 사람들이 그 특별한 작품을 보러 모입니다.\n이거 집에 두지 말고 보여줘 → exhibit, 특별한 special → 특별 전시.","dialogue":"A: Does this ticket include the special exhibit?\nB: No, that requires a separate ticket.","dialogues":["A: Does this ticket include the special exhibit?\nB: No, that requires a separate ticket.","A: Do I need a separate ticket for the special exhibit?\nB: Yes, it costs five dollars extra."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 표에 특별 전시도 포함되나요?\nB: 아니요, 별도 표가 필요해요.","dialogue_pairs":[{"en":"A: Does this ticket include the special exhibit?\nB: No, that requires a separate ticket.","ko":"A: 이 표에 특별 전시도 포함되나요?\nB: 아니요, 별도 표가 필요해요."},{"en":"A: Do I need a separate ticket for the special exhibit?\nB: Yes, it costs five dollars extra.","ko":"A: 특별 전시를 보려면 별도 표가 필요한가요?\nB: 네, 5달러가 추가됩니다."}],"pronunciation":"스페셜 이그지빗","id":297},{"day":30,"num":9,"word":"art exhibition","meaning":"미술 전시회","hint":"","mnemonic":"art exhibition → “예술 작품을 집 밖으로 꺼내 함께 보여준다!”\n화가들이 집에서 그린 그림을 한 공간으로 가져와 벽마다 겁니다. 문을 열자 관람객들이 들어와 작품을 감상합니다.\nart(예술) + 이거 집에 두지 말고 보여줘(exhibit 연상) → art exhibition = 미술 전시회.","dialogue":"A: Where is the art exhibition being held?\nB: In the hall on the third floor.","dialogues":["A: Where is the art exhibition being held?\nB: In the hall on the third floor.","A: There is an art exhibition at the old warehouse this weekend.\nB: Let us go on Saturday afternoon."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 미술 전시회는 어디에서 열리나요?\nB: 3층 홀에서 열려요.","dialogue_pairs":[{"en":"A: Where is the art exhibition being held?\nB: In the hall on the third floor.","ko":"A: 미술 전시회는 어디에서 열리나요?\nB: 3층 홀에서 열려요."},{"en":"A: There is an art exhibition at the old warehouse this weekend.\nB: Let us go on Saturday afternoon.","ko":"A: 이번 주말 오래된 창고에서 미술 전시회가 열려요.\nB: 토요일 오후에 가요."}],"pronunciation":"아트 엑시비션","id":298},{"day":30,"num":10,"word":"anything","meaning":"무엇이든, 아무것","hint":"","mnemonic":"anything → “아무 상자나 열어도 돼!”\n여러 상자 중 하나를 고르라고 합니다. 무슨 물건이든 괜찮아서 어느(any) 상자든 집을 수 있습니다.\nany(어느 것이든) + thing(것) → anything = 무엇이든.\n부정문에서는 아무것도 없다는 뜻을 만들 수 있습니다.","dialogue":"A: Do you need anything else?\nB: No, thank you. That is everything.","dialogues":["A: Do you need anything else?\nB: No, thank you. That is everything.","A: Is there anything else I should bring for the tour?\nB: Just water and comfortable shoes."],"caution":"긍정문에서는 ‘무엇이든’, 부정문에서는 ‘아무것도’로 해석될 수 있습니다.","past":true,"similar":"","note":"긍정문에서는 ‘무엇이든’, 부정문에서는 ‘아무것도’로 해석될 수 있습니다.","ko_dialogue":"A: 더 필요한 것이 있나요?\nB: 아니요, 감사합니다. 다 됐어요.","dialogue_pairs":[{"en":"A: Do you need anything else?\nB: No, thank you. That is everything.","ko":"A: 더 필요한 것이 있나요?\nB: 아니요, 감사합니다. 다 됐어요."},{"en":"A: Is there anything else I should bring for the tour?\nB: Just water and comfortable shoes.","ko":"A: 투어에 더 가져가야 할 것이 있나요?\nB: 물과 편한 신발만 있으면 됩니다."}],"pronunciation":"애니씽","id":299},{"day":31,"num":1,"word":"something","meaning":"무언가","hint":"","mnemonic":"something → “상자 안에 뭔가 하나 있다!”\n닫힌 상자를 흔드니 달그락 소리가 납니다. 정확히 무엇인지는 모르지만 안에 무언가가 들어 있습니다.\nsome(어떤) + thing(것) → something = 무언가.","dialogue":"A: Could I have something hot to drink?\nB: Of course. Would you like tea or coffee?","dialogues":["A: Could I have something hot to drink?\nB: Of course. Would you like tea or coffee?","A: I need something warm to wear tonight.\nB: There is a clothing shop near the station."],"caution":"something은 ‘무언가’. 의문문에서도 상대가 원할 것 같을 때 Would you like something...?처럼 쓸 수 있습니다.","past":true,"similar":"","note":"something은 ‘무언가’. 의문문에서도 상대가 원할 것 같을 때 Would you like something...?처럼 쓸 수 있습니다.","ko_dialogue":"A: 따뜻한 음료를 마실 수 있을까요?\nB: 네. 차와 커피 중 어떤 것을 드릴까요?","dialogue_pairs":[{"en":"A: Could I have something hot to drink?\nB: Of course. Would you like tea or coffee?","ko":"A: 따뜻한 음료를 마실 수 있을까요?\nB: 네. 차와 커피 중 어떤 것을 드릴까요?"},{"en":"A: I need something warm to wear tonight.\nB: There is a clothing shop near the station.","ko":"A: 오늘 밤 입을 따뜻한 게 필요해요.\nB: 역 근처에 옷가게가 있습니다."}],"pronunciation":"썸씽","id":300},{"day":31,"num":2,"word":"leave","meaning":"떠나다, 두고 가다","hint":"","mnemonic":"leave [리브] → “리브, 입은 옷만 챙겨 떠났네!”\n서둘러 호텔을 나와 버스를 탔습니다. 입은 옷은 따라왔는데 가방은 객실에 두고 왔습니다.\n리브 소리를 ‘입은 것만 들고 떠나, 나머지는 남김’과 연결합니다.\n사람이 떠나면 leave, 물건을 두고 가도 leave.","dialogue":"A: Can I leave my bags here until the afternoon?\nB: Yes. Please keep this claim ticket.","dialogues":["A: Can I leave my bags here until the afternoon?\nB: Yes. Please keep this claim ticket.","A: What time should we leave for the airport?\nB: At six, to avoid the traffic."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 오후까지 여기에 짐을 두어도 될까요?\nB: 네. 이 보관증을 가지고 계세요.","dialogue_pairs":[{"en":"A: Can I leave my bags here until the afternoon?\nB: Yes. Please keep this claim ticket.","ko":"A: 오후까지 여기에 짐을 두어도 될까요?\nB: 네. 이 보관증을 가지고 계세요."},{"en":"A: What time should we leave for the airport?\nB: At six, to avoid the traffic.","ko":"A: 공항으로 몇 시에 출발해야 할까요?\nB: 교통 체증을 피하려면 6시에요."}],"pronunciation":"리브","id":301},{"day":31,"num":3,"word":"luggage","meaning":"짐, 수하물","hint":"","mnemonic":"luggage [러기지] → “러그까지 챙긴 짐!”\n짐을 너무 많이 싼 사람이 여행가방 옆에 커다란 러그까지 말아 세워놨습니다. “러그까지 가져가요?” 하며 산더미 같은 짐을 봅니다.\n러그까지 → 러기지 → 여행 짐, 수하물.\n실제로 러그를 가져가라는 뜻이 아니라 소리 기억용 과장입니다.","dialogue":"A: How many pieces of luggage do you have?\nB: Two suitcases and a backpack.","dialogues":["A: How many pieces of luggage do you have?\nB: Two suitcases and a backpack.","A: Can I leave my luggage here for a few hours?\nB: Yes, we can store it behind the desk."],"caution":"luggage는 셀 수 없는 명사라 보통 a luggage라고 하지 않습니다. a piece of luggage처럼 씁니다.","past":true,"similar":"baggage = 수하물·짐 / suitcase = 여행가방 하나 / carry-on = 기내 반입 가방","note":"luggage는 셀 수 없는 명사라 보통 a luggage라고 하지 않습니다. a piece of luggage처럼 씁니다.","ko_dialogue":"A: 짐이 몇 개 있으신가요?\nB: 여행가방 두 개와 배낭 하나예요.","dialogue_pairs":[{"en":"A: How many pieces of luggage do you have?\nB: Two suitcases and a backpack.","ko":"A: 짐이 몇 개 있으신가요?\nB: 여행가방 두 개와 배낭 하나예요."},{"en":"A: Can I leave my luggage here for a few hours?\nB: Yes, we can store it behind the desk.","ko":"A: 몇 시간 동안 제 짐을 여기 맡겨도 될까요?\nB: 네, 데스크 뒤에 보관해드릴 수 있습니다."}],"pronunciation":"러기지","id":302},{"day":31,"num":4,"word":"blanket","meaning":"담요","hint":"","mnemonic":"blanket [블랭킷] → “불 끄니 냉기, 담요로 끝!”\n비행기 조명이 꺼지자 몸이 으슬으슬합니다. 담요를 어깨부터 덮으니 냉기가 막혀 따뜻해집니다.\n불 + 냉기 + 끝 → 블랭킷 → 담요.","dialogue":"A: Could I have a blanket, please?\nB: Of course. I will bring one to your seat.","dialogues":["A: Could I have a blanket, please?\nB: Of course. I will bring one to your seat.","A: Could I get another blanket? It is cold in here.\nB: Of course, I will bring one right away."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 담요 한 장 받을 수 있을까요?\nB: 네. 좌석으로 가져다드릴게요.","dialogue_pairs":[{"en":"A: Could I have a blanket, please?\nB: Of course. I will bring one to your seat.","ko":"A: 담요 한 장 받을 수 있을까요?\nB: 네. 좌석으로 가져다드릴게요."},{"en":"A: Could I get another blanket? It is cold in here.\nB: Of course, I will bring one right away.","ko":"A: 담요 하나 더 받을 수 있을까요? 여기가 추워요.\nB: 물론입니다. 바로 가져다드릴게요."}],"pronunciation":"블랭킷","id":303},{"day":31,"num":5,"word":"need to","meaning":"~할 필요가 있다","hint":"","mnemonic":"need to [니드 투] → need(필요하다) + to(할).\n→ need to = ~할 필요가 있다 / ~해야 한다","dialogue":"A: Do I need to print my ticket?\nB: No, you can show it on your phone.","dialogues":["A: Do I need to print my ticket?\nB: No, you can show it on your phone.","A: Do I need to print my train ticket?\nB: No, you can show the QR code on your phone."],"caution":"need to + 동사원형. 여행에서는 I need to check in.처럼 매우 자주 씁니다.","past":true,"similar":"","note":"need to + 동사원형. 여행에서는 I need to check in.처럼 매우 자주 씁니다.","ko_dialogue":"A: 표를 출력해야 하나요?\nB: 아니요, 휴대전화로 보여주셔도 돼요.","dialogue_pairs":[{"en":"A: Do I need to print my ticket?\nB: No, you can show it on your phone.","ko":"A: 표를 출력해야 하나요?\nB: 아니요, 휴대전화로 보여주셔도 돼요."},{"en":"A: Do I need to print my train ticket?\nB: No, you can show the QR code on your phone.","ko":"A: 기차표를 출력해야 하나요?\nB: 아니요, 휴대폰의 QR 코드를 보여주시면 됩니다."}],"pronunciation":"니드 투","id":304},{"day":31,"num":6,"word":"should","meaning":"~해야 한다, ~하는 게 좋다","hint":"","mnemonic":"should [슈드] → “슈즈 신고 가는 게 좋겠네!”\n돌이 많은 길을 맨발로 걷겠다는 친구에게 신발을 건넵니다. “슈즈 신고 가는 게 좋겠어요.”\n슈즈를 신으라는 권유 → 슈드 → ~하는 게 좋다, ~해야 한다.\n‘슈즈’는 소리 기억용이며 should의 뜻은 신발과 관계없습니다.","dialogue":"A: Should I book the tour in advance?\nB: Yes, it often sells out.","dialogues":["A: Should I book the tour in advance?\nB: Yes, it often sells out.","A: What time should we leave for the airport?\nB: Around six should be safe."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 투어를 미리 예약하는 게 좋을까요?\nB: 네, 자주 매진돼요.","dialogue_pairs":[{"en":"A: Should I book the tour in advance?\nB: Yes, it often sells out.","ko":"A: 투어를 미리 예약하는 게 좋을까요?\nB: 네, 자주 매진돼요."},{"en":"A: What time should we leave for the airport?\nB: Around six should be safe.","ko":"A: 공항으로 몇 시에 출발하는 게 좋을까요?\nB: 6시쯤이면 안전할 것 같습니다."}],"pronunciation":"슈드","id":305},{"day":31,"num":7,"word":"where should","meaning":"어디에 ~해야 하나요?","hint":"","mnemonic":"where should [웨어 슈드]\nwhere = 어디, should = ~해야.\n→ Where should I go? = 어디로 가야 하나요?","dialogue":"A: Where should I wait for the shuttle?\nB: Outside the main entrance.","dialogues":["A: Where should I wait for the shuttle?\nB: Outside the main entrance.","A: Where should I wait for the shuttle?\nB: Wait by the main entrance."],"caution":"Where should I go?처럼 should 뒤 동사는 원형.","past":true,"similar":"","note":"Where should I go?처럼 should 뒤 동사는 원형.","ko_dialogue":"A: 셔틀은 어디에서 기다려야 하나요?\nB: 정문 밖에서요.","dialogue_pairs":[{"en":"A: Where should I wait for the shuttle?\nB: Outside the main entrance.","ko":"A: 셔틀은 어디에서 기다려야 하나요?\nB: 정문 밖에서요."},{"en":"A: Where should I wait for the shuttle?\nB: Wait by the main entrance.","ko":"A: 셔틀을 어디에서 기다려야 하나요?\nB: 정문 옆에서 기다리세요."}],"pronunciation":"웨어 슈드","id":306},{"day":31,"num":8,"word":"what time does","meaning":"몇 시에 ~하나요?","hint":"","mnemonic":"what time does [왓 타임 더즈]\nwhat time = 몇 시, does 뒤에는 동사원형.\n→ What time does it leave? = 몇 시에 출발하나요?","dialogue":"A: What time does the restaurant open?\nB: At eleven thirty.","dialogues":["A: What time does the restaurant open?\nB: At eleven thirty.","A: What time does the museum open tomorrow?\nB: It opens at nine thirty."],"caution":"What time does the train leave?처럼 does 뒤 동사는 원형.","past":true,"similar":"","note":"What time does the train leave?처럼 does 뒤 동사는 원형.","ko_dialogue":"A: 식당은 몇 시에 여나요?\nB: 11시 30분에요.","dialogue_pairs":[{"en":"A: What time does the restaurant open?\nB: At eleven thirty.","ko":"A: 식당은 몇 시에 여나요?\nB: 11시 30분에요."},{"en":"A: What time does the museum open tomorrow?\nB: It opens at nine thirty.","ko":"A: 박물관은 내일 몇 시에 여나요?\nB: 9시 30분에 엽니다."}],"pronunciation":"왓 타임 더즈","id":307},{"day":31,"num":9,"word":"offer","meaning":"제안하다, 제공하다","hint":"","mnemonic":"offer [오퍼] → “오, 퍼줄게요!”\n식당 주인이 빈 접시를 보고 “오, 수프 더 퍼드릴까요?” 하며 국자를 내밉니다. 손님이 받기 전에 먼저 제공할 뜻을 밝힙니다.\n오 + 퍼줄게 → 오퍼 → 제안하다 / 제공하다.","dialogue":"A: Do you offer airport pickup?\nB: Yes. Please send us your flight details.","dialogues":["A: Do you offer airport pickup?\nB: Yes. Please send us your flight details.","A: Does the hotel offer free airport pickup?\nB: Yes, but you need to book it in advance."],"caution":"offer는 상대에게 먼저 제안·제공하는 느낌. recommend는 ‘이게 더 좋아요’라고 추천하는 느낌입니다.","past":true,"similar":"suggest = 제안하다 / recommend = 추천하다 / provide = 제공하다 / give = 주다","note":"offer는 상대에게 먼저 제안·제공하는 느낌. recommend는 ‘이게 더 좋아요’라고 추천하는 느낌입니다.","ko_dialogue":"A: 공항 픽업을 제공하나요?\nB: 네. 항공편 정보를 보내주세요.","dialogue_pairs":[{"en":"A: Do you offer airport pickup?\nB: Yes. Please send us your flight details.","ko":"A: 공항 픽업을 제공하나요?\nB: 네. 항공편 정보를 보내주세요."},{"en":"A: Does the hotel offer free airport pickup?\nB: Yes, but you need to book it in advance.","ko":"A: 호텔에서 무료 공항 픽업을 제공하나요?\nB: 네, 다만 미리 예약해야 합니다."}],"pronunciation":"오퍼","id":308},{"day":31,"num":10,"word":"baggage storage","meaning":"수하물 보관","hint":"","mnemonic":"baggage(수하물) + storage(보관).\n짐을 맡겨 보관하는 서비스나 공간.","dialogue":"A: Is baggage storage free for hotel guests?\nB: Yes, until the end of your checkout day.","dialogues":["A: Is baggage storage free for hotel guests?\nB: Yes, until the end of your checkout day.","A: Is baggage storage available after checkout?\nB: Yes, guests can use it for free until midnight."],"caution":"","past":true,"similar":"store = 보관하다 / keep = 보관하다 / storage = 보관","note":"","ko_dialogue":"A: 투숙객은 수하물 보관이 무료인가요?\nB: 네, 체크아웃 당일이 끝날 때까지 무료예요.","dialogue_pairs":[{"en":"A: Is baggage storage free for hotel guests?\nB: Yes, until the end of your checkout day.","ko":"A: 투숙객은 수하물 보관이 무료인가요?\nB: 네, 체크아웃 당일이 끝날 때까지 무료예요."},{"en":"A: Is baggage storage available after checkout?\nB: Yes, guests can use it for free until midnight.","ko":"A: 체크아웃 후에도 수하물 보관을 이용할 수 있나요?\nB: 네, 투숙객은 자정까지 무료로 이용할 수 있습니다."}],"pronunciation":"배기지 스토리지","id":309},{"day":32,"num":1,"word":"pharmacy","meaning":"약국","hint":"","mnemonic":"pharmacy [파머시] → “팔 멍이 심해서 약국으로!”\n여행 중 팔에 멍이 든 사람이 약국에 들어가 약사에게 팔을 보여주며 상담합니다.\n팔 + 멍이 + 심해 → 파머시 → 약국.\n이 이야기는 장소와 발음을 연결하는 암기용입니다.","dialogue":"A: Is there a pharmacy open nearby?\nB: Yes, the one across the street is open until ten.","dialogues":["A: Is there a pharmacy open nearby?\nB: Yes, the one across the street is open until ten.","A: Is there a pharmacy open this late?\nB: Yes, there is a twenty-four-hour pharmacy near the hospital."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 근처에 문을 연 약국이 있나요?\nB: 네, 길 건너 약국은 10시까지 열어요.","dialogue_pairs":[{"en":"A: Is there a pharmacy open nearby?\nB: Yes, the one across the street is open until ten.","ko":"A: 근처에 문을 연 약국이 있나요?\nB: 네, 길 건너 약국은 10시까지 열어요."},{"en":"A: Is there a pharmacy open this late?\nB: Yes, there is a twenty-four-hour pharmacy near the hospital.","ko":"A: 이 늦은 시간에도 여는 약국이 있나요?\nB: 네, 병원 근처에 24시간 약국이 있습니다."}],"pronunciation":"파머시","id":310},{"day":32,"num":2,"word":"avail","meaning":"쓸모·도움 / to no avail: 소용없이","hint":"","mnemonic":"avail [어베일] → “어, 베일을 걷으니 도움이 됐네!”\n지도를 덮고 있던 베일을 걷자 길이 보입니다. “어, 베일을 걷으니 도움이 되네!”\n어 + 베일 → 어베일 → 도움, 쓸모.\nto no avail은 그 도움이 전혀 없었다는 뜻으로, ‘소용없이’라고 연결합니다.","dialogue":"A: Did you reach the hotel by phone?\nB: No. I called twice, but to no avail.","dialogues":["A: Did you reach the hotel by phone?\nB: No. I called twice, but to no avail.","A: We tried to find another room, but to no avail.\nB: Then we may need to stay in a different hotel."],"ko_dialogue":"A: 호텔과 전화가 연결됐나요?\nB: 아니요. 두 번 전화했지만 소용이 없었어요.","similar":"to no avail = without success(성공하지 못하고)","note":"심화 표현입니다. to no avail은 ‘소용없이’라는 뜻이며, 쉬운 회화에서는 It did not work.라고도 말합니다.","dialogue_pairs":[{"en":"A: Did you reach the hotel by phone?\nB: No. I called twice, but to no avail.","ko":"A: 호텔과 전화가 연결됐나요?\nB: 아니요. 두 번 전화했지만 소용이 없었어요."},{"en":"A: We tried to find another room, but to no avail.\nB: Then we may need to stay in a different hotel.","ko":"A: 다른 객실을 찾으려고 했지만 소용이 없었어요.\nB: 그럼 다른 호텔에 묵어야 할 수도 있겠네요."}],"pronunciation":"어베일","caution":"심화 표현입니다. to no avail은 ‘소용없이’라는 뜻이며, 쉬운 회화에서는 It did not work.라고도 말합니다.","id":311},{"day":32,"num":3,"word":"able","meaning":"~할 수 있는","hint":"","mnemonic":"able [에이블] → “에이, 볼 하나쯤은 들 수 있어!”\n무거운 공을 들 수 없을 거라 하자 작은 공을 집어 듭니다. “에이, 이 볼은 들 수 있죠!”\n에이 + 볼 → 에이블 → 할 수 있는.\nbe able to 뒤에 할 수 있는 동작을 붙입니다.","dialogue":"A: Will we be able to check in early?\nB: It depends on whether your room is ready.","dialogues":["A: Will we be able to check in early?\nB: It depends on whether your room is ready.","A: Will you be able to store our bags until evening?\nB: Yes, we have plenty of space."],"ko_dialogue":"A: 일찍 체크인할 수 있을까요?\nB: 객실이 준비되었는지에 따라 달라요.","similar":"","note":"","dialogue_pairs":[{"en":"A: Will we be able to check in early?\nB: It depends on whether your room is ready.","ko":"A: 일찍 체크인할 수 있을까요?\nB: 객실이 준비되었는지에 따라 달라요."},{"en":"A: Will you be able to store our bags until evening?\nB: Yes, we have plenty of space.","ko":"A: 저녁까지 저희 짐을 보관해주실 수 있나요?\nB: 네, 공간이 충분합니다."}],"pronunciation":"에이블","caution":"","id":312},{"day":32,"num":4,"word":"firm","meaning":"확고한, 단단한","hint":"","mnemonic":"firm [펌] → “펌으로 머리 모양을 단단히 고정!”\n머리에 펌을 하고 나니 모양이 쉽게 풀리지 않고 유지됩니다. 손으로 눌러도 쉽게 흐트러지지 않는 고정된 느낌을 붙입니다.\n펌으로 단단히 고정 → firm = 단단한, 확고한.\n실제 펌의 성질을 설명하는 것이 아니라 단어의 느낌을 잇는 연상입니다.","dialogue":"A: This pillow is too soft. Do you have a firm one?\nB: Yes. I will bring one to your room.","dialogues":["A: This pillow is too soft. Do you have a firm one?\nB: Yes. I will bring one to your room.","A: Do you have a firmer pillow?\nB: Yes, I can bring a firm pillow to your room."],"ko_dialogue":"A: 이 베개는 너무 푹신해요. 단단한 것이 있나요?\nB: 네. 객실로 가져다드릴게요.","similar":"","note":"","dialogue_pairs":[{"en":"A: This pillow is too soft. Do you have a firm one?\nB: Yes. I will bring one to your room.","ko":"A: 이 베개는 너무 푹신해요. 단단한 것이 있나요?\nB: 네. 객실로 가져다드릴게요."},{"en":"A: Do you have a firmer pillow?\nB: Yes, I can bring a firm pillow to your room.","ko":"A: 더 단단한 베개가 있나요?\nB: 네, 단단한 베개를 객실로 가져다드릴게요."}],"pronunciation":"펌","caution":"","id":313},{"day":32,"num":5,"word":"draw","meaning":"끌다, 당기다, 그리다","hint":"","mnemonic":"draw [드로] → “드르륵 당겨 선을 그려!”\n종이 위에 연필을 대고 손을 쭉 끌어당깁니다. 연필 끝이 움직인 자리에 선이 그어집니다. 커튼도 손으로 드르륵 끌어당겨 닫습니다.\n드르륵 당기는 손 → 드로 → 끌다 / 그리다.","dialogue":"A: Could you draw the route on this map?\nB: Sure. Start here and follow this street.","dialogues":["A: Could you draw the route on this map?\nB: Sure. Start here and follow this street.","A: Could you draw a circle around the station on this map?\nB: Sure, it is right here."],"ko_dialogue":"A: 이 지도에 경로를 그려주시겠어요?\nB: 네. 여기에서 출발해서 이 길을 따라가세요.","similar":"","note":"","dialogue_pairs":[{"en":"A: Could you draw the route on this map?\nB: Sure. Start here and follow this street.","ko":"A: 이 지도에 경로를 그려주시겠어요?\nB: 네. 여기에서 출발해서 이 길을 따라가세요."},{"en":"A: Could you draw a circle around the station on this map?\nB: Sure, it is right here.","ko":"A: 이 지도에서 역에 동그라미를 그려주시겠어요?\nB: 네, 바로 여기입니다."}],"pronunciation":"드로","caution":"","id":314},{"day":32,"num":6,"word":"stock","meaning":"재고","hint":"","mnemonic":"stock [스탁] → “싹 다 쌓아둬!”\n팔 물건을 창고에 싹 다 쌓아둡니다.\n싹 다 쌓아둔 물건 → 스탁.\n→ stock = 재고","dialogue":"A: Do you have this bag in stock?\nB: Yes, in black and brown.","dialogues":["A: Do you have this bag in stock?\nB: Yes, in black and brown.","A: Do you have more of these adapters in stock?\nB: Yes, there are several in the back."],"ko_dialogue":"A: 이 가방 재고가 있나요?\nB: 네, 검은색과 갈색이 있어요.","similar":"","note":"","dialogue_pairs":[{"en":"A: Do you have this bag in stock?\nB: Yes, in black and brown.","ko":"A: 이 가방 재고가 있나요?\nB: 네, 검은색과 갈색이 있어요."},{"en":"A: Do you have more of these adapters in stock?\nB: Yes, there are several in the back.","ko":"A: 이 어댑터 재고가 더 있나요?\nB: 네, 뒤쪽에 여러 개 있습니다."}],"pronunciation":"스탁","caution":"","id":315},{"day":32,"num":7,"word":"re-","meaning":"다시","hint":"","mnemonic":"접두사 re- = 다시.\nrefill(다시 채우다), restock(재고를 다시 채우다). 단독 단어가 아닙니다.","dialogue":"A: Could you refill my water bottle?\nB: Sure. Please take the lid off.","dialogues":["A: Could you refill my water bottle?\nB: Sure. Please take the lid off.","A: Can I refill this bottle here?\nB: Yes, the water station is beside the restroom."],"ko_dialogue":"A: 제 물병에 물을 다시 채워주시겠어요?\nB: 네. 뚜껑을 열어주세요.","similar":"","note":"re-는 접두사입니다. 대화에서는 re-가 들어간 refill을 사용했습니다.","dialogue_pairs":[{"en":"A: Could you refill my water bottle?\nB: Sure. Please take the lid off.","ko":"A: 제 물병에 물을 다시 채워주시겠어요?\nB: 네. 뚜껑을 열어주세요."},{"en":"A: Can I refill this bottle here?\nB: Yes, the water station is beside the restroom.","ko":"A: 여기서 이 병에 물을 다시 채울 수 있나요?\nB: 네, 급수대는 화장실 옆에 있습니다."}],"pronunciation":"리","caution":"re-는 접두사입니다. 대화에서는 re-가 들어간 refill을 사용했습니다.","id":316},{"day":32,"num":8,"word":"inter-","meaning":"사이에, 서로 간","hint":"","mnemonic":"접두사 inter- = 사이에, 서로 간에.\ninternational = 국가 사이의 → 국제적인. 단독 단어가 아닙니다.","dialogue":"A: Where are the international departures?\nB: On the third floor.","dialogues":["A: Where are the international departures?\nB: On the third floor.","A: Is this the line for international departures?\nB: Yes, domestic departures are on the other side."],"ko_dialogue":"A: 국제선 출발 구역은 어디인가요?\nB: 3층에 있어요.","similar":"","note":"inter-는 접두사입니다. 대화에서는 inter-가 들어간 international을 사용했습니다.","dialogue_pairs":[{"en":"A: Where are the international departures?\nB: On the third floor.","ko":"A: 국제선 출발 구역은 어디인가요?\nB: 3층에 있어요."},{"en":"A: Is this the line for international departures?\nB: Yes, domestic departures are on the other side.","ko":"A: 여기가 국제선 출발 줄인가요?\nB: 네, 국내선 출발은 반대편에 있습니다."}],"pronunciation":"인터","caution":"inter-는 접두사입니다. 대화에서는 inter-가 들어간 international을 사용했습니다.","id":317},{"day":32,"num":9,"word":"national","meaning":"국가의","hint":"","mnemonic":"national [내셔널] → nation(국가) + -al(~의).\n→ national = 국가의","dialogue":"A: How far is the national park?\nB: About an hour by bus.","dialogues":["A: How far is the national park?\nB: About an hour by bus.","A: Is this train covered by the national rail pass?\nB: Yes, this route is included."],"ko_dialogue":"A: 국립공원은 얼마나 먼가요?\nB: 버스로 약 한 시간이요.","similar":"","note":"","dialogue_pairs":[{"en":"A: How far is the national park?\nB: About an hour by bus.","ko":"A: 국립공원은 얼마나 먼가요?\nB: 버스로 약 한 시간이요."},{"en":"A: Is this train covered by the national rail pass?\nB: Yes, this route is included.","ko":"A: 이 기차는 전국 철도 패스로 탈 수 있나요?\nB: 네, 이 노선은 포함됩니다."}],"pronunciation":"내셔널","caution":"","id":318},{"day":32,"num":10,"word":"permit","meaning":"허용하다","hint":"","mnemonic":"permit [퍼밋] → “퍼, 마음껏!”\n뷔페에서 음식을 더 떠도 되는지 망설입니다. 직원이 손짓하며 “퍼요, 마음껏!” 하고 허락합니다.\n퍼 + 마음껏 → 퍼밋 → 허용하다.\n허용된 상태는 permitted입니다.","dialogue":"A: Does the museum permit photography?\nB: Yes, except in the special exhibition rooms.","dialogues":["A: Does the museum permit photography?\nB: Yes, except in the special exhibition rooms.","A: Does this park permit bicycles on the walking path?\nB: No, bikes must stay on the road."],"ko_dialogue":"A: 박물관에서 사진 촬영을 허용하나요?\nB: 네. 특별 전시실은 제외하고요.","similar":"","note":"","dialogue_pairs":[{"en":"A: Does the museum permit photography?\nB: Yes, except in the special exhibition rooms.","ko":"A: 박물관에서 사진 촬영을 허용하나요?\nB: 네. 특별 전시실은 제외하고요."},{"en":"A: Does this park permit bicycles on the walking path?\nB: No, bikes must stay on the road.","ko":"A: 이 공원은 산책로에 자전거를 허용하나요?\nB: 아니요, 자전거는 도로로 다녀야 합니다."}],"pronunciation":"퍼밋","caution":"","id":319},{"day":33,"num":1,"word":"prohibit","meaning":"금지하다","hint":"","mnemonic":"prohibit [프로히빗] → “프로도 입에 빗장!”\n하면 안 되는 말을 막으려고 입에 빗장을 거는 모습을 붙입니다.\n프로 + 입 + 빗(장) ≈ 프로히빗.\n→ prohibit = 금지하다","dialogue":"A: Do the rules prohibit swimming here?\nB: Yes. Please use the beach farther down the coast.","dialogues":["A: Do the rules prohibit swimming here?\nB: Yes. Please use the beach farther down the coast.","A: Do local rules prohibit drinking alcohol on the beach?\nB: Yes, alcohol is not allowed after sunset."],"ko_dialogue":"A: 규정상 여기에서 수영이 금지되어 있나요?\nB: 네. 해안을 따라 더 내려가면 있는 해변을 이용하세요.","similar":"","note":"","dialogue_pairs":[{"en":"A: Do the rules prohibit swimming here?\nB: Yes. Please use the beach farther down the coast.","ko":"A: 규정상 여기에서 수영이 금지되어 있나요?\nB: 네. 해안을 따라 더 내려가면 있는 해변을 이용하세요."},{"en":"A: Do local rules prohibit drinking alcohol on the beach?\nB: Yes, alcohol is not allowed after sunset.","ko":"A: 현지 규정상 해변에서 술 마시는 것이 금지되나요?\nB: 네, 해가 진 뒤에는 술이 허용되지 않습니다."}],"pronunciation":"프로히빗","caution":"","id":320},{"day":33,"num":2,"word":"afford","meaning":"감당할 수 있다","hint":"","mnemonic":"afford [어포드] → “어, 포드 자동차도 살 수 있네!”\n통장 잔액과 중고 포드 자동차 가격을 비교합니다. 내 예산 안에서 살 수 있다는 걸 알고 “어, 포드도 감당할 수 있네!” 합니다.\n어 + 포드 → 어포드 → 비용을 감당할 여유가 있다.\ncan afford는 살 여유가 있다, cannot afford는 살 여유가 없다. 차가 원래 싸다는 뜻은 아닙니다.","dialogue":"A: Can we afford another night at this hotel?\nB: Yes, if we choose the standard room.","dialogues":["A: Can we afford another night at this hotel?\nB: Yes, if we choose the standard room.","A: We cannot afford a taxi every day.\nB: Let us buy a weekly transit pass instead."],"ko_dialogue":"A: 이 호텔에서 하룻밤 더 묵을 여유가 있나요?\nB: 네, 일반 객실로 고르면요.","similar":"","note":"","dialogue_pairs":[{"en":"A: Can we afford another night at this hotel?\nB: Yes, if we choose the standard room.","ko":"A: 이 호텔에서 하룻밤 더 묵을 여유가 있나요?\nB: 네, 일반 객실로 고르면요."},{"en":"A: We cannot afford a taxi every day.\nB: Let us buy a weekly transit pass instead.","ko":"A: 매일 택시를 탈 형편은 안 돼요.\nB: 대신 일주일 교통패스를 사요."}],"pronunciation":"어포드","caution":"","id":321},{"day":33,"num":3,"word":"prefer","meaning":"더 좋아하다, 선호하다","hint":"","mnemonic":"prefer [프리퍼] → “프리하게 다니는 쪽이 더 좋아!”\n정해진 단체 일정과 자유여행 중에서 고릅니다. “나는 프리하게 다니는 게 더 좋아!” 하며 자유여행을 집습니다.\n프리한 쪽을 더 좋아함 → 프리퍼 → 선호하다.\n대상은 음식·좌석·여행 방식 등 무엇이든 될 수 있습니다.","dialogue":"A: Do you prefer to walk or take a taxi?\nB: I prefer to walk. It is not far.","dialogues":["A: Do you prefer to walk or take a taxi?\nB: I prefer to walk. It is not far.","A: Would you prefer a room with one bed or two?\nB: I prefer two beds, please."],"ko_dialogue":"A: 걷는 것과 택시 타는 것 중 어느 쪽을 더 원하세요?\nB: 걷는 게 좋아요. 멀지 않잖아요.","similar":"","note":"","dialogue_pairs":[{"en":"A: Do you prefer to walk or take a taxi?\nB: I prefer to walk. It is not far.","ko":"A: 걷는 것과 택시 타는 것 중 어느 쪽을 더 원하세요?\nB: 걷는 게 좋아요. 멀지 않잖아요."},{"en":"A: Would you prefer a room with one bed or two?\nB: I prefer two beds, please.","ko":"A: 침대 한 개와 두 개 중 어느 객실을 선호하시나요?\nB: 침대 두 개인 객실이 좋아요."}],"pronunciation":"프리퍼","caution":"","id":322},{"day":33,"num":4,"word":"attract","meaning":"끌어당기다","hint":"","mnemonic":"attract [어트랙트] → “어, 트랙터가 끌어당긴다!”\n트랙터가 무거운 짐을 끌어당기듯, 멋진 관광지 사진이 내 관심을 자기 쪽으로 끌어당깁니다. 눈길이 자꾸 그쪽으로 갑니다.\n어 + 트랙터 → 어트랙트 → 끌어당기다, 관심을 끌다.","dialogue":"A: What attracts visitors to this village?\nB: Its traditional houses and local food.","dialogues":["A: What attracts visitors to this village?\nB: Its traditional houses and local food.","A: What attracts so many visitors to this island?\nB: The beaches and hiking trails are the main reasons."],"ko_dialogue":"A: 무엇 때문에 방문객들이 이 마을을 찾나요?\nB: 전통 가옥과 지역 음식 때문이에요.","similar":"","note":"","dialogue_pairs":[{"en":"A: What attracts visitors to this village?\nB: Its traditional houses and local food.","ko":"A: 무엇 때문에 방문객들이 이 마을을 찾나요?\nB: 전통 가옥과 지역 음식 때문이에요."},{"en":"A: What attracts so many visitors to this island?\nB: The beaches and hiking trails are the main reasons.","ko":"A: 무엇이 이렇게 많은 방문객을 이 섬으로 끌어들이나요?\nB: 해변과 등산로가 가장 큰 이유입니다."}],"pronunciation":"어트랙트","caution":"","id":323},{"day":33,"num":5,"word":"occupy","meaning":"차지하다, 점유하다","hint":"","mnemonic":"occupy [아큐파이] → “아! 꽉 파고앉았네!”\n누군가 빈자리에 깊숙이 앉아 자리를 꽉 차지합니다.\n아큐파이 ≈ 아! 꽉 파고앉다.\n→ occupy = 차지하다 / 점유하다","dialogue":"A: Can four people occupy this room?\nB: No, the maximum is three guests.","dialogues":["A: Can four people occupy this room?\nB: No, the maximum is three guests.","A: These bags occupy too much space in the aisle.\nB: I will move them to the luggage rack."],"ko_dialogue":"A: 이 객실에 네 명이 투숙할 수 있나요?\nB: 아니요, 최대 세 명입니다.","similar":"","note":"occupy는 다소 격식 있는 표현입니다. 평소 객실을 문의할 때는 Can four people stay in this room?도 자연스럽습니다.","dialogue_pairs":[{"en":"A: Can four people occupy this room?\nB: No, the maximum is three guests.","ko":"A: 이 객실에 네 명이 투숙할 수 있나요?\nB: 아니요, 최대 세 명입니다."},{"en":"A: These bags occupy too much space in the aisle.\nB: I will move them to the luggage rack.","ko":"A: 이 가방들이 통로 공간을 너무 많이 차지하네요.\nB: 짐 선반으로 옮길게요."}],"pronunciation":"아큐파이","caution":"occupy는 다소 격식 있는 표현입니다. 평소 객실을 문의할 때는 Can four people stay in this room?도 자연스럽습니다.","id":324},{"day":33,"num":6,"word":"exhibit","meaning":"전시하다, 전시품","hint":"","mnemonic":"exhibit [이그지빗] → “이거, 집에 두지 말고 보여줘!”\n집에만 숨겨둔 멋진 그림을 친구가 발견합니다. “이거 집에 두기 아까워. 사람들이 보게 꺼내!” 그림을 꺼내 전시합니다.\n이거 + 집에 → 이그지… → 전시하다 / 전시품.","dialogue":"A: Does this gallery exhibit local artists’ work?\nB: Yes, all these paintings  the rental car?\nB: By ten tomorrow morning.","dialogues":["A: When should I return the rental car?\nB: By ten tomorrow morning.","A: I need to return this jacket because it is too small.\nB: Do you have the receipt?"],"ko_dialogue":"A: 렌터카는 언제 반납해야 하나요?\nB: 내일 오전 10시까지입니다.","similar":"return = 물건을 돌려주다 / refund = 환불하다 / exchange = 교환하다","note":"","dialogue_pairs":[{"en":"A: When should I return the rental car?\nB: By ten tomorrow morning.","ko":"A: 렌터카는 언제 반납해야 하나요?\nB: 내일 오전 10시까지입니다."},{"en":"A: I need to return this jacket because it is too small.\nB: Do you have the receipt?","ko":"A: 이 재킷이 너무 작아서 반품하고 싶어요.\nB: 영수증이 있으신가요?"}],"pronunciation":"리턴","caution":"","id":329},{"day":34,"num":1,"word":"verify","meaning":"검증하다, 사실인지 확인하다","hint":"","mnemonic":"verify [베러파이] → “베낀 파일, 맞나 봐!”\n여권 내용을 파일에 옮겨 적은 뒤 원본과 한 글자씩 맞는지 확인합니다.\n베낀 파일 맞나 봐 → 베러파이.\n→ verify = 확인하다 / 검증하다","dialogue":"A: Why do you need my passport?\nB: We need to verify your identity before check-in.","dialogues":["A: Why do you need my passport?\nB: We need to verify your identity before check-in.","A: Could you verify the departure time for me?\nB: Yes, the train leaves at 8:45."],"ko_dialogue":"A: 여권이 왜 필요한가요?\nB: 체크인 전에 신원을 확인해야 합니다.","similar":"","note":"","dialogue_pairs":[{"en":"A: Why do you need my passport?\nB: We need to verify your identity before check-in.","ko":"A: 여권이 왜 필요한가요?\nB: 체크인 전에 신원을 확인해야 합니다."},{"en":"A: Could you verify the departure time for me?\nB: Yes, the train leaves at 8:45.","ko":"A: 출발 시간을 확인해주시겠어요?\nB: 네, 기차는 8시 45분에 출발합니다."}],"pronunciation":"베러파이","caution":"","id":330}];

const storage={getItem(k){try{return localStorage.getItem('travelWork331:'+k)}catch{return null}},setItem(k,v){try{localStorage.setItem('travelWork331:'+k,v)}catch{}}};
let localEdits=JSON.parse(storage.getItem('localEdits')||'{}');
let customCards=[];

function applyLocalEdit(card){
  const e=localEdits[card.word];
  return e ? {...card, ...e} : card;
}
function saveLocalEdit(word, patch){
  localEdits[word]={...(localEdits[word]||{}), ...patch};
  storage.setItem('localEdits', JSON.stringify(localEdits));
}
try{customCards=JSON.parse(storage.getItem('travelCustomCards')||'[]')}catch(e){customCards=[]}
let wrongSet=new Set();
try{wrongSet=new Set(JSON.parse(storage.getItem('travelWrongWords')||'[]'))}catch(e){}
let hideMeaning=storage.getItem('travelHideMeaning')!=='false';
let hideMnemonic=storage.getItem('travelHideMnemonic')!=='false';
let bookMode=storage.getItem('travelBookMode')==='true';
let shuffled=storage.getItem('travelShuffle')==='true';
let wrongOnly=false;
let index=Number(storage.getItem('index')||0);
let revealed=!hideMeaning;
let mnemonicRevealed=!hideMnemonic;
let englishRevealed=false;
let mode='cards';
let query='';

function allCards(){return [...baseCards,...customCards].map(applyLocalEdit)}
function activeCards(){
  let a=allCards();
  if(wrongOnly) a=a.filter(c=>wrongSet.has(c.word));
  if(shuffled){
    const seedStr=storage.getItem('travelShuffleSeed')||'0.314159';
    let seed=Number(seedStr)||0.314159;
    a=[...a].sort((x,y)=>{
      const hx=Math.sin([...x.word].reduce((s,ch)=>s+ch.charCodeAt(0),0)+seed*10000);
      const hy=Math.sin([...y.word].reduce((s,ch)=>s+ch.charCodeAt(0),0)+seed*10000);
      return hx-hy;
    });
  }
  return a;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function saveState(){
  storage.setItem('travelWrongWords',JSON.stringify([...wrongSet]));
  storage.setItem('travelHideMeaning',String(hideMeaning));
  storage.setItem('travelHideMnemonic',String(hideMnemonic));
  storage.setItem('travelBookMode',String(bookMode));
  storage.setItem('travelShuffle',String(shuffled));
}
function current(){const a=activeCards();return a.length?a[Math.max(0,Math.min(index,a.length-1))]:null}


// ===== V9: actual male / female neural audio =====
let speechGender=storage.getItem('speechGender')==='male'?'male':'female';
const savedSpeechRate=Number(storage.getItem('speechRate'));
let speechRate=savedSpeechRate>=0.5&&savedSpeechRate<=1.5?savedSpeechRate:1;
let speechRun=0, speechTimer=null, speechWait=null;
let speechStatus='미국식 AI 음성 · 남성 Michael / 여성 Heart';
function cleanSpeechText(text){return String(text||'').replace(/^[AB]:\s*/gm,'').replace(/~/g,'').replace(/\s+/g,' ').trim();}
function speechControls(){
 return `<div class="voice-controls" onclick="event.stopPropagation()">
  <div class="voice-buttons" role="group" aria-label="음성 선택">
   <button type="button" class="speak-btn" aria-pressed="${speechGender==='male'}" onclick="setSpeechGender('male')">남성 · Michael</button>
   <button type="button" class="speak-btn" aria-pressed="${speechGender==='female'}" onclick="setSpeechGender('female')">여성 · Heart</button>
  </div>
  <label class="voice-speed">읽기 속도 <output class="speech-rate-value">${speechRate.toFixed(2)}배</output>
   <input aria-label="읽기 속도" type="range" min="0.5" max="1.5" step="0.05" value="${speechRate}" oninput="setSpeechRate(this.value)">
   <span class="speed-limits"><span>느리게 0.5배</span><span>빠르게 1.5배</span></span>
  </label>
  <div class="voice-note speech-status" role="status">${esc(speechStatus)}</div>
  <button type="button" class="speak-btn" onclick="speakText('Could I leave my baggage here after check out?')">▶ 목소리 들어보기</button>
  <details><summary>음성 안내</summary><p class="voice-note">기본 단어·예문은 남녀 AI 음성이 포함돼 있습니다. 추가하거나 수정한 문장은 기기에서 같은 AI 음성을 만듭니다. 이때 처음 한 번 큰 음성 모델을 내려받아 시간이 걸릴 수 있습니다. Wi-Fi 사용을 권장합니다. 음성 이용료나 API 키는 필요하지 않습니다.</p></details>
 </div>`;
}
function setSpeechStatus(text){speechStatus=text;document.querySelectorAll('.speech-status').forEach(el=>el.textContent=text);}
TravelAudio.onStatus(setSpeechStatus);
function refreshSpeechControls(){document.querySelectorAll('.speech-settings').forEach(el=>el.innerHTML=speechControls());}
function setSpeechGender(g){stopSpeech();speechGender=g==='male'?'male':'female';storage.setItem('speechGender',speechGender);setSpeechStatus((speechGender==='male'?'남성 Michael':'여성 Heart')+' 선택됨');refreshSpeechControls();}
function setSpeechRate(value){
 const n=Number(value);if(!Number.isFinite(n))return;
 stopSpeech();speechRate=Math.max(.5,Math.min(1.5,n));storage.setItem('speechRate',String(speechRate));
 document.querySelectorAll('.speech-rate-value').forEach(el=>el.textContent=speechRate.toFixed(2)+'배');
 document.querySelectorAll('.voice-speed input').forEach(el=>el.value=speechRate);
 setSpeechStatus(speechRate.toFixed(2)+'배 · 다시 재생하면 적용됩니다.');
}
async function speakText(text,mode='sentence'){
 stopSpeech();TravelAudio.unlock();await TravelAudio.play(cleanSpeechText(text),speechGender,speechRate);
}
async function speakSequence(items){
 stopSpeech();TravelAudio.unlock();const run=speechRun;
 const list=(items||[]).map(item=>({text:cleanSpeechText(typeof item==='string'?item:item.text),pause:typeof item==='object'&&Number.isFinite(item.pause)?item.pause:430})).filter(x=>x.text);
 for(const item of list){
  if(run!==speechRun)return;
  const played=await TravelAudio.play(item.text,speechGender,speechRate);
  if(!played||run!==speechRun)return;
  await new Promise(resolve=>{speechWait=resolve;speechTimer=setTimeout(()=>{speechWait=null;resolve()},item.pause)});
 }
}

function speakCurrentCard(){
  const c=current();
  if(!c) return;

  const items=[{text:c.word,mode:'word',pause:520}];
  const pairs=Array.isArray(c.dialogue_pairs)?c.dialogue_pairs:[];

  pairs.forEach((p,pairIndex)=>{
    const lines=String(p.en||'').split('\n').filter(Boolean);
    lines.forEach((line,lineIndex)=>{
      // Slightly longer pause after the reply and between examples.
      const isLastLine=lineIndex===lines.length-1;
      const isLastPair=pairIndex===pairs.length-1;
      items.push({
        text:line,
        mode:'sentence',
        pause:isLastLine ? (isLastPair ? 300 : 720) : 430
      });
    });
  });

  speakSequence(items);
}

function stopSpeech(){
 speechRun++;clearTimeout(speechTimer);speechTimer=null;
 if(speechWait){speechWait();speechWait=null;}
 TravelAudio.stop();setSpeechStatus('재생 대기');
}

let writingLookup;
function writingKey(text){return String(text||'').replace(/^[AB]:\s*/,'').replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();}
function writingLesson(text){if(!writingLookup)writingLookup=new Map(Object.entries(WRITING_DATA).map(([k,v])=>[writingKey(k),v]));return writingLookup.get(writingKey(text));}
function toggleWriting(button){const panel=button.nextElementSibling,opened=button.getAttribute('aria-expanded')==='true';button.setAttribute('aria-expanded',String(!opened));panel.hidden=opened;button.querySelector('.writing-action').textContent=opened?'보기':'가리기';}
function writingRow(raw,translation){
 if(!String(raw).trim())return '';
 const lesson=writingLesson(raw),speaker=String(raw).match(/^[AB]:\s*/)?.[0]?.trim()||'';
 const meaning=String(translation||lesson?.ko||'').replace(/^[AB]:\s*/,'').trim();
 const en=lesson?lesson.chunks.map(p=>p[0]).join(' / '):String(raw).replace(/^[AB]:\s*/,'');
 const ko=lesson?lesson.chunks.map(p=>p[1]).join(' / '):'';
 return `<article class="writing-card" onclick="event.stopPropagation()">
 <div class="writing-meaning"><span class="writing-speaker">${esc(speaker)}</span>${esc(meaning||'기본 해석이 없는 문장입니다.')}</div>
 <div class="writing-fold"><button type="button" class="writing-toggle" aria-expanded="false" onclick="event.stopPropagation();toggleWriting(this)"><span>① 나눈 해석</span><span class="writing-action">보기</span></button><div class="writing-hint" hidden>${ko?esc(ko):'추가·수정한 문장의 나눈 해석은 아직 없습니다.'}</div></div>
 <div class="writing-fold"><button type="button" class="writing-toggle" aria-expanded="false" onclick="event.stopPropagation();toggleWriting(this)"><span>② 영어</span><span class="writing-action">보기</span></button><div class="writing-answer" hidden><p class="writing-english">${esc(en)}</p><button class="speak-btn" type="button" data-speech="${esc(raw)}" onclick="event.stopPropagation();speakText(this.dataset.speech,'sentence')">🔊 이 문장 듣기</button></div></div>
 ${lesson?.notes?.length?`<details class="writing-notes"><summary>💡 왜 이 표현을 썼을까요?</summary>${lesson.notes.map(([title,body])=>`<div class="writing-note"><strong>${esc(title)}</strong><p>${esc(body)}</p></div>`).join('')}</details>`:''}</article>`;
}

function cardContent(c, compact=false){
  const meaningBlock = revealed
    ? `<div class="meaning tap-toggle" onclick="event.stopPropagation();revealed=false;render()">${esc(c.meaning||'')}</div>`
    : `<div class="meaning tap-toggle blurred" onclick="event.stopPropagation();revealed=true;render()">${esc(c.meaning||'')}</div>`;

  const mnemonicBlock = mnemonicRevealed
    ? `<div class="box tap-toggle" onclick="event.stopPropagation();mnemonicRevealed=false;render()">${esc(c.mnemonic||'')}</div>`
    : `<div class="box tap-toggle blurred" onclick="event.stopPropagation();mnemonicRevealed=true;render()">${esc(c.mnemonic||'')}</div>`;

  const sim = esc(c.similar||'');
  const note = esc(c.note||c.caution||'');
  const pairs = Array.isArray(c.dialogue_pairs) ? c.dialogue_pairs : (c.dialogues||[]).map(en=>({en,ko:''}));

  const dialogueHtml = pairs.map((p,i)=>{
    const enLines=(p.en||'').split('\n');
    const koLines=(p.ko||'').split('\n');
    const rows=enLines.map((line,j)=>writingRow(line,koLines[j]||'')).join('');

    return `
      <div class="dialogue-example">
        <div class="lab" style="margin-top:${i?18:8}px">예시 ${i+1}</div>
        ${rows}
      </div>
    `;
  }).join('');

  return `
