":"","mnemonic":"popular [파퓰러] → “표 몰려!”\n인기 많은 후보에게 사람들의 표가 몰립니다.\n파퓰러 ≈ 표 몰려.\n→ popular = 인기 있는","dialogue":"A: Which dish is the most popular?\nB: The grilled fish is our best seller.","caution":"","dialogues":["A: Which dish is the most popular?\nB: The grilled fish is our best seller.","A: Which beach is most popular with local families?\nB: Sunset Beach is usually the busiest."],"similar":"","note":"","ko_dialogue":"A: 어떤 요리가 가장 인기 있나요?\nB: 생선구이가 가장 많이 팔려요.","dialogue_pairs":[{"en":"A: Which dish is the most popular?\nB: The grilled fish is our best seller.","ko":"A: 어떤 요리가 가장 인기 있나요?\nB: 생선구이가 가장 많이 팔려요."},{"en":"A: Which beach is most popular with local families?\nB: Sunset Beach is usually the busiest.","ko":"A: 현지 가족들에게 가장 인기 있는 해변이 어디인가요?\nB: 보통 선셋 비치가 가장 붐빕니다."}],"pronunciation":"파퓰러","id":151},{"day":16,"num":3,"word":"ready to","meaning":"~할 준비가 된","hint":"","mnemonic":"ready to [레디 투] → ready(준비된) + to(할).\n→ ready to = ~할 준비가 된","dialogue":"A: Are you ready to order?\nB: Yes. Two bowls of noodle soup, please.","caution":"이 표현 뒤에는 보통 동사원형이 옵니다. 여행에서 바로 문장으로 붙여 쓰는 연습을 하세요.","dialogues":["A: Are you ready to order?\nB: Yes. Two bowls of noodle soup, please.","A: Are you ready to board?\nB: Yes, I have my passport and boarding pass."],"similar":"","note":"이 표현 뒤에는 보통 동사원형이 옵니다. 여행에서 바로 문장으로 붙여 쓰는 연습을 하세요.","ko_dialogue":"A: 주문할 준비가 되셨나요?\nB: 네. 국수 두 그릇 주세요.","dialogue_pairs":[{"en":"A: Are you ready to order?\nB: Yes. Two bowls of noodle soup, please.","ko":"A: 주문할 준비가 되셨나요?\nB: 네. 국수 두 그릇 주세요."},{"en":"A: Are you ready to board?\nB: Yes, I have my passport and boarding pass.","ko":"A: 탑승할 준비됐어요?\nB: 네, 여권과 탑승권 챙겼어요."}],"pronunciation":"레디 투","id":152},{"day":16,"num":4,"word":"cheap","meaning":"값싼","hint":"","mnemonic":"cheap [칩] → “집이 이렇게 싸?”\n집값을 보고 너무 저렴해서 놀랍니다.\n집 ≈ 칩.\n→ cheap = 싼 / 저렴한","dialogue":"A: Is there a cheap place to eat nearby?\nB: Yes, the noodle shop across the street is inexpensive.","caution":"cheap은 가격이 싸다는 뜻이지만 품질이 낮다는 느낌도 줄 수 있습니다. 가격만 말하려면 inexpensive도 좋습니다.","dialogues":["A: Is there a cheap place to eat nearby?\nB: Yes, the noodle shop across the street is inexpensive.","A: These tickets are cheap. Are they for today?\nB: Yes, the afternoon shows cost less."],"similar":"cheap = 싼 / affordable = 부담 가능한 / inexpensive = 저렴한","note":"cheap은 가격이 싸다는 뜻이지만 품질이 낮다는 느낌도 줄 수 있습니다. 가격만 말하려면 inexpensive도 좋습니다.","ko_dialogue":"A: 근처에 저렴하게 먹을 곳이 있나요?\nB: 네, 길 건너 국숫집이 저렴해요.","dialogue_pairs":[{"en":"A: Is there a cheap place to eat nearby?\nB: Yes, the noodle shop across the street is inexpensive.","ko":"A: 근처에 저렴하게 먹을 곳이 있나요?\nB: 네, 길 건너 국숫집이 저렴해요."},{"en":"A: These tickets are cheap. Are they for today?\nB: Yes, the afternoon shows cost less.","ko":"A: 이 표들은 저렴하네요. 오늘 표인가요?\nB: 네, 오후 공연은 더 저렴해요."}],"pronunciation":"칩","id":153},{"day":16,"num":5,"word":"affordable","meaning":"가격이 부담 없는","hint":"","mnemonic":"affordable [어포더블] → “어? 포도 더블로 사도 돼!”\n포도를 두 배로 사도 예산 안에서 살 수 있습니다.\n어 + 포도 더블 ≈ affordable.\n→ affordable = 가격이 부담 없는 / 감당 가능한","dialogue":"A: Can you recommend an affordable hotel?\nB: The hotel beside the station has reasonable rates.","caution":"affordable은 ‘싸다’보다 ‘내가 감당 가능한 가격’이라는 뜻이라 cheap보다 긍정적입니다.","dialogues":["A: Can you recommend an affordable hotel?\nB: The hotel beside the station has reasonable rates.","A: Do you know an affordable hotel near the station?\nB: There is a small guesthouse two blocks away."],"similar":"cheap = 싼 / reasonable = 가격이 합리적인 / expensive = 비싼","note":"affordable은 ‘싸다’보다 ‘내가 감당 가능한 가격’이라는 뜻이라 cheap보다 긍정적입니다.","ko_dialogue":"A: 가격이 부담 없는 호텔을 추천해주시겠어요?\nB: 역 옆 호텔은 요금이 합리적이에요.","dialogue_pairs":[{"en":"A: Can you recommend an affordable hotel?\nB: The hotel beside the station has reasonable rates.","ko":"A: 가격이 부담 없는 호텔을 추천해주시겠어요?\nB: 역 옆 호텔은 요금이 합리적이에요."},{"en":"A: Do you know an affordable hotel near the station?\nB: There is a small guesthouse two blocks away.","ko":"A: 역 근처에 가격 부담 없는 호텔을 아시나요?\nB: 두 블록 떨어진 곳에 작은 게스트하우스가 있어요."}],"pronunciation":"어포더블","id":154},{"day":16,"num":6,"word":"expensive","meaning":"비싼","hint":"","mnemonic":"expensive [익스펜시브] → “익! 이 펜 십오만 원?”\n펜 하나 가격이 15만 원이라 깜짝 놀랍니다.\n익! 이 펜 십… ≈ expensive.\n→ expensive = 비싼","dialogue":"A: This is a little expensive. Do you have a cheaper one?\nB: Yes, this smaller one is twenty dollars.","caution":"","dialogues":["A: This is a little expensive. Do you have a cheaper one?\nB: Yes, this smaller one is twenty dollars.","A: Taxis are expensive here at night.\nB: Then let us take the subway instead."],"similar":"pricey = 비싼 / costly = 비용이 많이 드는 / cheap = 싼","note":"","ko_dialogue":"A: 이건 조금 비싸네요. 더 저렴한 것이 있나요?\nB: 네, 이 작은 것은 20달러예요.","dialogue_pairs":[{"en":"A: This is a little expensive. Do you have a cheaper one?\nB: Yes, this smaller one is twenty dollars.","ko":"A: 이건 조금 비싸네요. 더 저렴한 것이 있나요?\nB: 네, 이 작은 것은 20달러예요."},{"en":"A: Taxis are expensive here at night.\nB: Then let us take the subway instead.","ko":"A: 여기 택시는 밤에 비싸네요.\nB: 그럼 대신 지하철을 타요."}],"pronunciation":"익스펜시브","id":155},{"day":16,"num":7,"word":"coupon","meaning":"쿠폰","hint":"","mnemonic":"coupon [쿠폰] → “쿠폰을 내자 가격이 뚝!”\n지갑 속 쿠폰 한 장을 계산대에 내밉니다. 직원이 쿠폰을 적용하자 내야 할 돈이 줄어듭니다.\n쿠폰을 내밀어 할인받는 동작 → coupon = 쿠폰, 할인권.","dialogue":"A: Can I use this coupon today?\nB: Yes. Please show it before you pay.","caution":"","dialogues":["A: Can I use this coupon today?\nB: Yes. Please show it before you pay.","A: Can I use this coupon for the airport shuttle?\nB: Yes, show it when you buy the ticket."],"similar":"","note":"","ko_dialogue":"A: 오늘 이 쿠폰을 사용할 수 있나요?\nB: 네. 결제 전에 보여주세요.","dialogue_pairs":[{"en":"A: Can I use this coupon today?\nB: Yes. Please show it before you pay.","ko":"A: 오늘 이 쿠폰을 사용할 수 있나요?\nB: 네. 결제 전에 보여주세요."},{"en":"A: Can I use this coupon for the airport shuttle?\nB: Yes, show it when you buy the ticket.","ko":"A: 이 쿠폰을 공항 셔틀에 사용할 수 있나요?\nB: 네, 표를 살 때 보여주세요."}],"pronunciation":"쿠폰","id":156},{"day":16,"num":8,"word":"be in stock","meaning":"재고가 있다","hint":"","mnemonic":"be in stock → “쌓인 상자 안에 아직 있다!”\n손님이 찾는 신발을 꺼내려고 창고에 갑니다. 쌓아둔 재고(stock) 더미 안(in)에 해당 사이즈가 남아 있습니다.\n재고 더미 안에 있음 → be in stock = 재고가 있다.\n모두 빠져나가 out이면 out of stock = 품절입니다.","dialogue":"A: Is this size in stock?\nB: Yes, we have one left in black.","caution":"","dialogues":["A: Is this size in stock?\nB: Yes, we have one left in black.","A: Will this suitcase be in stock again tomorrow?\nB: Yes, a new shipment arrives in the morning."],"similar":"","note":"","ko_dialogue":"A: 이 사이즈 재고가 있나요?\nB: 네, 검은색 하나 남아 있어요.","dialogue_pairs":[{"en":"A: Is this size in stock?\nB: Yes, we have one left in black.","ko":"A: 이 사이즈 재고가 있나요?\nB: 네, 검은색 하나 남아 있어요."},{"en":"A: Will this suitcase be in stock again tomorrow?\nB: Yes, a new shipment arrives in the morning.","ko":"A: 이 여행가방이 내일 다시 재고가 있을까요?\nB: 네, 아침에 새 물량이 들어옵니다."}],"pronunciation":"비 인 스탁","id":157},{"day":16,"num":9,"word":"measure","meaning":"재다, 측정하다","hint":"","mnemonic":"measure [메저] → “매죠? 먼저 재죠!”\n벨트를 사려는데 직원이 바로 매기 전에 줄자를 꺼냅니다. “허리에 매려면 먼저 재죠.” 허리둘레를 잰 뒤 맞는 벨트를 고릅니다.\n매죠 / 먼저 재죠 → 메저 → 재다, 측정하다.","dialogue":"A: Could you measure my feet?\nB: Of course. Please stand on this mat.","caution":"","dialogues":["A: Could you measure my feet?\nB: Of course. Please stand on this mat.","A: Could you measure this bag to see if it is carry-on size?\nB: Sure, place it on the measuring stand."],"similar":"","note":"","ko_dialogue":"A: 제 발 치수를 재주시겠어요?\nB: 물론이죠. 이 매트 위에 서주세요.","dialogue_pairs":[{"en":"A: Could you measure my feet?\nB: Of course. Please stand on this mat.","ko":"A: 제 발 치수를 재주시겠어요?\nB: 물론이죠. 이 매트 위에 서주세요."},{"en":"A: Could you measure this bag to see if it is carry-on size?\nB: Sure, place it on the measuring stand.","ko":"A: 이 가방이 기내 반입 크기인지 재주실 수 있나요?\nB: 네, 측정대 위에 올려주세요."}],"pronunciation":"메저","id":158},{"day":16,"num":10,"word":"be in line","meaning":"줄 서 있다","hint":"","mnemonic":"be in line [비 인 라인] → line(줄) 안에 있다.\n→ be in line = 줄 서 있다","dialogue":"A: Are you in line?\nB: Yes, the end of the line is behind me.","caution":"","dialogues":["A: Are you in line?\nB: Yes, the end of the line is behind me.","A: Are you in line for the ticket counter?\nB: Yes, the end of the line is behind me."],"similar":"","note":"","ko_dialogue":"A: 줄 서 계신가요?\nB: 네, 줄 끝은 제 뒤쪽이에요.","dialogue_pairs":[{"en":"A: Are you in line?\nB: Yes, the end of the line is behind me.","ko":"A: 줄 서 계신가요?\nB: 네, 줄 끝은 제 뒤쪽이에요."},{"en":"A: Are you in line for the ticket counter?\nB: Yes, the end of the line is behind me.","ko":"A: 매표소 줄에 서 계신 건가요?\nB: 네, 줄 끝은 제 뒤입니다."}],"pronunciation":"비 인 라인","id":159},{"day":17,"num":1,"word":"prefer","meaning":"더 좋아하다, 선호하다","hint":"","mnemonic":"prefer [프리퍼] → “프리한 여행을 더 좋아해!”\n빽빽한 단체 일정과 자유여행 중에서 고릅니다. “나는 프리하게 다니는 여행이 더 좋아!” 하며 자유여행 쪽을 집습니다.\n프리하게 다니는 쪽을 더 좋아함 → 프리퍼 → 선호하다.\n특정 여행 방식이 아니라 무엇이든 더 좋아하는 것을 말할 때 씁니다.","dialogue":"A: Would you prefer a window seat or an aisle seat?\nB: An aisle seat, please.","caution":"","dialogues":["A: Would you prefer a window seat or an aisle seat?\nB: An aisle seat, please.","A: Would you prefer a room with one bed or two?\nB: I prefer two beds, please."],"similar":"","note":"","ko_dialogue":"A: 창가와 통로 중 어느 좌석을 더 원하세요?\nB: 통로 쪽으로 부탁드려요.","dialogue_pairs":[{"en":"A: Would you prefer a window seat or an aisle seat?\nB: An aisle seat, please.","ko":"A: 창가와 통로 중 어느 좌석을 더 원하세요?\nB: 통로 쪽으로 부탁드려요."},{"en":"A: Would you prefer a room with one bed or two?\nB: I prefer two beds, please.","ko":"A: 침대 한 개와 두 개 중 어느 객실을 선호하시나요?\nB: 침대 두 개인 객실이 좋아요."}],"pronunciation":"프리퍼","id":160},{"day":17,"num":2,"word":"The total comes to ~.","meaning":"총액은 ~입니다","hint":"","mnemonic":"The total comes to [더 토털 컴즈 투]\ntotal(총액)이 ~에 이른다(comes to).\n→ The total comes to ~. = 총액은 ~입니다","dialogue":"A: The total comes to twenty-eight dollars.\nB: Can I pay by card?","caution":"이 표현 뒤에는 보통 동사원형이 옵니다. 여행에서 바로 문장으로 붙여 쓰는 연습을 하세요.","dialogues":["A: The total comes to twenty-eight dollars.\nB: Can I pay by card?","A: The total comes to forty-eight dollars with tax.\nB: Great, I will pay by card."],"similar":"","note":"이 표현 뒤에는 보통 동사원형이 옵니다. 여행에서 바로 문장으로 붙여 쓰는 연습을 하세요.","ko_dialogue":"A: 총액은 28달러입니다.\nB: 카드로 결제해도 될까요?","dialogue_pairs":[{"en":"A: The total comes to twenty-eight dollars.\nB: Can I pay by card?","ko":"A: 총액은 28달러입니다.\nB: 카드로 결제해도 될까요?"},{"en":"A: The total comes to forty-eight dollars with tax.\nB: Great, I will pay by card.","ko":"A: 세금 포함 총액은 48달러입니다.\nB: 좋아요, 카드로 결제할게요."}],"pronunciation":"더 토털 컴즈 투","id":161},{"day":17,"num":3,"word":"kind of","meaning":"약간, 어느 정도","hint":"","mnemonic":"kind of → “딱 그 종류는 아니지만 좀 그런 쪽!”\n한 번도 못 먹을 만큼 맵지는 않은데 혀가 살짝 따갑습니다. 아주 맵다고 단정하지 않고 ‘매운 쪽에 조금 가까워요’ 하고 한발 물러서 말합니다.\nkind(종류·부류)의 ‘그런 쪽’ 느낌 → kind of = 좀, 약간.\n직역 공식이 아니라 말을 부드럽게 낮추는 느낌을 연결합니다.","dialogue":"A: Is the walk difficult?\nB: It is kind of steep, but it is short.","caution":"","dialogues":["A: Is the walk difficult?\nB: It is kind of steep, but it is short.","A: I am kind of tired after the flight.\nB: Let us rest at the hotel before dinner."],"similar":"","note":"","ko_dialogue":"A: 걸어가기 힘든가요?\nB: 조금 가파르지만 거리는 짧아요.","dialogue_pairs":[{"en":"A: Is the walk difficult?\nB: It is kind of steep, but it is short.","ko":"A: 걸어가기 힘든가요?\nB: 조금 가파르지만 거리는 짧아요."},{"en":"A: I am kind of tired after the flight.\nB: Let us rest at the hotel before dinner.","ko":"A: 비행기 타고 나니 좀 피곤하네요.\nB: 저녁 먹기 전에 호텔에서 쉬어요."}],"pronunciation":"카인드 어브","id":162},{"day":17,"num":4,"word":"swipe","meaning":"긁다, 카드 결제하다","hint":"","mnemonic":"swipe [스와이프] → “쓱, 와이퍼!”\n자동차 와이퍼가 유리를 쓱 훑고 지나가듯, 카드를 단말기 홈에 대고 쓱 긁어 지나갑니다. 휴대전화 화면에서도 손가락을 대고 쓱 밀어 넘깁니다.\n스와이프 → 쓱, 와이퍼 → 표면을 쓱 훑는 동작.\n→ swipe = 카드를 긁다 / 화면을 밀어 넘기다","dialogue":"A: The chip is not working.\nB: Please try swiping your card instead.","caution":"","dialogues":["A: The chip is not working.\nB: Please try swiping your card instead.","A: Do I swipe my card or insert it?\nB: Swipe it through the reader on the right."],"similar":"","note":"","ko_dialogue":"A: 카드 칩이 인식되지 않네요.\nB: 대신 카드를 긁어보세요.","dialogue_pairs":[{"en":"A: The chip is not working.\nB: Please try swiping your card instead.","ko":"A: 카드 칩이 인식되지 않네요.\nB: 대신 카드를 긁어보세요."},{"en":"A: Do I swipe my card or insert it?\nB: Swipe it through the reader on the right.","ko":"A: 카드를 긁어야 하나요, 넣어야 하나요?\nB: 오른쪽 단말기에 긁어주세요."}],"pronunciation":"스와이프","id":163},{"day":17,"num":5,"word":"warranty","meaning":"보증, 품질 보증","hint":"","mnemonic":"warranty [워런티] → “워, 이런! 고장 나도 보증해줘?”\n새 카메라가 멈춰 놀랐습니다. “워, 이런!” 하고 영수증을 꺼내자 직원이 보증기간 안이라 수리해준다고 합니다.\n워, 이런 → 워런… → 고장에 대비한 품질 보증 → warranty.","dialogue":"A: Does this camera come with a warranty?\nB: Yes, it has a one-year warranty.","caution":"","dialogues":["A: Does this camera come with a warranty?\nB: Yes, it has a one-year warranty.","A: Does this adapter come with a warranty?\nB: Yes, it has a one-year warranty."],"similar":"","note":"","ko_dialogue":"A: 이 카메라에는 품질 보증이 있나요?\nB: 네, 1년 보증이 있습니다.","dialogue_pairs":[{"en":"A: Does this camera come with a warranty?\nB: Yes, it has a one-year warranty.","ko":"A: 이 카메라에는 품질 보증이 있나요?\nB: 네, 1년 보증이 있습니다."},{"en":"A: Does this adapter come with a warranty?\nB: Yes, it has a one-year warranty.","ko":"A: 이 어댑터에 보증이 있나요?\nB: 네, 1년 보증입니다."}],"pronunciation":"워런티","id":164},{"day":17,"num":6,"word":"decide","meaning":"결정하다","hint":"","mnemonic":"decide [디사이드] → “어느 사이드로 갈지 결정!”\n갈림길에서 왼쪽 사이드와 오른쪽 사이드를 번갈아 봅니다. 잠시 생각하다 오른쪽을 딱 가리키고 걷기 시작합니다.\n사이드(side·쪽) 하나를 고름 → 디사이드 → 결정하다.","dialogue":"A: Have you decided which tour to take?\nB: Yes, the morning boat tour.","caution":"","dialogues":["A: Have you decided which tour to take?\nB: Yes, the morning boat tour.","A: We have not decided which island to visit yet.\nB: Check the ferry times before you decide."],"similar":"","note":"","ko_dialogue":"A: 어떤 투어를 할지 결정하셨어요?\nB: 네, 오전 보트 투어요.","dialogue_pairs":[{"en":"A: Have you decided which tour to take?\nB: Yes, the morning boat tour.","ko":"A: 어떤 투어를 할지 결정하셨어요?\nB: 네, 오전 보트 투어요."},{"en":"A: We have not decided which island to visit yet.\nB: Check the ferry times before you decide.","ko":"A: 어느 섬에 갈지 아직 결정하지 못했어요.\nB: 결정하기 전에 페리 시간을 확인해보세요."}],"pronunciation":"디사이드","id":165},{"day":17,"num":7,"word":"give ~ a minute","meaning":"~에게 잠깐 시간을 주다","hint":"","mnemonic":"give me a minute [기브 미 어 미닛]\n나에게 1분을 주세요 → 잠깐만 시간을 주세요.\n→ give ~ a minute = ~에게 잠깐 시간을 주다","dialogue":"A: Are you ready to order?\nB: Could you give me a minute, please?","caution":"","dialogues":["A: Are you ready to order?\nB: Could you give me a minute, please?","A: Give me a minute to find our booking number.\nB: Sure, take your time."],"similar":"","note":"","ko_dialogue":"A: 주문할 준비가 되셨나요?\nB: 잠깐만 시간을 주시겠어요?","dialogue_pairs":[{"en":"A: Are you ready to order?\nB: Could you give me a minute, please?","ko":"A: 주문할 준비가 되셨나요?\nB: 잠깐만 시간을 주시겠어요?"},{"en":"A: Give me a minute to find our booking number.\nB: Sure, take your time.","ko":"A: 예약번호 찾을 시간을 잠깐 주세요.\nB: 네, 천천히 하세요."}],"pronunciation":"기브 어 미닛","id":166},{"day":17,"num":8,"word":"with","meaning":"~와 함께","hint":"","mnemonic":"with [위드] → “위드(with)라고 적힌 두 손이 함께!”\n두 사람이 손을 꼭 잡고 여행가방을 나란히 끌고 갑니다. 혼자가 아니라 둘이 함께 움직입니다.\n한국어에서도 쓰는 ‘위드 ○○’ → ○○와 함께. 손잡은 둘의 움직임을 붙입니다.","dialogue":"A: Would you like milk with your coffee?\nB: Yes, a little, please.","caution":"","dialogues":["A: Would you like milk with your coffee?\nB: Yes, a little, please.","A: I would like coffee with milk, please.\nB: Sure. Would you like sugar too?"],"similar":"","note":"","ko_dialogue":"A: 커피에 우유를 넣어드릴까요?\nB: 네, 조금 넣어주세요.","dialogue_pairs":[{"en":"A: Would you like milk with your coffee?\nB: Yes, a little, please.","ko":"A: 커피에 우유를 넣어드릴까요?\nB: 네, 조금 넣어주세요."},{"en":"A: I would like coffee with milk, please.\nB: Sure. Would you like sugar too?","ko":"A: 우유 넣은 커피로 주세요.\nB: 네. 설탕도 넣어드릴까요?"}],"pronunciation":"위드","id":167},{"day":17,"num":9,"word":"without","meaning":"~없이","hint":"","mnemonic":"without [위드아웃] → “함께 있던 것이 아웃!”\n커피 옆에 함께(with) 있던 우유를 집어 밖(out)으로 치웁니다. 남은 커피에는 우유가 없습니다.\n함께할 것이 아웃 → without = ~없이.\nwith milk는 우유를 넣어서, without milk는 우유 없이입니다.","dialogue":"A: Could I have this without onions?\nB: Of course. I will let the kitchen know.","caution":"without sugar = 설탕 없이. with sugar = 설탕 넣어서. 둘을 세트로 외우세요.","dialogues":["A: Could I have this without onions?\nB: Of course. I will let the kitchen know.","A: Could I get this sandwich without cheese?\nB: Of course. We can leave the cheese out."],"similar":"","note":"without sugar = 설탕 없이. with sugar = 설탕 넣어서. 둘을 세트로 외우세요.","ko_dialogue":"A: 이것을 양파 없이 받을 수 있을까요?\nB: 물론이죠. 주방에 전달할게요.","dialogue_pairs":[{"en":"A: Could I have this without onions?\nB: Of course. I will let the kitchen know.","ko":"A: 이것을 양파 없이 받을 수 있을까요?\nB: 물론이죠. 주방에 전달할게요."},{"en":"A: Could I get this sandwich without cheese?\nB: Of course. We can leave the cheese out.","ko":"A: 이 샌드위치 치즈 없이 받을 수 있을까요?\nB: 물론이죠. 치즈는 빼드릴게요."}],"pronunciation":"위드아웃","id":168},{"day":17,"num":10,"word":"save room for ~","meaning":"~ 먹을 배를 남겨두다","hint":"","mnemonic":"save room for [세이브 룸 포]\nroom은 ‘방’뿐 아니라 ‘남는 공간’.\n배 속 공간을 남겨 둔다.\n→ save room for ~ = ~먹을 자리 남겨두다","dialogue":"A: Would you like another slice of pizza?\nB: No, I want to save room for dessert.","caution":"음식 얘기에서 ‘배에 자리 남겨두다’라는 표현. 실제 방(room) 의미와 헷갈리지 마세요.","dialogues":["A: Would you like another slice of pizza?\nB: No, I want to save room for dessert.","A: Save room for dessert. The cheesecake here is famous.\nB: Good idea. I will order a smaller main dish."],"similar":"","note":"음식 얘기에서 ‘배에 자리 남겨두다’라는 표현. 실제 방(room) 의미와 헷갈리지 마세요.","ko_dialogue":"A: 피자 한 조각 더 드실래요?\nB: 아니요, 디저트 먹을 배를 남겨두고 싶어요.","dialogue_pairs":[{"en":"A: Would you like another slice of pizza?\nB: No, I want to save room for dessert.","ko":"A: 피자 한 조각 더 드실래요?\nB: 아니요, 디저트 먹을 배를 남겨두고 싶어요."},{"en":"A: Save room for dessert. The cheesecake here is famous.\nB: Good idea. I will order a smaller main dish.","ko":"A: 디저트 먹을 배를 남겨두세요. 여기 치즈케이크가 유명해요.\nB: 좋은 생각이에요. 메인 요리를 작은 걸로 주문할게요."}],"pronunciation":"세이브 룸 포","id":169},{"day":18,"num":1,"word":"patio","meaning":"야외 테라스석","hint":"","mnemonic":"patio [패티오] → “패티는 밖 테라스에서 구워!”\n햄버거 패티를 들고 건물 밖 테라스로 나갑니다. 야외 그릴에서 패티가 지글지글 익고, 바로 옆 테이블에 앉아 먹습니다.\n패티를 굽고 먹는 야외 공간 → 패티오 → 테라스, 야외 좌석 공간.","dialogue":"A: Can we sit on the patio?\nB: Yes. There is a table outside in the shade.","caution":"","dialogues":["A: Can we sit on the patio?\nB: Yes. There is a table outside in the shade.","A: Do you have a table on the patio?\nB: Yes, but it may get chilly later."],"similar":"","note":"","ko_dialogue":"A: 야외 테라스에 앉아도 될까요?\nB: 네, 밖 그늘에 자리가 있어요.","dialogue_pairs":[{"en":"A: Can we sit on the patio?\nB: Yes. There is a table outside in the shade.","ko":"A: 야외 테라스에 앉아도 될까요?\nB: 네, 밖 그늘에 자리가 있어요."},{"en":"A: Do you have a table on the patio?\nB: Yes, but it may get chilly later.","ko":"A: 야외 테라스 자리가 있나요?\nB: 네, 다만 나중에는 쌀쌀할 수 있어요."}],"pronunciation":"패티오","id":170},{"day":18,"num":2,"word":"special","meaning":"특별한, 특선","hint":"","mnemonic":"special [스페셜] → “평범한 메뉴 사이에서 이것만 반짝!”\n매일 먹는 메뉴 옆에 오늘만 내놓는 특별 요리가 등장합니다. 주방장이 따로 꾸미고 손님 앞에 자랑스럽게 내놓습니다.\n익숙한 ‘스페셜 메뉴’에 그 특별 대우를 붙여 기억합니다.\n→ special = 특별한 / 특선","dialogue":"A: What is today’s special?\nB: Grilled fish with rice and vegetables.","caution":"","dialogues":["A: What is today’s special?\nB: Grilled fish with rice and vegetables.","A: What is today's lunch special?\nB: Grilled fish with salad and soup."],"similar":"","note":"","ko_dialogue":"A: 오늘의 특선 요리는 무엇인가요?\nB: 밥과 채소를 곁들인 생선구이입니다.","dialogue_pairs":[{"en":"A: What is today’s special?\nB: Grilled fish with rice and vegetables.","ko":"A: 오늘의 특선 요리는 무엇인가요?\nB: 밥과 채소를 곁들인 생선구이입니다."},{"en":"A: What is today's lunch special?\nB: Grilled fish with salad and soup.","ko":"A: 오늘 점심 특선이 뭐예요?\nB: 구운 생선에 샐러드와 수프입니다."}],"pronunciation":"스페셜","id":171},{"day":18,"num":3,"word":"tip","meaning":"팁","hint":"","mnemonic":"tip [팁] → 한국어 팁처럼 서비스 후 주는 돈, 또는 짧은 조언.\n→ tip = 팁 / 조언","dialogue":"A: Can I leave a tip on my card?\nB: Yes. You can add it on the next screen.","caution":"","dialogues":["A: Can I leave a tip on my card?\nB: Yes. You can add it \n→ on the house = 가게 서비스로 무료","dialogue":"A: We did not order this cake.\nB: It is on the house. Happy anniversary!","caution":"식당·바에서 가게가 서비스로 무료 제공할 때 씁니다.","dialogues":["A: We did not order this cake.\nB: It is on the house. Happy anniversary!","A: The dessert is on the house because you had to wait.\nB: Thank you, that is very kind."],"similar":"","note":"식당·바에서 가게가 서비스로 무료 제공할 때 씁니다.","ko_dialogue":"A: 저희는 이 케이크를 주문하지 않았는데요.\nB: 무료로 드리는 서비스예요. 기념일 축하드려요!","dialogue_pairs":[{"en":"A: We did not order this cake.\nB: It is on the house. Happy anniversary!","ko":"A: 저희는 이 케이크를 주문하지 않았는데요.\nB: 무료로 드리는 서비스예요. 기념일 축하드려요!"},{"en":"A: The dessert is on the house because you had to wait.\nB: Thank you, that is very kind.","ko":"A: 오래 기다리셔서 디저트는 서비스입니다.\nB: 감사합니다. 정말 친절하시네요."}],"pronunciation":"온 더 하우스","id":183},{"day":19,"num":5,"word":"split","meaning":"나누다, 더치페이하다","hint":"","mnemonic":"split [스플릿] → “스플릿 자세처럼 양쪽으로 쫙!”\n두 다리를 양옆으로 벌리는 스플릿 자세처럼, 계산서도 가운데에서 두 갈래로 나눕니다. 각자 자기 몫을 냅니다.\n하나였던 것이 양쪽으로 나뉨 → split = 나누다 / 계산을 나눠 내다.","dialogue":"A: Can we split the bill in half?\nB: Yes. You can each pay with a different card.","caution":"","dialogues":["A: Can we split the bill in half?\nB: Yes. You can each pay with a different card.","A: Can we split this pizza between the three of us?\nB: Sure, I will bring extra plates."],"similar":"","note":"","ko_dialogue":"A: 계산을 반씩 나눌 수 있나요?\nB: 네. 각각 다른 카드로 결제하셔도 됩니다.","dialogue_pairs":[{"en":"A: Can we split the bill in half?\nB: Yes. You can each pay with a different card.","ko":"A: 계산을 반씩 나눌 수 있나요?\nB: 네. 각각 다른 카드로 결제하셔도 됩니다."},{"en":"A: Can we split this pizza between the three of us?\nB: Sure, I will bring extra plates.","ko":"A: 이 피자를 세 명이 나눠 먹어도 될까요?\nB: 네, 접시를 더 가져다드릴게요."}],"pronunciation":"스플릿","id":184},{"day":19,"num":6,"word":"place an order","meaning":"주문하다","hint":"","mnemonic":"place an order [플레이스 언 오더]\norder(주문)를 place(넣다/접수하다).\n→ place an order = 주문하다","dialogue":"A: Can I place an order for pickup?\nB: Yes. What would you like?","caution":"place an order는 조금 더 정식 표현, order는 동사로 바로 써도 됩니다.","dialogues":["A: Can I place an order for pickup?\nB: Yes. What would you like?","A: I would like to place an order for room service.\nB: Certainly. What would you like to have?"],"similar":"","note":"place an order는 조금 더 정식 표현, order는 동사로 바로 써도 됩니다.","ko_dialogue":"A: 방문 포장 주문을 할 수 있나요?\nB: 네. 무엇을 드릴까요?","dialogue_pairs":[{"en":"A: Can I place an order for pickup?\nB: Yes. What would you like?","ko":"A: 방문 포장 주문을 할 수 있나요?\nB: 네. 무엇을 드릴까요?"},{"en":"A: I would like to place an order for room service.\nB: Certainly. What would you like to have?","ko":"A: 룸서비스 주문을 하고 싶어요.\nB: 네. 무엇을 드릴까요?"}],"pronunciation":"플레이스 언 오더","id":185},{"day":19,"num":7,"word":"deliver","meaning":"배달하다, 전달하다","hint":"","mnemonic":"deliver [딜리버] → “딜 넣으러 리버를 보낸다!”\n스타크래프트에서 리버를 상대 쪽까지 보내 딜을 넣습니다.\n딜 + 리버 ≈ 딜리버 → 무언가를 목적지까지 보내 건넨다.\n→ deliver = 전달하다 / 배달하다","dialogue":"A: Do you deliver to this hotel?\nB: Yes. Please give us the hotel name and address.","caution":"","dialogues":["A: Do you deliver to this hotel?\nB: Yes. Please give us the hotel name and address.","A: Can you deliver these flowers to my hotel this afternoon?\nB: Yes, please write the room number here."],"similar":"","note":"","ko_dialogue":"A: 이 호텔로 배달해주시나요?\nB: 네. 호텔 이름과 주소를 알려주세요.","dialogue_pairs":[{"en":"A: Do you deliver to this hotel?\nB: Yes. Please give us the hotel name and address.","ko":"A: 이 호텔로 배달해주시나요?\nB: 네. 호텔 이름과 주소를 알려주세요."},{"en":"A: Can you deliver these flowers to my hotel this afternoon?\nB: Yes, please write the room number here.","ko":"A: 오늘 오후에 이 꽃을 제 호텔로 배달해주실 수 있나요?\nB: 네, 여기에 객실 번호를 적어주세요."}],"pronunciation":"딜리버","id":186},{"day":19,"num":8,"word":"taken","meaning":"(자리 등이) 이미 찬","hint":"","mnemonic":"taken [테이큰] → “이미 누가 테이크해 갔네!”\n빈 의자인 줄 알고 앉으려는데 친구가 가방을 올려놓으며 말합니다. “이 자리는 일행이 먼저 잡아뒀어요.” 이미 누군가 차지한 자리입니다.\ntake(차지하다)한 결과가 taken → 이미 차지된, 자리 있는.","dialogue":"A: Is this table taken?\nB: Yes, but the table by the door is free.","caution":"","dialogues":["A: Is this table taken?\nB: Yes, but the table by the door is free.","A: Is this seat taken?\nB: Yes, my friend is sitting here."],"similar":"","note":"","ko_dialogue":"A: 이 테이블에 자리 있나요?\nB: 네. 하지만 문 옆 테이블은 비어 있어요.","dialogue_pairs":[{"en":"A: Is this table taken?\nB: Yes, but the table by the door is free.","ko":"A: 이 테이블에 자리 있나요?\nB: 네. 하지만 문 옆 테이블은 비어 있어요."},{"en":"A: Is this seat taken?\nB: Yes, my friend is sitting here.","ko":"A: 이 자리 주인이 있나요?\nB: 네, 제 친구가 여기 앉을 거예요."}],"pronunciation":"테이큰","id":187},{"day":19,"num":9,"word":"cancel","meaning":"취소하다","hint":"","mnemonic":"cancel [캔슬] → “캔을 싹 쓸어 없애!”\n있던 캔을 전부 쓸어 치워 목록에서 없어지게 합니다.\n캔 + 쓸어 ≈ 캔슬.\n→ cancel = 취소하다 / 없던 일로 하다","dialogue":"A: I need to cancel my dinner reservation.\nB: Certainly. What name is it under?","caution":"","dialogues":["A: I need to cancel my dinner reservation.\nB: Certainly. What name is it under?","A: I need to cancel tomorrow's tour because I am sick.\nB: I can cancel it and check the refund policy for you."],"similar":"","note":"","ko_dialogue":"A: 저녁 식사 예약을 취소해야 해요.\nB: 네. 어떤 이름으로 예약하셨나요?","dialogue_pairs":[{"en":"A: I need to cancel my dinner reservation.\nB: Certainly. What name is it under?","ko":"A: 저녁 식사 예약을 취소해야 해요.\nB: 네. 어떤 이름으로 예약하셨나요?"},{"en":"A: I need to cancel tomorrow's tour because I am sick.\nB: I can cancel it and check the refund policy for you.","ko":"A: 몸이 아파서 내일 투어를 취소해야 해요.\nB: 취소하고 환불 규정도 확인해드릴게요."}],"pronunciation":"캔슬","id":188},{"day":19,"num":10,"word":"share","meaning":"나누다, 함께 쓰다","hint":"","mnemonic":"share [셰어] → “세어 보고 나눠!”\n사람 수를 세어 본 뒤 음식을 똑같이 나눕니다.\n셰어 ≈ 세어.\n→ share = 나누다 / 함께 쓰다","dialogue":"A: Can we share one pizza?\nB: Of course. I will bring you two plates.","caution":"","dialogues":["A: Can we share one pizza?\nB: Of course. I will bring you two plates.","A: Do you want to share a taxi to the airport?\nB: Sure, that will be cheaper for both of us."],"similar":"","note":"","ko_dialogue":"A: 피자 한 판을 나눠 먹어도 될까요?\nB: 물론이죠. 접시 두 개를 가져다드릴게요.","dialogue_pairs":[{"en":"A: Can we share one pizza?\nB: Of course. I will bring you two plates.","ko":"A: 피자 한 판을 나눠 먹어도 될까요?\nB: 물론이죠. 접시 두 개를 가져다드릴게요."},{"en":"A: Do you want to share a taxi to the airport?\nB: Sure, that will be cheaper for both of us.","ko":"A: 공항까지 택시 같이 타실래요?\nB: 좋아요, 둘 다 더 저렴하겠네요."}],"pronunciation":"셰어","id":189},{"day":20,"num":1,"word":"happy hour","meaning":"할인 시간대","hint":"","mnemonic":"happy hour [해피 아워] → 손님이 행복(happy)한 할인 시간(hour).\n→ happy hour = 식당·바의 할인 시간대","dialogue":"A: What time does happy hour start?\nB: At five, and it ends at seven.","caution":"보통 술집·식당의 특정 할인 시간대. 나라/매장마다 시간은 다릅니다.","dialogues":["A: What time does happy hour start?\nB: At five, and it ends at seven.","A: What time does happy hour start?\nB: From five to seven, all cocktails are half price."],"similar":"","note":"보통 술집·식당의 특정 할인 시간대. 나라/매장마다 시간은 다릅니다.","ko_dialogue":"A: 할인 시간대는 몇 시에 시작하나요?\nB: 5시에 시작해서 7시에 끝나요.","dialogue_pairs":[{"en":"A: What time does happy hour start?\nB: At five, and it ends at seven.","ko":"A: 할인 시간대는 몇 시에 시작하나요?\nB: 5시에 시작해서 7시에 끝나요."},{"en":"A: What time does happy hour start?\nB: From five to seven, all cocktails are half price.","ko":"A: 해피아워는 몇 시에 시작하나요?\nB: 5시부터 7시까지 모든 칵테일이 반값입니다."}],"pronunciation":"해피 아워","id":190},{"day":20,"num":2,"word":"validate parking","meaning":"주차 확인받다","hint":"","mnemonic":"validate parking → “날짜가 맞는 주차권에 확인 도장!”\n식당 직원이 주차권의 날짜와 이용 내역을 확인하고 도장을 찍습니다. 출구에서는 그 도장을 확인해 주차 할인을 적용합니다.\nvalidate 속 date(날짜) 모양 + 유효함을 확인하는 도장 + parking(주차).\n→ 주차 확인·할인 처리하다. 날짜 연결은 암기용입니다.","dialogue":"A: Do you validate parking?\nB: Yes, please show me your parking ticket.","caution":"validate parking은 주차권에 주차 할인·무료 이용 확인을 해주는 뜻입니다.","dialogues":["A: Do you validate parking?\nB: Yes, please show me your parking ticket.","A: Where can I validate parking before I leave?\nB: Bring your ticket to the front desk."],"similar":"","note":"validate parking은 주차권에 주차 할인·무료 이용 확인을 해주는 뜻입니다.","ko_dialogue":"A: 주차 할인 처리를 해주시나요?\nB: 네, 주차권을 보여주세요.","dialogue_pairs":[{"en":"A: Do you validate parking?\nB: Yes, please show me your parking ticket.","ko":"A: 주차 할인 처리를 해주시나요?\nB: 네, 주차권을 보여주세요."},{"en":"A: Where can I validate parking before I leave?\nB: Bring your ticket to the front desk.","ko":"A: 나가기 전에 주차 확인은 어디서 받나요?\nB: 주차권을 프런트 데스크로 가져오세요."}],"pronunciation":"밸리데이트 파킹","id":191},{"day":20,"num":3,"word":"see the menu","meaning":"메뉴를 보다","hint":"","mnemonic":"see the menu → “씨! 눈으로 메뉴를 살핀다!”\n주문하기 전에 메뉴를 펼쳐 음식 사진과 가격을 눈으로 훑습니다. 손은 아직 주문을 가리키지 않고, 눈이 먼저 메뉴를 보고 있습니다.\nsee(보다) + menu(메뉴) → see the menu = 메뉴를 보다.","dialogue":"A: Could we see the menu, please?\nB: Of course. Here are two menus.","caution":"","dialogues":["A: Could we see the menu, please?\nB: Of course. Here are two menus.","A: Could we see the menu before we sit down?\nB: Of course, here is one for each of you."],"similar":"","note":"","ko_dialogue":"A: 메뉴를 볼 수 있을까요?\nB: 네. 메뉴 두 부 드릴게요.","dialogue_pairs":[{"en":"A: Could we see the menu, please?\nB: Of course. Here are two menus.","ko":"A: 메뉴를 볼 수 있을까요?\nB: 네. 메뉴 두 부 드릴게요."},{"en":"A: Could we see the menu before we sit down?\nB: Of course, here is one for each of you.","ko":"A: 앉기 전에 메뉴를 볼 수 있을까요?\nB: 물론이죠, 한 분당 하나씩 드릴게요."}],"pronunciation":"씨 더 메뉴","id":192},{"day":20,"num":4,"word":"flavor","meaning":"맛, 향","hint":"","mnemonic":"flavor [플레이버] → “입안에서 맛과 향이 플레이!”\n아이스크림 한 숟갈을 먹자 딸기 맛, 우유 맛, 달콤한 향이 입안에서 차례로 재생되듯 퍼집니다.\n입안에서 맛이 플레이(play) → 플레이버 → 맛, 풍미.","dialogue":"A: What flavors do you have?\nB: Chocolate, vanilla, and strawberry.","caution":"","dialogues":["A: What flavors do you have?\nB: Chocolate, vanilla, and strawberry.","A: What flavor of ice cream is this?\nB: It is mango with a little coconut."],"similar":"flavor = 맛·향 / taste = 맛 / scent = 향","note":"","ko_dialogue":"A: 어떤 맛이 있나요?\nB: 초콜릿, 바닐라, 딸기가 있어요.","dialogue_pairs":[{"en":"A: What flavors do you have?\nB: Chocolate, vanilla, and strawberry.","ko":"A: 어떤 맛이 있나요?\nB: 초콜릿, 바닐라, 딸기가 있어요."},{"en":"A: What flavor of ice cream is this?\nB: It is mango with a little coconut.","ko":"A: 이 아이스크림은 무슨 맛인가요?\nB: 망고 맛에 코코넛이 조금 들어갔어요."}],"pronunciation":"플레이버","id":193},{"day":20,"num":5,"word":"check on","meaning":"확인해보다","hint":"","mnemonic":"check on [체크 온] → 어떤 대상(on)의 상태를 check(확인)한다.\n→ check on = 상태를 확인하다","dialogue":"A: Could you check on our order?\nB: Certainly. I will ask the kitchen now.","caution":"","dialogues":["A: Could you check on our order?\nB: Certainly. I will ask the kitchen now.","A: Could you check on our order? It has been thirty minutes.\nB: I will ask the kitchen right away."],"similar":"","note":"","ko_dialogue":"A: 저희 주문이 어떻게 되고 있는지 확인해주시겠어요?\nB: 네. 지금 주방에 물어볼게요.","dialogue_pairs":[{"en":"A: Could you check on our order?\nB: Certainly. I will ask the kitchen now.","ko":"A: 저희 주문이 어떻게 되고 있는지 확인해주시겠어요?\nB: 네. 지금 주방에 물어볼게요."},{"en":"A: Could you check on our order? It has been thirty minutes.\nB: I will ask the kitchen right away.","ko":"A: 주문한 음식 좀 확인해주시겠어요? 30분이 지났어요.\nB: 바로 주방에 확인해볼게요."}],"pronunciation":"체크 온","id":194},{"day":20,"num":6,"word":"crave","meaning":"간절히 원하다, 땡기다","hint":"","mnemonic":"crave [크레이브] → “크레이프가 너무 먹고 싶다!”\n배가 불러도 달콤한 크레이프 냄새가 나자 발길이 가게로 향합니다. 머릿속에 계속 크레이프만 맴돕니다.\n크레이프를 몹시 원함 → 크레이브 → 간절히 원하다, 몹시 먹고 싶다.","dialogue":"A: What would you like for dinner?\nB: I am craving Korean food.","caution":"","dialogues":["A: What would you like for dinner?\nB: I am craving Korean food.","A: I am craving noodles after that long flight.\nB: There is a good noodle shop near the hotel."],"similar":"","note":"","ko_dialogue":"A: 저녁으로 무엇을 먹고 싶으세요?\nB: 한국 음식이 정말 먹고 싶어요.","dialogue_pairs":[{"en":"A: What would you like for dinner?\nB: I am craving Korean food.","ko":"A: 저녁으로 무엇을 먹고 싶으세요?\nB: 한국 음식이 정말 먹고 싶어요."},{"en":"A: I am craving noodles after that long flight.\nB: There is a good noodle shop near the hotel.","ko":"A: 긴 비행 후라 면 요리가 너무 당겨요.\nB: 호텔 근처에 괜찮은 국수집이 있어요."}],"pronunciation":"크레이브","id":195},{"day":20,"num":7,"word":"first come, first served","meaning":"선착순","hint":"","mnemonic":"first come, first served [퍼스트 컴, 퍼스트 서브드]\n먼저 온(first come) 사람이 먼저 받는다(first served).\n→ first come, first served = 선착순","dialogue":"A: Can we reserve seats for the show?\nB: No, seating is first come, first served.","caution":"예약 없이 먼저 온 순서대로 받는다는 뜻. 식당·행사 안내에서 자주 보입니다.","dialogues":["A: Can we reserve seats for the show?\nB: No, seating is first come, first served.","A: Do we need to book seats for the rooftop?\nB: No, it is first come, first served."],"similar":"","note":"예약 없이 먼저 온 순서대로 받는다는 뜻. 식당·행사 안내에서 자주 보입니다.","ko_dialogue":"A: 공연 좌석을 예약할 수 있나요?\nB: 아니요, 좌석은 선착순입니다.","dialogue_pairs":[{"en":"A: Can we reserve seats for the show?\nB: No, seating is first come, first served.","ko":"A: 공연 좌석을 예약할 수 있나요?\nB: 아니요, 좌석은 선착순입니다."},{"en":"A: Do we need to book seats for the rooftop?\nB: No, it is first come, first served.","ko":"A: 루프탑 자리를 예약해야 하나요?\nB: 아니요, 선착순입니다."}],"pronunciation":"퍼스트 컴, 퍼스트 서브드","id":196},{"day":20,"num":8,"word":"It's under ~","meaning":"~ 밑에 있어요 / ~ 이름으로 되어 있어요","hint":"","mnemonic":"It's under Kim [잇츠 언더 김].\n예약이 Kim이라는 이름 ‘아래(under)’에 등록돼 있다.\n→ It's under ~ = ~ 이름으로 예약했어요","dialogue":"A: What name is the reservation under?\nB: It is under Son.","caution":"예약 이름 말할 때 It’s under Kim.이 매우 자연스럽습니다. under 뒤에는 보통 예약자 이름.","dialogues":["A: What name is the reservation under?\nB: It is under Son.","A: The reservation is under Kim.\nB: I found it. A table for two at seven."],"similar":"","note":"예약 이름 말할 때 It’s under Kim.이 매우 자연스럽습니다. under 뒤에는 보통 예약자 이름.","ko_dialogue":"A: 어떤 성함으로 예약하셨나요?\nB: 손이라는 이름으로 되어 있어요.","dialogue_pairs":[{"en":"A: What name is the reservation under?\nB: It is under Son.","ko":"A: 어떤 성함으로 예약하셨나요?\nB: 손이라는 이름으로 되어 있어요."},{"en":"A: The reservation is under Kim.\nB: I found it. A table for two at seven.","ko":"A: 예약은 Kim 이름으로 되어 있어요.\nB: 찾았습니다. 7시에 두 분 예약이네요."}],"pronunciation":"잇츠 언더","id":197},{"day":20,"num":9,"word":"That will be all.","meaning":"이게 전부예요","hint":"","mnemonic":"That will be all [댓 윌 비 올] → 그게 전부(all)입니다.\n→ That will be all. = 이상입니다 / 이게 전부예요","dialogue":"A: Anything else?\nB: No, that will be all. Thank you.","caution":"주문 마지막에 ‘이게 전부예요’라는 뜻. That's all.도 가능.","dialogues":["A: Anything else?\nB: No, that will be all. Thank you.","A: Anything else for you today?\nB: No, that will be all. Thank you."],"similar":"","note":"주문 마지막에 ‘이게 전부예요’라는 뜻. That's all.도 가능.","ko_dialogue":"A: 더 필요하신 건 없나요?\nB: 네, 이게 전부예요. 감사합니다.","dialogue_pairs":[{"en":"A: Anything else?\nB: No, that will be all. Thank you.","ko":"A: 더 필요하신 건 없나요?\nB: 네, 이게 전부예요. 감사합니다."},{"en":"A: Anything else for you today?\nB: No, that will be all. Thank you.","ko":"A: 오늘 더 필요한 것은 없으신가요?\nB: 아니요, 이게 전부예요. 감사합니다."}],"pronunciation":"댓 윌 비 올","id":198},{"day":20,"num":10,"word":"perfect","meaning":"완벽한, 딱 좋은","hint":"","mnemonic":"perfect [퍼펙트] → “퍼펙트!” = 완벽해 / 딱 좋아.\n→ perfect = 완벽한 / 딱 좋은","dialogue":"A: We have a table by the window.\nB: Perfect. We would like that one.","caution":"","dialogues":["A: We have a table by the window.\nB: Perfect. We would like that one.","A: A table at six thirty would be perfect.\nB: Great, I will reserve it for you."],"similar":"","note":"","ko_dialogue":"A: 창가에 자리가 있어요.\nB: 딱 좋네요. 그 자리로 할게요.","dialogue_pairs":[{"en":"A: We have a table by the window.\nB: Perfect. We would like that one.","ko":"A: 창가에 자리가 있어요.\nB: 딱 좋네요. 그 자리로 할게요."},{"en":"A: A table at six thirty would be perfect.\nB: Great, I will reserve it for you.","ko":"A: 6시 30분 자리가 딱 좋겠어요.\nB: 좋습니다. 그 시간으로 예약해드릴게요."}],"pronunciation":"퍼펙트","id":199},{"day":21,"num":1,"word":"layover","meaning":"경유, 환승 대기시간","hint":"","mnemonic":"layover [레이오버] → “짐을 내려놓고 다음 비행까지 쉬어 간다!”\n최종 목적지까지 가기 전에 중간 공항에서 내려 가방을 의자에 놓습니다(lay). 다음 비행기를 탈 때까지 시간을 보내고 다시 떠납니다.\n중간에 짐을 놓고 잠깐 머무는 쉼표 → layover = 경유·환승 대기.\nlay를 이용한 기억 연결이지, 낱말 전체를 직역한 뜻은 아닙니다.","dialogue":"A: How long is your layover?\nB: Three hours. Then I fly to Rome.","dialogues":["A: How long is your layover?\nB: Three hours. Then I fly to Rome.","A: We have a five-hour layover in Singapore.\nB: That is enough time to have a meal and rest."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 환승 대기시간이 얼마나 되나요?\nB: 세 시간이요. 그다음에 로마로 갑니다.","dialogue_pairs":[{"en":"A: How long is your layover?\nB: Three hours. Then I fly to Rome.","ko":"A: 환승 대기시간이 얼마나 되나요?\nB: 세 시간이요. 그다음에 로마로 갑니다."},{"en":"A: We have a five-hour layover in Singapore.\nB: That is enough time to have a meal and rest.","ko":"A: 싱가포르에서 5시간 경유해요.\nB: 식사하고 쉬기에 충분한 시간이네요."}],"pronunciation":"레이오버","id":200},{"day":21,"num":2,"word":"exchange","meaning":"환전하다, 교환하다","hint":"","mnemonic":"exchange [익스체인지] → “X자로 서로 바꿔!”\n두 사람이 손을 X자로 교차해 서로 다른 돈을 맞바꿉니다.\nX + 서로 바꿈 → exchange.\n→ exchange = 교환하다 / 환전하다","dialogue":"A: Where can I exchange dollars for euros?\nB: At the exchange counter beside the bank.","dialogues":["A: Where can I exchange dollars for euros?\nB: At the exchange counter beside the bank.","A: Can I exchange this for a larger size?\nB: Yes. Do you have the receipt?"],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 달러를 유로로 어디에서 바꿀 수 있나요?\nB: 은행 옆 환전 창구에서요.","dialogue_pairs":[{"en":"A: Where can I exchange dollars for euros?\nB: At the exchange counter beside the bank.","ko":"A: 달러를 유로로 어디에서 바꿀 수 있나요?\nB: 은행 옆 환전 창구에서요."},{"en":"A: Can I exchange this for a larger size?\nB: Yes. Do you have the receipt?","ko":"A: 이것을 더 큰 사이즈로 교환할 수 있나요?\nB: 네. 영수증이 있으신가요?"}],"pronunciation":"익스체인지","id":201},{"day":21,"num":3,"word":"receipt","meaning":"영수증","hint":"","mnemonic":"receipt [리싯] → “받은 돈을 적은 리스트!”\n물건을 계산하자 가게가 받은 돈과 산 물건을 길쭉한 리스트로 출력해 건넵니다. 그 종이를 지갑에 넣습니다.\n리스트처럼 적힌 결제 내역 → 리싯 → 영수증.\nreceive(받다)와도 연결되며, receipt의 p는 소리 내지 않습니다.","dialogue":"A: Could I have a receipt, please?\nB: Of course. Here you are.","dialogues":["A: Could I have a receipt, please?\nB: Of course. Here you are.","A: Could I get a receipt for this taxi ride?\nB: Sure, I can print one for you."],"caution":"receipt는 결제 후 받는 영수증. bill/check는 결제하기 전의 계산서일 수 있습니다.","past":true,"similar":"bill = 계산서 / invoice = 청구서 / receipt = 결제 후 받는 영수증","note":"receipt는 결제 후 받는 영수증. bill/check는 결제하기 전의 계산서일 수 있습니다.","ko_dialogue":"A: 영수증을 받을 수 있을까요?\nB: 네. 여기 있습니다.","dialogue_pairs":[{"en":"A: Could I have a receipt, please?\nB: Of course. Here you are.","ko":"A: 영수증을 받을 수 있을까요?\nB: 네. 여기 있습니다."},{"en":"A: Could I get a receipt for this taxi ride?\nB: Sure, I can print one for you.","ko":"A: 이 택시 이용 영수증을 받을 수 있을까요?\nB: 네, 출력해드릴게요."}],"pronunciation":"리싯","id":202},{"day":21,"num":4,"word":"nearby","meaning":"근처의, 근처에","hint":"","mnemonic":"near(가까이) + by(곁에) → nearby(근처에).\na nearby café = 근처 카페.","dialogue":"A: Is there a bakery nearby?\nB: Yes, just around the corner.","dialogues":["A: Is there a bakery nearby?\nB: Yes, just around the corner.","A: Is there a pharmacy nearby?\nB: Yes, one is open twenty-four hours across the square."],"caution":"nearby는 형용사/부사로 가능. a nearby hotel = 근처 호텔 / Is there a hotel nearby? = 근처에 호텔 있나요?","past":true,"similar":"near = 가까운 / nearby = 근처의·근처에 / nearest = 가장 가까운","note":"nearby는 형용사/부사로 가능. a nearby hotel = 근처 호텔 / Is there a hotel nearby? = 근처에 호텔 있나요?","ko_dialogue":"A: 근처에 빵집이 있나요?\nB: 네, 모퉁이를 돌면 바로 있어요.","dialogue_pairs":[{"en":"A: Is there a bakery nearby?\nB: Yes, just around the corner.","ko":"A: 근처에 빵집이 있나요?\nB: 네, 모퉁이를 돌면 바로 있어요."},{"en":"A: Is there a pharmacy nearby?\nB: Yes, one is open twenty-four hours across the square.","ko":"A: 근처에 약국이 있나요?\nB: 네, 광장 건너편에 24시간 약국이 있습니다."}],"pronunciation":"니어바이","id":203},{"day":21,"num":5,"word":"recommend","meaning":"추천하다","hint":"","mnemonic":"recommend [레커멘드] → “좋다는 코멘트를 붙여 권해준다!”\n여행을 다녀온 친구가 식당 사진에 코멘트를 답니다. “여기 국수가 정말 맛있었어. 꼭 가봐!” 평가만 하는 데서 끝나지 않고 나에게 가보라고 권합니다.\n추천 코멘트 → 레커멘드 → 추천하다.\ncomment는 익숙한 소리를 빌린 기억 단서입니다.","dialogue":"A: What do you recommend for someone who does not like spicy food?\nB: The grilled chicken is mild and very popular.","dialogues":["A: What do you recommend for someone who does not like spicy food?\nB: The grilled chicken is mild and very popular.","A: Can you recommend a quiet place for breakfast?\nB: Try the café beside the park."],"caution":"recommend + 명사: recommend a restaurant. recommend + 동명사: recommend taking the bus.","past":true,"similar":"","note":"recommend + 명사: recommend a restaurant. recommend + 동명사: recommend taking the bus.","ko_dialogue":"A: 매운 음식을 못 먹는 사람에게 무엇을 추천하시나요?\nB: 닭고기구이가 맵지 않고 인기가 많아요.","dialogue_pairs":[{"en":"A: What do you recommend for someone who does not like spicy food?\nB: The grilled chicken is mild and very popular.","ko":"A: 매운 음식을 못 먹는 사람에게 무엇을 추천하시나요?\nB: 닭고기구이가 맵지 않고 인기가 많아요."},{"en":"A: Can you recommend a quiet place for breakfast?\nB: Try the café beside the park.","ko":"A: 아침 먹기 좋은 조용한 곳을 추천해주시겠어요?\nB: 공원 옆 카페에 가보세요."}],"pronunciation":"레커멘드","id":204},{"day":21,"num":6,"word":"charge","meaning":"요금, 청구하다, 충전하다","hint":"","mnemonic":"charge [차지] → “요금이 내 지갑을 차지!”\n호텔 요금과 택시 요금이 지갑 속 돈을 하나씩 차지해 갑니다. 내야 할 돈이 계속 청구되는 것입니다.\n돈을 차지하는 청구 금액 → charge = 요금 / 청구하다.\n배터리에서는 전기가 빈칸을 차지하도록 채운다고 연결하면 ‘충전하다’도 기억할 수 있습니다.","dialogue":"A: Is there a charge for using the pool?\nB: No, it is free for hotel guests.","dialogues":["A: Is there a charge for using the pool?\nB: No, it is free for hotel guests.","A: Can I charge my phone here?\nB: Yes, there is an outlet under the table."],"caution":"charge는 ‘요금/청구하다’뿐 아니라 ‘충전하다’ 뜻도 있습니다. 문맥을 보고 구분하세요.","past":true,"similar":"fee = 수수료·서비스 요금 / fare = 교통요금 / cost = 비용 / price = 가격","note":"charge는 ‘요금/청구하다’뿐 아니라 ‘충전하다’ 뜻도 있습니다. 문맥을 보고 구분하세요.","ko_dialogue":"A: 수영장 이용 요금이 있나요?\nB: 아니요, 투숙객은 무료입니다.","dialogue_pairs":[{"en":"A: Is there a charge for using the pool?\nB: No, it is free for hotel guests.","ko":"A: 수영장 이용 요금이 있나요?\nB: 아니요, 투숙객은 무료입니다."},{"en":"A: Can I charge my phone here?\nB: Yes, there is an outlet under the table.","ko":"A: 여기에서 휴대전화를 충전해도 되나요?\nB: 네, 테이블 아래에 콘센트가 있어요."}],"pronunciation":"차지","id":205},{"day":21,"num":7,"word":"restroom","meaning":"화장실","hint":"","mnemonic":"restroom [레스트룸] → rest(쉬다) + room(방).\n미국 영어에서 화장실을 restroom이라고 부른다.\n→ restroom = 화장실","dialogue":"A: Excuse me, where is the restroom?\nB: At the end of the hallway, on the right.","dialogues":["A: Excuse me, where is the restroom?\nB: At the end of the hallway, on the right.","A: Is there a restroom inside the station?\nB: Yes, it is past the ticket gates on the right."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 실례합니다. 화장실은 어디인가요?\nB: 복도 끝 오른쪽에 있어요.","dialogue_pairs":[{"en":"A: Excuse me, where is the restroom?\nB: At the end of the hallway, on the right.","ko":"A: 실례합니다. 화장실은 어디인가요?\nB: 복도 끝 오른쪽에 있어요."},{"en":"A: Is there a restroom inside the station?\nB: Yes, it is past the ticket gates on the right.","ko":"A: 역 안에 화장실이 있나요?\nB: 네, 개찰구를 지나 오른쪽에 있습니다."}],"pronunciation":"레스트룸","id":206},{"day":21,"num":8,"word":"queue","meaning":"줄, 줄을 서다","hint":"","mnemonic":"queue [큐]\nQ 뒤에 ueue가 줄줄이 붙어 있다.\n사람들이 Q 뒤로 길게 줄 서 있는 모습처럼 기억한다.\n→ queue = 줄 / 줄 서다","dialogue":"A: Is this the queue for tickets?\nB: Yes. It starts over there.","dialogues":["A: Is this the queue for tickets?\nB: Yes. It starts over there.","A: Is this the queue for passport control?\nB: Yes, the line starts back there."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 줄이 표 사는 줄인가요?\nB: 네. 줄은 저쪽부터예요.","dialogue_pairs":[{"en":"A: Is this the queue for tickets?\nB: Yes. It starts over there.","ko":"A: 이 줄이 표 사는 줄인가요?\nB: 네. 줄은 저쪽부터예요."},{"en":"A: Is this the queue for passport control?\nB: Yes, the line starts back there.","ko":"A: 여기가 여권 심사 줄인가요?\nB: 네, 줄은 저 뒤에서 시작합니다."}],"pronunciation":"큐","id":207},{"day":21,"num":9,"word":"adapter","meaning":"어댑터, 변환 플러그","hint":"","mnemonic":"adapter [어댑터] → “안 맞는 사이를 맞춰주는 연결 부품!”\n플러그 모양과 벽의 구멍 모양이 달라 들어가지 않습니다. 중간에 어댑터를 끼우자 양쪽이 딱 맞습니다.\nadapt(맞추다) → 서로 다른 두 모양을 맞춰주는 adapter.\n플러그 모양을 맞추는 것과 전압을 바꾸는 것은 구별합니다.","dialogue":"A: Do you have a plug adapter I can borrow?\nB: Yes. Please return it when you check out.","dialogues":["A: Do you have a plug adapter I can borrow?\nB: Yes. Please return it when you check out.","A: Do you sell an adapter for this plug?\nB: Yes, this universal adapter should work."],"caution":"plug adapter는 플러그 모양을 맞추는 장치입니다. 전압 변환을 뜻하는 voltage converter와 구별하세요.","past":true,"similar":"","note":"plug adapter는 플러그 모양을 맞추는 장치입니다. 전압 변환을 뜻하는 voltage converter와 구별하세요.","ko_dialogue":"A: 빌릴 수 있는 변환 플러그가 있나요?\nB: 네. 체크아웃하실 때 돌려주세요.","dialogue_pairs":[{"en":"A: Do you have a plug adapter I can borrow?\nB: Yes. Please return it when you check out.","ko":"A: 빌릴 수 있는 변환 플러그가 있나요?\nB: 네. 체크아웃하실 때 돌려주세요."},{"en":"A: Do you sell an adapter for this plug?\nB: Yes, this universal adapter should work.","ko":"A: 이 플러그에 맞는 어댑터를 파나요?\nB: 네, 이 범용 어댑터면 될 겁니다."}],"pronunciation":"어댑터","id":208},{"day":21,"num":10,"word":"boarding pass","meaning":"탑승권","hint":"","mnemonic":"boarding pass [보딩 패스]\nboarding = 탑승, pass = 통과시키는 표.\n→ boarding pass = 탑승권","dialogue":"A: May I see your boarding pass?\nB: Yes, it is on my phone.","dialogues":["A: May I see your boarding pass?\nB: Yes, it is on my phone.","A: I cannot find my boarding pass on the app.\nB: We can print one for you at the counter."],"caution":"boarding pass는 탑승권. ticket과 완전히 같은 말은 아닙니다.","past":true,"similar":"","note":"boarding pass는 탑승권. ticket과 완전히 같은 말은 아닙니다.","ko_dialogue":"A: 탑승권을 보여주시겠어요?\nB: 네, 제 휴대전화에 있어요.","dialogue_pairs":[{"en":"A: May I see your boarding pass?\nB: Yes, it is on my phone.","ko":"A: 탑승권을 보여주시겠어요?\nB: 네, 제 휴대전화에 있어요."},{"en":"A: I cannot find my boarding pass on the app.\nB: We can print one for you at the counter.","ko":"A: 앱에서 탑승권을 찾을 수가 없어요.\nB: 카운터에서 출력해드릴 수 있습니다."}],"pronunciation":"보딩 패스","id":209},{"day":22,"num":1,"word":"allergy","meaning":"알레르기","hint":"","mnemonic":"allergy [앨러지] → “먹고 앓지!”\n안 맞는 음식을 먹으면 몸이 가렵거나 붓고 앓습니다.\n앨러지 ≈ 앓지.\n→ allergy = 알레르기","dialogue":"A: Do you have any food allergies?\nB: Yes, I have a peanut allergy.","dialogues":["A: Do you have any food allergies?\nB: Yes, I have a peanut allergy.","A: I have a shellfish allergy. Is this soup safe for me?\nB: Let me ask the chef about the ingredients."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 음식 알레르기가 있나요?\nB: 네, 땅콩 알레르기가 있어요.","dialogue_pairs":[{"en":"A: Do you have any food allergies?\nB: Yes, I have a peanut allergy.","ko":"A: 음식 알레르기가 있나요?\nB: 네, 땅콩 알레르기가 있어요."},{"en":"A: I have a shellfish allergy. Is this soup safe for me?\nB: Let me ask the chef about the ingredients.","ko":"A: 저는 조개류 알레르기가 있어요. 이 수프 먹어도 괜찮을까요?\nB: 재료를 주방장에게 확인해볼게요."}],"pronunciation":"앨러지","id":210},{"day":22,"num":2,"word":"outlet","meaning":"콘센트, 아울렛","hint":"","mnemonic":"outlet [아웃렛] → “전기가 아웃!”\n벽 속에 있던 전기가 콘센트 구멍에서 밖(out)으로 나와 충전기와 휴대전화로 갑니다.\n전기가 밖으로 나오는 출구 → outlet = 콘센트.\n상품을 내보내 파는 아울렛 매장의 outlet도 함께 기억할 수 있습니다.","dialogue":"A: Is there an outlet near this seat?\nB: Yes, underneath the table.","dialogues":["A: Is there an outlet near this seat?\nB: Yes, underneath the table.","A: Is there an outlet near this seat?\nB: Yes, there is one under the table."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 자리 근처에 콘센트가 있나요?\nB: 네, 테이블 아래에 있어요.","dialogue_pairs":[{"en":"A: Is there an outlet near this seat?\nB: Yes, underneath the table.","ko":"A: 이 자리 근처에 콘센트가 있나요?\nB: 네, 테이블 아래에 있어요."},{"en":"A: Is there an outlet near this seat?\nB: Yes, there is one under the table.","ko":"A: 이 자리 근처에 콘센트가 있나요?\nB: 네, 테이블 아래에 하나 있습니다."}],"pronunciation":"아웃렛","id":211},{"day":22,"num":3,"word":"crosswalk","meaning":"횡단보도","hint":"","mnemonic":"crosswalk [크로스워크] → cross(건너다) + walk(걷다).\n걸어서 건너는 곳.\n→ crosswalk = 횡단보도","dialogue":"A: Where can we cross the road?\nB: Use the crosswalk by the traffic lights.","dialogues":["A: Where can we cross the road?\nB: Use the crosswalk by the traffic lights.","A: Is there a crosswalk near the hotel entrance?\nB: Yes, walk fifty meters to the left."],"caution":"미국식 crosswalk, 영국식 pedestrian crossing도 자주 씁니다.","past":true,"similar":"","note":"미국식 crosswalk, 영국식 pedestrian crossing도 자주 씁니다.","ko_dialogue":"A: 어디에서 길을 건널 수 있나요?\nB: 신호등 옆 횡단보도를 이용하세요.","dialogue_pairs":[{"en":"A: Where can we cross the road?\nB: Use the crosswalk by the traffic lights.","ko":"A: 어디에서 길을 건널 수 있나요?\nB: 신호등 옆 횡단보도를 이용하세요."},{"en":"A: Is there a crosswalk near the hotel entrance?\nB: Yes, walk fifty meters to the left.","ko":"A: 호텔 입구 근처에 횡단보도가 있나요?\nB: 네, 왼쪽으로 50미터 가세요."}],"pronunciation":"크로스워크","id":212},{"day":22,"num":4,"word":"explore","meaning":"둘러보다, 탐험하다","hint":"","mnemonic":"explore [익스플로어] → “익숙하지 않은 플로어를 구석구석!”\n처음 가본 거대한 성에서 한 층(floor)을 돌아보고, 다음 층도 올라가 방마다 살펴봅니다. 아직 모르는 곳을 직접 돌아다니며 알아봅니다.\n익숙하지 않은 + 플로어 → 익스플로어 → 탐험하다, 둘러보다.\n층을 뜻하는 floor는 소리 연상에만 사용한 말입니다.","dialogue":"A: What shall we do this afternoon?\nB: Let us explore the old town on foot.","dialogues":["A: What shall we do this afternoon?\nB: Let us explore the old town on foot.","A: We have the afternoon free to explore the neighborhood.\nB: Let us start at the market and walk toward the river."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 오늘 오후에 무엇을 할까요?\nB: 구시가지를 걸어서 둘러봐요.","dialogue_pairs":[{"en":"A: What shall we do this afternoon?\nB: Let us explore the old town on foot.","ko":"A: 오늘 오후에 무엇을 할까요?\nB: 구시가지를 걸어서 둘러봐요."},{"en":"A: We have the afternoon free to explore the neighborhood.\nB: Let us start at the market and walk toward the river.","ko":"A: 오후에 동네를 둘러볼 자유 시간이 있어요.\nB: 시장에서 시작해서 강 쪽으로 걸어가요."}],"pronunciation":"익스플로어","id":213},{"day":22,"num":5,"word":"suggest","meaning":"제안하다, 추천하다","hint":"","mnemonic":"suggest [서제스트] → “먼저 제시해!”\n여행 계획이 정해지지 않아 모두 조용합니다. 한 사람이 먼저 손을 들어 “오후에는 보트 타는 게 어때요?” 하고 의견을 제시합니다.\n먼저 + 제시 → 서제… → suggest = 제안하다.","dialogue":"A: What do you suggest we do on a rainy day?\nB: You could visit the art museum.","dialogues":["A: What do you suggest we do on a rainy day?\nB: You could visit the art museum.","A: What do you suggest for a rainy afternoon?\nB: The art museum is a good choice."],"caution":"suggest going / suggest that we go. suggest to go라고 하지 않습니다.","past":true,"similar":"","note":"suggest going / suggest that we go. suggest to go라고 하지 않습니다.","ko_dialogue":"A: 비 오는 날에는 무엇을 하면 좋을까요?\nB: 미술관에 가보셔도 좋아요.","dialogue_pairs":[{"en":"A: What do you suggest we do on a rainy day?\nB: You could visit the art museum.","ko":"A: 비 오는 날에는 무엇을 하면 좋을까요?\nB: 미술관에 가보셔도 좋아요."},{"en":"A: What do you suggest for a rainy afternoon?\nB: The art museum is a good choice.","ko":"A: 비 오는 오후에는 무엇을 추천하시나요?\nB: 미술관이 좋습니다."}],"pronunciation":"서제스트","id":214},{"day":22,"num":6,"word":"direction","meaning":"방향, 길 안내","hint":"","mnemonic":"direction [디렉션] → “디렉터가 손으로 가리킨 방향!”\n촬영장에서 디렉터가 배우에게 “이쪽으로 걸어가세요” 하며 한쪽을 가리킵니다. 배우가 그 손끝 방향으로 움직입니다.\n디렉터의 디렉션 → 어디로 갈지 가리키는 방향 → direction.","dialogue":"A: Are we going in the right direction?\nB: No, the station is the other way.","dialogues":["A: Are we going in the right direction?\nB: No, the station is the other way.","A: Which direction should I walk for the station?\nB: Head east for two blocks."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 저희가 맞는 방향으로 가고 있나요?\nB: 아니요, 역은 반대 방향이에요.","dialogue_pairs":[{"en":"A: Are we going in the right direction?\nB: No, the station is the other way.","ko":"A: 저희가 맞는 방향으로 가고 있나요?\nB: 아니요, 역은 반대 방향이에요."},{"en":"A: Which direction should I walk for the station?\nB: Head east for two blocks.","ko":"A: 역으로 가려면 어느 방향으로 걸어가야 하나요?\nB: 동쪽으로 두 블록 가세요."}],"pronunciation":"디렉션","id":215},{"day":22,"num":7,"word":"directions","meaning":"길 안내","hint":"","mnemonic":"directions [디렉션즈] → “디렉터가 움직일 길을 차례로 지시!”\n디렉터가 “앞으로 가서, 오른쪽으로 돌고, 문으로 들어가세요”라고 동선을 알려줍니다. 여러 방향 지시가 연결되니 목적지까지 가는 길이 됩니다.\ndirection(방향)들이 이어짐 → directions = 길 안내.","dialogue":"A: Could you give me directions to the beach?\nB: Go straight for two blocks, then turn left.","dialogues":["A: Could you give me directions to the beach?\nB: Go straight for two blocks, then turn left.","A: Could you give me directions to the ferry terminal?\nB: Go straight and turn right at the second light."],"caution":"","past":true,"similar":"direction = 방향 / directions = 길 안내 / route = 경로","note":"","ko_dialogue":"A: 해변으로 가는 길을 알려주시겠어요?\nB: 두 블록 직진한 뒤 왼쪽으로 도세요.","dialogue_pairs":[{"en":"A: Could you give me directions to the beach?\nB: Go straight for two blocks, then turn left.","ko":"A: 해변으로 가는 길을 알려주시겠어요?\nB: 두 블록 직진한 뒤 왼쪽으로 도세요."},{"en":"A: Could you give me directions to the ferry terminal?\nB: Go straight and turn right at the second light.","ko":"A: 페리 터미널 가는 길을 알려주시겠어요?\nB: 직진해서 두 번째 신호등에서 오른쪽으로 도세요."}],"pronunciation":"디렉션즈","id":216},{"day":22,"num":8,"word":"prescription","meaning":"처방전","hint":"","mnemonic":"prescription [프리스크립션] → “미리 써준 약 복용 스크립트!”\n의사가 어떤 약을 어떻게 먹을지 적어 종이로 건넵니다. 배우가 대본(script)을 보고 연기하듯, 환자는 그 종이에 적힌 약과 복용법을 확인합니다.\n미리(pre) 써준 약 복용 스크립트 → prescription = 처방전.\n처방하는 행동은 prescribe, 써준 처방전은 prescription입니다.","dialogue":"A: I have a prescription from this clinic.\nB: May I see it, please?","dialogues":["A: I have a prescription from this clinic.\nB: May I see it, please?","A: Can this pharmacy fill a foreign prescription?\nB: It depends on the medicine, so please show it to the pharmacist."],"caution":"prescription = 처방전. pharmacy = 약국. drugstore는 미국에서 약국+생활용품점 느낌이 강할 수 있습니다.","past":true,"similar":"","note":"prescription = 처방전. pharmacy = 약국. drugstore는 미국에서 약국+생활용품점 느낌이 강할 수 있습니다.","ko_dialogue":"A: 이 진료소에서 받은 처방전이 있어요.\nB: 보여주시겠어요?","dialogue_pairs":[{"en":"A: I have a prescription from this clinic.\nB: May I see it, please?","ko":"A: 이 진료소에서 받은 처방전이 있어요.\nB: 보여주시겠어요?"},{"en":"A: Can this pharmacy fill a foreign prescription?\nB: It depends on the medicine, so please show it to the pharmacist.","ko":"A: 이 약국에서 외국 처방전으로 약을 받을 수 있나요?\nB: 약에 따라 다르니 약사에게 보여주세요."}],"pronunciation":"프리스크립션","id":217},{"day":22,"num":9,"word":"fare","meaning":"요금","hint":"","mnemonic":"fare [페어] → “표값, 빼어!”\n버스나 택시를 타려고 지갑에서 요금 낼 돈을 빼어 냅니다.\n빼어 ≈ 페어.\n→ fare = 교통요금 / 운임","dialogue":"A: How much is the bus fare?\nB: Two dollars per person.","dialogues":["A: How much is the bus fare?\nB: Two dollars per person.","A: What is the bus fare to the airport?\nB: It is eight dollars if you pay by card."],"caution":"","past":true,"similar":"fare = 교통요금 / fee = 수수료 / price = 일반 가격","note":"","ko_dialogue":"A: 버스 요금은 얼마인가요?\nB: 1인당 2달러입니다.","dialogue_pairs":[{"en":"A: How much is the bus fare?\nB: Two dollars per person.","ko":"A: 버스 요금은 얼마인가요?\nB: 1인당 2달러입니다."},{"en":"A: What is the bus fare to the airport?\nB: It is eight dollars if you pay by card.","ko":"A: 공항까지 버스 요금이 얼마인가요?\nB: 카드로 결제하면 8달러입니다."}],"pronunciation":"페어","id":218},{"day":22,"num":10,"word":"gate","meaning":"탑승구, 문","hint":"","mnemonic":"gate [게이트] → “게임 게이트가 열리면 다음 공간으로!”\n게임에서 커다란 게이트 앞에 서 있다가 문이 열리면 안으로 들어갑니다. 공항에서도 탑승구를 통과해 비행기로 들어갑니다.\n익숙한 게이트의 통과 동작 → gate = 문 / 탑승구.","dialogue":"A: Has our gate changed?\nB: Yes. Your flight now leaves from gate eighteen.","dialogues":["A: Has our gate changed?\nB: Yes. Your flight now leaves from gate eighteen.","A: Has the gate for our flight changed?\nB: Yes, it moved from gate twelve to gate eighteen."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 저희 탑승구가 바뀌었나요?\nB: 네. 지금은 18번 탑승구에서 출발합니다.","dialogue_pairs":[{"en":"A: Has our gate changed?\nB: Yes. Your flight now leaves from gate eighteen.","ko":"A: 저희 탑승구가 바뀌었나요?\nB: 네. 지금은 18번 탑승구에서 출발합니다."},{"en":"A: Has the gate for our flight changed?\nB: Yes, it moved from gate twelve to gate eighteen.","ko":"A: 우리 항공편 탑승구가 바뀌었나요?\nB: 네, 12번에서 18번으로 바뀌었습니다."}],"pronunciation":"게이트","id":219},{"day":23,"num":1,"word":"voucher","meaning":"바우처, 이용권","hint":"","mnemonic":"voucher [바우처] → “바로 바꿔주는 쿠폰!”\n조식 이용권 한 장을 내밀자 직원이 돈 대신 그 종이를 받고 아침 식사를 내줍니다. 종이가 서비스로 바뀝니다.\n바우처를 내면 바로 서비스로 바꿈 → voucher = 이용권, 교환권.","dialogue":"A: Where can I use this breakfast voucher?\nB: At the restaurant on the second floor.","dialogues":["A: Where can I use this breakfast voucher?\nB: At the restaurant on the second floor.","A: Can I use this meal voucher at any restaurant in the terminal?\nB: Only at the restaurants listed on the back."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 조식 이용권은 어디에서 사용할 수 있나요?\nB: 2층 식당에서요.","dialogue_pairs":[{"en":"A: Where can I use this breakfast voucher?\nB: At the restaurant on the second floor.","ko":"A: 이 조식 이용권은 어디에서 사용할 수 있나요?\nB: 2층 식당에서요."},{"en":"A: Can I use this meal voucher at any restaurant in the terminal?\nB: Only at the restaurants listed on the back.","ko":"A: 이 식사 바우처를 터미널 안 아무 식당에서나 쓸 수 있나요?\nB: 뒷면에 적힌 식당에서만 사용할 수 있습니다."}],"pronunciation":"바우처","id":220},{"day":23,"num":2,"word":"schedule","meaning":"일정, 시간표","hint":"","mnemonic":"schedule [스케줄] → “시간마다 약속이 줄줄이!”\n아침 비행기, 점심 식사, 오후 투어를 달력의 시간 칸마다 차례로 넣습니다. 스케줄이 차면서 하루에 어디서 무엇을 할지 정해집니다.\n익숙한 스케줄 + 시간 칸에 약속이 들어가는 모습 → 일정, 시간표.","dialogue":"A: Could I see the ferry schedule?\nB: Yes. The next ferry leaves at two.","dialogues":["A: Could I see the ferry schedule?\nB: Yes. The next ferry leaves at two.","A: Has the ferry schedule changed for winter?\nB: Yes, there are fewer departures after October."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 페리 시간표를 볼 수 있을까요?\nB: 네. 다음 페리는 2시에 출발합니다.","dialogue_pairs":[{"en":"A: Could I see the ferry schedule?\nB: Yes. The next ferry leaves at two.","ko":"A: 페리 시간표를 볼 수 있을까요?\nB: 네. 다음 페리는 2시에 출발합니다."},{"en":"A: Has the ferry schedule changed for winter?\nB: Yes, there are fewer departures after October.","ko":"A: 겨울에는 페리 시간표가 바뀌나요?\nB: 네, 10월 이후에는 운항 횟수가 줄어듭니다."}],"pronunciation":"스케줄","id":221},{"day":23,"num":3,"word":"laundry","meaning":"세탁물, 세탁","hint":"","mnemonic":"laundry [론드리] → “러닝셔츠도 돌려!”\n땀에 젖은 러닝셔츠를 벗어 세탁기에 넣습니다. “러닝셔츠도 돌려!” 하며 버튼을 누르자 셔츠가 빙빙 돌면서 빨립니다.\n러닝 + 돌려 → 론드리 → 세탁, 세탁물.","dialogue":"A: Does the hotel have a laundry service?\nB: Yes. Put your clothes in the bag in your closet.","dialogues":["A: Does the hotel have a laundry service?\nB: Yes. Put your clothes in the bag in your closet.","A: Is there a self-service laundry near the hotel?\nB: Yes, one is open late two blocks away."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 호텔에 세탁 서비스가 있나요?\nB: 네. 옷장 안의 봉투에 세탁물을 넣어주세요.","dialogue_pairs":[{"en":"A: Does the hotel have a laundry service?\nB: Yes. Put your clothes in the bag in your closet.","ko":"A: 호텔에 세탁 서비스가 있나요?\nB: 네. 옷장 안의 봉투에 세탁물을 넣어주세요."},{"en":"A: Is there a self-service laundry near the hotel?\nB: Yes, one is open late two blocks away.","ko":"A: 호텔 근처에 셀프 세탁실이 있나요?\nB: 네, 두 블록 떨어진 곳에 늦게까지 하는 곳이 있습니다."}],"pronunciation":"론드리","id":222},{"day":23,"num":4,"word":"luggage storage","meaning":"수하물 보관소","hint":"","mnemonic":"luggage storage [러기지 스토리지]\nluggage [러기지] = 여행 짐, storage = 보관.\n→ luggage storage = 수하물 보관소","dialogue":"A: Is there luggage storage at the station?\nB: Yes, beside the ticket office.","dialogues":["A: Is there luggage storage at the station?\nB: Yes, beside the ticket office.","A: How much does luggage storage cost for six hours?\nB: It is five dollars per bag."],"caution":"","past":true,"similar":"store = 보관하다 / keep = 보관하다 / storage = 보관","note":"","ko_dialogue":"A: 역에 수하물 보관소가 있나요?\nB: 네, 매표소 옆에 있어요.","dialogue_pairs":[{"en":"A: Is there luggage storage at the station?\nB: Yes, beside the ticket office.","ko":"A: 역에 수하물 보관소가 있나요?\nB: 네, 매표소 옆에 있어요."},{"en":"A: How much does luggage storage cost for six hours?\nB: It is five dollars per bag.","ko":"A: 짐을 6시간 보관하는 데 얼마인가요?\nB: 가방 하나당 5달러입니다."}],"pronunciation":"러기지 스토리지","id":223},{"day":23,"num":5,"word":"currency","meaning":"통화, 화폐","hint":"","mnemonic":"currency [커런시] → “그 나라 안에서 돌고 도는 돈!”\n내가 식당에서 낸 돈이 직원에게 가고, 직원이 빵집에 내고, 빵집이 다시 시장에 냅니다. 같은 돈이 그 나라 안에서 계속 흐릅니다.\ncurrent의 ‘흐름’과 모양을 연결 → 유통되어 흐르는 돈 → currency = 통화, 화폐.","dialogue":"A: Which currency do you accept?\nB: We only accept euros.","dialogues":["A: Which currency do you accept?\nB: We only accept euros.","A: What currency do they use on the island?\nB: They use the euro."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 어떤 화폐를 받나요?\nB: 유로만 받습니다.","dialogue_pairs":[{"en":"A: Which currency do you accept?\nB: We only accept euros.","ko":"A: 어떤 화폐를 받나요?\nB: 유로만 받습니다."},{"en":"A: What currency do they use on the island?\nB: They use the euro.","ko":"A: 그 섬에서는 어떤 화폐를 사용하나요?\nB: 유로를 사용합니다."}],"pronunciation":"커런시","id":224},{"day":23,"num":6,"word":"spicy","meaning":"매운","hint":"","mnemonic":"spicy [스파이시] → spice(향신료) + -y(~한).\n향신료 맛이 강한 것.\n→ spicy = 매운 / 향신료가 강한","dialogue":"A: Is this dish very spicy?\nB: A little. We can make it less spicy.","dialogues":["A: Is this dish very spicy?\nB: A little. We can make it less spicy.","A: Is this curry very spicy?\nB: It is medium spicy, but we can make it milder."],"caution":"","past":true,"similar":"spicy = 매운 / hot = 뜨거운·매운 / mild = 순한","note":"","ko_dialogue":"A: 이 요리는 많이 매운가요?\nB: 조금 매워요. 덜 맵게 만들어드릴 수 있어요.","dialogue_pairs":[{"en":"A: Is this dish very spicy?\nB: A little. We can make it less spicy.","ko":"A: 이 요리는 많이 매운가요?\nB: 조금 매워요. 덜 맵게 만들어드릴 수 있어요."},{"en":"A: Is this curry very spicy?\nB: It is medium spicy, but we can make it milder.","ko":"A: 이 카레는 많이 매운가요?\nB: 중간 정도 맵지만 덜 맵게 해드릴 수 있어요."}],"pronunciation":"스파이시","id":225},{"day":23,"num":7,"word":"vegetarian","meaning":"채식주의자, 채식의","hint":"","mnemonic":"vegetarian [베지테리언] → “베지터블 접시를 고르는 사람!”\n식탁에 고기 접시와 채소 접시가 나란히 있습니다. 베지터블(vegetable·채소) 접시를 골라 담고 채식으로 식사를 합니다.\n베지터블 → 베지테리언 → 채식주의자.\n채식 메뉴는 vegetarian food라고 합니다.","dialogue":"A: Do you have any vegetarian dishes?\nB: Yes, the vegetable curry contains no meat or fish.","dialogues":["A: Do you have any vegetarian dishes?\nB: Yes, the vegetable curry contains no meat or fish.","A: Do you have a vegetarian breakfast option?\nB: Yes, we have eggs, fruit, and vegetable sandwiches."],"caution":"","past":true,"similar":"vegetarian = 채식주의자 / vegan = 완전 채식주의자 / meat-free = 고기 없는","note":"","ko_dialogue":"A: 채식 메뉴가 있나요?\nB: 네, 채소 카레에는 고기나 생선이 들어가지 않아요.","dialogue_pairs":[{"en":"A: Do you have any vegetarian dishes?\nB: Yes, the vegetable curry contains no meat or fish.","ko":"A: 채식 메뉴가 있나요?\nB: 네, 채소 카레에는 고기나 생선이 들어가지 않아요."},{"en":"A: Do you have a vegetarian breakfast option?\nB: Yes, we have eggs, fruit, and vegetable sandwiches.","ko":"A: 채식 아침 메뉴가 있나요?\nB: 네, 달걀과 과일, 채소 샌드위치가 있습니다."}],"pronunciation":"베지테리언","id":226},{"day":23,"num":8,"word":"verify","meaning":"확인하다, 검증하다","hint":"","mnemonic":"verify [베러파이] → “베낀 파일, 맞나 봐!”\n여권 내용을 파일에 옮겨 적은 뒤 원본과 한 글자씩 맞는지 확인합니다.\n베낀 파일 맞나 봐 → 베러파이.\n→ verify = 확인하다 / 검증하다","dialogue":"A: Could you verify my booking details?\nB: Certainly. May I have your booking number?","dialogues":["A: Could you verify my booking details?\nB: Certainly. May I have your booking number?","A: Could you verify the departure time for me?\nB: Yes, the train leaves at 8:45."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 제 예약 내용을 확인해주시겠어요?\nB: 네. 예약 번호를 알려주시겠어요?","dialogue_pairs":[{"en":"A: Could you verify my booking details?\nB: Certainly. May I have your booking number?","ko":"A: 제 예약 내용을 확인해주시겠어요?\nB: 네. 예약 번호를 알려주시겠어요?"},{"en":"A: Could you verify the departure time for me?\nB: Yes, the train leaves at 8:45.","ko":"A: 출발 시간을 확인해주시겠어요?\nB: 네, 기차는 8시 45분에 출발합니다."}],"pronunciation":"베러파이","id":227},{"day":23,"num":9,"word":"fit","meaning":"맞다, 맞추다","hint":"","mnemonic":"옷의 ‘핏’이 딱 맞다 → fit = 크기·모양이 맞다.\nfit은 크기, suit는 어울림에 초점을 둡니다.","dialogue":"A: Do these shoes fit?\nB: They are a little tight. Can I try a larger size?","dialogues":["A: Do these shoes fit?\nB: They are a little tight. Can I try a larger size?","A: Does this suitcase fit in the overhead bin?\nB: Yes, it should fit without a problem."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 신발이 맞나요?\nB: 조금 끼네요. 더 큰 사이즈를 신어봐도 될까요?","dialogue_pairs":[{"en":"A: Do these shoes fit?\nB: They are a little tight. Can I try a larger size?","ko":"A: 이 신발이 맞나요?\nB: 조금 끼네요. 더 큰 사이즈를 신어봐도 될까요?"},{"en":"A: Does this suitcase fit in the overhead bin?\nB: Yes, it should fit without a problem.","ko":"A: 이 여행가방이 머리 위 수납칸에 들어가나요?\nB: 네, 문제없이 들어갈 겁니다."}],"pronunciation":"핏","id":228},{"day":23,"num":10,"word":"broken","meaning":"고장 난, 깨진","hint":"","mnemonic":"broken [브로큰] → “브레이크가 고장 나 멈추질 않네!”\n손수레의 브레이크 부품이 부러졌습니다. 손잡이를 잡아도 브레이크가 일을 못 합니다.\n브레이크가 부러짐 → break(깨뜨리다)의 결과 broken → 깨진, 고장 난.\n브레이크(brake)는 소리 연결용이며 break와 철자가 다릅니다.","dialogue":"A: The lock on my door is broken.\nB: I am sorry. We will arrange another room for you.","dialogues":["A: The lock on my door is broken.\nB: I am sorry. We will arrange another room for you.","A: The air conditioner in my room is broken.\nB: I am sorry. We will send someone to fix it."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 객실 문 잠금장치가 고장 났어요.\nB: 죄송합니다. 다른 객실을 마련해드릴게요.","dialogue_pairs":[{"en":"A: The lock on my door is broken.\nB: I am sorry. We will arrange another room for you.","ko":"A: 객실 문 잠금장치가 고장 났어요.\nB: 죄송합니다. 다른 객실을 마련해드릴게요."},{"en":"A: The air conditioner in my room is broken.\nB: I am sorry. We will send someone to fix it.","ko":"A: 제 객실 에어컨이 고장 났어요.\nB: 죄송합니다. 수리할 직원을 보내드리겠습니다."}],"pronunciation":"브로큰","id":229},{"day":24,"num":1,"word":"elevator","meaning":"엘리베이터","hint":"","mnemonic":"elevator [엘리베이터] → “엘리베이터 바닥이 나를 위로 올린다!”\n버튼을 누르자 바닥이 나를 받친 채 위층으로 올라갑니다. 계단을 걷지 않아도 몸이 통째로 들어 올려집니다.\nelevate(높이 올리다)하는 장치 → elevator = 엘리베이터.","dialogue":"A: Where is the elevator?\nB: Just past the front desk, on your left.","dialogues":["A: Where is the elevator?\nB: Just past the front desk, on your left.","A: Is there an elevator to the observation deck?\nB: Yes, it is at the end of the hall."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 엘리베이터가 어디에 있나요?\nB: 프런트를 지나면 바로 왼쪽에 있어요.","dialogue_pairs":[{"en":"A: Where is the elevator?\nB: Just past the front desk, on your left.","ko":"A: 엘리베이터가 어디에 있나요?\nB: 프런트를 지나면 바로 왼쪽에 있어요."},{"en":"A: Is there an elevator to the observation deck?\nB: Yes, it is at the end of the hall.","ko":"A: 전망대로 가는 엘리베이터가 있나요?\nB: 네, 복도 끝에 있습니다."}],"pronunciation":"엘리베이터","id":230},{"day":24,"num":2,"word":"lift","meaning":"엘리베이터, 들어 올리다","hint":"","mnemonic":"lift [리프트] → 위로 들어 올린다.\n사람을 위로 올려주는 장치도 영국에서는 lift.\n→ lift = 들다 / 엘리베이터","dialogue":"A: Could you help me lift this bag?\nB: Sure. Let us put it on the rack.","dialogues":["A: Could you help me lift this bag?\nB: Sure. Let us put it on the rack.","A: Is there a lift in this building?\nB: Yes, just behind the stairs."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 가방 들어 올리는 걸 도와주시겠어요?\nB: 네. 선반에 올려놓아요.","dialogue_pairs":[{"en":"A: Could you help me lift this bag?\nB: Sure. Let us put it on the rack.","ko":"A: 이 가방 들어 올리는 걸 도와주시겠어요?\nB: 네. 선반에 올려놓아요."},{"en":"A: Is there a lift in this building?\nB: Yes, just behind the stairs.","ko":"A: 이 건물에 엘리베이터가 있나요?\nB: 네, 계단 바로 뒤에 있어요."}],"pronunciation":"리프트","id":231},{"day":24,"num":3,"word":"restock","meaning":"재입고하다","hint":"","mnemonic":"restock [리스탁]\nre- = 다시\nstock [스탁] → “싹 다 쌓아둬!” = 재고.\n다시 재고를 쌓아 채웁니다.\n→ restock = 재입고하다 / 재고를 채우다","dialogue":"A: When will you restock this size?\nB: We expect more on Friday.","dialogues":["A: When will you restock this size?\nB: We expect more on Friday.","A: When will you restock these travel bottles?\nB: We expect more tomorrow morning."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 사이즈는 언제 재입고되나요?\nB: 금요일에 더 들어올 예정이에요.","dialogue_pairs":[{"en":"A: When will you restock this size?\nB: We expect more on Friday.","ko":"A: 이 사이즈는 언제 재입고되나요?\nB: 금요일에 더 들어올 예정이에요."},{"en":"A: When will you restock these travel bottles?\nB: We expect more tomorrow morning.","ko":"A: 이 여행용 용기는 언제 재입고되나요?\nB: 내일 아침에 더 들어올 예정입니다."}],"pronunciation":"리스탁","id":232},{"day":24,"num":4,"word":"changing room","meaning":"탈의실","hint":"","mnemonic":"changing room [체인징 룸]\nchange = 바꾸다, room = 방.\n옷을 바꾸는 방.\n→ changing room = 탈의실","dialogue":"A: Where is the changing room?\nB: At the back of the shop.","dialogues":["A: Where is the changing room?\nB: At the back of the shop.","A: Where is the changing room?\nB: It is behind the mirrors on the left."],"caution":"미국 쇼핑에서는 fitting room도 매우 흔합니다.","past":true,"similar":"","note":"미국 쇼핑에서는 fitting room도 매우 흔합니다.","ko_dialogue":"A: 탈의실은 어디인가요?\nB: 매장 안쪽에 있어요.","dialogue_pairs":[{"en":"A: Where is the changing room?\nB: At the back of the shop.","ko":"A: 탈의실은 어디인가요?\nB: 매장 안쪽에 있어요."},{"en":"A: Where is the changing room?\nB: It is behind the mirrors on the left.","ko":"A: 탈의실이 어디인가요?\nB: 왼쪽 거울 뒤쪽에 있습니다."}],"pronunciation":"체인징 룸","id":233},{"day":24,"num":5,"word":"luggage rack","meaning":"짐 선반","hint":"","mnemonic":"luggage rack [러기지 랙]\nluggage = 여행 짐, rack = 선반.\n→ luggage rack = 짐 선반","dialogue":"A: Can I put my suitcase on the luggage rack?\nB: Yes, if it fits securely.","dialogues":["A: Can I put my suitcase on the luggage rack?\nB: Yes, if it fits securely.","A: Is there space on the luggage rack for this suitcase?\nB: Yes, put it on the lower shelf."],"caution":"기차·버스의 짐 선반. 비행기 위쪽 수납공간은 overhead bin이 더 흔합니다.","past":true,"similar":"","note":"기차·버스의 짐 선반. 비행기 위쪽 수납공간은 overhead bin이 더 흔합니다.","ko_dialogue":"A: 여행가방을 짐 선반에 올려도 될까요?\nB: 네, 안정적으로 들어가면 됩니다.","dialogue_pairs":[{"en":"A: Can I put my suitcase on the luggage rack?\nB: Yes, if it fits securely.","ko":"A: 여행가방을 짐 선반에 올려도 될까요?\nB: 네, 안정적으로 들어가면 됩니다."},{"en":"A: Is there space on the luggage rack for this suitcase?\nB: Yes, put it on the lower shelf.","ko":"A: 이 여행가방을 놓을 짐 선반 공간이 있나요?\nB: 네, 아래 선반에 놓으세요."}],"pronunciation":"러기지 랙","id":234},{"day":24,"num":6,"word":"occupied","meaning":"사용 중인, 점유된","hint":"","mnemonic":"occupied [아큐파이드]\noccupy = 자리를 꽉 차지하다.\n이미 누군가가 차지해 쓰고 있는 상태가 occupied입니다.\n→ occupied = 사용 중인 / 점유된","dialogue":"A: Is this room occupied?\nB: Yes, please use the room next door.","dialogues":["A: Is this room occupied?\nB: Yes, please use the room next door.","A: Is this restroom occupied?\nB: Yes, someone is inside."],"caution":"화장실 문에서는
