<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여행영단어 311 PRO STUDY</title>
<style>
:root{
  --bg:#120b07;--panel:#21130c;--card:#fffaf6;--text:#2a221e;--muted:#8c7467;
  --accent:#ff8150;--soft:#fff0e7;--line:#efd9cd;--darktext:#f6e8df;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--text)}
body{overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.top{padding:calc(env(safe-area-inset-top) + 8px) 10px 7px;background:#15100d;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.brand{font-size:14px;font-weight:900;color:var(--accent);margin-right:2px}
.iconbtn{border:0;background:#29221e;color:white;border-radius:12px;min-width:42px;height:42px;padding:0 9px;font-size:16px;font-weight:900}
.iconbtn.active{background:var(--accent)}
.progressbox{flex:1;min-width:120px}
.pt{font-size:11px;color:#d5c2b7;text-align:center;margin-bottom:4px;font-weight:700}
.progress{height:6px;background:#342821;border-radius:99px;overflow:hidden}
.bar{height:100%;width:0;background:var(--accent)}
.main{flex:1;overflow:hidden;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px)}
.card{height:100%;max-width:900px;margin:auto;background:var(--card);border-radius:24px;overflow:auto;box-shadow:0 10px 38px #0008;padding:20px 18px;position:relative}
.day{font-size:13px;font-weight:900;color:var(--accent)}
.word{font-size:clamp(34px,7vw,62px);font-weight:900;line-height:1.07;margin:5px 0 12px;word-break:keep-all}
.meaning{font-size:clamp(20px,4vw,29px);font-weight:850;line-height:1.4;margin-bottom:12px}
.hiddenMeaning{border:2px dashed #e6c7b5;background:#fff5ef;border-radius:18px;padding:18px;text-align:center;color:#a47a65;font-weight:800;font-size:18px;margin-bottom:12px}
.reveal{border:0;background:var(--accent);color:white;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:900;margin-top:8px}
.sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.lab{font-size:13px;font-weight:900;color:var(--accent);margin-bottom:7px}
.box{background:var(--soft);border-radius:16px;padding:13px;font-size:16px;line-height:1.55;white-space:pre-line}
.dialogue{border-left:4px solid #f2c2a7;padding:8px 11px;margin:8px 0;background:#fffdfb;border-radius:0 12px 12px 0;font-size:15.5px;line-height:1.58;white-space:pre-line}
.note{font-size:15px;line-height:1.55;color:#5b4c44}
.actionrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.action{border:0;border-radius:12px;padding:10px 13px;font-size:14px;font-weight:900;background:#f4e6df;color:#4b3b33}
.action.wrong{background:#ffe3e3;color:#a52f2f}
.action.wrong.on{background:#d84b4b;color:#fff}
.action.next{background:var(--accent);color:#fff;margin-left:auto}
.book{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:0;overflow:hidden}
.book .half{padding:20px;height:100%;overflow:auto}
.book .left{background:#fff5ee;border-right:1px solid #e7ccbd;display:flex;flex-direction:column;justify-content:center}
.book .right{background:#fffdfb}
.book .word{font-size:clamp(32px,6vw,54px)}
.searchPanel,.addPanel,.wrongPanel{height:100%;max-width:900px;margin:auto;background:#fffaf6;border-radius:24px;overflow:auto;padding:18px}
.panelTitle{font-size:24px;font-weight:900;margin-bottom:12px}
.input{width:100%;border:1px solid #ddc9bd;border-radius:14px;padding:13px 14px;font-size:16px;background:#fff}
.result{padding:12px;border-bottom:1px solid #eee0d8;cursor:pointer}
.result b{font-size:18px}
.small{font-size:13px;color:#876f62;margin-top:4px}
.formgrid{display:grid;grid-template-columns:1fr;gap:10px}
textarea.input{min-height:85px;resize:vertical}
.primary{border:0;background:var(--accent);color:white;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:900}
.secondary{border:0;background:#eee1da;color:#493d36;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900}
.empty{text-align:center;color:#8d776b;padding:40px 10px}
@media(max-width:650px){
  .brand{width:100%;font-size:13px}
  .book{grid-template-columns:1fr 1fr}
  .book .half{padding:14px 12px}
  .book .right .box,.book .right .dialogue,.book .right .note{font-size:13.5px}
  .book .right .lab{font-size:12px}
}

.tap-toggle{
  position:relative;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:pan-y;
}
.tap-toggle.blurred{
  filter:blur(7px);
  opacity:.72;
  user-select:none;
}
.ko-dialogue{
  border-left:4px solid #f2c2a7;
  padding:8px 11px;
  margin:8px 0 10px;
  background:#fffdfb;
  border-radius:0 12px 12px 0;
  font-size:15.5px;
  line-height:1.58;
  white-space:pre-line;
}
.swipe-hint{
  margin-top:14px;
  text-align:center;
  color:#9d7d6a;
  font-size:12px;
  font-weight:800;
}

.dialogue-example + .dialogue-example{border-top:1px dashed rgba(242,194,167,.28);padding-top:4px}

.dialogue-line-pair{margin-top:10px}
.dialogue-line-pair .dialogue{margin-bottom:5px}
.ko-line{
  font-size:15.5px;
  line-height:1.55;
  color:#f3e7df;
  padding:0 10px 7px 10px;
  white-space:pre-wrap;
}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15100d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="영어단어">
<link rel="apple-touch-icon" href="icon-192.png">

</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">여행영어 전체 · 331 PRO</div>
    <button class="iconbtn" id="searchBtn" title="검색">🔍</button>
    <button class="iconbtn" id="shuffleBtn" title="무작위">🔀</button>
    <button class="iconbtn" id="hideBtn" title="뜻 가리기">🙈뜻</button>
    <button class="iconbtn" id="hideMnemonicBtn" title="연상법 가리기">🧠</button>
    <button class="iconbtn" id="bookBtn" title="책 모드">📖</button>
    <button class="iconbtn" id="wrongBtn" title="오답만">❌</button>
    <button class="iconbtn" id="addBtn" title="단어 추가">＋</button>
    <button class="iconbtn" id="prevBtn">◀</button>
    <button class="iconbtn" id="nextBtn">▶</button>
    <div class="progressbox">
      <div class="pt" id="pt"></div>
      <div class="progress"><div class="bar" id="bar"></div></div>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>
<script>
const baseCards=[{"day": 11, "num": 1, "word": "check in", "meaning": "체크인하다, 입실 수속하다", "hint": "호텔·공항에서 가장 자주 쓰는 표현으로 통째로 외우기", "mnemonic": "[익숙한 표현 연상] 체크인 = 호텔·공항에서 한국어로도 그대로 씀. 들어가며 수속한다.\n→ check in = 체크인하다, 입실 수속하다", "dialogue": "A: I'd like to check in.\nB: Sure. May I see your passport?", "caution": "check in = 입실/탑승 수속. check out = 퇴실.", "dialogues": ["A: I'd like to check in.\nB: Sure. May I see your passport?", "A: What time can I check in?\nB: After 3 p.m.", "A: Can I check in early?\nB: I'll check for you."], "similar": "check out = 체크아웃하다 / register = 등록하다 / sign in = 이름을 적고 들어가다", "note": "check in는 단어를 따로 떼기보다 한 덩어리 표현으로 외우는 게 자연스럽습니다. 실제 여행에서는 통째로 말하는 경우가 많습니다.", "ko_dialogue": "A: 체크인하고 싶어요.\nB: 네. 여권을 보여주시겠어요?", "dialogue_pairs": [{"en": "A: Hi, I'd like to check in.\nB: Of course. May I see your passport, please?\nA: Sure. Here you are.\nB: Thank you. Your room is on the eighth floor.", "ko": "A: 안녕하세요. 체크인하고 싶어요.\nB: 네. 여권을 보여주시겠어요?\nA: 물론이죠. 여기 있습니다.\nB: 감사합니다. 객실은 8층입니다."}, {"en": "A: Is it possible to check in early?\nB: Let me check if your room is ready.\nA: Thank you. I can wait if necessary.\nB: Good news. Your room is available now.", "ko": "A: 일찍 체크인할 수 있을까요?\nB: 객실 준비가 되었는지 확인해볼게요.\nA: 감사합니다. 필요하면 기다릴 수 있어요.\nB: 다행히 지금 객실 이용이 가능합니다."}]}, {"day": 11, "num": 2, "word": "check out", "meaning": "체크아웃하다, 퇴실하다", "hint": "check in의 반대", "mnemonic": "[익숙한 표현 연상] 체크아웃 = 나가며 퇴실 수속한다.\n→ check out = 체크아웃하다, 퇴실하다", "dialogue": "A: I'd like to check out.\nB: Of course. How was your stay?", "caution": "호텔에서는 '퇴실하다'. 물건을 '확인해 보다'라는 뜻도 있음.", "dialogues": ["A: I'd like to check out.\nB: Of course. How was your stay?", "A: What time is check-out?\nB: At 11 a.m.", "A: Can I check out late?\nB: Yes, until 1 p.m."], "similar": "check in = 체크인하다 / leave = 떠나다 / settle the bill = 계산을 끝내다", "note": "check out는 단어를 따로 떼기보다 한 덩어리 표현으로 외우는 게 자연스럽습니다. 실제 여행에서는 통째로 말하는 경우가 많습니다.", "ko_dialogue": "A: 체크아웃하고 싶어요.\nB: 물론이죠. 숙박은 어떠셨어요?", "dialogue_pairs": [{"en": "A: Hi, I'd like to check out.\nB: Certainly. What room were you in?\nA: Room 812.\nB: Thank you. Let me prepare your final bill.", "ko": "A: 안녕하세요. 체크아웃하고 싶어요.\nB: 네. 몇 호실에 묵으셨나요?\nA: 812호요.\nB: 감사합니다. 최종 계산서를 준비해드릴게요."}, {"en": "A: Could I check out a little later today?\nB: We can extend it until one p.m.\nA: Is there an extra charge?\nB: No, not until one.", "ko": "A: 오늘 체크아웃을 조금 늦게 해도 될까요?\nB: 오후 1시까지 연장해드릴 수 있어요.\nA: 추가 요금이 있나요?\nB: 아니요, 1시까지는 없습니다."}]}, {"day": 11, "num": 3, "word": "boarding", "meaning": "탑승", "hint": "boarding pass = 탑승권까지 같이 묶어 외우기", "mnemonic": "[익숙한 표현 연상] BOARDING 표지판 = 탑승. 공항 전광판과 묶는다.\n→ boarding = 탑승", "dialogue": "A: When does boarding start?\nB: At 8:20.", "caution": "boarding = 탑승. boarding pass = 탑승권.", "dialogues": ["A: When does boarding start?\nB: At 8:20.", "A: I saw “boarding” at the airport. What does it mean?\nB: It means “탑승.”", "A: Can you help me with “boarding”?\nB: Sure. Let me help you."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "A: 탑승은 언제 시작하나요?\nB: 8시 20분에 시작합니다.", "dialogue_pairs": [{"en": "A: When does boarding start?\nB: At 8:20.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 탑승은 언제 시작하나요?\nB: 8시 20분에 시작합니다.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: Has boarding started yet?\nB: Not yet. It starts in ten minutes.\nA: Which group boards first?\nB: Group A.", "ko": "A: 탑승이 벌써 시작됐나요?\nB: 아직이요. 10분 뒤에 시작합니다.\nA: 어느 그룹이 먼저 탑승하나요?\nB: A그룹입니다."}]}, {"day": 11, "num": 4, "word": "fragile", "meaning": "깨지기 쉬운", "hint": "수하물에 붙는 스티커로 자주 봄", "mnemonic": "[익숙한 표현 연상] FRAGILE 스티커 + 깨진 유리잔 그림 = 파손주의.\n→ fragile = 깨지기 쉬운", "dialogue": "A: This bag is fragile.\nB: We'll put a fragile tag on it.", "caution": "fragile = 깨지기 쉬운. 수하물 표지에서 자주 봄.", "dialogues": ["A: This bag is fragile.\nB: We'll put a fragile tag on it.", "A: I saw “fragile” at the airport. What does it mean?\nB: It means “깨지기 쉬운.”", "A: Can you help me with “fragile”?\nB: Sure. Let me help you."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "A: 이 가방은 깨지기 쉬워요.\nB: 파손주의 태그를 붙여드릴게요.", "dialogue_pairs": [{"en": "A: This bag is fragile.\nB: We'll put a fragile tag on it.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 이 가방은 깨지기 쉬워요.\nB: 파손주의 태그를 붙여드릴게요.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: This suitcase has some fragile items inside.\nB: We'll mark it as fragile.\nA: Could you handle it carefully, please?\nB: Of course.", "ko": "A: 이 여행가방 안에 깨지기 쉬운 물건이 있어요.\nB: 파손주의 표시를 해드릴게요.\nA: 조심해서 다뤄주시겠어요?\nB: 물론입니다."}]}, {"day": 11, "num": 5, "word": "one-way", "meaning": "편도", "hint": "왕복이 아닌 한쪽만", "mnemonic": "[구조 연상] one(하나) + way(방향)\n한 방향으로만 가는 것.\n→ one-way = 편도 / 일방통행.", "dialogue": "A: One-way or round trip?\nB: One-way, please.", "caution": "one-way = 편도 / round trip = 왕복.", "dialogues": ["A: One-way or round trip?\nB: One-way, please.", "A: I saw “one-way” at the airport. What does it mean?\nB: It means “편도.”", "A: Can you help me with “one-way”?\nB: Sure. Let me help you."], "similar": "—", "note": "one-way ticket = 편도표, one-way street = 일방통행 도로. 같은 one-way가 두 상황에서 모두 쓰입니다.", "ko_dialogue": "A: 편도인가요, 왕복인가요?\nB: 편도로 주세요.", "dialogue_pairs": [{"en": "A: Do you need a one-way or round-trip ticket?\nB: One-way, please.\nA: What time would you like to leave?\nB: Around nine in the morning.", "ko": "A: 편도와 왕복 중 어떤 티켓이 필요하세요?\nB: 편도로 주세요.\nA: 몇 시쯤 출발하시겠어요?\nB: 오전 9시쯤이요."}, {"en": "A: Is this a one-way street?\nB: Yes, you can only drive in that direction.\nA: Then I can't turn left here, right?\nB: That's right.", "ko": "A: 여기가 일방통행 도로인가요?\nB: 네, 저 방향으로만 운전할 수 있어요.\nA: 그럼 여기서 좌회전은 못 하는 거죠?\nB: 네, 맞습니다."}]}, {"day": 11, "num": 6, "word": "round trip", "meaning": "왕복", "hint": "왔다가 다시 돌아오는 여행", "mnemonic": "[구조 연상] round(돌아서) + trip(여행)\n갔다가 다시 돌아오는 한 바퀴 여행.\n→ round trip = 왕복.", "dialogue": "A: Is this a round-trip ticket?\nB: Yes, it is.", "caution": "round trip = 왕복. one-way와 반대.", "dialogues": ["A: Is this a round-trip ticket?\nB: Yes, it is.", "A: I saw “round trip” at the airport. What does it mean?\nB: It means “왕복.”", "A: Can you help me with “round trip”?\nB: Sure. Let me help you."], "similar": "—", "note": "미국식은 round-trip ticket, 영국식은 return ticket이 흔합니다.", "ko_dialogue": "A: 이거 왕복 티켓인가요?\nB: 네, 맞습니다.", "dialogue_pairs": [{"en": "A: I'd like a round-trip ticket to Kyoto, please.\nB: Sure. When would you like to return?\nA: This Sunday evening.\nB: Okay. The total is 8,600 yen.", "ko": "A: 교토까지 왕복 티켓 한 장 주세요.\nB: 네. 돌아오는 날짜는 언제로 하실까요?\nA: 이번 주 일요일 저녁이요.\nB: 알겠습니다. 총 8,600엔입니다."}, {"en": "A: Is a round trip cheaper than buying two one-way tickets?\nB: Yes, the round-trip fare is a little cheaper.\nA: Then I'll take the round trip.\nB: Great. I'll book that for you.", "ko": "A: 편도 티켓 두 장을 사는 것보다 왕복이 더 저렴한가요?\nB: 네, 왕복 요금이 조금 더 저렴합니다.\nA: 그럼 왕복으로 할게요.\nB: 좋습니다. 그렇게 예약해드릴게요."}]}, {"day": 11, "num": 7, "word": "travel", "meaning": "여행하다, 여행", "hint": "넓은 의미의 여행 전체", "mnemonic": "[장면 연상] 여행 중 실제 표지판·예약화면·메뉴에서 **travel**가 크게 적힌 장면을 떠올린다.\n그 단어를 ‘여행하다, 여행’ 장면과 한 번에 묶어 기억한다.\n→ travel = 여행하다, 여행", "dialogue": "A: What does “travel” mean?\nB: It means “여행하다.”", "caution": "여행에서는 자주 붙는 표현과 함께 외우면 훨씬 오래 기억됩니다.", "dialogues": ["A: What does “travel” mean?\nB: It means “여행하다.”", "A: I saw “travel” at the airport. What does it mean?\nB: It means “여행하다.”", "A: Can you help me with “travel”?\nB: Sure. Let me help you."], "similar": "trip = 한 번의 여행 / journey = 이동 과정 / tour = 관광", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "이 표현은 여행에서 ‘여행하다, 여행’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Do you travel abroad often?\nB: A few times a year.\nA: Where are you traveling next?\nB: I'm going to Vietnam next month.", "ko": "A: 해외여행을 자주 하세요?\nB: 1년에 몇 번 정도 해요.\nA: 다음에는 어디로 여행 가세요?\nB: 다음 달에 베트남에 가요."}, {"en": "A: Could you help me with travel?\nB: Sure. Tell me what you need.\nA: I want to make sure about 여행하다, 여행.\nB: Of course. I'll help you with that.", "ko": "A: 여행하다, 여행와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요한지 말씀해주세요.\nA: 여행하다, 여행 부분을 확실히 확인하고 싶어요.\nB: 물론이죠. 도와드릴게요."}]}, {"day": 11, "num": 8, "word": "trip", "meaning": "여행, 이동", "hint": "한 번의 구체적인 여행", "mnemonic": "[장면 연상] 여행 중 실제 표지판·예약화면·메뉴에서 **trip**가 크게 적힌 장면을 떠올린다.\n그 단어를 ‘여행, 이동’ 장면과 한 번에 묶어 기억한다.\n→ trip = 여행, 이동", "dialogue": "A: What does “trip” mean?\nB: It means “여행.”", "caution": "여행에서는 자주 붙는 표현과 함께 외우면 훨씬 오래 기억됩니다.", "dialogues": ["A: What does “trip” mean?\nB: It means “여행.”", "A: I saw “trip” at the airport. What does it mean?\nB: It means “여행.”", "A: Can you help me with “trip”?\nB: Sure. Let me help you."], "similar": "travel = 여행 전반 / journey = 여정 / tour = 관광", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "이 표현은 여행에서 ‘여행, 이동’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: How was your trip to Japan?\nB: It was great, but it went by too quickly.\nA: How long did you stay?\nB: Five days.", "ko": "A: 일본 여행은 어땠어요?\nB: 정말 좋았는데 너무 빨리 지나갔어요.\nA: 얼마나 머물렀어요?\nB: 5일이요."}, {"en": "A: Could you help me with trip?\nB: Sure. Tell me what you need.\nA: I want to make sure about 여행, 이동.\nB: Of course. I'll help you with that.", "ko": "A: 여행, 이동와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요한지 말씀해주세요.\nA: 여행, 이동 부분을 확실히 확인하고 싶어요.\nB: 물론이죠. 도와드릴게요."}]}, {"day": 11, "num": 9, "word": "tour", "meaning": "관광, 투어", "hint": "가이드가 있는 관광 느낌", "mnemonic": "[익숙한 표현 연상] 투어 = 관광.\n→ tour = 관광, 투어", "dialogue": "A: What does “tour” mean?\nB: It means “관광.”", "caution": "여행에서는 자주 붙는 표현과 함께 외우면 훨씬 오래 기억됩니다.", "dialogues": ["A: What does “tour” mean?\nB: It means “관광.”", "A: I saw “tour” at the airport. What does it mean?\nB: It means “관광.”", "A: Can you help me with “tour”?\nB: Sure. Let me help you."], "similar": "trip = 여행 / sightseeing = 관광 / guided tour = 가이드 투어", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "이 표현은 여행에서 ‘관광, 투어’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Are you joining the city tour tomorrow?\nB: Yes. It starts at nine, right?\nA: That's right. We meet in the hotel lobby.\nB: Great. I'll be there early.", "ko": "A: 내일 시티 투어에 참가하시나요?\nB: 네. 9시에 시작하죠?\nA: 맞아요. 호텔 로비에서 만나요.\nB: 좋아요. 일찍 가 있을게요."}, {"en": "A: Could you help me with tour?\nB: Sure. Tell me what you need.\nA: I want to make sure about 관광, 투어.\nB: Of course. I'll help you with that.", "ko": "A: 관광, 투어와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요한지 말씀해주세요.\nA: 관광, 투어 부분을 확실히 확인하고 싶어요.\nB: 물론이죠. 도와드릴게요."}]}, {"day": 11, "num": 10, "word": "flight", "meaning": "비행, 항공편", "hint": "flight number = 항공편 번호", "mnemonic": "[장면 연상] 여행 중 실제 표지판·예약화면·메뉴에서 **flight**가 크게 적힌 장면을 떠올린다.\n그 단어를 ‘비행, 항공편’ 장면과 한 번에 묶어 기억한다.\n→ flight = 비행, 항공편", "dialogue": "A: What time is your flight?\nB: It's at 10 a.m.", "caution": "flight = 항공편. plane은 비행기 자체.", "dialogues": ["A: What time is your flight?\nB: It's at 10 a.m.", "A: I saw “flight” at the airport. What does it mean?\nB: It means “비행.”", "A: Can you help me with “flight”?\nB: Sure. Let me help you."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "A: 항공편이 몇 시예요?\nB: 오전 10시예요.", "dialogue_pairs": [{"en": "A: What time is your flight?\nB: It's at 10 a.m.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 항공편이 몇 시예요?\nB: 오전 10시예요.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: What time is your flight tomorrow?\nB: It leaves at 10:20 in the morning.\nA: What time are you going to the airport?\nB: Around seven.", "ko": "A: 내일 비행기가 몇 시예요?\nB: 오전 10시 20분에 출발해요.\nA: 공항에는 몇 시쯤 갈 거예요?\nB: 7시쯤이요."}]}, {"day": 11, "num": 11, "word": "delay", "meaning": "지연, 지연되다", "hint": "비행기 delay = 연착", "mnemonic": "[익숙한 표현 연상] ‘딜레이 됐다’ = 늦어졌다. 공항 DELAYED 전광판과 연결.\n→ delay = 지연, 지연되다", "dialogue": "A: Is the flight delayed?\nB: Yes, by 30 minutes.", "caution": "delay = 지연. delayed = 지연된.", "dialogues": ["A: Is the flight delayed?\nB: Yes, by 30 minutes.", "A: I saw “delay” at the airport. What does it mean?\nB: It means “지연.”", "A: Can you help me with “delay”?\nB: Sure. Let me help you."], "similar": "late = 늦은 상태 / postponed = 연기된 / canceled = 취소된", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "A: 비행기가 지연됐나요?\nB: 네, 30분 지연됐어요.", "dialogue_pairs": [{"en": "A: Is the flight delayed?\nB: Yes, by 30 minutes.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 비행기가 지연됐나요?\nB: 네, 30분 지연됐어요.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: How long is the delay?\nB: About forty minutes.\nA: Has the gate changed too?\nB: No, the gate is still the same.", "ko": "A: 얼마나 지연됐나요?\nB: 약 40분입니다.\nA: 탑승구도 바뀌었나요?\nB: 아니요, 탑승구는 그대로입니다."}]}, {"day": 11, "num": 12, "word": "destination", "meaning": "목적지", "hint": "어디로 가는지 마지막 도착점", "mnemonic": "[발음+상황 연상] “됐어! 이 네비에 찍은 곳!”\n네비에 마지막으로 찍힌 곳이 내가 최종적으로 가는 곳.\n됐어-이-네비… ≈ destination → 목적지.", "dialogue": "A: What's your final destination?\nB: Paris.", "caution": "destination = 최종 목적지. departure는 출발.", "dialogues": ["A: What's your final destination?\nB: Paris.", "A: I saw “destination” at the airport. What does it mean?\nB: It means “목적지.”", "A: Can you help me with “destination”?\nB: Sure. Let me help you."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "A: 최종 목적지가 어디인가요?\nB: 파리입니다.", "dialogue_pairs": [{"en": "A: What's your final destination?\nB: Paris.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 최종 목적지가 어디인가요?\nB: 파리입니다.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: What's your final destination?\nB: Barcelona.\nA: Are you connecting in Paris?\nB: Yes, I have a two-hour layover there.", "ko": "A: 최종 목적지가 어디인가요?\nB: 바르셀로나입니다.\nA: 파리에서 환승하시나요?\nB: 네, 거기서 2시간 경유합니다."}]}, {"day": 11, "num": 13, "word": "pack", "meaning": "짐을 싸다", "hint": "여행 전에 짐 챙기는 장면", "mnemonic": "[익숙한 표현 연상] ‘패킹한다’ = 짐 싼다. 여행가방 이미지와 연결.\n→ pack = 짐을 싸다", "dialogue": "A: Have you packed your bag?\nB: Not yet.", "caution": "pack = 짐을 싸다. unpack = 짐을 풀다.", "dialogues": ["A: Have you packed your bag?\nB: Not yet.", "A: I saw “pack” at the airport. What does it mean?\nB: It means “짐을 싸다.”", "A: Can you help me with “pack”?\nB: Sure. Let me help you."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "A: 가방 다 싸셨어요?\nB: 아직이요.", "dialogue_pairs": [{"en": "A: Have you packed your bag?\nB: Not yet.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 가방 다 싸셨어요?\nB: 아직이요.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: Have you packed everything for the trip?\nB: Almost. I still need to pack my charger.\nA: Don't forget your passport.\nB: Good reminder.", "ko": "A: 여행 짐 다 싸셨어요?\nB: 거의요. 충전기만 아직 안 넣었어요.\nA: 여권 잊지 마세요.\nB: 맞다, 알려줘서 고마워요."}]}, {"day": 11, "num": 14, "word": "unpack", "meaning": "짐을 풀다", "hint": "pack의 반대", "mnemonic": "[구조/상황 연상] un-(반대로/풀다) + pack(짐 싸다) → 짐을 풀다.\n→ unpack = 짐을 풀다", "dialogue": "A: Did you unpack already?\nB: Yes, I did.", "caution": "unpack = 짐을 풀다. pack의 반대.", "dialogues": ["A: Did you unpack already?\nB: Yes, I did.", "A: I saw “unpack” at the airport. What does it mean?\nB: It means “짐을 풀다.”", "A: Can you help me with “unpack”?\nB: Sure. Let me help you."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "A: 벌써 짐 풀었어요?\nB: 네, 풀었어요.", "dialogue_pairs": [{"en": "A: Did you unpack already?\nB: Yes, I did.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 벌써 짐 풀었어요?\nB: 네, 풀었어요.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: Are you going to unpack now?\nB: Yes. I want to hang up my clothes first.\nA: I'll put the suitcases by the closet.\nB: Thanks.", "ko": "A: 지금 짐 풀 거예요?\nB: 네. 옷부터 걸어두려고요.\nA: 여행가방은 옷장 옆에 둘게요.\nB: 고마워요."}]}, {"day": 11, "num": 15, "word": "extra", "meaning": "추가의, 여분의", "hint": "extra charge = 추가 요금", "mnemonic": "[익숙한 표현 연상] ‘엑스트라’ = 추가분. extra charge와 같이 외운다.\n→ extra = 추가의, 여분의", "dialogue": "A: Is there an extra charge?\nB: No, it's included.", "caution": "extra = 추가의/여분의. extra charge = 추가 요금.", "dialogues": ["A: Is there an extra charge?\nB: No, it's included.", "A: I saw “extra” at the airport. What does it mean?\nB: It means “추가의.”", "A: Can you help me with “extra”?\nB: Sure. Let me help you."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "A: 추가 요금이 있나요?\nB: 아니요, 포함되어 있어요.", "dialogue_pairs": [{"en": "A: Is there an extra charge?\nB: No, it's included.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 추가 요금이 있나요?\nB: 아니요, 포함되어 있어요.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: Excuse me, can you help me with this?\nB: Sure. What do you need?\nA: I need to use 'extra' in this situation.\nB: No problem. Let's take care of it.", "ko": "A: 실례합니다. 이것 좀 도와주실 수 있나요?\nB: 네. 무엇이 필요하세요?\nA: 이 상황에서 ‘추가의, 여분의’이 필요해요.\nB: 괜찮습니다. 처리해드릴게요."}]}, {"day": 11, "num": 16, "word": "contact", "meaning": "연락하다, 연락처", "hint": "contact number = 연락처", "mnemonic": "[익숙한 표현 연상] ‘컨택하다’ = 연락하다.\n→ contact = 연락하다, 연락처", "dialogue": "A: How can I contact you?\nB: Call this number.", "caution": "contact = 연락하다/연락처.", "dialogues": ["A: How can I contact you?\nB: Call this number.", "A: I saw “contact” at the airport. What does it mean?\nB: It means “연락하다.”", "A: Can you help me with “contact”?\nB: Sure. Let me help you."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "A: 어떻게 연락드리면 되나요?\nB: 이 번호로 전화하세요.", "dialogue_pairs": [{"en": "A: How can I contact you?\nB: Call this number.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 어떻게 연락드리면 되나요?\nB: 이 번호로 전화하세요.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: How can I contact the hotel after midnight?\nB: Call the front desk at this number.\nA: Is someone available all night?\nB: Yes, the desk is open 24 hours.", "ko": "A: 자정 이후에는 호텔에 어떻게 연락하면 되나요?\nB: 이 번호로 프런트 데스크에 전화하세요.\nA: 밤새 직원이 있나요?\nB: 네, 프런트는 24시간 운영합니다."}]}, {"day": 11, "num": 17, "word": "put on", "meaning": "입다, 착용하다", "hint": "옷·신발·안경을 몸에 올려놓는다", "mnemonic": "[장면 연상] 여행 중 실제 표지판·예약화면·메뉴에서 **put on**가 크게 적힌 장면을 떠올린다.\n그 단어를 ‘입다, 착용하다’ 장면과 한 번에 묶어 기억한다.\n→ put on = 입다, 착용하다", "dialogue": "A: Please put on your seat belt.\nB: Okay.", "caution": "put on = 착용하다. take off = 벗다/이륙하다.", "dialogues": ["A: Please put on your seat belt.\nB: Okay.", "A: I saw “put on” at the airport. What does it mean?\nB: It means “입다.”", "A: Can you help me with “put on”?\nB: Sure. Let me help you."], "similar": "—", "note": "put on는 단어를 따로 떼기보다 한 덩어리 표현으로 외우는 게 자연스럽습니다. 실제 여행에서는 통째로 말하는 경우가 많습니다.", "ko_dialogue": "A: 안전벨트를 착용해주세요.\nB: 네.", "dialogue_pairs": [{"en": "A: Please put on your seat belt.\nB: Okay.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 안전벨트를 착용해주세요.\nB: 네.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: Please put on your seat belt.\nB: Okay. Are we taking off soon?\nA: Yes, in a few minutes.\nB: Got it.", "ko": "A: 안전벨트를 착용해주세요.\nB: 네. 곧 이륙하나요?\nA: 네, 몇 분 뒤에 이륙합니다.\nB: 알겠습니다."}]}, {"day": 11, "num": 18, "word": "lose", "meaning": "잃어버리다", "hint": "lose my passport = 여권을 잃어버리다", "mnemonic": "[장면 연상] 여행 중 실제 표지판·예약화면·메뉴에서 **lose**가 크게 적힌 장면을 떠올린다.\n그 단어를 ‘잃어버리다’ 장면과 한 번에 묶어 기억한다.\n→ lose = 잃어버리다", "dialogue": "A: I lost my passport.\nB: Please contact the police.", "caution": "lose = 잃어버리다. loose(헐거운)와 철자 주의.", "dialogues": ["A: I lost my passport.\nB: Please contact the police.", "A: I saw “lose” at the airport. What does it mean?\nB: It means “잃어버리다.”", "A: Can you help me with “lose”?\nB: Sure. Let me help you."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "A: 여권을 잃어버렸어요.\nB: 경찰에 연락해주세요.", "dialogue_pairs": [{"en": "A: I lost my passport.\nB: Please contact the police.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 여권을 잃어버렸어요.\nB: 경찰에 연락해주세요.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: I think I lost my wallet.\nB: Where did you last see it?\nA: At the café near the station.\nB: Let's call them first.", "ko": "A: 지갑을 잃어버린 것 같아요.\nB: 마지막으로 어디에서 보셨어요?\nA: 역 근처 카페에서요.\nB: 우선 거기에 전화해봅시다."}]}, {"day": 11, "num": 19, "word": "seat", "meaning": "좌석", "hint": "창가 seat, aisle seat", "mnemonic": "[익숙한 표현 연상] seat = 좌석. seat number와 같이 외운다.\n→ seat = 좌석", "dialogue": "A: Is this seat taken?\nB: No, it's free.", "caution": "seat = 좌석. sit = 앉다.", "dialogues": ["A: Is this seat taken?\nB: No, it's free.", "A: I saw “seat” at the airport. What does it mean?\nB: It means “좌석.”", "A: Can you help me with “seat”?\nB: Sure. Let me help you."], "similar": "chair = 일반 의자 / seat = 지정 좌석 / spot = 자리", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "A: 이 자리 누가 앉았나요?\nB: 아니요, 비어 있어요.", "dialogue_pairs": [{"en": "A: Is this seat taken?\nB: No, it's free.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 이 자리 누가 앉았나요?\nB: 아니요, 비어 있어요.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: Is this seat free?\nB: Yes, no one's sitting there.\nA: Great. Do you mind if I sit here?\nB: Not at all.", "ko": "A: 이 자리 비어 있나요?\nB: 네, 아무도 안 앉아요.\nA: 좋아요. 제가 여기 앉아도 괜찮을까요?\nB: 물론이죠."}]}, {"day": 11, "num": 20, "word": "aisle", "meaning": "통로", "hint": "비행기·버스의 가운데 통로", "mnemonic": "[익숙한 표현 연상] 비행기 좌석도 WINDOW ↔ AISLE 한 쌍으로.\n→ aisle = 통로", "dialogue": "A: Window or aisle seat?\nB: Aisle, please.", "caution": "aisle = 통로. 발음은 '아일'에 가까움.", "dialogues": ["A: Window or aisle seat?\nB: Aisle, please.", "A: I saw “aisle” at the airport. What does it mean?\nB: It means “통로.”", "A: Can you help me with “aisle”?\nB: Sure. Let me help you."], "similar": "window seat = 창가 좌석 / middle seat = 가운데 좌석 / aisle seat = 통로 좌석", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "A: 창가 좌석인가요, 통로 좌석인가요?\nB: 통로 좌석으로 주세요.", "dialogue_pairs": [{"en": "A: Window or aisle seat?\nB: Aisle, please.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 창가 좌석인가요, 통로 좌석인가요?\nB: 통로 좌석으로 주세요.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: Would you prefer a window or an aisle seat?\nB: An aisle seat, please.\nA: I have one near the back.\nB: That's fine.", "ko": "A: 창가와 통로 좌석 중 어느 쪽을 원하세요?\nB: 통로 좌석으로 주세요.\nA: 뒤쪽에 한 자리 있습니다.\nB: 괜찮습니다."}]}, {"day": 11, "num": 21, "word": "I'm good.", "meaning": "괜찮아요, 전 됐어요", "hint": "정중하게 거절할 때 자주 씀", "mnemonic": "[회화 연상] 제안을 거절할 때 “난 괜찮아요.”\n→ I'm good. = 괜찮습니다 / 됐습니다.", "dialogue": "A: Would you like more coffee?\nB: No, I'm good. Thanks.", "caution": "I'm good = 괜찮아요/됐어요.", "dialogues": ["A: Would you like more coffee?\nB: No, I'm good. Thanks.", "A: I saw “I'm good.” at the airport. What does it mean?\nB: It means “괜찮아요.”", "A: Can you help me with “I'm good.”?\nB: Sure. Let me help you."], "similar": "—", "note": "제안을 정중히 거절할 때 ‘괜찮아요’ 의미. 상황에 따라 ‘나는 잘 지내’ 뜻도 됩니다.", "ko_dialogue": "A: 커피 더 드릴까요?\nB: 아니요, 괜찮습니다. 감사합니다.", "dialogue_pairs": [{"en": "A: Would you like more coffee?\nB: No, I'm good. Thanks.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 커피 더 드릴까요?\nB: 아니요, 괜찮습니다. 감사합니다.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: Excuse me, can you help me with this?\nB: Sure. What do you need?\nA: I need to use 'I'm good.' in this situation.\nB: No problem. Let's take care of it.", "ko": "A: 실례합니다. 이것 좀 도와주실 수 있나요?\nB: 네. 무엇이 필요하세요?\nA: 이 상황에서 ‘괜찮아요, 전 됐어요’이 필요해요.\nB: 괜찮습니다. 처리해드릴게요."}]}, {"day": 11, "num": 22, "word": "flight attendant", "meaning": "승무원", "hint": "flight + attendant", "mnemonic": "[장면 연상] 여행 중 실제 표지판·예약화면·메뉴에서 **flight attendant**가 크게 적힌 장면을 떠올린다.\n그 단어를 ‘승무원’ 장면과 한 번에 묶어 기억한다.\n→ flight attendant = 승무원", "dialogue": "A: Excuse me, could you call a flight attendant?\nB: Sure.", "caution": "flight attendant = 승무원.", "dialogues": ["A: Excuse me, could you call a flight attendant?\nB: Sure.", "A: I saw “flight attendant” at the airport. What does it mean?\nB: It means “승무원.”", "A: Can you help me with “flight attendant”?\nB: Sure. Let me help you."], "similar": "—", "note": "flight attendant는 단어를 따로 떼기보다 한 덩어리 표현으로 외우는 게 자연스럽습니다. 실제 여행에서는 통째로 말하는 경우가 많습니다.", "ko_dialogue": "A: 실례합니다. 승무원을 불러주시겠어요?\nB: 네.", "dialogue_pairs": [{"en": "A: Excuse me, could you call a flight attendant?\nB: Sure.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 실례합니다. 승무원을 불러주시겠어요?\nB: 네.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: Excuse me, could you call a flight attendant?\nB: Sure. Is something wrong?\nA: I need some water.\nB: I'll let them know.", "ko": "A: 실례합니다. 승무원을 불러주실 수 있나요?\nB: 네. 무슨 문제 있으세요?\nA: 물이 좀 필요해서요.\nB: 전달해드릴게요."}]}, {"day": 11, "num": 23, "word": "take off", "meaning": "이륙하다, 벗다", "hint": "비행기는 take off", "mnemonic": "[구동사 연상] off = 붙어 있던 곳에서 떨어짐.\n비행기가 땅에서 떨어져 올라간다.\n→ take off = 이륙하다.", "dialogue": "A: What time do we take off?\nB: At 9:30.", "caution": "비행기 = 이륙하다. 옷 = 벗다. 문맥 주의.", "dialogues": ["A: What time do we take off?\nB: At 9:30.", "A: I saw “take off” at the airport. What does it mean?\nB: It means “이륙하다.”", "A: Can you help me with “take off”?\nB: Sure. Let me help you."], "similar": "—", "note": "비행기는 take off, 사람은 clothes를 take off하면 ‘벗다’가 됩니다.", "ko_dialogue": "A: 몇 시에 이륙하나요?\nB: 9시 30분입니다.", "dialogue_pairs": [{"en": "A: What time do we take off?\nB: At 9:30.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 몇 시에 이륙하나요?\nB: 9시 30분입니다.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: What time are we expected to take off?\nB: Around 9:30.\nA: Are we delayed?\nB: Only by about ten minutes.", "ko": "A: 몇 시쯤 이륙할 예정인가요?\nB: 9시 30분쯤입니다.\nA: 지연된 건가요?\nB: 약 10분 정도만 지연됐습니다."}]}, {"day": 11, "num": 24, "word": "switch", "meaning": "바꾸다, 전환하다", "hint": "switch seats = 좌석을 바꾸다", "mnemonic": "[익숙한 표현 연상] 스위치 = 상태를 바꾸는 장치. → switch = 바꾸다.\n→ switch = 바꾸다, 전환하다", "dialogue": "A: Could we switch seats?\nB: Sure.", "caution": "switch = 바꾸다. change와 비슷하지만 서로 바꾸는 느낌.", "dialogues": ["A: Could we switch seats?\nB: Sure.", "A: I saw “switch” at the airport. What does it mean?\nB: It means “바꾸다.”", elp.\nB: You're welcome.", "ko": "A: 이거 추가 요금이 있나요?\nB: 네, 5달러입니다.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: Is there an extra charge for checked baggage?\nB: Yes, it's 30 dollars for this fare.\nA: What about a carry-on bag?\nB: One carry-on is included.", "ko": "A: 위탁 수하물에 추가 요금이 있나요?\nB: 네, 이 운임은 30달러입니다.\nA: 기내 반입 가방은요?\nB: 기내 반입 가방 한 개는 포함되어 있습니다."}]}, {"day": 11, "num": 30, "word": "change", "meaning": "바꾸다, 변화, 잔돈", "hint": "돈 이야기할 때는 잔돈", "mnemonic": "[장면 연상] 여행 중 실제 표지판·예약화면·메뉴에서 **change**가 크게 적힌 장면을 떠올린다.\n그 단어를 ‘바꾸다, 변화, 잔돈’ 장면과 한 번에 묶어 기억한다.\n→ change = 바꾸다, 변화, 잔돈", "dialogue": "A: Do you have change for $20?\nB: Yes.", "caution": "change = 바꾸다/잔돈. exchange는 화폐 교환.", "dialogues": ["A: Do you have change for $20?\nB: Yes.", "A: Do you have change for a twenty?\nB: Yes.", "A: Can I change seats?\nB: Sure."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "A: 20달러짜리 잔돈으로 바꿔주실 수 있나요?\nB: 네.", "dialogue_pairs": [{"en": "A: Do you have change for $20?\nB: Yes.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 20달러짜리 잔돈으로 바꿔주실 수 있나요?\nB: 네.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: Excuse me, can you help me with this?\nB: Sure. What do you need?\nA: I need to use 'change' in this situation.\nB: No problem. Let's take care of it.", "ko": "A: 실례합니다. 이것 좀 도와주실 수 있나요?\nB: 네. 무엇이 필요하세요?\nA: 이 상황에서 ‘바꾸다, 변화, 잔돈’이 필요해요.\nB: 괜찮습니다. 처리해드릴게요."}]}, {"day": 11, "num": 31, "word": "domestic", "meaning": "국내의", "hint": "domestic flight = 국내선", "mnemonic": "[구조/상황 연상] DOMESTIC ↔ INTERNATIONAL 공항 표지판을 한 쌍으로. domestic = 국내의.\n→ domestic = 국내의", "dialogue": "A: Is this a domestic flight?\nB: Yes.", "caution": "domestic = 국내의. international = 국제의.", "dialogues": ["A: Is this a domestic flight?\nB: Yes.", "A: I saw “domestic” at the airport. What does it mean?\nB: It means “국내의.”", "A: Can you help me with “domestic”?\nB: Sure. Let me help you."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외  = 투어에 참가하다", "dialogue": "A: Can I join the tour today?\nB: Yes.", "caution": "join = 참가하다. attend와 구분.", "dialogues": ["A: Can I join the tour today?\nB: Yes.", "A: I saw “join a tour” on the sign. What does it mean?\nB: It means “투어에 참가하다.”", "A: Can I use “join a tour” here?\nB: Yes, that's a useful travel expression."], "similar": "—", "note": "join a tour는 단어를 따로 떼기보다 한 덩어리 표현으로 외우는 게 자연스럽습니다. 실제 여행에서는 통째로 말하는 경우가 많습니다.", "ko_dialogue": "A: 오늘 투어에 참가할 수 있나요?\nB: 네.", "dialogue_pairs": [{"en": "A: Can I join the tour today?\nB: Yes.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 오늘 투어에 참가할 수 있나요?\nB: 네.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: Excuse me, could you help me with join a tour?\nB: Sure. What are you looking for?\nA: I'm trying to plan my trip and need some information about 투어에 참가하다.\nB: No problem. I can help with that.", "ko": "A: 실례합니다. 투어에 참가하다에 대해 도와주실 수 있나요?\nB: 네. 무엇을 찾고 계세요?\nA: 여행 계획을 세우는 중이라 투어에 참가하다에 대한 정보가 필요해요.\nB: 괜찮습니다. 도와드릴게요."}]}, {"day": 12, "num": 29, "word": "ATM", "meaning": "현금자동입출금기", "hint": "카드로 현금 찾는 기계", "mnemonic": "[익숙한 표현 연상] ATM = 현금 뽑는 기계 그대로.\n→ ATM = 현금자동입출금기", "dialogue": "A: Is there an ATM nearby?\nB: Yes, in the lobby.", "caution": "ATM = 현금자동입출금기.", "dialogues": ["A: Is there an ATM nearby?\nB: Yes, in the lobby.", "A: I saw “ATM” on the sign. What does it mean?\nB: It means “현금자동입출금기.”", "A: Can I use “ATM” here?\nB: Yes, that's a useful travel expression."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "A: 근처에 ATM이 있나요?\nB: 네, 로비에 있어요.", "dialogue_pairs": [{"en": "A: Is there an ATM nearby?\nB: Yes, in the lobby.\nA: Great, thank you for your help.\nB: You're welcome.", "ko": "A: 근처에 ATM이 있나요?\nB: 네, 로비에 있어요.\nA: 좋아요. 도와주셔서 감사합니다.\nB: 천만에요."}, {"en": "A: Excuse me, where can I find an ATM?\nB: Go straight and turn right at the end of the hall.\nA: Is it far from here?\nB: No, it's only a few minutes away.", "ko": "A: 실례합니다. 현금자동입출금기은/는 fy는 신분·정보가 진짜인지 검증하는 느낌이 더 강합니다.", "ko_dialogue": "A: 제 예약을 확인하고 싶어요.\nB: 성함을 알려주시겠어요?", "dialogue_pairs": [{"en": "A: I'd like to confirm my reservation for tonight.\nB: Sure. May I have your name, please?\nA: It's Kim, Sungwoo.\nB: Yes, I found it. Your room is confirmed.", "ko": "A: 오늘 밤 예약을 확인하고 싶어요.\nB: 네. 성함을 알려주시겠어요?\nA: 김성우입니다.\nB: 네, 확인됐습니다. 객실 예약이 확정되어 있습니다."}, {"en": "A: Could you confirm the departure time for me?\nB: Yes. The train leaves at 7:40 p.m.\nA: And which platform does it leave from?\nB: Platform 6.", "ko": "A: 출발 시간을 확인해주실 수 있나요?\nB: 네. 기차는 오후 7시 40분에 출발합니다.\nA: 그리고 몇 번 승강장에서 출발하나요?\nB: 6번 승강장입니다."}]}, {"day": 12, "num": 32, "word": "entrance", "meaning": "입구", "hint": "exit의 반대", "mnemonic": "[구조/상황 연상] enter(들어가다) 계열 → 들어가는 곳 = 입구.\n→ entrance = 입구", "dialogue": "A: Where is the entrance?\nB: On the left.", "caution": "entrance = 입구. exit = 출구.", "dialogues": ["A: Where is the entrance?\nB: On the left.", "A: I saw “entrance” on the sign. What does it mean?\nB: It means “입구.”", "A: Can I use “entrance” here?\nB: Yes, that's a useful travel expression."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "이 표현은 여행에서 ‘입구’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, where can I find the entrance?\nB: Go straight and turn right at the end of the hall.\nA: Is it far from here?\nB: No, it's only a few minutes away.", "ko": "A: 실례합니다. 입구은/는 어디에서 찾을 수 있나요?\nB: 곧장 가셔서 복도 끝에서 오른쪽으로 도세요.\nA: 여기서 먼가요?\nB: 아니요, 몇 분 거리밖에 안 됩니다."}, {"en": "A: Is the entrance close to here?\nB: Yes, it's just around the corner.\nA: Can I walk there?\nB: Yes, it'll take less than five minutes.", "ko": "A: 입구이/가 여기서 가까운가요?\nB: 네, 바로 모퉁이를 돌면 있어요.\nA: 걸어서 갈 수 있나요?\nB: 네, 5분도 안 걸립니다."}]}, {"day": 12, "num": 33, "word": "last", "meaning": "마지막의, 지난, 지속되다", "hint": "last train, last night처럼 묶기", "mnemonic": "[장면 연상] 여행 중 실제 표지판·예약화면·메뉴에서 **last**가 크게 적힌 장면을 떠올린다.\n그 단어를 ‘마지막의, 지난, 지속되다’ 장면과 한 번 와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "이 표현은 여행에서 ‘유지하다, 보관하다’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, can you help me with this?\nB: Sure. What do you need?\nA: I need to use 'keep' in this situation.\nB: No problem. Let's take care of it.", "ko": "A: 실례합니다. 이것 좀 도와주실 수 있나요?\nB: 네. 무엇이 필요하세요?\nA: 이 상황에서 ‘유지하다, 보관하다’이 필요해요.\nB: 괜찮습니다. 처리해드릴게요."}, {"en": "A: Could you help me with keep?\nB: Sure. Tell me what you need.\nA: I want to make sure about 유지하다, 보관하다.\nB: Of course. I'll help you with that.", "ko": "A: 유지하다, 보관하다와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요한지 말씀해주세요.\nA: 유지하다, 보관하다 부분을 확실히 확인하고 싶어요.\nB: 물론이죠. 도와드릴게요."}]}, {"day": 13, "num": 4, "word": "rent", "meaning": "빌리다, 임대하다", "hint": "rent a car", "mnemonic": "[장면 연상] 여행 중 실제 표지판·예약화면·메뉴에서 **rent**가 크게 적힌 장면을 떠올린다.\n그 단어를 ‘빌리다, 임대하다’ 장면과 한 번에 묶어 기억한다.\n→ rent = 빌리다, 임대하다", "dialogue": "A: I'd like to rent a car.\nB: For how many days?", "caution": "rent = 돈을 내고 빌리다. borrow와 구분.", "dialogues": ["A: I'd like to rent a car.\nB: For how many days?", "A: I saw “rent” at the hotel or store. What does it mean?\nB: It means “빌리다.”", "A: Could you help me with “rent”?\nB: Of course."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "이 표현은 여행에서 ‘빌리다, 임대하다’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, I have a question about rent.\nB: Sure. What would you like to know?\nA: I want to make sure about the 빌리다, 임대하다 before I pay.\nB: Of course. Let me explain it for you.", "ko": "A: 실례합니다. 빌리다, 임대하다에 대해 질문이 있어요.\nB: 네. 무엇이 궁금하세요?\nA: 결제하기 전에 빌리다, 임대하다 부분을 확실히 확인하고 싶어요.\nB: 물론입니다. 설명해드릴게요."}, {"en": "A: Could you help me with rent?\nB: Sure. Tell me what you need.\nA: I want to make sure about 빌리다, 임대하다.\nB: Of course. I'll help you with that.", "ko": "A: 빌리다, 임대하다와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요한지 말씀해주세요.\nA: 빌리다, 임대하다 부분을 확실히 확인하고 싶어요.\nB: 물론이죠. 도와드릴게요."}]}, {"day": 13, "num": 5, "word": "rate 려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, I have a question about get to.\nB: Sure. What would you like to know?\nA: I just want to make sure I understand the get to information correctly.\nB: No problem. Let me check it for you.", "ko": "A: 실례합니다. 도착하다, ~에 이르다에 대해 질문이 있어요.\nB: 네. 무엇을 알고 싶으세요?\nA: 도착하다, ~에 이르다 정보를 제가 제대로 이해했는지 확인하고 싶어요.\nB: 네. 제가 확인해드릴게요."}, {"en": "A: Could you help me with get to?\nB: Sure. Tell me what you need.\nA: I want to make sure about 도착하다, ~에 이르다.\nB: Of course. I'll help you with that.", "ko": "A: 도착하다, ~에 이르다와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요한지 말씀해주세요.\nA: 도착하다, ~에 이르다 부분을 확실히 확인하고 싶어요.\nB: 물론이죠. 도와드릴게요."}]}, {"day": 13, "num": 7, "word": "come with", "meaning": "함께 오다, 포함되다", "hint": "Does it come with breakfast?", "mnemonic": "[장면 연상] 여행 중 실제 표지판·예약화면·메뉴에서 **come with**가 크게 적힌 장면을 떠올린다.\n그 단어를 ‘함께 오다, 포함되다’ 장면과 한 번에 묶어 기억한다.\n→ come with = 함께 오다, 포함되다", "dialogue": "A: Does the room come with breakfast?\nB: Yes.", "caution": "come with = 함께 포함되다.", "dialogues": ["A: Does the room come with breakfast?\nB: Yes.", "A: I saw “come with” at the hotel or store. What does it mean?\nB: It means “함께 오다.”", "A: Could you help me with “come with”?\nB: Of course."], "similar": "—", "note": "come with는 단어를 따로 떼기보다 한 덩어리 표현으로 외우는 게 자연스럽습니다. 실제 여행에서는 통째로 말하는 경우가 많습니다.", "ko_dialogue": "이 표현은 여행에서 ‘함께 오다, 포함되다’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, can you help me with this?\nB: Sure. What do you need?\nA: I need to use 'come with' in this situation.\nB: No problem. Let's take care of it.", "ko": "A: 실례합니다. 이것 좀 도와주실 수 있나요?\nB: 네. 무엇이 필요하세요?\nA: 이 상황에서 ‘함께 오다, 포함되다’이 필요해요.\nB: 괜찮습니다. 처리해드릴게요."}, {"en": "A: Could you help me with come with?\nB: Sure. Tell me what you need.\nA: I want to make sure about 함께 오다, 포함되다.\nB: Of course. I'll help you with that.", "ko": "A: 함께 오다, 포함되다와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요한지 말씀해주세요.\nA: 함께 오다, 포함되다 부분을 확실히 확인하고 싶어요.\nB: 물론이죠. 도와드릴게요."}]}, {"day": 13, "num": 8, "word": "driver's license", "meaning": "운전면허증", "hint": "렌터카에서 필수", "mnemonic": "[구조 연상] driver(운전자) + license(면허)\n→ driver's license = 운전면허증.", "dialogue": "A: May I see your driver's license?\nB: Here it is.", "caution": "운전면허증.", "dialogues": ["A: May I see your driver's license?\nB: Here it is.", "A: I saw “driver's license” at the hotel or store. What does it mean?\nB: It means “운전면허증.”", "A: Could you help me with “driver's license”?\nB: Of course."], "similar": "—", "note": "미국식 driver's license, 영국식 driving licence 철자가 다릅니다.", "ko_dialogue": "이 표현은 여행에서 ‘운전면허증’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, do I need my driver's license for this?\nB: Yes, please keep your driver's license with you.\nA: Okay. Should I show it now?\nB: Yes, please.", "ko": "A: 실례합니다. 이걸 하려면 운전면허증이/가 필요한가요?\nB: 네, 운전면허증은/는 가지고 계세요.\nA: 알겠습니다. 지금 보여드리면 되나요?\nB: 네, 부탁드립니다."}, {"en": "A: I can't find my driver's license.\nB: When did you last have it?\nA: I had it a few minutes ago.\nB: Let's check the counter first.", "ko": "A: 제 운전면허증을/를 찾을 수가 없어요.\nB: 마지막으로 언제 가지고 계셨나요?\nA: 몇 분 전까지 있었어요.\nB: 우선 카운터부터 확인해봅시다."}]}, {"day": 13, "num": 9, "word": "include", "meaning": "포함하다", "hint": "Does the price include tax?", "mnemonic": "[구조/상황 연상] in(안에) + ‘넣어둔다’ 이미지 → 안에 포함하다.\n→ include = 포함하다", "dialogue": "A: Does the price include tax?\nB: Yes.", "caution": "include = 포함하다.", "dialogues": ["A: Does the price include tax?\nB: Yes.", "A: I saw “include” at the hotel or store. What does it mean?\nB: It means “포함하다.”", "A: Could you help me with “include”?\nB: Of course."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "이 표현은 여행에서 ‘포함하다’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, I have a question about include.\nB: Sure. What would you like to know?\nA: I want to make sure about the 포함하다 before I pay.\nB: Of course. Let me explain it for you.  필요하세요?\nA: 이 상황에서 ‘예정보다 빠른’이 필요해요.\nB: 괜찮습니다. 처리해드릴게요."}, {"en": "A: Could you help me with ahead of schedule?\nB: Sure. Tell me what you need.\nA: I want to make sure about 예정보다 빠른.\nB: Of course. I'll help you with that.", "ko": "A: 예정보다 빠른와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요한지 말씀해주세요.\nA: 예정보다 빠른 부분을 확실히 확인하고 싶어요.\nB: 물론이죠. 도와드릴게요."}]}, {"day": 13, "num": 18, "word": "available", "meaning": "이용 가능한, 남아 있는", "hint": "Is it available?", "mnemonic": "[구조 연상] avail(쓸 수 있다·도움이 되다) + able(~할 수 있는)\n즉 ‘쓸 수 있는 상태’.\n→ available = 이용 가능한 / 시간이 되는 / 구할 수 있는.", "dialogue": "A: Is this room available tonight?\nB: Yes.", "caution": "available = 이용 가능/남아 있음.", "dialogues": ["A: Is this room available tonight?\nB: Yes.", "A: Is a double room available?\nB: Yes.", "A: Is this seat available?\nB: Yes, it is."], "similar": "vacant = 비어 있는 / free = 무료인·시간이 비는 / open = 열려 있는 / in stock = 재고가 있는", "note": "available은 방·좌석·상품·사람의 시간까지 넓게 씁니다. vacant는 주로 방·좌석처럼 ‘비어 있음’에 가깝습니다.", "ko_dialogue": "A: 오늘 밤 이용 가능한 방이 있나요?\nB: 네, 방이 하나 있습니다.", "dialogue_pairs": [{"en": "A: Do you have any rooms available tonight?\nB: Yes, we have one double room left.\nA: How much is it per night?\nB: It's 140 dollars, including breakfast.", "ko": "A: 오늘 밤 이용 가능한 방이 있나요?\nB: 네, 더블룸 한 개 남아 있습니다.\nA: 1박에 얼마인가요?\nB: 조식 포함 140달러입니다."}, {"en": "A: Are there any aisle seats available?\nB: Let me check. Yes, there are two left.\nA: Great. Could I have one of them?\nB: Of course.", "ko": "A: 이용 가능한 통로 좌석이 있나요?\nB: 확인해볼게요. 네, 두 자리 남아 있습니다.\nA: 좋아요. 그중 한 자리로 받을 수 있을까요?\nB: 물론입니다."}]}, {"day": 13, "num": 19, "word": "request", "meaning": "요청하다, 요청", "hint": "special request", "mnemonic": "[장면 연상] 여행 중 실제 표지판·예약화면·메뉴에서 **request**가 크게 적힌 장면을 떠올린다.\n그 단어를 ‘요청하다, 요청’ 장면과 한 번에 묶어 기억한다.\n→ request = 요청하다, 요청", "dialogue": "A: Can I make a special request?\nB: Sure.", "caution": "request = 요청. ask보다 공식적.", "dialogues": ["A: Can I make a special request?\nB: Sure.", "A: I saw “request” at the hotel or store. What does it mean?\n  도와주실 수 있나요?\nB: 네. 무엇이 필요한지 말씀해주세요.\nA: 가능하다면 부분을 확실히 확인하고 싶어요.\nB: 물론이죠. 도와드릴게요."}]}, {"day": 13, "num": 21, "word": "run out of", "meaning": "~이 떨어지다", "hint": "run out of cash", "mnemonic": "[이미지 연상] 안에 있던 것이 밖으로 다 빠져나가(run out) 없어짐.\n→ run out of = ~이 떨어지다.", "dialogue": "A: We ran out of water.\nB: I'll get more.", "caution": "run out of = ~이 떨어지다.", "dialogues": ["A: We ran out of water.\nB: I'll get more.", "A: I saw “run out of” at the hotel or store. What does it mean?\nB: It means “~이 떨어지다.”", "A: Could you help me with “run out of”?\nB: Of course."], "similar": "—", "note": "run out of water = 물이 떨어지다. 사람이 다 떨어지는 게 아니라 ‘재고가 없어짐’.", "ko_dialogue": "이 표현은 여행에서 ‘~이 떨어지다’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, could you help me with run out of?\nB: Certainly. What do you need?\nA: I'd like to ask about ~이 떨어지다.\nB: Of course. I'll see what I can do.", "ko": "A: 실례합니다. ~이 떨어지다와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요하세요?\nA: ~이 떨어지다에 대해 문의하고 싶어요.\nB: 물론입니다. 가능한지 확인해볼게요."}, {"en": "A: Could you help me with run out of?\nB: Sure. Tell me what you need.\nA: I want to make sure about ~이 떨어지다.\nB: Of course. I'll help you with that.", "ko": "A: ~이 떨어지다와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요한지 말씀해주세요.\nA: ~이 떨어지다 부분을 확실히 확인하고 싶어요.\nB: 물론이죠. 도와드릴게요."}]}, {"day": 13, "num": 22, "word": "work", "meaning": "일하다, 작동하다", "hint": "The card doesn't work", "mnemonic": "[장면 연상] 여행 중 실제 표지판·예약화면·메뉴에서 **work**가 크게 적힌 장면을 떠올린다.\n그 단어를 ‘일하다, 작동하다’ 장면과 한 번에 묶어 기억한다.\n→ work = 일하다, 작동하다", "dialogue": "A: My card doesn't work.\nB: Try another card.", "caution": "work = 일하다 / 작동하다.", "dialogues": ["A: My card doesn't work.\nB: Try another card.", "A: I saw “work” at the hotel or store. What does it mean?\nB: It means “일하다.”", "A: Could you help me with “work”?\nB: Of course."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "이 표현은 여행에서 ‘일하다, 작동하다’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, could you help me with work?\nB: Certainly. What do you need?\nA: I'd like to ask about 일하다, 작동하다.\nB: Of course. I'll see what I can do.", "ko": "A: 실례합니다. 일하다, 작동하다와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요하세요?\nA: 일하다, 작동하다에 대해 문의하고 싶어요.\nB: 물론입니다. 가능한지 확인해볼게요."}, {"en": "A: Could you help me with work?\nB: Sure. Tell me what you need.\nA: I want to make sure about 일하다, 작동하다.\nB: Of course. I'll help you with that.", "ko": "A: 일하다, 작동하다와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요한지 말씀해주세요.\nA: 일하다, 작동하다 부분을 확실히 확인하고 싶어요.\nB: 물론이죠. 도와드릴게요."}]}, {"day": 13, "num": 23, "word": "front desk", "meaning": "프런트 데스크", "hint": "호텔 리셉션", "mnemonic": "[구조 연상] front(앞) + desk(데스크)\n호텔 앞쪽 안내 데스크.\n→ front desk = 프런트 데스크.", "dialogue": "A: Please call the front desk.\nB: Okay.", "caution": "호텔 프런트/접수대.", "dialogues": ["A: Please call the front desk.\nB: Okay.", "A: I saw “front desk” at the hotel or store. What does it mean?\nB: It means “프런트 데스크.”", "A: Could you help me with “front desk”?\nB: Of course."], "similar": "—", "note": "호텔에서는 front desk가 자연스럽고, reception/reception desk도 자주 씁니다.", "ko_dialogue": "이 표현은 여행에서 ‘프런트 데스크’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, where can I find the front desk?\nB: Go straight and turn right at the end of the hall.\nA: Is it far from here?\nB: No, it's only a few minutes away.", "ko": "A: 실례합니다. 프런트 데스크은/는 어디에서 찾을 수 있나요?\nB: 곧장 가셔서 복도 끝에서 오른쪽으로 도세요.\nA: 여기서 먼가요?\nB: 아니요, 몇 분 거리밖에 안 됩니다."}, {"en": "A: Is the front desk close to here?\nB: Yes, it's just around the corner.\nA: Can I walk there?\nB: Yes, it'll take less than five minutes.", "ko": "A: 프런트 데스크이/가 여기서 가까운가요?\nB: 네, 바로 모퉁이를 돌면 있어요.\nA: 걸어서 갈 수 있나요?\nB: 네, 5분도 안 걸립니다."}]}, {"day": 13, "num": 24, "word": "ID", "meaning": "신분증", "hint": "여권도 일종의 ID", "mnemonic": "[장면 연상] 여행 중 실제 표지판·예약화면·메뉴에서 **ID**가 크게 적힌 장면을 떠올린다.\n그 단어를 ‘신분증’ 장면과 한 번에 묶어 기억한다.\n→ ID = 신분증", "dialogue": "A: Do I need to show ID?\nB: Yes.", "caution": "ID = 신분증.", "dialogues": ["A: Do I need to show ID?\nB: Yes.", "A: I saw “ID” at the hotel or store. What does it mean?\nB: It means “신분증.”", "A: Could you help me with “ID”?\nB: Of course."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "이 표현은 여행에서 ‘신분증’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, do I need my ID for this?\nB: Yes, please keep your ID with you.\nA: Okay. Should I show it now?\nB: Yes, please.", "ko": "A: 실례합니다. 이걸 하려면 신분증이/가 필요한가요?\nB: 네, 신분증은/는 가지고 계세요.\nA: 알겠습니다. 지금 보여드리면 되나요?\nB: 네, 부탁드립니다."}, {"en": "A: I can't find my ID.\nB: When did you last have it?\nA: I had it a few minutes ago.\nB: Let's check the counter first.", "ko": "A: 제 신분증을/를 찾을 수가 없어요.\nB: 마지막으로 언제 가지고 계셨나요?\nA: 몇 분 전까지 있었어요.\nB: 우선 카운터부터 확인해봅시다."}]}, {"day": 13, "num": 25, "word": "smoking", "meaning": "흡연", "hint": "smoking area = 흡연구역", "mnemonic": "[구조/상황 연상] smoke(담배 피우다) + -ing → 흡연.\n→ smoking = 흡연", "dialogue": "A: Is this a smoking room?\nB: No, non-smoking.", "caution": "smoking / non-smoking 세트.", "dialogues": ["A: Is this a smoking room?\nB: No, non-smoking.", "A: I saw “smoking” at the hotel or store. What does it mean?\nB: It means “흡연.”", "A: Could you help me with “smoking”?\nB: Of course."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "이 표현은 여행에서 ‘흡연’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, could you help me with smoking?\nB: Certainly. What do you need?\nA: I'd like to ask about 흡연.\nB: Of course. I'll see what I can do.", "ko": "A: 실례합니다. 흡연와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요하세요?\nA: 흡연에 대해 문의하고 싶어요.\nB: 물론입니다. 가능한지 확인해볼게요."}, {"en": "A: Could you help me with smoking?\nB: Sure. Tell me what you need.\nA: I want to make sure about 흡연.\nB: Of course. I'll help you with that.", "ko": "A: 흡연와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요한지 말씀해주세요.\nA: 흡연 부분을 확실히 확인하고 싶어요.\nB: 물론이죠. 도와드릴게요."}]}, {"day": 13, "num": 26, "word": "upgrade", "meaning": "업그레이드하다, 상향 조정", "hint": "좌석 업그레이드", "mnemonic": "[익숙한 표현 연상] 업그레이드 = 등급을 올림.\n→ upgrade = 업그레이드하다, 상향 조정", "dialogue": "A: Can I upgrade my room?\nB: Yes, for an extra charge.", "caution": "upgrade = 상향 변경.", "dialogues": ["A: Can I upgrade my room?\nB: Yes, for an extra charge.", "A: I saw “upgrade” at the hotel or store. What does it mean?\nB: It means “업그레이드하다.”", "A: Could you help me with “upgrade”?\nB: Of course."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "이 표현은 여행에서 ‘업그레이드하다, 상향 조정’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, I have a question about upgrade.\nB: Sure. What would you like to know?\nA: I want to make sure about the 업그레이드하다, 상향 조정 before I pay.\nB: Of course. Let me explain it for you.", "ko": "A: 실례합니다. 업그레이드하다, 상향 조정에 대해 질문이 있어요.\nB: 네. 무엇이 궁금하세요?\nA: 결제하기 전에 업그레이드하다, 상향 조정 부분을 확실히 확인하고 싶어요.\nB: 물론입니다. 설명해드릴게요."}, {"en": "A: Could you help me with upgrade?\nB: Sure. Tell me what you need.\nA: I want to make sure about 업그레이드하다, 상향 조정.\nB: Of course. I'll help you with that.", "ko": "A: 업그레이드하다, 상향 조정와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요한지 말씀해주세요.\nA: 업그레이드하다, 상향 조정 부분을 확실히 확인하고 싶어요.\nB: 물론이죠. 도와드릴게요."}]}, {"day": 13, "num": 27, "word": "business center", "meaning": "비즈니스 센터", "hint": "호텔 부대시설", "mnemonic": "[익숙한 표현 연상] 호텔 BUSINESS CENTER = 업무용 컴퓨터·프린터 있는 공간.\n→ business center = 비즈니스 센터", "dialogue": "A: Is there a business center?\nB: Yes, on the first floor.", "caution": "호텔 업무용 공간.", "dialogues": ["A: Is there a business center?\nB: Yes, on the first floor.", "A: I saw “business center” at the hotel or store. What does it mean?\nB: It means “비즈니스 센터.”", "A: Could you help me with “business center”?\nB: Of course."], "similar": "—", "note": "business center는 단어를 따로 떼기보다 한 덩어리 표현으로 외우는 게 자연스럽습니다. 실제 여행에서는 통째로 말하는 경우가 많습니다.", "ko_dialogue": "이 표현은 여행에서 ‘비즈니스 센터’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, where can I find the business center?\nB: Go straight and turn right at the end of the hall.\nA: Is it far from here?\nB: No, it's only a few minutes away.", "ko": "A: 실례합니다. 비즈니스 센터은/는 어디에서 찾을 수 있나요?\nB: 곧장 가셔서 복도 끝에서 오른쪽으로 도세요.\nA: 여기서 먼가요?\nB: 아니요, 몇 분 거리밖에 안 됩니다."}, {"en": "A: Is the business center close to here?\nB: Yes, it's just around the corner.\nA: Can I walk there?\nB: Yes, it'll take less than five minutes.", "ko": "A: 비즈니스 센터이/가 여기서 가까운가요?\nB: 네, 바로 모퉁이를 돌면 있어요.\nA: 걸어서 갈 수 있나요?\nB: 네, 5분도 안 걸립니다."}]}, {"day": 13, "num": 28, "word": "complimentary", "meaning": "무료 제공의", "hint": "complimentary breakfast", "mnemonic": "[발음 연상] “컵 플리즈! 맨, 더 드리!”\n호텔에서 컵을 달라고 하자 직원이 “더 드릴게요. 이건 서비스예요.” 하며 무료로 준다.\n→ complimentary = 무료 제공의.", "dialogue": "A: Is breakfast complimentary?\nB: Yes, it's free.", "caution": "complimentary = 무료 제공의. complementary와 철자 주의.", "dialogues": ["A: Is breakfast complimentary?\nB: Yes, it's free.", "A: Is breakfast complimentary?\nB: Yes.", "A: Is the water complimentary?\nB: The first two bottles are."], "similar": "free = 무료 / included = 포함된 / on the house = 가게 서비스로 무료", "note": "호텔·항공에서는 complimentary가 ‘무료 제공’이라는 뜻으로 아주 흔합니다. compliment(칭찬)와 철자가 비슷하지만 뜻은 다릅니다.", "ko_dialogue": "A: 조식은 무료로 제공되나요?\nB: 네, 숙박에 포함되어 있습니다.", "dialogue_pairs": [{"en": "A: Is breakfast complimentary with the room?\nB: Yes, it's included for all hotel guests.\nA: What time does breakfast start?\nB: It starts at seven.", "ko": "A: 객실에 조식이 무료로 제공되나요?\nB: 네, 모든 투숙객에게 포함되어 있습니다.\nA: 조식은 몇 시에 시작하나요?\nB: 7시에 시작합니다."}, {"en": "A: Are these bottles of water complimentary?\nB: Yes, the two bottles on the desk are free.\nA: Great. Can I ask for more later?\nB: Yes, just call the front desk.", "ko": "A: 이 생수들은 무료 제공인가요?\nB: 네, 책상 위의 두 병은 무료입니다.\nA: 좋아요. 나중에 더 요청해도 되나요?\nB: 네, 프런트 데스크로 전화하시면 됩니다."}]}, {"day": 13, "num": 29, "word": "serve", "meaning": "제공하다, 서빙하다", "hint": "아침을 serve하다", "mnemonic": "[장면 연상] 여행 중 실제 표지판·예약화면·메뉴에서 **serve**가 크게 적힌 장면을 떠올린다.\n그 단어를 ‘제공하다, 서빙하다’ 장면과 한 번에 묶어 기억한다.\n→ serve = 제공하다, 서빙하다", "dialogue": "A: What time do you serve breakfast?\nB: From 7 to 10.", "caution": "serve = 제공/서빙하다.", "dialogues": ["A: What time do you serve breakfast?\nB: From 7 to 10.", "A: I saw “serve” at the hotel or store. What does it mean?\nB: It means “제공하다.”", "A: Could you help me with “serve”?\nB: Of course."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "이 표현은 여행에서 ‘제공하다, 서빙하다’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, could you help me with serve?\nB: Certainly. What do you need?\nA: I'd like to ask about 제공하다, 서빙하다.\nB: Of course. I'll see what I can do.", "ko": "A: 실례합니다. 제공하다, 서빙하다와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요하세요?\nA: 제공하다, 서빙하다에 대해 문의하고 싶어요.\nB: 물론입니다. 가능한지 확인해볼게요."}, {"en": "A: Could you help me with serve?\nB: Sure. Tell me what you need.\nA: I want to make sure about 제공하다, 서빙하다.\nB: Of course. I'll help you with that.", "ko": "A: 제공하다, 서빙하다와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요한지 말씀해주세요.\nA: 제공하다, 서빙하다 부분을 확실히 확인하고 싶어요.\nB: 물론이죠. 도와드릴게요."}]}, {"day": 13, "num": 30, "word": "extend", "meaning": "연장하다", "hint": "숙박 기간 연장", "mnemonic": "[구조/상황 연상] ex-(밖으로) + tend(뻗다) → 길게 늘이다 → 연장하다.\n→ extend = 연장하다", "dialogue": "A: Can I extend my stay?\nB: Let me check availability.", "caution": "extend = 연장하다.", "dialogues": ["A: Can I extend my stay?\nB: Let me check availability.", "A: I saw “extend” at the hotel or store. What does it mean?\nB: It means “연장하다.”", "A: Could you help me with “extend”?\nB: Of course."], "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "이 표현은 여행에서 ‘연장하다’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, could you help me with extend?\nB: Certainly. What do you need?\nA: I'd like to ask about 연장하다.\nB: Of course. I'll see what I can do.", "ko": "A: 실례합니다. 연장하다와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요하세요?\nA: 연장하다에 대해 문의하고 싶어요.\nB: 물론입니다. 가능한지 확인해볼게요."}, {"en": "A: Could you help me with extend?\nB: Sure. Tell me what you need.\nA: I want to make sure about 연장하다.\nB: Of course. I'll help you with that.", "ko": "A: 연장하다와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요한지 말씀해주세요.\nA: 연장하다 부분을 확실히 확인하고 싶어요.\nB: 물론이죠. 도와드릴게요."}]}, {"day": 13, "num": 31, "word": "Let me ~.", "meaning": "제가 ~할게요", "hint": "도와드릴 때 쓰는 표현", "mnemonic": "[장면 연상] 여행 중 실제 표지판·예약화면·메뉴에서 **Let me ~.**가 크게 적힌 장면을 떠올린다.\n그 단어를 ‘제가 ~할게요’ 장면과 한 번에 묶어 기억한다.\n→ Let me ~. = 제가 ~할게요", "dialogue": "A: I can't find my room.\nB: Let me show you.", "caution": "Let me + 동사 = 제가 ~할게요.", "dialogues": ["A: I can't find my room.\nB: Let me show you.", "A: I saw “Let me ~.” at the hotel or store. What does it mean?\nB: It means “제가 ~할게요.”", "A: Could you help me with “Let me ~.”?\nB: Of course."], "similar": "—", "note": "Let me ~.는 단어를 따로 떼기보다 한 덩어리 표현으로 외우는 게 자연스럽습니다. 실제 여행에서는 통째로 말하는 경우가 많습니다.", "ko_dialogue": "이 표현은 여행에서 ‘제가 ~할게요’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, could you help me with Let me ~.?\nB: Certainly. What do you need?\nA: I'd like to ask about 제가 ~할게요.\nB: Of course. I'll see what I can do.", "ko": "A: 실례합니다. 제가 ~할게요와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요하세요?\nA: 제가 ~할게요에 대해 문의하고 싶어요.\nB: 물론입니다. 가능한지 확인해볼게요."}, {"en": "A: Could you help me with Let me ~.?\nB: Sure. Tell me what you need.\nA: I want to make sure about 제가 ~할게요.\nB: Of course. I'll help you with that.", "ko": "A: 제가 ~할게요와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요한지 말씀해주세요.\nA: 제가 ~할게요 부분을 확실히 확인하고 싶어요.\nB: 물론이죠. 도와드릴게요."}]}, {"day": 13, "num": 32, "word": "deposit", "meaning": "보증금, 입금하다", "hint": "뒤 빠지! 돈이 뒤로 빠져 맡겨짐", "mnemonic": "[익숙한 표현 연상] 디포짓 = 미리 맡겨두는 돈 / 보증금.\n→ deposit = 보증금, 입금하다", "dialogue": "A: Is the deposit refundable?\nB: Yes, after check-out.", "caution": "연상: '뒤 빠지!' 돈이 뒤로 빠져 맡겨짐 → 보증금/입금.", "dialogues": ["A: Is the deposit refundable?\nB: Yes, after check-out.", "A: How much is the depos ok.\nA: I was charged for two drinks, but I only ordered one.\nB: You're right. I'll correct it right away.", "ko": "A: 이 영수증의 총액이 잘못된 것 같아요.\nB: 확인해볼게요.\nA: 음료 두 잔이 청구됐는데 저는 한 잔만 주문했어요.\nB: 맞네요. 바로 수정해드리겠습니다."}]}, {"day": "PAST", "num": 4, "word": "nearby", "meaning": "근처의, 근처에", "hint": "", "mnemonic": "[구조 연상] near(가까운) + by(곁에)\n가까운 곁에 있다.\n→ nearby = 근처의 / 근처에.", "dialogue": "A: Is there a pharmacy nearby?\nB: Yes, around the corner.", "dialogues": ["A: Is there a pharmacy nearby?\nB: Yes, around the corner.", "A: Is there an ATM nearby?\nB: Across the street."], "caution": "실제 여행에서 자주 붙는 표현과 함께 외우세요.", "past": true, "similar": "near = 가까운 / nearby = 근처의·근처에 / nearest = 가장 가까운", "note": "nearby는 형용사/부사로 가능. a nearby hotel = 근처 호텔 / Is there a hotel nearby? = 근처에 호텔 있나요?", "ko_dialogue": "이 표현은 여행에서 ‘근처의, 근처에’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, can you help me with this?\nB: Sure. What do you need?\nA: I need to use 'nearby' in this situation.\nB: No problem. Let's take care of it.", "ko": "A: 실례합니다. 이것 좀 도와주실 수 있나요?\nB: 네. 무엇이 필요하세요?\nA: 이 상황에서 ‘근처의, 근처에’이 필요해요.\nB: 괜찮습니다. 처리해드릴게요."}, {"en": "A: Could you help me with nearby?\nB: Sure. Tell me what you need.\nA: I want to make sure about 근처의, 근처에.\nB: Of course. I'll help you with that.", "ko": "A: 근처의, 근처에와 관련해서 도와주실 수 있나요?\nB: 네. 무엇이 필요한지 말씀해주세요.\nA: 근처의, 근처에 부분을 확실히 확인하고 싶어요.\nB: 물론이죠. 도와드릴게요."}]}, {"day": "PAST", "num": 5, "word": "recommend", "meaning": "추천하다", "hint": "", "mnemonic": "[구조/상황 연상] 직원이 메뉴 하나에 별표를 찍어 권함 → 추천하다.\n→ recommend = 추천하다", "dialogue": "A: What does “recommend” mean here?\nB: It means “추천하다.”", "dialogues": ["A: What does “recommend” mean here?\nB: It means “추천하다.”", "A: Can I use “recommend” while traveling?\nB: Yes, it's useful."], "caution": "실제 여행에서 자주 붙는 표현과 함께 외우세요.", "past": true, "similar": "—", "note": "이 단어는 실제 여행 상황의 표지판·예약화면·직원 대화와 함께 외우면 더 잘 기억됩니다.", "ko_dialogue": "이 표현은 여행에서 ‘추천하다’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 ues": ["A: What does “offer” mean here?\nB: It means “제안하다.”", "A: Can I use “offer” while traveling?\nB: Yes, it's useful."], "caution": "실제 여행에서 자주 붙는 표현과 함께 외우세요.", "past": true, "similar": "suggest = 제안하다 / recommend = 추천하다 / provide = 제공하다 / give = 주다", "note": "offer는 상대에게 먼저 제안·제공하는 느낌. recommend는 ‘이게 더 좋아요’라고 추천하는 느낌입니다.", "ko_dialogue": "A: 무료 업그레이드를 제공해주실 수 있나요?\nB: 가능한지 확인해볼게요.", "dialogue_pairs": [{"en": "A: Do you have any special offers this week?\nB: Yes, breakfast is included if you stay three nights.\nA: That sounds good. Is the offer available online too?\nB: Yes, it is.", "ko": "A: 이번 주에 특별한 혜택이 있나요?\nB: 네, 3박 하시면 조식이 포함됩니다.\nA: 좋네요. 그 혜택은 온라인에서도 이용할 수 있나요?\nB: 네, 가능합니다."}, {"en": "A: The hotel offered us a free room upgrade.\nB: That's nice. Did you take it?\nA: Yes, we got a room with a better view.\nB: That's a great deal.", "ko": "A: 호텔에서 무료 객실 업그레이드를 제안해줬어요.\nB: 좋네요. 받으셨어요?\nA: 네, 전망이 더 좋은 방을 받았어요.\nB: 정말 좋은 혜택이네요."}]}, {"day": "PAST", "num": 110, "word": "baggage storage", "meaning": "수하물 보관", "hint": "", "mnemonic": "[덩어리 연상] baggage(수하물) + storage(보관)\n구성요소 뜻을 한 장면으로 묶어서 외운다.\n→ baggage storage = 수하물 보관", "dialogue": "A: What does “baggage storage” mean here?\nB: It means “수하물 보관.”", "dialogues": ["A: What does “baggage storage” mean here?\nB: It means “수하물 보관.”", "A: Can I use “baggage storage” while traveling?\nB: Yes, it's useful."], "caution": "실제 여행에서 자주 붙는 표현과 함께 외우세요.", "past": true, "similar": "store = 보관하다 / keep = 보관하다 / storage = 보관", "note": "baggage storage는 단어를 따로 떼기보다 한 덩어리 표현으로 외우는 게 자연스럽습니다. 실제 여행에서는 통째로 말하는 경우가 많습니다.", "ko_dialogue": "이 표현은 여행에서 ‘수하물 보관’의 뜻으로 씁니다.\n아래 영어 대화를 먼저 떠올려보고 [영어 보기]로 확인하세요.", "dialogue_pairs": [{"en": "A: Excuse me, where can I find baggage storage?\nB: Go straight and turn right at the end of the hall.\nA: Is it far from here?\nB: No, it's only a few minutes away.", "ko": "A: 실례합니다. 수하물 보관은/는 어디에서 찾을 수 있나요?\nB: 곧장 가셔서 복도 끝에서 오른쪽으로 도세요.\nA: 여기서 먼가요?\nB: 아니요, 몇 분 거리밖에 안 됩니다."}, {"en": "A: Is bagga let localEdits=JSON.parse(localStorage.getItem('localEdits')||'{}');
let customCards=[];

function applyLocalEdit(card){
  const e=localEdits[card.word];
  return e ? {...card, ...e} : card;
}
function saveLocalEdit(word, patch){
  localEdits[word]={...(localEdits[word]||{}), ...patch};
  localStorage.setItem('localEdits', JSON.stringify(localEdits));
}
try{customCards=JSON.parse(localStorage.getItem('travelCustomCards')||'[]')}catch(e){customCards=[]}
let wrongSet=new Set();
try{wrongSet=new Set(JSON.parse(localStorage.getItem('travelWrongWords')||'[]'))}catch(e){}
let hideMeaning=localStorage.getItem('travelHideMeaning')!=='false';
let hideMnemonic=localStorage.getItem('travelHideMnemonic')!=='false';
let bookMode=localStorage.getItem('travelBookMode')==='true';
let shuffled=localStorage.getItem('travelShuffle')==='true';
let wrongOnly=false;
let index=0;
let revealed=false;
let mnemonicRevealed=false;
let englishRevealed=false;
let mode='cards';
let query='';

function allCards(){return [...baseCards,...customCards]}
function activeCards(){
  let a=allCards();
  if(wrongOnly) a=a.filter(c=>wrongSet.has(c.word));
  if(shuffled){
    const seedStr=localStorage.getItem('travelShuffleSeed')||'0.314159';
    let seed=Number(seedStr)||0.314159;
    a=[...a].sort((x,y)=>{
      const hx=Math.sin([...x.word].reduce((s,ch)=>s+ch.charCodeAt(0),0)+seed*10000);
      const hy=Math.sin([...y.word].reduce((s,ch)=>s+ch.charCodeAt(0),0)+seed*10000);
      return hx-hy;
    });
  }
  return a;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function saveState(){
  localStorage.setItem('travelWrongWords',JSON.stringify([...wrongSet]));
  localStorage.setItem('travelHideMeaning',String(hideMeaning));
  localStorage.setItem('travelHideMnemonic',String(hideMnemonic));
  localStorage.setItem('travelBookMode',String(bookMode));
  localStorage.setItem('travelShuffle',String(shuffled));
}
function current(){const a=activeCards();return a.length?a[Math.max(0,Math.min(index,a.length-1))]:null}

function cardContent(c, compact=false){
  const meaningBlock = revealed
    ? `<div class="meaning tap-toggle" onclick="event.stopPropagation();revealed=false;render()">${esc(c.meaning||'')}</div>`
    : `<div class="meaning tap-toggle blurred" onclick="event.stopPropagation();revealed=true;render()">${esc(c.meaning||'')}</div>`;

  const mnemonicBlock = mnemonicRevealed
    ? `<div class="box tap-toggle" onclick="event.stopPropagation();mnemonicRevealed=false;render()">${esc(c.mnemonic||'')}</div>`
    : `<div class="box tap-toggle blurred" onclick="event.stopPropagation();mnemonicRevealed=true;render()">${esc(c.mnemonic||'')}</div>`;

  const sim = esc(c.similar||'');
  const note = esc(c.note||c.caution||'');
  const pairs = Array.isArray(c.dialogue_pairs) ? c.dialogue_pairs : [];

  const dialogueHtml = pairs.map((p,i)=>{
    const enLines=(p.en||'').split('\n');
    const koLines=(p.ko||'').split('\n');
    const rows=enLines.map((line,j)=>`
      <div class="dialogue-line-pair">
        <div class="dialogue tap-toggle blurred english-line"
             onclick="event.stopPropagation();this.classList.toggle('blurred')">${esc(line)}</div>
        <div class="ko-line">→ ${esc(koLines[j]||'')}</div>
      </div>
    `).join('');

    return `
      <div class="dialogue-example">
        <div class="lab" style="margin-top:${i?18:8}px">예시 ${i+1}</div>
        ${rows}
      </div>
    `;
  }).join('');

  return `
    <div class="day">${c.custom?'내가 추가한 단어':`DAY ${esc(c.day)} · ${String(c.num||'').padStart(2,'0')}`}</div>
    <div class="word">${esc(c.word)}</div>

    ${meaningBlock}

    <div class="sec">
      <div class="lab">🧠 발음연상 · 눌러서 보기 / 다시 누르면 가리기</div>
      ${mnemonicBlock}
    </div>

    <div class="sec">
      <div class="lab">💬 실생활 대화 · 영어 문장을 눌러서 보기 / 다시 누르면 가리기</div>
      ${dialogueHtml}
    </div>

    <div class="sec">
      <div class="lab">🔁 비슷한 표현</div>
      <div class="note">${sim||'—'}</div>
    </div>

    <div class="sec">
      <div class="lab">⚠️ 주의 / 같이 기억하기</div>
      <div class="note">${note||'—'}</div>
    </div>

    <div class="swipe-hint">← 화면을 좌우로 밀어서 이전 / 다음 단어 →</div>
  `;
}
function renderCards(){
  const a=activeCards(), c=current(), main=document.getElementById('main');
  if(!c){
    main.innerHTML=`<div class="wrongPanel"><div class="panelTitle">오답 카드가 없습니다</div><div class="empty">❌를 눌러 틀린 단어를 체크하면 여기에 모입니다.</div></div>`;
    document.getElementById('pt').textContent='0 / 0';
    document.getElementById('bar').style.width='0%';
    return;
  }
  const wrong=wrongSet.has(c.word);
  main.innerHTML=`<div class="card">${cardContent(c)}
    <div class="actionrow">
      <button class="action wrong ${wrong?'on':''}" onclick="event.stopPropagation();toggleWrong()">❌ ${wrong?'오답 해제':'오답 체크'}</button>
    </div>
  </div>`;
  document.getElementById('pt').textContent=`${wrongOnly?'오답 · ':''}${index+1} / ${a.length}`;
  document.getElementById('bar').style.width=((index+1)/a.length*100)+'%';
}
function renderSearch(){
  const main=document.getElementById('main');
  const q=query.trim().toLowerCase();
  const res=q?allCards().filter(c=>(c.word+' '+c.meaning+' '+(c.mnemonic||'')).toLowerCase().includes(q)).slice(0,100):[];
  main.innerHTML=`<div class="searchPanel">
    <div class="panelTitle">🔍 단어 검색</div>
    <input id="searchInput" class="input" placeholder="영어 또는 뜻을 검색하세요" value="${esc(query)}">
    <div id="results">${q?(res.length?res.map(c=>`<div class="result" data-word="${esc(c.word)}"><b>${esc(c.word)}</b><div class="small">${esc(c.meaning)}</div></div>`).join(''):`<div class="empty">검색 결과가 없습니다.</div>`):`<div class="empty">예: deposit, 보증금, 환불, 관광...</div>`}</div>
  </div>`;
  const inp=document.getElementById('searchInput');inp.focus();
  inp.addEventListener('input',e=>{query=e.target.value;renderSearch()});
  document.querySelectorAll('.result').forEach(el=>el.addEventListener('click',()=>jumpToWord(el.dataset.word)));
  document.getElementById('pt').textContent='검색';document.getElementById('bar').style.width='0%';
}
function renderAdd(){
  const main=document.getElementById('main');
  main.innerHTML=`<div class="addPanel">
    <div class="panelTitle">＋ 내 단어 추가</div>
    <div class="formgrid">
      <input id="aw" class="input" placeholder="영단어 / 표현 (예: refund)">
      <input id="am" class="input" placeholder="뜻 (예: 환불하다 / 환불)">
      <textarea id="amn" class="input" placeholder="발음연상 (예: 리펀드! 돈을 다시 fund 해준다 → 환불)"></textarea>
      <textarea id="ad1" class="input" placeholder="실생활 대화 1&#10;A: ...&#10;B: ..."></textarea>
      <textarea id="ad2" class="input" placeholder="실생활 대화 2 (선택)"></textarea>
      <textarea id="ad3" class="input" placeholder="실생활 대화 3 (선택)"></textarea>
      <textarea id="ac" class="input" placeholder="비슷한 표현 / 주의점"></textarea>
      <button class="primary" id="saveWord">저장하고 카드에 추가</button>
      <button class="secondary" id="backCards">카드로 돌아가기</button>
    </div>
    <div class="sec"><div class="lab">현재 내가 추가한 단어: ${customCards.length}개</div>
      ${customCards.length?customCards.map((c,i)=>`<div class="result"><b>${esc(c.word)}</b><div class="small">${esc(c.meaning)}</div><button class="secondary" style="margin-top:7px;padding:7px 10px" onclick="deleteCustom(${i})">삭제</button></div>`).join(''):`<div class="empty">아직 추가한 단어가 없습니다.</div>`}
    </div>
  </div>`;
  document.getElementById('saveWord').onclick=saveCustom;
  document.getElementById('backCards').onclick=()=>{mode='cards';render()};
  document.getElementById('pt').textContent='단어 추가';document.getElementById('bar').style.width='0%';
}
function saveCustom(){
  const word=document.getElementById('aw').value.trim(), meaning=document.getElementById('am').value.trim();
  if(!word||!meaning){alert('단어와 뜻은 꼭 입력해주세요.');return}
  const ds=['ad1','ad2','ad3'].map(id=>document.getElementById(id).value.trim()).filter(Boolean);
  const c={word,meaning,mnemonic:document.getElementById('amn').value.trim(),dialogues:ds,caution:document.getElementById('ac').value.trim(),custom:true,day:'MY',num:customCards.length+1};
  customCards.push(c);
  localStorage.setItem('travelCustomCards',JSON.stringify(customCards));
  alert('추가했습니다.');
  renderAdd();
}
function deleteCustom(i){
  if(!confirm('이 단어를 삭제할까요?'))return;
  customCards.splice(i,1);localStorage.setItem('travelCustomCards',JSON.stringify(customCards));renderAdd();
}
function render(){updateButtons(); if(mode==='search')renderSearch(); else if(mode==='add')renderAdd(); else renderCards()}
function updateButtons(){
  document.getElementById('shuffleBtn').classList.toggle('active',shuffled);
  document.getElementById('hideBtn').classList.toggle('active',hideMeaning);
  document.getElementById('hideMnemonicBtn').classList.toggle('active',hideMnemonic);
  document.getElementById('bookBtn').classList.toggle('active',bookMode);
  document.getElementById('wrongBtn').classList.toggle('active',wrongOnly);
}
function nextCard(){const a=activeCards();if(!a.length)return;index=(index+1)%a.length;revealed=false;mnemonicRevealed=false;englishRevealed=false;mode='cards';render()}
function prevCard(){const a=activeCards();if(!a.length)return;index=(index-1+a.length)%a.length;revealed=false;mnemonicRevealed=false;englishRevealed=false;mode='cards';render()}
function toggleWrong(){const c=current();if(!c)return;if(wrongSet.has(c.word))wrongSet.delete(c.word);else wrongSet.add(c.word);saveState();render()}
function jumpToWord(word){
  wrongOnly=false;mode='cards';const a=activeCards();const i=a.findIndex(c=>c.word===word);index=i>=0?i:0;revealed=false;mnemonicRevealed=false;render();
}
document.getElementById('searchBtn').onclick=()=>{mode=mode==='search'?'cards':'search';render()};
document.getElementById('addBtn').onclick=()=>{mode=mode==='add'?'cards':'add';render()};
document.getElementById('shuffleBtn').onclick=()=>{
  shuffled=!shuffled;if(shuffled)localStorage.setItem('travelShuffleSeed',String(Math.random()*1000));index=0;revealed=false;mnemonicRevealed=false;saveState();mode='cards';render()
};
document.getElementById('hideBtn').onclick=()=>{hideMeaning=!hideMeaning;revealed=!hideMeaning;saveState();mode='cards';render()};
document.getElementById('hideMnemonicBtn').onclick=()=>{hideMnemonic=!hideMnemonic;mnemonicRevealed=!hideMnemonic;saveState();mode='cards';render()};
document.getElementById('bookBtn').onclick=()=>{bookMode=!bookMode;saveState();mode='cards';render()};
document.getElementById('wrongBtn').onclick=()=>{wrongOnly=!wrongOnly;index=0;revealed=false;mnemonicRevealed=false;mode='cards';render()};
document.getElementById('prevBtn').onclick=prevCard;
document.getElementById('nextBtn').onclick=nextCard;

document.addEventListener('keydown',e=>{if(mode==='cards'&&e.key==='ArrowRight')nextCard();if(mode==='cards'&&e.key==='ArrowLeft')prevCard()});
render();

  });
}
</script>


<button id="edit-current-card-btn" style="position:fixed;right:14px;bottom:86px;z-index:9999;border:0;border-radius:999px;padding:10px 14px;font-weight:700;box-shadow:0 4px 18px rgba(0,0,0,.25);">✏️ 연상 수정</button>
<script>
(function(){
  const btn=document.getElementById('edit-current-card-btn');
  btn.addEventListener('click',()=>{
    try{
      let list;
      if(typeof filteredCards!=='undefined' && Array.isArray(filteredCards)) list=filteredCards;
      else if(typeof currentCards!=='undefined' && Array.isArray(currentCards)) list=currentCards;
      else if(typeof cards!=='undefined' && Array.isArray(cards)) list=cards;
      else list=[...baseCards,...customCards].map(applyLocalEdit);

      let idx=0;
      if(typeof currentIndex!=='undefined') idx=currentIndex;
      else if(typeof index!=='undefined') idx=index;
      else if(typeof current!=='undefined' && Number.isInteger(current)) idx=current;

      const card=list[Math.max(0,Math.min(idx,list.length-1))];
      if(!card) return alert('현재 카드를 찾지 못했습니다.');
      const val=prompt(card.word+' 연상법 수정', card.mnemonic||'');
      if(val===null) return;
      saveLocalEdit(card.word,{mnemonic:val});
      alert('저장했습니다. 화면을 새로고침하면 적용됩니다.');
    }catch(e){ alert('수정 중 오류가 발생했습니다.'); }
  });
})();
</script>


<script>
(function(){
  let startX=0, startY=0, active=false;

  document.addEventListener('touchstart', function(e){
    if(mode!=='cards' || !e.touches || e.touches.length!==1) return;
    const t=e.touches[0];
    startX=t.clientX;
    startY=t.clientY;
    active=true;
  }, {passive:true});

  document.addEventListener('touchend', function(e){
    if(!active || mode!=='cards') return;
    active=false;
    if(!e.changedTouches || !e.changedTouches.length) return;

    const t=e.changedTouches[0];
    const dx=t.clientX-startX;
    const dy=t.clientY-startY;

    // 가로 이동이 충분히 크고 세로 스크롤보다 명확할 때만 넘김
    if(Math.abs(dx) >= 65 && Math.abs(dx) > Math.abs(dy)*1.35){
      if(dx < 0) nextCard();
      else prevCard();
    }
  }, {passive:true});
})();
</script>
