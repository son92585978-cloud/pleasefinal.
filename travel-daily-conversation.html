<style>

.top:after{content:"";position:absolute;width:210px;height:210px;background:radial-gradient(circle,#92c8fa36,transparent 68%);right:-65px;top:-70px;pointer-events:none}

.panel{background:#fff;border:1px solid #e0e7f1;border-radius:18px;padding:15px;margin:13px 0;box-shadow:0 3px 10px #15263e08}.panel h3{font-size:16px;margin:0 0 11px}.panel p{font-size:13px;line-height:1.7}.mini-note{background:#fff7e7;color:#895d1e;border:1px solid #f0dab2;font-size:12px;padding:11px;border-radius:11px;line-height:1.6}

.kpi{display:flex;gap:7px;margin:10px 0}.kpi span{height:6px;flex:1;border-radius:20px;background:#e3e9f2}.kpi span.passed{background:#3279b9}
.sourceitem{border:1px solid #e0e8f1;border-radius:12px;padding:12px;margin:8px 0;background:#fff}.sourceitem.focus{border:2px solid #4276aa;background:#f6faff}.sourceitem .num{color:#456c9b;font-size:11px;font-weight:850}.sourceitem .phrase-ko{font-size:14px;font-weight:800;line-height:1.5;margin:9px 0 5px}.sourceitem .phrase-en{font-size:14px;font-weight:750;color:#1e5184;line-height:1.6;margin:8px 0}.sourceitem .phrase-en[hidden]{display:none}.sourceitem .extra{color:#78859a;font-size:11px;line-height:1.6}.related{border-left:3px solid #6b93b8;background:#f4f8fd;padding:11px 12px;border-radius:8px;margin:9px 0;color:#465f80;line-height:1.6;font-size:12px}.explain-grid{display:flex;flex-wrap:wrap;gap:7px}.explain-btn{border:1px solid #c5d5e6;color:#244e80;background:#f4f9ff;border-radius:999px;font-size:12px;font-weight:800;padding:8px 11px}.explain-view{background:#f3f7fd;border-radius:10px;padding:12px;line-height:1.75;font-size:12px;margin-top:9px;white-space:pre-line}.info-title{font-size:12px;color:#72829b;font-weight:800}.complete{background:#ecf8f1;color:#19724e;border:1px solid #b7e4cb;border-radius:14px;padding:14px;line-height:1.6;font-weight:800}
.empty{background:#fff;border:1px dashed #becbdc;padding:28px 14px;text-align:center;border-radius:15px;color:#697990;font-size:13px}
.speed{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:750;color:#61728b}.speed select{padding:6px 9px;border-radius:10px;border:1px solid #cad7e5;background:#fff;color:#2b4f7b;font-size:12px}
.footertext{text-align:center;margin:25px 0 5px;color:#94a0b1;font-size:10px;line-height:1.8}
