function render(){let cats=$('cats');cats.replaceChildren();DATA.forEach((c,i)=>{let b=button('',()=>{cat=i;sc=0;step=0;reviewMode=false;render()},'cat'+(i===cat?' active':''));b.append(el('b','',c[0]),el('span','',c[1]));cats.append(b)});let list=$('scenarios');list.replaceChildren();DATA[cat][2].forEach((s,i)=>{let b=button((i+1)+'. '+s[0],()=>{sc=i;step=0;reviewMode=false;render();$('lessonTitle').scrollIntoView({block:'start'})},'scenario'+(i===sc&&!reviewMode?' active':''));b.append(el('small','',(s.length-1)+'문장 · 실전 대화'));list.append(b)});
let lesson=DATA[cat][2][sc];$('lessonTitle').textContent=reviewMode?'⭐ 저장한 문장':lesson[0];$('viewAll').className='btn'+(mode==='all'?' primary':'');$('viewStep').className='btn'+(mode==='step'?' primary':'');$('viewBranch').className='btn'+(mode==='branch'?' primary':'');let entries=reviewMode?saved.map(x=>['복습',x.ko,x.en]):lesson.slice(1);step=Math.min(step,Math.max(entries.length-1,0));$('stepControls').replaceChildren();$('branches').replaceChildren();let lines=$('lines');lines.replaceChildren();
if(mode==='branch'&&!reviewMode){let box=$('branches');box.append(el('p','note','직원의 답변이 예상과 다를 때 사용할 수 있는 추가 표현입니다. 한국어를 먼저 보고 영어를 확인하세요.'));let cases=[['예약이 없다고 하면','예약 확인 이메일을 보여드릴게요.','I can show you my confirmation email.'],['기다려야 한다고 하면','얼마나 기다려야 하나요?','How long do we need to wait?'],['원하는 것이 불가능하다고 하면','다른 방법이 있을까요?','Is there another option?'],['설명을 못 알아들었을 때','조금 더 천천히 말씀해 주시겠어요?','Could you speak a little more slowly?']];cases.forEach(([a,k,e])=>{let c=el('div','branch');c.append(el('strong','',a),el('p','ko',k));let ans=el('div','en hidden',e);c.append(ans,button('영어 확인',()=>ans.classList.toggle('hidden')));box.append(c)});return}
if(mode==='step'&&entries.length){let bar=el('div','stepbar');bar.append(button('← 이전',()=>{step=Math.max(0,step-1);render()}),el('strong','',`${step+1} / ${entries.length}`),button('다음 →',()=>{step=Math.min(entries.length-1,step+1);render()}));$('stepControls').append(bar);entries=[entries[step]]}
if(!entries.length)lines.append(el('p','empty','저장한 문장이 없습니다.'));
entries.forEach(([who,ko,en])=>{let card=el('article','bubble '+(who==='나'?'me':'staff'));card.append(el('div','who',who==='나'?'🙋 나':who==='직원'?'👩‍💼 직원':'⭐ 저장 문장'),el('div','ko',ko));let enBox=el('div','en hidden',en),details=el('div','details hidden');let toggle=button('👁 영어 확인',()=>{enBox.classList.toggle('hidden');toggle.textContent=enBox.classList.contains('hidden')?'👁 영어 확인':'🙈 영어 가리기'});let exp=button('📖 문장·표현 설명',()=>{details.classList.toggle('hidden');if(!details.classList.contains('hidden'))enBox.classList.remove('hidden')});let actions=el('div','toolbar');actions.append(toggle,exp,button('☆ 복습 저장',()=>save(en,ko)));card.append(enBox,actions);details.append(el('p','note','전체 해석: '+ko));let chunksBox=el('div');let info=el('div','expbox','아래 표현을 누르면 의미와 사용 이유가 나타납니다.');details.append(chunksBox,info);chunks(en).forEach(([part,meaning,why])=>{chunksBox.append(button(part,()=>{info.replaceChildren(el('strong','',part),el('p','',meaning),el('p','',why))},'chunkBtn'))});card.append(details);lines.append(card)});
$('showAll').onclick=()=>lines.querySelectorAll('.en').forEach(x=>x.classList.remove('hidden'));$('hideAll').onclick=()=>lines.querySelectorAll('.en').forEach(x=>x.classList.add('hidden'));$('review').onclick=()=>{reviewMode=!reviewMode;mode='all';render()};$('review').textContent=reviewMode?'← 대화로 돌아가기':'⭐ 저장한 문장 보기';}
$('viewAll').onclick=()=>{mode='all';render()};$('viewStep').onclick=()=>{mode='step';render()};$('viewBranch').onclick=()=>{mode='branch';render()};render();
</script></body></html>
