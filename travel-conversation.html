<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15100d"><title>실전 여행 회화</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#292c33;background:#f6f7fa}*{box-sizing:border-box}body{margin:0}.app{max-width:720px;margin:auto;padding:16px 14px 90px}.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{color:#195f99;text-decoration:none;font-weight:700}.hero{background:#183c61;color:white;border-radius:20px;padding:20px;margin-bottom:15px}.hero h1{margin:0 0 7px;font-size:23px}.hero p{margin:0;font-size:13px;line-height:1.6;color:#e0ecf8}.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.cat{border:1px solid #d9e0e9;border-radius:12px;background:white;padding:10px 2px;min-height:77px;font-size:12px}.cat b{display:block;font-size:23px;margin-bottom:5px}.cat.active{border:2px solid #2476bb;background:#e8f3ff}.section{margin:22px 0 9px;font-size:17px;font-weight:800}.scenario{width:100%;text-align:left;background:white;border:1px solid #dce2e8;border-radius:13px;padding:14px;margin-bottom:8px;font:inherit}.scenario.active{border:2px solid #267bb9}.scenario small{display:block;color:#68717e;margin-top:5px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.btn{border:1px solid #c9d7e6;border-radius:10px;background:white;padding:10px 12px;font:inherit;font-size:13px;cursor:pointer}.btn.primary{background:#1c6ba7;color:white;border-color:#1c6ba7}.bubble{background:white;border-radius:15px;padding:13px;margin:11px 0;border:1px solid #e2e5ea}.bubble.me{background:#e8f3ff;margin-left:18px}.bubble.staff{margin-right:18px}.who{font-size:12px;color:#667689;margin-bottom:7px}.ko{font-size:16px;font-weight:700;line-height:1.6}.en{font-size:17px;line-height:1.65;margin:10px 0;font-weight:650}.hidden{display:none}.details{margin-top:12px;border-top:1px solid #dae2e9;padding-top:12px}.chunk{background:#f3f6f9;border:1px solid #e0e7ed;border-radius:10px;padding:10px;margin:7px 0}.chunk strong{color:#195e91}.chunk p{font-size:13px;margin:5px 0;line-height:1.65}.empty{color:#68717e}.note{font-size:12px;color:#64707b;line-height:1.7}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#213b54;color:white;padding:11px;border-radius:10px;display:none}</style></head><body><main class="app"><header class="head"><a class="back" href="./index.html">← 기존 영단어 앱</a><strong>실전 여행 회화</strong></header><div class="hero"><h1>🌍 여행에서 바로 쓰는 영어</h1><p>한국어를 먼저 보고 영어를 떠올려 보세요. 영어 확인 → 표현 묶음 해설 → 복습 저장까지 연습할 수 있습니다.</p></div><div class="cats" id="cats"></div><div class="section">상황 선택</div><div id="scenarios"></div><div class="section" id="lessonTitle">대화 연습</div><div class="toolbar"><button class="btn" id="showAll">영어 전체 보기</button><button class="btn" id="hideAll">영어 전체 가리기</button><button class="btn" id="review">⭐ 저장한 문장 보기</button></div><div id="lines"></div><p class="note">이 메뉴는 기존 앱에 별도 추가된 실전 회화입니다. 복습 문장은 이 기기의 브라우저에 저장되며, 기존 단어 학습 기록과는 별도로 보관됩니다. 브라우저 데이터 삭제 시 복습 저장도 사라질 수 있습니다.</p></main><div class="toast" id="toast"></div><script>
const DATA=[
['✈️','공항·비행기',[
['체크인 카운터',['나','체크인하고 싶어요.','I’d like to check in.'],['직원','여권을 보여주시겠어요?','May I see your passport, please?'],['나','네, 여기 있습니다.','Sure, here it is.'],['나','제 탑승구는 어디인가요?','Where is my gate?']],
['수하물 맡기기',['나','이 가방을 부치고 싶어요.','I’d like to check this bag.'],['직원','가방이 몇 개 있으신가요?','How many bags do you have?'],['나','가방 한 개 있어요.','I have one bag.'],['나','추가 요금이 있나요?','Is there an extra fee?']]]],
['🏨','호텔·숙소',[
['예약 확인과 체크인',['직원','무엇을 도와드릴까요?','How can I help you?'],['나','예약하고 왔는데요.','Hi, I have a reservation.'],['직원','어떤 이름으로 예약하셨나요?','What name is the reservation under?'],['나','손이라는 이름으로 예약했어요.','It’s under the name Son.'],['직원','여권을 보여주시겠어요?','Could I see your passport, please?'],['나','네, 여기 있습니다.','Sure, here it is.']],
['룸서비스 주문',['나','룸서비스를 주문하고 싶어요.','I’d like to order room service.'],['직원','무엇을 주문하시겠어요?','What would you like to order?'],['나','버거 하나와 콜라 하나 주세요.','I’d like a burger and a Coke, please.'],['나','얼마나 걸리나요?','How long will it take?']],
['체크아웃과 짐 보관',['나','체크아웃하고 싶어요.','I’d like to check out.'],['나','제 가방을 여기 맡겨도 될까요?','Can I leave my bags here?'],['직원','네, 프런트에 맡기시면 됩니다.','Yes, you can leave them at the front desk.']]]],
['🍽️','식당·카페',[
['식당에서 주문하기',['나','두 명 자리 있나요?','Do you have a table for two?'],['직원','예약하셨나요?','Do you have a reservation?'],['나','아니요, 예약하지 않았어요.','No, I don’t have a reservation.'],['나','메뉴 좀 볼 수 있을까요?','Could I see the menu, please?'],['나','이걸로 주문할게요.','I’ll have this, please.']],
['루프탑 자리 예약',['나','루프탑은 예약해야 하나요?','Do we need to make a reservation for the rooftop?'],['직원','네, 예약하시는 게 좋습니다.','Yes, it’s best to make a reservation.'],['나','루프탑 테이블을 예약할 수 있나요?','Can we reserve a table on the rooftop?']]]],
['🚆','교통·환승',[
['지하철 환승하기',['나','여기서 갈아타야 하나요?','Do I need to transfer here?'],['직원','네, 2호선으로 갈아타세요.','Yes, transfer to Line 2.'],['나','어디서 갈아타야 하나요?','Where should I transfer?'],['직원','다음 역에서 갈아타세요.','Transfer at the next station.']],
['택시 이용하기',['나','공항까지 가 주세요.','Please take me to the airport.'],['나','요금이 얼마나 나올까요?','How much will it cost?'],['나','여기서 내려 주세요.','Could you drop me off here?']]]],
['🛍️','쇼핑·환불',[
['사이즈와 재고 묻기',['나','이거 다른 사이즈 있나요?','Do you have this in another size?'],['나','이 제품 재고가 더 있나요?','Do you have more of these in stock?'],['나','입어 봐도 될까요?','Can I try this on?']],
['환불 요청하기',['나','이걸 반품하고 싶어요.','I’d like to return this.'],['직원','영수증 있으신가요?','Do you have the receipt?'],['나','네, 여기 있습니다.','Yes, here it is.'],['나','환불받을 수 있나요?','Can I get a refund?']]]],
['🎟️','관광·입장권',[
['입장료 확인하기',['나','입장료가 얼마인가요?','How much is admission?'],['나','온라인으로 표를 살 수 있나요?','Can I buy tickets online?'],['나','몇 시에 문을 닫나요?','What time do you close?']]]],
['🆘','문제·긴급',[
['물건을 잃어버렸을 때',['나','도움이 필요해요.','I need help.'],['나','제 가방을 잃어버렸어요.','I lost my bag.'],['나','분실물 센터가 어디인가요?','Where is the lost and found?']],
['몸이 아플 때',['나','몸이 안 좋아요.','I don’t feel well.'],['나','가까운 병원이 어디인가요?','Where is the nearest hospital?'],['나','구급차를 불러 주세요.','Please call an ambulance.']]]],
['💬','일상·요청',[
['사진 부탁하기',['나','사진 좀 찍어 주시겠어요?','Could you take a picture of us?'],['직원','물론이죠.','Of course.'],['나','정말 감사합니다.','Thank you so much.']],
['잠깐 시간 요청하기',['나','잠깐 시간 내주실 수 있나요?','Could you spare a minute?'],['나','이 주소를 찾는 걸 도와주시겠어요?','Could you help me find this address?']]]]
];
const SPECIAL={"I’d like to":['저는 ~하고 싶어요','I would like to의 줄임말로 정중한 요청입니다. 뒤에는 동사원형이 옵니다.'],"I’d like":['저는 ~을 원해요','뒤에 명사를 붙이면 원하는 물건을 말할 수 있습니다.'],"Do I need to":['제가 ~해야 하나요?','필요 여부를 묻습니다. 일반동사 need의 의문문이라 do를 씁니다.'],"Do we need to":['저희가 ~해야 하나요?','we는 나를 포함한 여러 사람입니다. need to 뒤에는 동사원형이 옵니다.'],"Could you":['~해 주시겠어요?','상대방에게 정중하게 부탁할 때 씁니다. could 뒤에 동사원형이 옵니다.'],"Could I":['제가 ~해도 될까요?','허락을 정중하게 구할 때 씁니다.'],"Can I":['제가 ~할 수 있나요?','가능 여부나 허락을 물을 때 씁니다.'],"Can we":['저희가 ~할 수 있나요?','can 자체가 조동사이므로 do를 함께 쓰지 않습니다.'],"Where should I":['제가 어디서 ~해야 할까요?','should를 주어 I 앞에 둡니다. do를 추가하지 않습니다.'],"make a reservation":['예약하다','make a reservation은 예약을 한다는 표현입니다. have a reservation은 예약된 상태입니다.'],"a reservation":['예약','have a reservation은 예약이 되어 있는 상태를 말합니다.'],"under the name":['~라는 이름으로','예약·등록된 이름을 나타내는 고정 표현입니다.'],"on the rooftop":['루프탑에','옥상 공간의 위치를 나타내므로 on을 사용합니다.'],"in stock":['재고가 있는','재고가 있는 상태를 뜻하는 묶음 표현입니다.'],"drop me off":['저를 내려주다','drop off는 차로 데려다주고 내려주는 뜻입니다. leave는 단순히 두고 가는 뜻일 수 있습니다.'],"check in":['체크인하다','도착만 하는 arrive와 달리 등록·수속을 뜻합니다.'],"check out":['체크아웃하다','호텔에서 퇴실 수속을 하는 것입니다.'],"transfer to":['~로 환승하다','다른 노선·교통수단으로 이동하는 목적지를 to로 연결합니다.'],"How much":['얼마','가격·금액을 물을 때 사용합니다.'],"How long":['얼마나 오래','소요 시간을 물을 때 사용합니다.']};
let cat=1,sc=0,reviewMode=false;const savedKey='travel-conversation-saved-v1';let saved=[];try{saved=JSON.parse(localStorage.getItem(savedKey)||'[]')}catch(e){}const $=id=>document.getElementById(id);function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}function button(label,fn,cls='btn'){let b=el('button',cls,label);b.type='button';b.onclick=fn;return b}function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1500)}function chunks(s){let remaining=s.replace(/[’]/g,"'");let out=[];while(remaining.trim()){let key=Object.keys(SPECIAL).sort((a,b)=>b.length-a.length).find(k=>remaining.toLowerCase().startsWith(k.toLowerCase().replace('’',"'")));if(key){out.push([remaining.slice(0,key.length),...SPECIAL[key]]);remaining=remaining.slice(key.length).trimStart()}else{let i=remaining.indexOf(' ');if(i<0){out.push([remaining,'문장 구성 요소','앞뒤 표현과 함께 문장 전체의 뜻을 확인하세요.']);break}out.push([remaining.slice(0,i),'문장 구성 요소','다음 단어와 연결하여 뜻을 이해하세요.']);remaining=remaining.slice(i+1)}}return out}function save(en,ko){if(!saved.some(x=>x.en===en)){saved.push({en,ko});localStorage.setItem(savedKey,JSON.stringify(saved));toast('복습 문장에 저장했습니다')}else toast('이미 저장된 문장입니다')}function render(){let cats=$('cats');cats.replaceChildren();DATA.forEach((c,i)=>{let b=button('',()=>{cat=i;sc=0;reviewMode=false;render()},'cat'+(i===cat?' active':''));b.append(el('b','',c[0]),el('span','',c[1]));cats.append(b)});let list=$('scenarios');list.replaceChildren();DATA[cat][2].forEach((s,i)=>{let b=button((i+1)+'. '+s[0],()=>{sc=i;reviewMode=false;render();$('lessonTitle').scrollIntoView({block:'start'})},'scenario'+(i===sc&&!reviewMode?' active':''));b.append(el('small','',(s.length-1)+'문장 · 직원과 나의 실전 대화'));list.append(b)});$('lessonTitle').textContent=reviewMode?'⭐ 저장한 문장':DATA[cat][2][sc][0];let lines=$('lines');lines.replaceChildren();let entries=reviewMode?saved.map(x=>['복습',x.ko,x.en]):DATA[cat][2][sc].slice(1);if(!entries.length)lines.append(el('p','empty','저장한 문장이 없습니다.'));entries.forEach((entry,i)=>{let [who,ko,en]=entry;let card=el('article','bubble '+(who==='나'?'me':'staff'));card.append(el('div','who',who==='나'?'🙋 나':who==='직원'?'👩‍💼 직원':'⭐ 저장 문장'),el('div','ko',ko));let enBox=el('div','en hidden',en),details=el('div','details hidden');let toggle=button('👁 영어 문장 확인',()=>{enBox.classList.toggle('hidden');toggle.textContent=enBox.classList.contains('hidden')?'👁 영어 문장 확인':'🙈 영어 가리기'});let exp=button('📖 문장·표현 설명',()=>{details.classList.toggle('hidden');if(!details.classList.contains('hidden'))enBox.classList.remove('hidden')});let bookmark=button('☆ 복습 저장',()=>save(en,ko));let actions=el('div','toolbar');actions.append(toggle,exp,bookmark);card.append(enBox,actions);let desc=el('p','note','문장 뜻: '+ko+'  ·  아래 표현은 발음과 뜻을 함께 묶어 학습하세요.');details.append(desc);chunks(en).forEach(([part,meaning,why])=>{let c=el('div','chunk');c.append(el('strong','',part),el('p','',meaning),el('p','',why));details.append(c)});card.append(details);lines.append(card)});$('showAll').onclick=()=>lines.querySelectorAll('.en').forEach(x=>x.classList.remove('hidden'));$('hideAll').onclick=()=>lines.querySelectorAll('.en').forEach(x=>x.classList.add('hidden'));$('review').onclick=()=>{reviewMode=!reviewMode;render()};$('review').textContent=reviewMode?'← 대화로 돌아가기':'⭐ 저장한 문장 보기'}render();
</script></body></html>
