 막차","dialogue":"A: What time is the last train to the airport?\nB: At eleven fifteen tonight.","dialogues":["A: What time is the last train to the airport?\nB: At eleven fifteen tonight.","A: What time is the last train to the airport?\nB: It leaves at 11:42."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 공항행 막차는 몇 시인가요?\nB: 오늘 밤 11시 15분입니다.","dialogue_pairs":[{"en":"A: What time is the last train to the airport?\nB: At eleven fifteen tonight.","ko":"A: 공항행 막차는 몇 시인가요?\nB: 오늘 밤 11시 15분입니다."},{"en":"A: What time is the last train to the airport?\nB: It leaves at 11:42.","ko":"A: 공항으로 가는 막차가 몇 시인가요?\nB: 11시 42분에 출발합니다."}],"pronunciation":"래스트 트레인","id":286},{"day":29,"num":8,"word":"last day","meaning":"마지막 날","hint":"","mnemonic":"last day [래스트 데이]\nlast = 마지막, day = 날.\n→ last day = 마지막 날","dialogue":"A: Is today your last day here?\nB: Yes. I fly home tomorrow morning.","dialogues":["A: Is today your last day here?\nB: Yes. I fly home tomorrow morning.","A: It is our last day, so let us visit the market again.\nB: Good idea. We still need souvenirs."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 오늘이 여기에서 보내는 마지막 날인가요?\nB: 네. 내일 아침 비행기로 돌아가요.","dialogue_pairs":[{"en":"A: Is today your last day here?\nB: Yes. I fly home tomorrow morning.","ko":"A: 오늘이 여기에서 보내는 마지막 날인가요?\nB: 네. 내일 아침 비행기로 돌아가요."},{"en":"A: It is our last day, so let us visit the market again.\nB: Good idea. We still need souvenirs.","ko":"A: 오늘이 마지막 날이니 시장에 다시 가요.\nB: 좋아요. 아직 기념품을 사야 해요."}],"pronunciation":"래스트 데이","id":287},{"day":29,"num":9,"word":"final","meaning":"최종의, 마지막의","hint":"","mnemonic":"final [파이널] → “파이널 경기 뒤에는 더 없다!”\n토너먼트의 파이널 경기가 끝나자 우승자가 정해집니다. 다음 경기는 없고 결과가 최종으로 확정됩니다.\n익숙한 파이널 경기의 마지막 → final = 최종의, 마지막의.","dialogue":"A: Is this the final price?\nB: Yes, it includes all taxes and fees.","dialogues":["A: Is this the final price?\nB: Yes, it includes all taxes and fees.","A: Is this the final stop on the line?\nB: Yes, everyone needs to get off here."],"caution":"","past":true,"similar":"final = 최종의 / last = 마지막 / latest = 최신의","note":"","ko_dialogue":"A: 이것이 최종 가격인가요?\nB: 네, 세금과 수수료가 모두 포함되어 있어요.","dialogue_pairs":[{"en":"A: Is this the final price?\nB: Yes, it includes all taxes and fees.","ko":"A: 이것이 최종 가격인가요?\nB: 네, 세금과 수수료가 모두 포함되어 있어요."},{"en":"A: Is this the final stop on the line?\nB: Yes, everyone needs to get off here.","ko":"A: 여기가 이 노선의 종점인가요?\nB: 네, 모두 여기서 내려야 합니다."}],"pronunciation":"파이널","id":288},{"day":29,"num":10,"word":"latest","meaning":"최신의, 가장 최근의","hint":"","mnemonic":"latest [레이티스트] → “늦게 나온 것이 가장 최근 것!”\n오래된 잡지들이 먼저 쌓여 있고, 가장 늦게 도착한 새 잡지가 맨 위에 놓입니다. 발행 시점이 가장 뒤인 그 잡지가 최신호입니다.\nlate(시간상 뒤의) + -est(가장) → latest = 가장 최근의, 최신의.","dialogue":"A: Do you have the latest bus timetable?\nB: Yes. This one was updated yesterday.","dialogues":["A: Do you have the latest bus timetable?\nB: Yes. This one was updated yesterday.","A: Where can I find the latest train schedule?\nB: The station app has the most recent times."],"caution":"latest train이 아니라 last train이 ‘막차’입니다. latest는 ‘최신의/가장 최근의’.","past":true,"similar":"latest = 최신의 / last = 지난·마지막 / newest = 가장 새로운","note":"latest train이 아니라 last train이 ‘막차’입니다. latest는 ‘최신의/가장 최근의’.","ko_dialogue":"A: 최신 버스 시간표가 있나요?\nB: 네. 이것은 어제 갱신됐어요.","dialogue_pairs":[{"en":"A: Do you have the latest bus timetable?\nB: Yes. This one was updated yesterday.","ko":"A: 최신 버스 시간표가 있나요?\nB: 네. 이것은 어제 갱신됐어요."},{"en":"A: Where can I find the latest train schedule?\nB: The station app has the most recent times.","ko":"A: 최신 기차 시간표는 어디에서 볼 수 있나요?\nB: 역 앱에 가장 최근 시간이 나옵니다."}],"pronunciation":"레이티스트","id":289},{"day":30,"num":1,"word":"How long does it last?","meaning":"얼마나 오래 지속돼요?","hint":"","mnemonic":"How long does it last? [하우 롱 더즈 잇 래스트]\nhow long = 얼마나 오래, last = 지속되다.\n→ 얼마나 오래 지속되나요?","dialogue":"A: I am interested in the boat tour. How long does it last?\nB: About ninety minutes.","dialogues":["A: I am interested in the boat tour. How long does it last?\nB: About ninety minutes.","A: How long does it last?\nB: The boat tour takes about ninety minutes."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 보트 투어에 관심이 있어요. 얼마나 오래 진행되나요?\nB: 약 90분입니다.","dialogue_pairs":[{"en":"A: I am interested in the boat tour. How long does it last?\nB: About ninety minutes.","ko":"A: 보트 투어에 관심이 있어요. 얼마나 오래 진행되나요?\nB: 약 90분입니다."},{"en":"A: How long does it last?\nB: The boat tour takes about ninety minutes.","ko":"A: 얼마나 오래 걸리나요?\nB: 보트 투어는 약 90분 동안 진행됩니다."}],"pronunciation":"하우 롱 더즈 잇 래스트","id":290},{"day":30,"num":2,"word":"take a break","meaning":"쉬다, 휴식을 취하다","hint":"","mnemonic":"take a break [테이크 어 브레이크]\nbreak = 흐름을 끊다.\n일을 잠깐 끊고 쉰다.\n→ take a break = 휴식하다","dialogue":"A: Can we take a break before the next museum?\nB: Of course. There is a café over there.","dialogues":["A: Can we take a break before the next museum?\nB: Of course. There is a café over there.","A: Let us take a break after this museum.\nB: Sure, there is a cafe in the courtyard."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 다음 박물관에 가기 전에 잠깐 쉴 수 있을까요?\nB: 그럼요. 저기에 카페가 있어요.","dialogue_pairs":[{"en":"A: Can we take a break before the next museum?\nB: Of course. There is a café over there.","ko":"A: 다음 박물관에 가기 전에 잠깐 쉴 수 있을까요?\nB: 그럼요. 저기에 카페가 있어요."},{"en":"A: Let us take a break after this museum.\nB: Sure, there is a cafe in the courtyard.","ko":"A: 이 박물관을 보고 나서 잠깐 쉬어요.\nB: 좋아요, 안뜰에 카페가 있어요."}],"pronunciation":"테이크 어 브레이크","id":291},{"day":30,"num":3,"word":"break down","meaning":"고장 나다","hint":"","mnemonic":"break down [브레이크 다운]\nbreak = 망가지다, down = 멈춰 내려앉다.\n→ break down = 고장 나다","dialogue":"A: Did your rental car break down?\nB: Yes. I am waiting for roadside assistance.","dialogues":["A: Did your rental car break down?\nB: Yes. I am waiting for roadside assistance.","A: What happens if the rental car breaks down?\nB: Call this number and roadside assistance will come."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 렌터카가 고장 났나요?\nB: 네. 긴급 출동 서비스를 기다리고 있어요.","dialogue_pairs":[{"en":"A: Did your rental car break down?\nB: Yes. I am waiting for roadside assistance.","ko":"A: 렌터카가 고장 났나요?\nB: 네. 긴급 출동 서비스를 기다리고 있어요."},{"en":"A: What happens if the rental car breaks down?\nB: Call this number and roadside assistance will come.","ko":"A: 렌터카가 고장 나면 어떻게 해야 하나요?\nB: 이 번호로 전화하면 긴급출동 서비스가 옵니다."}],"pronunciation":"브레이크 다운","id":292},{"day":30,"num":4,"word":"break a bill","meaning":"큰돈을 잔돈으로 바꾸다","hint":"","mnemonic":"break a bill [브레이크 어 빌]\n큰 지폐(bill)를 작은 돈으로 쪼갠다(break).\n→ break a bill = 큰돈을 잔돈으로 바꾸다","dialogue":"A: Could you break a fifty-dollar bill?\nB: Yes. Would you like some smaller notes?","dialogues":["A: Could you break a fifty-dollar bill?\nB: Yes. Would you like some smaller notes?","A: Could you break a fifty-dollar bill for me?\nB: Sure. Do you want tens and fives?"],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 50달러 지폐를 잔돈으로 바꿔주시겠어요?\nB: 네. 작은 지폐도 드릴까요?","dialogue_pairs":[{"en":"A: Could you break a fifty-dollar bill?\nB: Yes. Would you like some smaller notes?","ko":"A: 50달러 지폐를 잔돈으로 바꿔주시겠어요?\nB: 네. 작은 지폐도 드릴까요?"},{"en":"A: Could you break a fifty-dollar bill for me?\nB: Sure. Do you want tens and fives?","ko":"A: 50달러 지폐를 잔돈으로 바꿔주시겠어요?\nB: 네. 10달러와 5달러짜리로 드릴까요?"}],"pronunciation":"브레이크 어 빌","id":293},{"day":30,"num":5,"word":"exhibition","meaning":"전시회","hint":"","mnemonic":"exhibition → “집에 숨겨둔 작품을 꺼내 모두에게!”\n“이거 집에 두지 말고 보여줘!”라는 말을 듣고 그림 여러 점을 밖으로 꺼냅니다. 한 공간에 걸고 사람들을 초대하니 전시회가 열립니다.\n이거 + 집에 → exhibit(전시하다) → 작품을 모아 보여주는 exhibition(전시회).","dialogue":"A: When does the exhibition close?\nB: At six. Last admission is at five thirty.","dialogues":["A: When does the exhibition close?\nB: At six. Last admission is at five thirty.","A: When does the photography exhibition close?\nB: It runs until the end of the month."],"caution":"exhibit = 전시하다/전시품, exhibition = 전시회.","past":true,"similar":"","note":"exhibit = 전시하다/전시품, exhibition = 전시회.","ko_dialogue":"A: 전시회는 몇 시에 닫나요?\nB: 6시입니다. 마지막 입장은 5시 30분이에요.","dialogue_pairs":[{"en":"A: When does the exhibition close?\nB: At six. Last admission is at five thirty.","ko":"A: 전시회는 몇 시에 닫나요?\nB: 6시입니다. 마지막 입장은 5시 30분이에요."},{"en":"A: When does the photography exhibition close?\nB: It runs until the end of the month.","ko":"A: 사진 전시는 언제 끝나나요?\nB: 이달 말까지 열립니다."}],"pronunciation":"엑시비션","id":294},{"day":30,"num":6,"word":"museum","meaning":"박물관","hint":"","mnemonic":"museum [뮤지엄] → “뮤~ 하고 울던 옛 동물도 여기!”\n아주 오래전 동물의 뼈와 옛사람들이 쓰던 그릇이 한 건물 안에 모여 있습니다. 동물 울음소리 ‘뮤~’를 듣는 듯하며 옛것들을 둘러봅니다.\n뮤~ + 오래된 유물들을 모아놓은 곳 → 뮤지엄 → 박물관.","dialogue":"A: Is the museum open on Mondays?\nB: No, it is closed every Monday.","dialogues":["A: Is the museum open on Mondays?\nB: No, it is closed every Monday.","A: Is the museum free on Fridays?\nB: Yes, admission is free after five."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 박물관은 월요일에 운영하나요?\nB: 아니요, 매주 월요일은 휴관입니다.","dialogue_pairs":[{"en":"A: Is the museum open on Mondays?\nB: No, it is closed every Monday.","ko":"A: 박물관은 월요일에 운영하나요?\nB: 아니요, 매주 월요일은 휴관입니다."},{"en":"A: Is the museum free on Fridays?\nB: Yes, admission is free after five.","ko":"A: 금요일에는 박물관이 무료인가요?\nB: 네, 5시 이후에는 무료 입장입니다."}],"pronunciation":"뮤지엄","id":295},{"day":30,"num":7,"word":"gallery","meaning":"미술관, 갤러리","hint":"","mnemonic":"gallery [갤러리] → “그림 걸어, 여기!”\n벽에 그림을 하나씩 걸어 사람들이 보게 합니다.\n걸어, 여기! ≈ 갤러리.\n→ gallery = 미술관 / 갤러리","dialogue":"A: Is there an art gallery near here?\nB: Yes, beside the public library.","dialogues":["A: Is there an art gallery near here?\nB: Yes, beside the public library.","A: This gallery has a lot of local art.\nB: Yes, most of the artists live in this city."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 근처에 미술관이 있나요?\nB: 네, 공공도서관 옆에 있어요.","dialogue_pairs":[{"en":"A: Is there an art gallery near here?\nB: Yes, beside the public library.","ko":"A: 이 근처에 미술관이 있나요?\nB: 네, 공공도서관 옆에 있어요."},{"en":"A: This gallery has a lot of local art.\nB: Yes, most of the artists live in this city.","ko":"A: 이 미술관에는 지역 작품이 많네요.\nB: 네, 대부분의 작가가 이 도시에 살아요."}],"pronunciation":"갤러리","id":296},{"day":30,"num":8,"word":"special exhibit","meaning":"특별 전시","hint":"","mnemonic":"special exhibit → “이 작품은 집에 숨기기 아까워, 특별히 보여줘!”\n평소에는 잘 꺼내지 않는 귀한 작품을 딱 한 기간만 공개합니다. 사람들이 그 특별한 작품을 보러 모입니다.\n이거 집에 두지 말고 보여줘 → exhibit, 특별한 special → 특별 전시.","dialogue":"A: Does this ticket include the special exhibit?\nB: No, that requires a separate ticket.","dialogues":["A: Does this ticket include the special exhibit?\nB: No, that requires a separate ticket.","A: Do I need a separate ticket for the special exhibit?\nB: Yes, it costs five dollars extra."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 표에 특별 전시도 포함되나요?\nB: 아니요, 별도 표가 필요해요.","dialogue_pairs":[{"en":"A: Does this ticket include the special exhibit?\nB: No, that requires a separate ticket.","ko":"A: 이 표에 특별 전시도 포함되나요?\nB: 아니요, 별도 표가 필요해요."},{"en":"A: Do I need a separate ticket for the special exhibit?\nB: Yes, it costs five dollars extra.","ko":"A: 특별 전시를 보려면 별도 표가 필요한가요?\nB: 네, 5달러가 추가됩니다."}],"pronunciation":"스페셜 이그지빗","id":297},{"day":30,"num":9,"word":"art exhibition","meaning":"미술 전시회","hint":"","mnemonic":"art exhibition → “예술 작품을 집 밖으로 꺼내 함께 보여준다!”\n화가들이 집에서 그린 그림을 한 공간으로 가져와 벽마다 겁니다. 문을 열자 관람객들이 들어와 작품을 감상합니다.\nart(예술) + 이거 집에 두지 말고 보여줘(exhibit 연상) → art exhibition = 미술 전시회.","dialogue":"A: Where is the art exhibition being held?\nB: In the hall on the third floor.","dialogues":["A: Where is the art exhibition being held?\nB: In the hall on the third floor.","A: There is an art exhibition at the old warehouse this weekend.\nB: Let us go on Saturday afternoon."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 미술 전시회는 어디에서 열리나요?\nB: 3층 홀에서 열려요.","dialogue_pairs":[{"en":"A: Where is the art exhibition being held?\nB: In the hall on the third floor.","ko":"A: 미술 전시회는 어디에서 열리나요?\nB: 3층 홀에서 열려요."},{"en":"A: There is an art exhibition at the old warehouse this weekend.\nB: Let us go on Saturday afternoon.","ko":"A: 이번 주말 오래된 창고에서 미술 전시회가 열려요.\nB: 토요일 오후에 가요."}],"pronunciation":"아트 엑시비션","id":298},{"day":30,"num":10,"word":"anything","meaning":"무엇이든, 아무것","hint":"","mnemonic":"anything → “아무 상자나 열어도 돼!”\n여러 상자 중 하나를 고르라고 합니다. 무슨 물건이든 괜찮아서 어느(any) 상자든 집을 수 있습니다.\nany(어느 것이든) + thing(것) → anything = 무엇이든.\n부정문에서는 아무것도 없다는 뜻을 만들 수 있습니다.","dialogue":"A: Do you need anything else?\nB: No, thank you. That is everything.","dialogues":["A: Do you need anything else?\nB: No, thank you. That is everything.","A: Is there anything else I should bring for the tour?\nB: Just water and comfortable shoes."],"caution":"긍정문에서는 ‘무엇이든’, 부정문에서는 ‘아무것도’로 해석될 수 있습니다.","past":true,"similar":"","note":"긍정문에서는 ‘무엇이든’, 부정문에서는 ‘아무것도’로 해석될 수 있습니다.","ko_dialogue":"A: 더 필요한 것이 있나요?\nB: 아니요, 감사합니다. 다 됐어요.","dialogue_pairs":[{"en":"A: Do you need anything else?\nB: No, thank you. That is everything.","ko":"A: 더 필요한 것이 있나요?\nB: 아니요, 감사합니다. 다 됐어요."},{"en":"A: Is there anything else I should bring for the tour?\nB: Just water and comfortable shoes.","ko":"A: 투어에 더 가져가야 할 것이 있나요?\nB: 물과 편한 신발만 있으면 됩니다."}],"pronunciation":"애니씽","id":299},{"day":31,"num":1,"word":"something","meaning":"무언가","hint":"","mnemonic":"something → “상자 안에 뭔가 하나 있다!”\n닫힌 상자를 흔드니 달그락 소리가 납니다. 정확히 무엇인지는 모르지만 안에 무언가가 들어 있습니다.\nsome(어떤) + thing(것) → something = 무언가.","dialogue":"A: Could I have something hot to drink?\nB: Of course. Would you like tea or coffee?","dialogues":["A: Could I have something hot to drink?\nB: Of course. Would you like tea or coffee?","A: I need something warm to wear tonight.\nB: There is a clothing shop near the station."],"caution":"something은 ‘무언가’. 의문문에서도 상대가 원할 것 같을 때 Would you like something...?처럼 쓸 수 있습니다.","past":true,"similar":"","note":"something은 ‘무언가’. 의문문에서도 상대가 원할 것 같을 때 Would you like something...?처럼 쓸 수 있습니다.","ko_dialogue":"A: 따뜻한 음료를 마실 수 있을까요?\nB: 네. 차와 커피 중 어떤 것을 드릴까요?","dialogue_pairs":[{"en":"A: Could I have something hot to drink?\nB: Of course. Would you like tea or coffee?","ko":"A: 따뜻한 음료를 마실 수 있을까요?\nB: 네. 차와 커피 중 어떤 것을 드릴까요?"},{"en":"A: I need something warm to wear tonight.\nB: There is a clothing shop near the station.","ko":"A: 오늘 밤 입을 따뜻한 게 필요해요.\nB: 역 근처에 옷가게가 있습니다."}],"pronunciation":"썸씽","id":300},{"day":31,"num":2,"word":"leave","meaning":"떠나다, 두고 가다","hint":"","mnemonic":"leave [리브] → “리브, 입은 옷만 챙겨 떠났네!”\n서둘러 호텔을 나와 버스를 탔습니다. 입은 옷은 따라왔는데 가방은 객실에 두고 왔습니다.\n리브 소리를 ‘입은 것만 들고 떠나, 나머지는 남김’과 연결합니다.\n사람이 떠나면 leave, 물건을 두고 가도 leave.","dialogue":"A: Can I leave my bags here until the afternoon?\nB: Yes. Please keep this claim ticket.","dialogues":["A: Can I leave my bags here until the afternoon?\nB: Yes. Please keep this claim ticket.","A: What time should we leave for the airport?\nB: At six, to avoid the traffic."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 오후까지 여기에 짐을 두어도 될까요?\nB: 네. 이 보관증을 가지고 계세요.","dialogue_pairs":[{"en":"A: Can I leave my bags here until the afternoon?\nB: Yes. Please keep this claim ticket.","ko":"A: 오후까지 여기에 짐을 두어도 될까요?\nB: 네. 이 보관증을 가지고 계세요."},{"en":"A: What time should we leave for the airport?\nB: At six, to avoid the traffic.","ko":"A: 공항으로 몇 시에 출발해야 할까요?\nB: 교통 체증을 피하려면 6시에요."}],"pronunciation":"리브","id":301},{"day":31,"num":3,"word":"luggage","meaning":"짐, 수하물","hint":"","mnemonic":"luggage [러기지] → “러그까지 챙긴 짐!”\n짐을 너무 많이 싼 사람이 여행가방 옆에 커다란 러그까지 말아 세워놨습니다. “러그까지 가져가요?” 하며 산더미 같은 짐을 봅니다.\n러그까지 → 러기지 → 여행 짐, 수하물.\n실제로 러그를 가져가라는 뜻이 아니라 소리 기억용 과장입니다.","dialogue":"A: How many pieces of luggage do you have?\nB: Two suitcases and a backpack.","dialogues":["A: How many pieces of luggage do you have?\nB: Two suitcases and a backpack.","A: Can I leave my luggage here for a few hours?\nB: Yes, we can store it behind the desk."],"caution":"luggage는 셀 수 없는 명사라 보통 a luggage라고 하지 않습니다. a piece of luggage처럼 씁니다.","past":true,"similar":"baggage = 수하물·짐 / suitcase = 여행가방 하나 / carry-on = 기내 반입 가방","note":"luggage는 셀 수 없는 명사라 보통 a luggage라고 하지 않습니다. a piece of luggage처럼 씁니다.","ko_dialogue":"A: 짐이 몇 개 있으신가요?\nB: 여행가방 두 개와 배낭 하나예요.","dialogue_pairs":[{"en":"A: How many pieces of luggage do you have?\nB: Two suitcases and a backpack.","ko":"A: 짐이 몇 개 있으신가요?\nB: 여행가방 두 개와 배낭 하나예요."},{"en":"A: Can I leave my luggage here for a few hours?\nB: Yes, we can store it behind the desk.","ko":"A: 몇 시간 동안 제 짐을 여기 맡겨도 될까요?\nB: 네, 데스크 뒤에 보관해드릴 수 있습니다."}],"pronunciation":"러기지","id":302},{"day":31,"num":4,"word":"blanket","meaning":"담요","hint":"","mnemonic":"blanket [블랭킷] → “불 끄니 냉기, 담요로 끝!”\n비행기 조명이 꺼지자 몸이 으슬으슬합니다. 담요를 어깨부터 덮으니 냉기가 막혀 따뜻해집니다.\n불 + 냉기 + 끝 → 블랭킷 → 담요.","dialogue":"A: Could I have a blanket, please?\nB: Of course. I will bring one to your seat.","dialogues":["A: Could I have a blanket, please?\nB: Of course. I will bring one to your seat.","A: Could I get another blanket? It is cold in here.\nB: Of course, I will bring one right away."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 담요 한 장 받을 수 있을까요?\nB: 네. 좌석으로 가져다드릴게요.","dialogue_pairs":[{"en":"A: Could I have a blanket, please?\nB: Of course. I will bring one to your seat.","ko":"A: 담요 한 장 받을 수 있을까요?\nB: 네. 좌석으로 가져다드릴게요."},{"en":"A: Could I get another blanket? It is cold in here.\nB: Of course, I will bring one right away.","ko":"A: 담요 하나 더 받을 수 있을까요? 여기가 추워요.\nB: 물론입니다. 바로 가져다드릴게요."}],"pronunciation":"블랭킷","id":303},{"day":31,"num":5,"word":"need to","meaning":"~할 필요가 있다","hint":"","mnemonic":"need to [니드 투] → need(필요하다) + to(할).\n→ need to = ~할 필요가 있다 / ~해야 한다","dialogue":"A: Do I need to print my ticket?\nB: No, you can show it on your phone.","dialogues":["A: Do I need to print my ticket?\nB: No, you can show it on your phone.","A: Do I need to print my train ticket?\nB: No, you can show the QR code on your phone."],"caution":"need to + 동사원형. 여행에서는 I need to check in.처럼 매우 자주 씁니다.","past":true,"similar":"","note":"need to + 동사원형. 여행에서는 I need to check in.처럼 매우 자주 씁니다.","ko_dialogue":"A: 표를 출력해야 하나요?\nB: 아니요, 휴대전화로 보여주셔도 돼요.","dialogue_pairs":[{"en":"A: Do I need to print my ticket?\nB: No, you can show it on your phone.","ko":"A: 표를 출력해야 하나요?\nB: 아니요, 휴대전화로 보여주셔도 돼요."},{"en":"A: Do I need to print my train ticket?\nB: No, you can show the QR code on your phone.","ko":"A: 기차표를 출력해야 하나요?\nB: 아니요, 휴대폰의 QR 코드를 보여주시면 됩니다."}],"pronunciation":"니드 투","id":304},{"day":31,"num":6,"word":"should","meaning":"~해야 한다, ~하는 게 좋다","hint":"","mnemonic":"should [슈드] → “슈즈 신고 가는 게 좋겠네!”\n돌이 많은 길을 맨발로 걷겠다는 친구에게 신발을 건넵니다. “슈즈 신고 가는 게 좋겠어요.”\n슈즈를 신으라는 권유 → 슈드 → ~하는 게 좋다, ~해야 한다.\n‘슈즈’는 소리 기억용이며 should의 뜻은 신발과 관계없습니다.","dialogue":"A: Should I book the tour in advance?\nB: Yes, it often sells out.","dialogues":["A: Should I book the tour in advance?\nB: Yes, it often sells out.","A: What time should we leave for the airport?\nB: Around six should be safe."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 투어를 미리 예약하는 게 좋을까요?\nB: 네, 자주 매진돼요.","dialogue_pairs":[{"en":"A: Should I book the tour in advance?\nB: Yes, it often sells out.","ko":"A: 투어를 미리 예약하는 게 좋을까요?\nB: 네, 자주 매진돼요."},{"en":"A: What time should we leave for the airport?\nB: Around six should be safe.","ko":"A: 공항으로 몇 시에 출발하는 게 좋을까요?\nB: 6시쯤이면 안전할 것 같습니다."}],"pronunciation":"슈드","id":305},{"day":31,"num":7,"word":"where should","meaning":"어디에 ~해야 하나요?","hint":"","mnemonic":"where should [웨어 슈드]\nwhere = 어디, should = ~해야.\n→ Where should I go? = 어디로 가야 하나요?","dialogue":"A: Where should I wait for the shuttle?\nB: Outside the main entrance.","dialogues":["A: Where should I wait for the shuttle?\nB: Outside the main entrance.","A: Where should I wait for the shuttle?\nB: Wait by the main entrance."],"caution":"Where should I go?처럼 should 뒤 동사는 원형.","past":true,"similar":"","note":"Where should I go?처럼 should 뒤 동사는 원형.","ko_dialogue":"A: 셔틀은 어디에서 기다려야 하나요?\nB: 정문 밖에서요.","dialogue_pairs":[{"en":"A: Where should I wait for the shuttle?\nB: Outside the main entrance.","ko":"A: 셔틀은 어디에서 기다려야 하나요?\nB: 정문 밖에서요."},{"en":"A: Where should I wait for the shuttle?\nB: Wait by the main entrance.","ko":"A: 셔틀을 어디에서 기다려야 하나요?\nB: 정문 옆에서 기다리세요."}],"pronunciation":"웨어 슈드","id":306},{"day":31,"num":8,"word":"what time does","meaning":"몇 시에 ~하나요?","hint":"","mnemonic":"what time does [왓 타임 더즈]\nwhat time = 몇 시, does 뒤에는 동사원형.\n→ What time does it leave? = 몇 시에 출발하나요?","dialogue":"A: What time does the restaurant open?\nB: At eleven thirty.","dialogues":["A: What time does the restaurant open?\nB: At eleven thirty.","A: What time does the museum open tomorrow?\nB: It opens at nine thirty."],"caution":"What time does the train leave?처럼 does 뒤 동사는 원형.","past":true,"similar":"","note":"What time does the train leave?처럼 does 뒤 동사는 원형.","ko_dialogue":"A: 식당은 몇 시에 여나요?\nB: 11시 30분에요.","dialogue_pairs":[{"en":"A: What time does the restaurant open?\nB: At eleven thirty.","ko":"A: 식당은 몇 시에 여나요?\nB: 11시 30분에요."},{"en":"A: What time does the museum open tomorrow?\nB: It opens at nine thirty.","ko":"A: 박물관은 내일 몇 시에 여나요?\nB: 9시 30분에 엽니다."}],"pronunciation":"왓 타임 더즈","id":307},{"day":31,"num":9,"word":"offer","meaning":"제안하다, 제공하다","hint":"","mnemonic":"offer [오퍼] → “오, 퍼줄게요!”\n식당 주인이 빈 접시를 보고 “오, 수프 더 퍼드릴까요?” 하며 국자를 내밉니다. 손님이 받기 전에 먼저 제공할 뜻을 밝힙니다.\n오 + 퍼줄게 → 오퍼 → 제안하다 / 제공하다.","dialogue":"A: Do you offer airport pickup?\nB: Yes. Please send us your flight details.","dialogues":["A: Do you offer airport pickup?\nB: Yes. Please send us your flight details.","A: Does the hotel offer free airport pickup?\nB: Yes, but you need to book it in advance."],"caution":"offer는 상대에게 먼저 제안·제공하는 느낌. recommend는 ‘이게 더 좋아요’라고 추천하는 느낌입니다.","past":true,"similar":"suggest = 제안하다 / recommend = 추천하다 / provide = 제공하다 / give = 주다","note":"offer는 상대에게 먼저 제안·제공하는 느낌. recommend는 ‘이게 더 좋아요’라고 추천하는 느낌입니다.","ko_dialogue":"A: 공항 픽업을 제공하나요?\nB: 네. 항공편 정보를 보내주세요.","dialogue_pairs":[{"en":"A: Do you offer airport pickup?\nB: Yes. Please send us your flight details.","ko":"A: 공항 픽업을 제공하나요?\nB: 네. 항공편 정보를 보내주세요."},{"en":"A: Does the hotel offer free airport pickup?\nB: Yes, but you need to book it in advance.","ko":"A: 호텔에서 무료 공항 픽업을 제공하나요?\nB: 네, 다만 미리 예약해야 합니다."}],"pronunciation":"오퍼","id":308},{"day":31,"num":10,"word":"baggage storage","meaning":"수하물 보관","hint":"","mnemonic":"baggage(수하물) + storage(보관).\n짐을 맡겨 보관하는 서비스나 공간.","dialogue":"A: Is baggage storage free for hotel guests?\nB: Yes, until the end of your checkout day.","dialogues":["A: Is baggage storage free for hotel guests?\nB: Yes, until the end of your checkout day.","A: Is baggage storage available after checkout?\nB: Yes, guests can use it for free until midnight."],"caution":"","past":true,"similar":"store = 보관하다 / keep = 보관하다 / storage = 보관","note":"","ko_dialogue":"A: 투숙객은 수하물 보관이 무료인가요?\nB: 네, 체크아웃 당일이 끝날 때까지 무료예요.","dialogue_pairs":[{"en":"A: Is baggage storage free for hotel guests?\nB: Yes, until the end of your checkout day.","ko":"A: 투숙객은 수하물 보관이 무료인가요?\nB: 네, 체크아웃 당일이 끝날 때까지 무료예요."},{"en":"A: Is baggage storage available after checkout?\nB: Yes, guests can use it for free until midnight.","ko":"A: 체크아웃 후에도 수하물 보관을 이용할 수 있나요?\nB: 네, 투숙객은 자정까지 무료로 이용할 수 있습니다."}],"pronunciation":"배기지 스토리지","id":309},{"day":32,"num":1,"word":"pharmacy","meaning":"약국","hint":"","mnemonic":"pharmacy [파머시] → “팔 멍이 심해서 약국으로!”\n여행 중 팔에 멍이 든 사람이 약국에 들어가 약사에게 팔을 보여주며 상담합니다.\n팔 + 멍이 + 심해 → 파머시 → 약국.\n이 이야기는 장소와 발음을 연결하는 암기용입니다.","dialogue":"A: Is there a pharmacy open nearby?\nB: Yes, the one across the street is open until ten.","dialogues":["A: Is there a pharmacy open nearby?\nB: Yes, the one across the street is open until ten.","A: Is there a pharmacy open this late?\nB: Yes, there is a twenty-four-hour pharmacy near the hospital."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 근처에 문을 연 약국이 있나요?\nB: 네, 길 건너 약국은 10시까지 열어요.","dialogue_pairs":[{"en":"A: Is there a pharmacy open nearby?\nB: Yes, the one across the street is open until ten.","ko":"A: 근처에 문을 연 약국이 있나요?\nB: 네, 길 건너 약국은 10시까지 열어요."},{"en":"A: Is there a pharmacy open this late?\nB: Yes, there is a twenty-four-hour pharmacy near the hospital.","ko":"A: 이 늦은 시간에도 여는 약국이 있나요?\nB: 네, 병원 근처에 24시간 약국이 있습니다."}],"pronunciation":"파머시","id":310},{"day":32,"num":2,"word":"avail","meaning":"쓸모·도움 / to no avail: 소용없이","hint":"","mnemonic":"avail [어베일] → “어, 베일을 걷으니 도움이 됐네!”\n지도를 덮고 있던 베일을 걷자 길이 보입니다. “어, 베일을 걷으니 도움이 되네!”\n어 + 베일 → 어베일 → 도움, 쓸모.\nto no avail은 그 도움이 전혀 없었다는 뜻으로, ‘소용없이’라고 연결합니다.","dialogue":"A: Did you reach the hotel by phone?\nB: No. I called twice, but to no avail.","dialogues":["A: Did you reach the hotel by phone?\nB: No. I called twice, but to no avail.","A: We tried to find another room, but to no avail.\nB: Then we may need to stay in a different hotel."],"ko_dialogue":"A: 호텔과 전화가 연결됐나요?\nB: 아니요. 두 번 전화했지만 소용이 없었어요.","similar":"to no avail = without success(성공하지 못하고)","note":"심화 표현입니다. to no avail은 ‘소용없이’라는 뜻이며, 쉬운 회화에서는 It did not work.라고도 말합니다.","dialogue_pairs":[{"en":"A: Did you reach the hotel by phone?\nB: No. I called twice, but to no avail.","ko":"A: 호텔과 전화가 연결됐나요?\nB: 아니요. 두 번 전화했지만 소용이 없었어요."},{"en":"A: We tried to find another room, but to no avail.\nB: Then we may need to stay in a different hotel.","ko":"A: 다른 객실을 찾으려고 했지만 소용이 없었어요.\nB: 그럼 다른 호텔에 묵어야 할 수도 있겠네요."}],"pronunciation":"어베일","caution":"심화 표현입니다. to no avail은 ‘소용없이’라는 뜻이며, 쉬운 회화에서는 It did not work.라고도 말합니다.","id":311},{"day":32,"num":3,"word":"able","meaning":"~할 수 있는","hint":"","mnemonic":"able [에이블] → “에이, 볼 하나쯤은 들 수 있어!”\n무거운 공을 들 수 없을 거라 하자 작은 공을 집어 듭니다. “에이, 이 볼은 들 수 있죠!”\n에이 + 볼 → 에이블 → 할 수 있는.\nbe able to 뒤에 할 수 있는 동작을 붙입니다.","dialogue":"A: Will we be able to check in early?\nB: It depends on whether your room is ready.","dialogues":["A: Will we be able to check in early?\nB: It depends on whether your room is ready.","A: Will you be able to store our bags until evening?\nB: Yes, we have plenty of space."],"ko_dialogue":"A: 일찍 체크인할 수 있을까요?\nB: 객실이 준비되었는지에 따라 달라요.","similar":"","note":"","dialogue_pairs":[{"en":"A: Will we be able to check in early?\nB: It depends on whether your room is ready.","ko":"A: 일찍 체크인할 수 있을까요?\nB: 객실이 준비되었는지에 따라 달라요."},{"en":"A: Will you be able to store our bags until evening?\nB: Yes, we have plenty of space.","ko":"A: 저녁까지 저희 짐을 보관해주실 수 있나요?\nB: 네, 공간이 충분합니다."}],"pronunciation":"에이블","caution":"","id":312},{"day":32,"num":4,"word":"firm","meaning":"확고한, 단단한","hint":"","mnemonic":"firm [펌] → “펌으로 머리 모양을 단단히 고정!”\n머리에 펌을 하고 나니 모양이 쉽게 풀리지 않고 유지됩니다. 손으로 눌러도 쉽게 흐트러지지 않는 고정된 느낌을 붙입니다.\n펌으로 단단히 고정 → firm = 단단한, 확고한.\n실제 펌의 성질을 설명하는 것이 아니라 단어의 느낌을 잇는 연상입니다.","dialogue":"A: This pillow is too soft. Do you have a firm one?\nB: Yes. I will bring one to your room.","dialogues":["A: This pillow is too soft. Do you have a firm one?\nB: Yes. I will bring one to your room.","A: Do you have a firmer pillow?\nB: Yes, I can bring a firm pillow to your room."],"ko_dialogue":"A: 이 베개는 너무 푹신해요. 단단한 것이 있나요?\nB: 네. 객실로 가져다드릴게요.","similar":"","note":"","dialogue_pairs":[{"en":"A: This pillow is too soft. Do you have a firm one?\nB: Yes. I will bring one to your room.","ko":"A: 이 베개는 너무 푹신해요. 단단한 것이 있나요?\nB: 네. 객실로 가져다드릴게요."},{"en":"A: Do you have a firmer pillow?\nB: Yes, I can bring a firm pillow to your room.","ko":"A: 더 단단한 베개가 있나요?\nB: 네, 단단한 베개를 객실로 가져다드릴게요."}],"pronunciation":"펌","caution":"","id":313},{"day":32,"num":5,"word":"draw","meaning":"끌다, 당기다, 그리다","hint":"","mnemonic":"draw [드로] → “드르륵 당겨 선을 그려!”\n종이 위에 연필을 대고 손을 쭉 끌어당깁니다. 연필 끝이 움직인 자리에 선이 그어집니다. 커튼도 손으로 드르륵 끌어당겨 닫습니다.\n드르륵 당기는 손 → 드로 → 끌다 / 그리다.","dialogue":"A: Could you draw the route on this map?\nB: Sure. Start here and follow this street.","dialogues":["A: Could you draw the route on this map?\nB: Sure. Start here and follow this street.","A: Could you draw a circle around the station on this map?\nB: Sure, it is right here."],"ko_dialogue":"A: 이 지도에 경로를 그려주시겠어요?\nB: 네. 여기에서 출발해서 이 길을 따라가세요.","similar":"","note":"","dialogue_pairs":[{"en":"A: Could you draw the route on this map?\nB: Sure. Start here and follow this street.","ko":"A: 이 지도에 경로를 그려주시겠어요?\nB: 네. 여기에서 출발해서 이 길을 따라가세요."},{"en":"A: Could you draw a circle around the station on this map?\nB: Sure, it is right here.","ko":"A: 이 지도에서 역에 동그라미를 그려주시겠어요?\nB: 네, 바로 여기입니다."}],"pronunciation":"드로","caution":"","id":314},{"day":32,"num":6,"word":"stock","meaning":"재고","hint":"","mnemonic":"stock [스탁] → “싹 다 쌓아둬!”\n팔 물건을 창고에 싹 다 쌓아둡니다.\n싹 다 쌓아둔 물건 → 스탁.\n→ stock = 재고","dialogue":"A: Do you have this bag in stock?\nB: Yes, in black and brown.","dialogues":["A: Do you have this bag in stock?\nB: Yes, in black and brown.","A: Do you have more of these adapters in stock?\nB: Yes, there are several in the back."],"ko_dialogue":"A: 이 가방 재고가 있나요?\nB: 네, 검은색과 갈색이 있어요.","similar":"","note":"","dialogue_pairs":[{"en":"A: Do you have this bag in stock?\nB: Yes, in black and brown.","ko":"A: 이 가방 재고가 있나요?\nB: 네, 검은색과 갈색이 있어요."},{"en":"A: Do you have more of these adapters in stock?\nB: Yes, there are several in the back.","ko":"A: 이 어댑터 재고가 더 있나요?\nB: 네, 뒤쪽에 여러 개 있습니다."}],"pronunciation":"스탁","caution":"","id":315},{"day":32,"num":7,"word":"re-","meaning":"다시","hint":"","mnemonic":"접두사 re- = 다시.\nrefill(다시 채우다), restock(재고를 다시 채우다). 단독 단어가 아닙니다.","dialogue":"A: Could you refill my water bottle?\nB: Sure. Please take the lid off.","dialogues":["A: Could you refill my water bottle?\nB: Sure. Please take the lid off.","A: Can I refill this bottle here?\nB: Yes, the water station is beside the restroom."],"ko_dialogue":"A: 제 물병에 물을 다시 채워주시겠어요?\nB: 네. 뚜껑을 열어주세요.","similar":"","note":"re-는 접두사입니다. 대화에서는 re-가 들어간 refill을 사용했습니다.","dialogue_pairs":[{"en":"A: Could you refill my water bottle?\nB: Sure. Please take the lid off.","ko":"A: 제 물병에 물을 다시 채워주시겠어요?\nB: 네. 뚜껑을 열어주세요."},{"en":"A: Can I refill this bottle here?\nB: Yes, the water station is beside the restroom.","ko":"A: 여기서 이 병에 물을 다시 채울 수 있나요?\nB: 네, 급수대는 화장실 옆에 있습니다."}],"pronunciation":"리","caution":"re-는 접두사입니다. 대화에서는 re-가 들어간 refill을 사용했습니다.","id":316},{"day":32,"num":8,"word":"inter-","meaning":"사이에, 서로 간","hint":"","mnemonic":"접두사 inter- = 사이에, 서로 간에.\ninternational = 국가 사이의 → 국제적인. 단독 단어가 아닙니다.","dialogue":"A: Where are the international departures?\nB: On the third floor.","dialogues":["A: Where are the international departures?\nB: On the third floor.","A: Is this the line for international departures?\nB: Yes, domestic departures are on the other side."],"ko_dialogue":"A: 국제선 출발 구역은 어디인가요?\nB: 3층에 있어요.","similar":"","note":"inter-는 접두사입니다. 대화에서는 inter-가 들어간 international을 사용했습니다.","dialogue_pairs":[{"en":"A: Where are the international departures?\nB: On the third floor.","ko":"A: 국제선 출발 구역은 어디인가요?\nB: 3층에 있어요."},{"en":"A: Is this the line for international departures?\nB: Yes, domestic departures are on the other side.","ko":"A: 여기가 국제선 출발 줄인가요?\nB: 네, 국내선 출발은 반대편에 있습니다."}],"pronunciation":"인터","caution":"inter-는 접두사입니다. 대화에서는 inter-가 들어간 international을 사용했습니다.","id":317},{"day":32,"num":9,"word":"national","meaning":"국가의","hint":"","mnemonic":"national [내셔널] → nation(국가) + -al(~의).\n→ national = 국가의","dialogue":"A: How far is the national park?\nB: About an hour by bus.","dialogues":["A: How far is the national park?\nB: About an hour by bus.","A: Is this train covered by the national rail pass?\nB: Yes, this route is included."],"ko_dialogue":"A: 국립공원은 얼마나 먼가요?\nB: 버스로 약 한 시간이요.","similar":"","note":"","dialogue_pairs":[{"en":"A: How far is the national park?\nB: About an hour by bus.","ko":"A: 국립공원은 얼마나 먼가요?\nB: 버스로 약 한 시간이요."},{"en":"A: Is this train covered by the national rail pass?\nB: Yes, this route is included.","ko":"A: 이 기차는 전국 철도 패스로 탈 수 있나요?\nB: 네, 이 노선은 포함됩니다."}],"pronunciation":"내셔널","caution":"","id":318},{"day":32,"num":10,"word":"permit","meaning":"허용하다","hint":"","mnemonic":"permit [퍼밋] → “퍼, 마음껏!”\n뷔페에서 음식을 더 떠도 되는지 망설입니다. 직원이 손짓하며 “퍼요, 마음껏!” 하고 허락합니다.\n퍼 + 마음껏 → 퍼밋 → 허용하다.\n허용된 상태는 permitted입니다.","dialogue":"A: Does the museum permit photography?\nB: Yes, except in the special exhibition rooms.","dialogues":["A: Does the museum permit photography?\nB: Yes, except in the special exhibition rooms.","A: Does this park permit bicycles on the walking path?\nB: No, bikes must stay on the road."],"ko_dialogue":"A: 박물관에서 사진 촬영을 허용하나요?\nB: 네. 특별 전시실은 제외하고요.","similar":"","note":"","dialogue_pairs":[{"en":"A: Does the museum permit photography?\nB: Yes, except in the special exhibition rooms.","ko":"A: 박물관에서 사진 촬영을 허용하나요?\nB: 네. 특별 전시실은 제외하고요."},{"en":"A: Does this park permit bicycles on the walking path?\nB: No, bikes must stay on the road.","ko":"A: 이 공원은 산책로에 자전거를 허용하나요?\nB: 아니요, 자전거는 도로로 다녀야 합니다."}],"pronunciation":"퍼밋","caution":"","id":319},{"day":33,"num":1,"word":"prohibit","meaning":"금지하다","hint":"","mnemonic":"prohibit [프로히빗] → “프로도 입에 빗장!”\n하면 안 되는 말을 막으려고 입에 빗장을 거는 모습을 붙입니다.\n프로 + 입 + 빗(장) ≈ 프로히빗.\n→ prohibit = 금지하다","dialogue":"A: Do the rules prohibit swimming here?\nB: Yes. Please use the beach farther down the coast.","dialogues":["A: Do the rules prohibit swimming here?\nB: Yes. Please use the beach farther down the coast.","A: Do local rules prohibit drinking alcohol on the beach?\nB: Yes, alcohol is not allowed after sunset."],"ko_dialogue":"A: 규정상 여기에서 수영이 금지되어 있나요?\nB: 네. 해안을 따라 더 내려가면 있는 해변을 이용하세요.","similar":"","note":"","dialogue_pairs":[{"en":"A: Do the rules prohibit swimming here?\nB: Yes. Please use the beach farther down the coast.","ko":"A: 규정상 여기에서 수영이 금지되어 있나요?\nB: 네. 해안을 따라 더 내려가면 있는 해변을 이용하세요."},{"en":"A: Do local rules prohibit drinking alcohol on the beach?\nB: Yes, alcohol is not allowed after sunset.","ko":"A: 현지 규정상 해변에서 술 마시는 것이 금지되나요?\nB: 네, 해가 진 뒤에는 술이 허용되지 않습니다."}],"pronunciation":"프로히빗","caution":"","id":320},{"day":33,"num":2,"word":"afford","meaning":"감당할 수 있다","hint":"","mnemonic":"afford [어포드] → “어, 포드 자동차도 살 수 있네!”\n통장 잔액과 중고 포드 자동차 가격을 비교합니다. 내 예산 안에서 살 수 있다는 걸 알고 “어, 포드도 감당할 수 있네!” 합니다.\n어 + 포드 → 어포드 → 비용을 감당할 여유가 있다.\ncan afford는 살 여유가 있다, cannot afford는 살 여유가 없다. 차가 원래 싸다는 뜻은 아닙니다.","dialogue":"A: Can we afford another night at this hotel?\nB: Yes, if we choose the standard room.","dialogues":["A: Can we afford another night at this hotel?\nB: Yes, if we choose the standard room.","A: We cannot afford a taxi every day.\nB: Let us buy a weekly transit pass instead."],"ko_dialogue":"A: 이 호텔에서 하룻밤 더 묵을 여유가 있나요?\nB: 네, 일반 객실로 고르면요.","similar":"","note":"","dialogue_pairs":[{"en":"A: Can we afford another night at this hotel?\nB: Yes, if we choose the standard room.","ko":"A: 이 호텔에서 하룻밤 더 묵을 여유가 있나요?\nB: 네, 일반 객실로 고르면요."},{"en":"A: We cannot afford a taxi every day.\nB: Let us buy a weekly transit pass instead.","ko":"A: 매일 택시를 탈 형편은 안 돼요.\nB: 대신 일주일 교통패스를 사요."}],"pronunciation":"어포드","caution":"","id":321},{"day":33,"num":3,"word":"prefer","meaning":"더 좋아하다, 선호하다","hint":"","mnemonic":"prefer [프리퍼] → “프리하게 다니는 쪽이 더 좋아!”\n정해진 단체 일정과 자유여행 중에서 고릅니다. “나는 프리하게 다니는 게 더 좋아!” 하며 자유여행을 집습니다.\n프리한 쪽을 더 좋아함 → 프리퍼 → 선호하다.\n대상은 음식·좌석·여행 방식 등 무엇이든 될 수 있습니다.","dialogue":"A: Do you prefer to walk or take a taxi?\nB: I prefer to walk. It is not far.","dialogues":["A: Do you prefer to walk or take a taxi?\nB: I prefer to walk. It is not far.","A: Would you prefer a room with one bed or two?\nB: I prefer two beds, please."],"ko_dialogue":"A: 걷는 것과 택시 타는 것 중 어느 쪽을 더 원하세요?\nB: 걷는 게 좋아요. 멀지 않잖아요.","similar":"","note":"","dialogue_pairs":[{"en":"A: Do you prefer to walk or take a taxi?\nB: I prefer to walk. It is not far.","ko":"A: 걷는 것과 택시 타는 것 중 어느 쪽을 더 원하세요?\nB: 걷는 게 좋아요. 멀지 않잖아요."},{"en":"A: Would you prefer a room with one bed or two?\nB: I prefer two beds, please.","ko":"A: 침대 한 개와 두 개 중 어느 객실을 선호하시나요?\nB: 침대 두 개인 객실이 좋아요."}],"pronunciation":"프리퍼","caution":"","id":322},{"day":33,"num":4,"word":"attract","meaning":"끌어당기다","hint":"","mnemonic":"attract [어트랙트] → “어, 트랙터가 끌어당긴다!”\n트랙터가 무거운 짐을 끌어당기듯, 멋진 관광지 사진이 내 관심을 자기 쪽으로 끌어당깁니다. 눈길이 자꾸 그쪽으로 갑니다.\n어 + 트랙터 → 어트랙트 → 끌어당기다, 관심을 끌다.","dialogue":"A: What attracts visitors to this village?\nB: Its traditional houses and local food.","dialogues":["A: What attracts visitors to this village?\nB: Its traditional houses and local food.","A: What attracts so many visitors to this island?\nB: The beaches and hiking trails are the main reasons."],"ko_dialogue":"A: 무엇 때문에 방문객들이 이 마을을 찾나요?\nB: 전통 가옥과 지역 음식 때문이에요.","similar":"","note":"","dialogue_pairs":[{"en":"A: What attracts visitors to this village?\nB: Its traditional houses and local food.","ko":"A: 무엇 때문에 방문객들이 이 마을을 찾나요?\nB: 전통 가옥과 지역 음식 때문이에요."},{"en":"A: What attracts so many visitors to this island?\nB: The beaches and hiking trails are the main reasons.","ko":"A: 무엇이 이렇게 많은 방문객을 이 섬으로 끌어들이나요?\nB: 해변과 등산로가 가장 큰 이유입니다."}],"pronunciation":"어트랙트","caution":"","id":323},{"day":33,"num":5,"word":"occupy","meaning":"차지하다, 점유하다","hint":"","mnemonic":"occupy [아큐파이] → “아! 꽉 파고앉았네!”\n누군가 빈자리에 깊숙이 앉아 자리를 꽉 차지합니다.\n아큐파이 ≈ 아! 꽉 파고앉다.\n→ occupy = 차지하다 / 점유하다","dialogue":"A: Can four people occupy this room?\nB: No, the maximum is three guests.","dialogues":["A: Can four people occupy this room?\nB: No, the maximum is three guests.","A: These bags occupy too much space in the aisle.\nB: I will move them to the luggage rack."],"ko_dialogue":"A: 이 객실에 네 명이 투숙할 수 있나요?\nB: 아니요, 최대 세 명입니다.","similar":"","note":"occupy는 다소 격식 있는 표현입니다. 평소 객실을 문의할 때는 Can four people stay in this room?도 자연스럽습니다.","dialogue_pairs":[{"en":"A: Can four people occupy this room?\nB: No, the maximum is three guests.","ko":"A: 이 객실에 네 명이 투숙할 수 있나요?\nB: 아니요, 최대 세 명입니다."},{"en":"A: These bags occupy too much space in the aisle.\nB: I will move them to the luggage rack.","ko":"A: 이 가방들이 통로 공간을 너무 많이 차지하네요.\nB: 짐 선반으로 옮길게요."}],"pronunciation":"아큐파이","caution":"occupy는 다소 격식 있는 표현입니다. 평소 객실을 문의할 때는 Can four people stay in this room?도 자연스럽습니다.","id":324},{"day":33,"num":6,"word":"exhibit","meaning":"전시하다, 전시품","hint":"","mnemonic":"exhibit [이그지빗] → “이거, 집에 두지 말고 보여줘!”\n집에만 숨겨둔 멋진 그림을 친구가 발견합니다. “이거 집에 두기 아까워. 사람들이 보게 꺼내!” 그림을 꺼내 전시합니다.\n이거 + 집에 → 이그지… → 전시하다 / 전시품.","dialogue":"A: Does this gallery exhibit local artists’ work?\nB: Yes, all these paintings are by local artists.","dialogues":["A: Does this gallery exhibit local artists’ work?\nB: Yes, all these paintings are by local artists.","A: Which floor has the photography exhibit?\nB: The exhibit is on the second floor."],"ko_dialogue":"A: 이 갤러리는 지역 작가들의 작품을 전시하나요?\nB: 네, 이 그림들은 모두 지역 작가들의 작품이에요.","similar":"","note":"","dialogue_pairs":[{"en":"A: Does this gallery exhibit local artists’ work?\nB: Yes, all these paintings are by local artists.","ko":"A: 이 갤러리는 지역 작가들의 작품을 전시하나요?\nB: 네, 이 그림들은 모두 지역 작가들의 작품이에요."},{"en":"A: Which floor has the photography exhibit?\nB: The exhibit is on the second floor.","ko":"A: 사진 전시는 몇 층에 있나요?\nB: 전시는 2층에 있습니다."}],"pronunciation":"이그지빗","caution":"","id":325},{"day":33,"num":7,"word":"prescribe","meaning":"처방하다","hint":"","mnemonic":"prescribe [프리스크라이브] → “미리 써주는 약 복용 스크립트!”\n배우가 대사를 보고 연기하도록 스크립트(대본)를 써주듯, 의사가 환자에게 어떤 약을 어떻게 먹을지 미리 써줍니다. 환자는 그 처방전을 가지고 약국에 갑니다.\npre(미리) + scribe(쓰다) → 의사가 약 이름과 복용법을 미리 써준다 → 처방하다.\n‘의사가 써주는 약 복용 대본’으로 연결합니다.","dialogue":"A: Did the doctor prescribe any medicine?\nB: Yes. I need to take this prescription to a pharmacy.","dialogues":["A: Did the doctor prescribe any medicine?\nB: Yes. I need to take this prescription to a pharmacy.","A: Can a doctor here prescribe medicine for this allergy?\nB: Yes, the clinic is open until eight."],"ko_dialogue":"A: 의사가 약을 처방했나요?\nB: 네. 이 처방전을 약국에 가져가야 해요.","similar":"","note":"","dialogue_pairs":[{"en":"A: Did the doctor prescribe any medicine?\nB: Yes. I need to take this prescription to a pharmacy.","ko":"A: 의사가 약을 처방했나요?\nB: 네. 이 처방전을 약국에 가져가야 해요."},{"en":"A: Can a doctor here prescribe medicine for this allergy?\nB: Yes, the clinic is open until eight.","ko":"A: 여기 의사가 이 알레르기에 약을 처방해줄 수 있나요?\nB: 네, 진료소는 8시까지 운영합니다."}],"pronunciation":"프리스크라이브","caution":"","id":326},{"day":33,"num":8,"word":"claim","meaning":"요구하다, 자기 것이라고 주장하다/찾아가다","hint":"","mnemonic":"claim [클레임] → “크게 외침! ‘그거 제 거예요!’”\n내 물건을 다른 사람이 가져가려 하자 크게 외쳐 내 것이라고 주장합니다.\n클레임 ≈ 크게 외침.\n→ claim = 주장하다 / 요구하다 / 찾아가다","dialogue":"A: Where can I claim my lost bag?\nB: At the lost property desk near the exit.","dialogues":["A: Where can I claim my lost bag?\nB: At the lost property desk near the exit.","A: Where do I claim my checked baggage?\nB: Go downstairs to carousel six."],"ko_dialogue":"A: 잃어버린 제 가방은 어디에서 찾을 수 있나요?\nB: 출구 근처 분실물 데스크에서요.","similar":"","note":"","dialogue_pairs":[{"en":"A: Where can I claim my lost bag?\nB: At the lost property desk near the exit.","ko":"A: 잃어버린 제 가방은 어디에서 찾을 수 있나요?\nB: 출구 근처 분실물 데스크에서요."},{"en":"A: Where do I claim my checked baggage?\nB: Go downstairs to carousel six.","ko":"A: 위탁 수하물은 어디에서 찾나요?\nB: 아래층 6번 벨트로 가세요."}],"pronunciation":"클레임","caution":"","id":327},{"day":33,"num":9,"word":"fund","meaning":"자금을 대다 / 자금, 기금","hint":"","mnemonic":"fund [펀드] → “푼돈을 모아 큰돈으로!”\n조금씩 모은 푼돈이 여행에 쓸 자금이 됩니다.\n펀드 ≈ 푼돈.\n→ fund = 자금 / 기금 / 자금을 대다","dialogue":"A: What does the entrance fee help fund?\nB: It helps fund repairs to the castle.","dialogues":["A: What does the entrance fee help fund?\nB: It helps fund repairs to the castle.","A: The city uses this tax to fund public transportation.\nB: That explains why the buses are so affordable."],"ko_dialogue":"A: 입장료는 어떤 일에 자금을 대는 데 쓰이나요?\nB: 성 보수 비용을 충당하는 데 쓰여요.","similar":"","note":"이 카드는 fund의 동사 용법(자금을 대다)을 연습합니다.","dialogue_pairs":[{"en":"A: What does the entrance fee help fund?\nB: It helps fund repairs to the castle.","ko":"A: 입장료는 어떤 일에 자금을 대는 데 쓰이나요?\nB: 성 보수 비용을 충당하는 데 쓰여요."},{"en":"A: The city uses this tax to fund public transportation.\nB: That explains why the buses are so affordable.","ko":"A: 이 도시는 이 세금으로 대중교통에 자금을 댑니다.\nB: 그래서 버스 요금이 저렴한 거군요."}],"pronunciation":"펀드","caution":"이 카드는 fund의 동사 용법(자금을 대다)을 연습합니다.","id":328},{"day":33,"num":10,"word":"return","meaning":"돌려주다, 돌아오다","hint":"","mnemonic":"return [리턴] → “다시 턴해서 원래 자리로!”\n빌린 차를 타고 여행하다가 마지막 날 다시 방향을 돌려 렌터카 영업소로 갑니다. 차가 출발했던 자리로 돌아와 반납됩니다.\n다시(re) + 턴(turn) → 리턴 → 돌아오다 / 돌려주다.","dialogue":"A: When should I return     a=[...a].sort((x,y)=>{
      const hx=Math.sin([...x.word].reduce((s,ch)=>s+ch.charCodeAt(0),0)+seed*10000);
      const hy=Math.sin([...y.word].reduce((s,ch)=>s+ch.charCodeAt(0),0)+seed*10000);

    });
  }

}

function setSpeechRate(value){

 stopSpeech();speechRate=Math.max(.5,Math.min(1.5,n));storage.setItem('speechRate',String(speechRate));

async function speakText(text,mode='sentence'){
 stopSpeech();TravelAudio.unlock();await TravelAudio.play(cleanSpeechText(text),speechGender,speechRate);
}
async function speakSequence(items){
 stopSpeech();TravelAudio.unlock();const run=speechRun;
 const list=(items||[]).map(item=>({text:cleanSpeechText(typeof item==='string'?item:item.text),pause:typeof item==='object'&&Number.isFinite(item.pause)?item.pause:430})).filter(x=>x.text);
 for(const item of list){
  if(run!==speechRun)return;
  const played=await TravelAudio.play(item.text,speechGender,speechRate);
  if(!played||run!==speechRun)return;
  await new Promise(resolve=>{speechWait=resolve;speechTimer=setTimeout(()=>{speechWait=null;resolve()},item.pause)});
 }
}

function speakCurrentCard(){
  const c=current();
  if(!c) return;

  const items=[{text:c.word,mode:'word',pause:520}];
  const pairs=Array.isArray(c.dialogue_pairs)?c.dialogue_pairs:[];

  pairs.forEach((p,pairIndex)=>{
    const lines=String(p.en||'').split('\n').filter(Boolean);
    lines.forEach((line,lineIndex)=>{
      // Slightly longer pause after the reply and between examples.
      const isLastLine=lineIndex===lines.length-1;
      const isLastPair=pairIndex===pairs.length-1;
      items.push({
        text:line,
        mode:'sentence',
        pause:isLastLine ? (isLastPair ? 300 : 720) : 430
      });
    });
  });

  speakSequence(items);
}

function stopSpeech(){
 speechRun++;clearTimeout(speechTimer);speechTimer=null;

 TravelAudio.stop();setSpeechStatus('재생 대기');
}

function parseAiCardPayload(data){
  if(!data || typeof data!=='object') throw new Error('AI 응답 형식이 올바르지 않습니다.');
  const d=data.card && typeof data.card==='object' ? data.card : data;
  if(!d.meaning || !d.pronunciation || !d.mnemonic) throw new Error('AI 응답에 뜻/발음/연상법이 빠졌습니다.');
  if(!Array.isArray(d.dialogues) || d.dialogues.length<2) throw new Error('AI 예문이 2개보다 적습니다.');
  return d;
}

async function aiAutofillCurrentWord(){
  const word=(document.getElementById('aw')?.value||'').trim();
  if(!word){alert('먼저 영단어 또는 표현을 입력해주세요.');return}

  const endpoint=(storage.getItem('travelAiEndpoint')||'').replace(/\/+$/,'');
  const token=storage.getItem('travelAiToken')||'';

  if(!endpoint){
    setAiStatus('AI 연결 주소가 아직 없습니다. 아래 ⚙️ AI 연결 설정에 Worker 주소를 한 번만 넣어주세요.');
    const details=document.querySelector('.ai-settings');
    if(details) details.open=true;
    return;
  }

  const btn=document.getElementById('aiFillBtn');
  btn.disabled=true;
  btn.textContent='⏳ 만드는 중...';
  setAiStatus(`“${word}” 뜻 · 발음 · 연상법 · 여행대화 2개를 만들고 있습니다...`);

  try{
    const res=await fetch(endpoint+'/autofill',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        ...(token?{'X-App-Token':token}:{})
      },
      body:JSON.stringify({word})
    });

    let data=null;
    try{data=await res.json()}catch(e){}
    if(!res.ok){
      throw new Error((data&&data.error)||`AI 서버 오류 (${res.status})`);
    }

    const d=parseAiCardPayload(data);

    document.getElementById('ap').value=d.pronunciation||'';
    document.getElementById('am').value=d.meaning||'';
    document.getElementById('amn').value=d.mnemonic||'';
    document.getElementById('ac').value=d.similar||d.caution||'';

    const pairs=d.dialogues.slice(0,3);
    [1,2,3].forEach((n,idx)=>{
      const p=pairs[idx]||{};
      document.getElementById('ad'+n).value=p.en||'';
      document.getElementById('ak'+n).value=p.ko||'';
    });

    setAiStatus('자동완성했습니다. 내용 한 번 확인하고 “저장하고 카드에 추가”를 누르세요.');
  }catch(err){
    console.error(err);
    setAiStatus('자동완성 실패: '+(err?.message||String(err)));
  }finally{
    btn.disabled=false;
    btn.textContent='✨ AI 자동완성';
  }
}

function saveCustom(){
  const word=document.getElementById('aw').value.trim();
  const pronunciation=document.getElementById('ap').value.trim();
  const meaning=document.getElementById('am').value.trim();

  if(!word||!meaning){alert('단어와 뜻은 꼭 입력해주세요.');return}

  const dialogue_pairs=[];
  [1,2,3].forEach(n=>{
    const en=(document.getElementById('ad'+n)?.value||'').trim();
    const ko=(document.getElementById('ak'+n)?.value||'').trim();
    if(en) dialogue_pairs.push({en,ko});
  });

  const c={
    word,
    pronunciation,
    meaning,
    mnemonic:document.getElementById('amn').value.trim(),
    dialogues:dialogue_pairs.map(p=>p.en),
    dialogue_pairs,
    similar:document.getElementById('ac').value.trim(),
    caution:'',
    note:'',
    custom:true,
    day:'MY',
    num:customCards.length+1
  };

  customCards.push(c);
  storage.setItem('travelCustomCards',JSON.stringify(customCards));
  alert('추가했습니다.');
  renderAdd();
}
function deleteCustom(i){
  if(!confirm('이 단어를 삭제할까요?'))return;
  customCards.splice(i,1);storage.setItem('travelCustomCards',JSON.stringify(customCards));renderAdd();
}
function render(){const eb=document.getElementById('edit-current-card-btn');if(eb)eb.style.display=mode==='cards'?'block':'none';updateButtons(); if(mode==='search')renderSearch(); else if(mode==='add')renderAdd(); else renderCards()}
function updateButtons(){
  document.getElementById('shuffleBtn').classList.toggle('active',shuffled);
  document.getElementById('hideBtn').classList.toggle('active',hideMeaning);
  document.getElementById('hideMnemonicBtn').classList.toggle('active',hideMnemonic);
  document.getElementById('bookBtn').classList.toggle('active',bookMode);
  document.getElementById('wrongBtn').classList.toggle('active',wrongOnly);
}
function nextCard(){stopSpeech();const a=activeCards();if(!a.length)return;index=(index+1)%a.length;revealed=!hideMeaning;mnemonicRevealed=!hideMnemonic;englishRevealed=false;mode='cards';render()}
function prevCard(){stopSpeech();const a=activeCards();if(!a.length)return;index=(index-1+a.length)%a.length;revealed=!hideMeaning;mnemonicRevealed=!hideMnemonic;englishRevealed=false;mode='cards';render()}
function toggleWrong(){const c=current();if(!c)return;if(wrongSet.has(c.word))wrongSet.delete(c.word);else wrongSet.add(c.word);saveState();render()}
function jumpToWord(word){
  wrongOnly=false;mode='cards';const a=activeCards();const i=a.findIndex(c=>c.word===word);index=i>=0?i:0;revealed=!hideMeaning;mnemonicRevealed=!hideMnemonic;render();
}
document.getElementById('searchBtn').onclick=()=>{mode=mode==='search'?'cards':'search';render()};
document.getElementById('addBtn').onclick=()=>{mode=mode==='add'?'cards':'add';render()};
document.getElementById('shuffleBtn').onclick=()=>{
  shuffled=!shuffled;if(shuffled)storage.setItem('travelShuffleSeed',String(Math.random()*1000));index=0;revealed=!hideMeaning;mnemonicRevealed=!hideMnemonic;saveState();mode='cards';render()
};
document.getElementById('hideBtn').onclick=()=>{hideMeaning=!hideMeaning;revealed=!hideMeaning;saveState();mode='cards';render()};
document.getElementById('hideMnemonicBtn').onclick=()=>{hideMnemonic=!hideMnemonic;mnemonicRevealed=!hideMnemonic;saveState();mode='cards';render()};
document.getElementById('bookBtn').onclick=()=>{bookMode=!bookMode;saveState();mode='cards';render()};
document.getElementById('wrongBtn').onclick=()=>{wrongOnly=!wrongOnly;index=0;revealed=!hideMeaning;mnemonicRevealed=!hideMnemonic;mode='cards';render()};
document.getElementById('prevBtn').onclick=prevCard;
document.getElementById('nextBtn').onclick=nextCard;

document.addEventListener('keydown',e=>{if(mode==='cards'&&e.key==='ArrowRight')nextCard();if(mode==='cards'&&e.key==='ArrowLeft')prevCard()});
render();
</script>

<script>
(function(){
  let startX=0, startY=0, active=false;

  document.addEventListener('touchstart', function(e){
    if(mode!=='cards' || !e.touches || e.touches.length!==1) return;
    const t=e.touches[0];
    startX=t.clientX;
    startY=t.clientY;
    active=true;
  }, {passive:true});

  document.addEventListener('touchend', function(e){
    if(!active || mode!=='cards') return;
    active=false;
    if(!e.changedTouches || !e.changedTouches.length) return;

    const t=e.changedTouches[0];
    const dx=t.clientX-startX;
    const dy=t.clientY-startY;

    // 가로 이동이 충분히 크고 세로 스크롤보다 명확할 때만 넘김
    if(Math.abs(dx) >= 65 && Math.abs(dx) > Math.abs(dy)*1.35){
      if(dx < 0) nextCard();
      else prevCard();
    }
  }, {passive:true});
})();
</script>


<script>
(function(){
  const installBtn = document.getElementById('installBtn');
  let deferredInstallPrompt = null;

  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.navigator.standalone === true;
  }

  function updateInstallButton(){
    if(!installBtn) return;
    if(isStandalone()){
      installBtn.style.display='none';
      return;
    }
    installBtn.style.display='inline-block';
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    updateInstallButton();
  });

  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    if(installBtn) installBtn.style.display='none';
  });

  if(installBtn){
    installBtn.addEventListener('click', async () => {
      if(isStandalone()){
        installBtn.style.display='none';
        return;
      }

      if(deferredInstallPrompt){
        deferredInstallPrompt.prompt();
        try { await deferredInstallPrompt.userChoice; } catch(e) {}
        deferredInstallPrompt = null;
        return;
      }

      alert('크롬 오른쪽 위 ⋮ 메뉴에서 “앱 설치” 또는 “홈 화면에 추가”를 눌러주세요. 메뉴가 바로 안 보이면 페이지를 한 번 새로고침한 뒤 다시 확인해주세요.');
    });
  }

  updateInstallButton();
})();
</script>
