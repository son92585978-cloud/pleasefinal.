 phone?\nB: Yes, there are outlets by the window.","caution":"이 표현 뒤에는 보통 동사원형이 옵니다. 여행에서 바로 문장으로 붙여 쓰는 연습을 하세요.","dialogues":["A: Is there a place to charge my phone?\nB: Yes, there are outlets by the window.","A: Is there a quiet place to sit near the gate?\nB: Yes, there is a lounge upstairs."],"similar":"","note":"이 표현 뒤에는 보통 동사원형이 옵니다. 여행에서 바로 문장으로 붙여 쓰는 연습을 하세요.","ko_dialogue":"A: 휴대전화를 충전할 곳이 있나요?\nB: 네, 창가에 콘센트가 있어요.","dialogue_pairs":[{"en":"A: Is there a place to charge my phone?\nB: Yes, there are outlets by the window.","ko":"A: 휴대전화를 충전할 곳이 있나요?\nB: 네, 창가에 콘센트가 있어요."},{"en":"A: Is there a quiet place to sit near the gate?\nB: Yes, there is a lounge upstairs.","ko":"A: 탑승구 근처에 조용히 앉아 있을 곳이 있나요?\nB: 네, 위층에 라운지가 있습니다."}],"pronunciation":"플레이스 투","id":76},{"day":8,"num":8,"word":"join a tour","meaning":"투어에 참가하다","hint":"","mnemonic":"join a tour [조인 어 투어]\njoin = 합류하다, tour = 투어.\n투어 팀에 합류한다.\n→ join a tour = 투어에 참가하다","dialogue":"A: Can we join a tour this afternoon?\nB: Yes, there are two places left on the three o’clock tour.","caution":"","dialogues":["A: Can we join a tour this afternoon?\nB: Yes, there are two places left on the three o’clock tour.","A: Can we join a tour without booking online?\nB: Yes, if there are seats left when you arrive."],"similar":"","note":"","ko_dialogue":"A: 오늘 오후에 투어에 참가할 수 있나요?\nB: 네, 3시 투어에 두 자리 남아 있어요.","dialogue_pairs":[{"en":"A: Can we join a tour this afternoon?\nB: Yes, there are two places left on the three o’clock tour.","ko":"A: 오늘 오후에 투어에 참가할 수 있나요?\nB: 네, 3시 투어에 두 자리 남아 있어요."},{"en":"A: Can we join a tour without booking online?\nB: Yes, if there are seats left when you arrive.","ko":"A: 온라인 예약 없이 투어에 참가할 수 있나요?\nB: 네, 도착했을 때 자리가 남아 있으면 가능합니다."}],"pronunciation":"조인 어 투어","id":77},{"day":8,"num":9,"word":"ATM","meaning":"현금자동입출금기","hint":"","mnemonic":"ATM → “은행 직원 대신 기계가 돈을!”\n작은 은행 창구 안에 사람이 아니라 기계가 앉아 있습니다. 카드를 넣고 금액을 누르면 기계가 지폐를 내밉니다.\n자동으로 일하는 은행 창구 → Automated Teller Machine → ATM, 현금자동입출금기.","dialogue":"A: Is there an ATM near here?\nB: Yes, inside the convenience store.","caution":"","dialogues":["A: Is there an ATM near here?\nB: Yes, inside the convenience store.","A: Is there an ATM that accepts foreign cards?\nB: Yes, there is one next to the bank entrance."],"similar":"","note":"","ko_dialogue":"A: 이 근처에 현금인출기가 있나요?\nB: 네, 편의점 안에 있어요.","dialogue_pairs":[{"en":"A: Is there an ATM near here?\nB: Yes, inside the convenience store.","ko":"A: 이 근처에 현금인출기가 있나요?\nB: 네, 편의점 안에 있어요."},{"en":"A: Is there an ATM that accepts foreign cards?\nB: Yes, there is one next to the bank entrance.","ko":"A: 해외 카드를 받는 ATM이 있나요?\nB: 네, 은행 입구 옆에 하나 있습니다."}],"pronunciation":"에이티엠","id":78},{"day":8,"num":10,"word":"withdraw","meaning":"인출하다","hint":"","mnemonic":"withdraw [위드드로] → “위에서 드르륵 돈이 나와!”\nATM에서 돈이 위쪽 출구로 드르륵 빠져나오는 모습을 붙입니다.\n위 + 드르륵 ≈ 위드드로.\n→ withdraw = 인출하다","dialogue":"A: Can I withdraw cash with this card?\nB: Yes. Insert it and choose your language.","caution":"ATM에서는 withdraw cash가 기본 표현. withdraw money도 가능하지만 cash가 더 자연스럽습니다.","dialogues":["A: Can I withdraw cash with this card?\nB: Yes. Insert it and choose your language.","A: I need to withdraw some cash before we leave town.\nB: There is an ATM across from the station."],"similar":"withdraw = 인출하다 / withdrawal = 인출(명사) / deposit = 입금·보증금","note":"ATM에서는 withdraw cash가 기본 표현. withdraw money도 가능하지만 cash가 더 자연스럽습니다.","ko_dialogue":"A: 이 카드로 현금을 인출할 수 있나요?\nB: 네. 카드를 넣고 언어를 선택하세요.","dialogue_pairs":[{"en":"A: Can I withdraw cash with this card?\nB: Yes. Insert it and choose your language.","ko":"A: 이 카드로 현금을 인출할 수 있나요?\nB: 네. 카드를 넣고 언어를 선택하세요."},{"en":"A: I need to withdraw some cash before we leave town.\nB: There is an ATM across from the station.","ko":"A: 시내를 떠나기 전에 현금을 좀 인출해야 해요.\nB: 역 맞은편에 ATM이 있습니다."}],"pronunciation":"위드드로","id":79},{"day":9,"num":1,"word":"confirm","meaning":"확인하다","hint":"","mnemonic":"confirm [컨펌] → “최종 컨펌 받았어?” = 확인·확정됐어?\nfirm = 확고한 → 내용을 확고하게 만든다.\n→ confirm = 확인하다 / 확정하다","dialogue":"A: I would like to confirm my reservation for tonight.\nB: Certainly. What name is it under?","caution":"confirm은 이미 잡힌 내용이 맞는지 확인·확정할 때 자주 씁니다. verify는 신분·정보가 진짜인지 검증하는 느낌이 더 강합니다.","dialogues":["A: I would like to confirm my reservation for tonight.\nB: Certainly. What name is it under?","A: Could you confirm my pickup time for tomorrow?\nB: Yes, the driver will be here at seven thirty."],"similar":"check = 확인하다 / verify = 사실인지 검증하다 / make sure = 확실히 하다 / approve = 승인하다","note":"confirm은 이미 잡힌 내용이 맞는지 확인·확정할 때 자주 씁니다. verify는 신분·정보가 진짜인지 검증하는 느낌이 더 강합니다.","ko_dialogue":"A: 오늘 밤 예약을 확인하고 싶어요.\nB: 네. 어떤 이름으로 예약하셨나요?","dialogue_pairs":[{"en":"A: I would like to confirm my reservation for tonight.\nB: Certainly. What name is it under?","ko":"A: 오늘 밤 예약을 확인하고 싶어요.\nB: 네. 어떤 이름으로 예약하셨나요?"},{"en":"A: Could you confirm my pickup time for tomorrow?\nB: Yes, the driver will be here at seven thirty.","ko":"A: 내일 픽업 시간을 확인해주시겠어요?\nB: 네, 기사님이 7시 30분에 올 예정입니다."}],"pronunciation":"컨펌","id":80},{"day":9,"num":2,"word":"entrance","meaning":"입구","hint":"","mnemonic":"entrance [엔트런스] → “엔터를 누르니 들어간다!”\n키보드의 엔터(enter) 키가 사람만큼 큰 문이 되었습니다. 엔터를 누르자 문이 열리고 건물 안으로 들어갑니다.\n엔터 → 들어가다 → 들어가는 문 → entrance = 입구.","dialogue":"A: Is this the entrance to the museum?\nB: Yes. Please have your ticket ready.","caution":"","dialogues":["A: Is this the entrance to the museum?\nB: Yes. Please have your ticket ready.","A: I cannot find the museum entrance.\nB: It is around the corner on the left."],"similar":"","note":"","ko_dialogue":"A: 여기가 박물관 입구인가요?\nB: 네. 표를 준비해주세요.","dialogue_pairs":[{"en":"A: Is this the entrance to the museum?\nB: Yes. Please have your ticket ready.","ko":"A: 여기가 박물관 입구인가요?\nB: 네. 표를 준비해주세요."},{"en":"A: I cannot find the museum entrance.\nB: It is around the corner on the left.","ko":"A: 박물관 입구를 못 찾겠어요.\nB: 왼쪽 모퉁이를 돌면 있습니다."}],"pronunciation":"엔트런스","id":81},{"day":9,"num":3,"word":"last","meaning":"마지막의, 지난, 지속되다","hint":"","mnemonic":"last [래스트] → 줄의 맨 끝에 마지막 하나가 남아 있다.\n→ last = 마지막의\n시간 앞에서는 ‘지난’ → last week = 지난주","dialogue":"A: What time is the last bus?\nB: At eleven thirty tonight.","caution":"","dialogues":["A: What time is the last bus?\nB: At eleven thirty tonight.","A: How long does the show last?\nB: About an hour."],"similar":"","note":"","ko_dialogue":"A: 막차가 몇 시인가요?\nB: 오늘 밤 11시 30분입니다.","dialogue_pairs":[{"en":"A: What time is the last bus?\nB: At eleven thirty tonight.","ko":"A: 막차가 몇 시인가요?\nB: 오늘 밤 11시 30분입니다."},{"en":"A: How long does the show last?\nB: About an hour.","ko":"A: 공연은 얼마나 오래 진행되나요?\nB: 약 한 시간이에요."}],"pronunciation":"래스트","id":82},{"day":9,"num":4,"word":"break","meaning":"쉬다, 깨뜨리다, 잔돈으로 바꾸다","hint":"","mnemonic":"break [브레이크] → ‘깨다/끊다’.\n물건을 깨고, 일의 흐름을 끊고 쉬고, 큰돈을 쪼갠다.\n→ break = 깨다 / 쉬다 / 쪼개다","dialogue":"A: Can we take a break here?\nB: Sure. Let us sit down for a few minutes.","caution":"","dialogues":["A: Can we take a break here?\nB: Sure. Let us sit down for a few minutes.","A: Let us take a break before we climb the hill.\nB: Good idea. There is a cafe over there."],"similar":"","note":"","ko_dialogue":"A: 여기에서 잠깐 쉬어도 될까요?\nB: 그럼요. 몇 분간 앉아서 쉬어요.","dialogue_pairs":[{"en":"A: Can we take a break here?\nB: Sure. Let us sit down for a few minutes.","ko":"A: 여기에서 잠깐 쉬어도 될까요?\nB: 그럼요. 몇 분간 앉아서 쉬어요."},{"en":"A: Let us take a break before we climb the hill.\nB: Good idea. There is a cafe over there.","ko":"A: 언덕 올라가기 전에 잠깐 쉬어요.\nB: 좋아요. 저쪽에 카페가 있네요."}],"pronunciation":"브레이크","id":83},{"day":9,"num":5,"word":"party","meaning":"파티, 일행","hint":"","mnemonic":"party [파티] → “같은 파티에 온 사람은 한 일행!”\n생일 파티에 친구 네 명이 함께 왔습니다. 직원이 인원을 묻자 네 명이 동시에 손을 듭니다.\n같은 파티에 함께 온 무리 → party = 파티 / 일행.","dialogue":"A: How many people are in your party?\nB: Four, including two children.","caution":"","dialogues":["A: How many people are in your party?\nB: Four, including two children.","A: How many people are in your party?\nB: There are five of us."],"similar":"","note":"","ko_dialogue":"A: 일행이 몇 분이세요?\nB: 아이 두 명을 포함해서 네 명이에요.","dialogue_pairs":[{"en":"A: How many people are in your party?\nB: Four, including two children.","ko":"A: 일행이 몇 분이세요?\nB: 아이 두 명을 포함해서 네 명이에요."},{"en":"A: How many people are in your party?\nB: There are five of us.","ko":"A: 일행이 몇 분이신가요?\nB: 저희는 다섯 명입니다."}],"pronunciation":"파티","id":84},{"day":9,"num":6,"word":"exhibit","meaning":"전시하다, 전시품","hint":"","mnemonic":"exhibit [이그지빗] → “이거, 집에 두지 말고 보여줘!”\n멋진 그림을 집 안에만 두자 친구가 말합니다. “이거 집에 숨겨두지 말고 밖에 걸어 보여줘!” 그림을 꺼내 사람들이 보게 전시합니다.\n이거 + 집에 → 이그지… → 밖에 꺼내 전시하다.\n→ exhibit = 전시하다 / 전시품","dialogue":"A: Where is the dinosaur exhibit?\nB: On the second floor, next to the stairs.","caution":"","dialogues":["A: Where is the dinosaur exhibit?\nB: On the second floor, next to the stairs.","A: Which floor has the photography exhibit?\nB: The exhibit is on the second floor."],"similar":"","note":"","ko_dialogue":"A: 공룡 전시는 어디에 있나요?\nB: 2층 계단 옆에 있어요.","dialogue_pairs":[{"en":"A: Where is the dinosaur exhibit?\nB: On the second floor, next to the stairs.","ko":"A: 공룡 전시는 어디에 있나요?\nB: 2층 계단 옆에 있어요."},{"en":"A: Which floor has the photography exhibit?\nB: The exhibit is on the second floor.","ko":"A: 사진 전시는 몇 층에 있나요?\nB: 전시는 2층에 있습니다."}],"pronunciation":"이그지빗","id":85},{"day":9,"num":7,"word":"take a picture","meaning":"사진을 찍다","hint":"","mnemonic":"take a picture [테이크 어 픽처] → 사진 한 장을 ‘취한다(take)’.\n→ take a picture = 사진을 찍다","dialogue":"A: Could you take a picture of us?\nB: Of course. Stand a little closer together.","caution":"","dialogues":["A: Could you take a picture of us?\nB: Of course. Stand a little closer together.","A: Could you take a picture of us in front of the temple?\nB: Of course. Stand a little closer together."],"similar":"","note":"","ko_dialogue":"A: 저희 사진을 찍어주시겠어요?\nB: 물론이죠. 서로 조금 더 가까이 서세요.","dialogue_pairs":[{"en":"A: Could you take a picture of us?\nB: Of course. Stand a little closer together.","ko":"A: 저희 사진을 찍어주시겠어요?\nB: 물론이죠. 서로 조금 더 가까이 서세요."},{"en":"A: Could you take a picture of us in front of the temple?\nB: Of course. Stand a little closer together.","ko":"A: 사원 앞에서 저희 사진 좀 찍어주시겠어요?\nB: 물론이죠. 조금 더 가까이 서세요."}],"pronunciation":"테이크 어 픽처","id":86},{"day":9,"num":8,"word":"refundable","meaning":"환불 가능한","hint":"","mnemonic":"refundable [리펀더블] → refund(환불) + able(~할 수 있는).\n→ refundable = 환불 가능한","dialogue":"A: Is this ticket refundable?\nB: Yes, if you cancel before Friday.","caution":"refundable = 환불 가능. non-refundable = 환불 불가. 호텔 예약에서 매우 자주 보입니다.","dialogues":["A: Is this ticket refundable?\nB: Yes, if you cancel before Friday.","A: Is this ticket refundable if my plans change?\nB: Yes, until twenty-four hours before departure."],"similar":"","note":"refundable = 환불 가능. non-refundable = 환불 불가. 호텔 예약에서 매우 자주 보입니다.","ko_dialogue":"A: 이 표는 환불이 가능한가요?\nB: 네, 금요일 전에 취소하시면 가능합니다.","dialogue_pairs":[{"en":"A: Is this ticket refundable?\nB: Yes, if you cancel before Friday.","ko":"A: 이 표는 환불이 가능한가요?\nB: 네, 금요일 전에 취소하시면 가능합니다."},{"en":"A: Is this ticket refundable if my plans change?\nB: Yes, until twenty-four hours before departure.","ko":"A: 일정이 바뀌면 이 표는 환불 가능한가요?\nB: 네, 출발 24시간 전까지 가능합니다."}],"pronunciation":"리펀더블","id":87},{"day":9,"num":9,"word":"provide","meaning":"제공하다","hint":"","mnemonic":"provide [프로바이드] → “프로가 필요한 바를 다 제공!”\n프로 가이드가 빈손으로 온 여행객에게 지도도 주고 물도 줍니다. “필요한 바를 다 준비했어요.”\n프로 + 바를 + 다 → 프로바이드 → 필요한 것을 제공하다.","dialogue":"A: Do you provide towels at the pool?\nB: Yes. You can get one at the entrance.","caution":"","dialogues":["A: Do you provide towels at the pool?\nB: Yes. You can get one at the entrance.","A: Does the hotel provide airport transportation?\nB: Yes, we have a shuttle every hour."],"similar":"","note":"","ko_dialogue":"A: 수영장에서 수건을 제공하나요?\nB: 네. 입구에서 받으실 수 있어요.","dialogue_pairs":[{"en":"A: Do you provide towels at the pool?\nB: Yes. You can get one at the entrance.","ko":"A: 수영장에서 수건을 제공하나요?\nB: 네. 입구에서 받으실 수 있어요."},{"en":"A: Does the hotel provide airport transportation?\nB: Yes, we have a shuttle every hour.","ko":"A: 호텔에서 공항 교통편을 제공하나요?\nB: 네, 매시간 셔틀이 있습니다."}],"pronunciation":"프로바이드","id":88},{"day":9,"num":10,"word":"tourist attraction","meaning":"관광명소","hint":"","mnemonic":"tourist attraction [투어리스트 어트랙션]\ntourist = 관광객, attraction = 끌어당기는 것.\n관광객을 끌어당기는 곳.\n→ tourist attraction = 관광명소","dialogue":"A: Which tourist attraction is closest to the hotel?\nB: The palace. It is a ten-minute walk.","caution":"","dialogues":["A: Which tourist attraction is closest to the hotel?\nB: The palace. It is a ten-minute walk.","A: What is the most popular tourist attraction nearby?\nB: The old castle is only ten minutes away."],"similar":"","note":"","ko_dialogue":"A: 호텔에서 가장 가까운 관광명소가 어디인가요?\nB: 궁전이요. 걸어서 10분 거리입니다.","dialogue_pairs":[{"en":"A: Which tourist attraction is closest to the hotel?\nB: The palace. It is a ten-minute walk.","ko":"A: 호텔에서 가장 가까운 관광명소가 어디인가요?\nB: 궁전이요. 걸어서 10분 거리입니다."},{"en":"A: What is the most popular tourist attraction nearby?\nB: The old castle is only ten minutes away.","ko":"A: 근처에서 가장 인기 있는 관광명소가 어디인가요?\nB: 오래된 성이 10분 거리에 있습니다."}],"pronunciation":"투어리스트 어트랙션","id":89},{"day":10,"num":1,"word":"crowded","meaning":"붐비는","hint":"","mnemonic":"crowded [크라우디드] → “크~ 와르르 몰려 꽉 찼네!”\n거리 공연을 보려고 사람들이 와르르 몰립니다. 사람 무리(crowd)가 골목을 가득 메워 지나가기도 어렵습니다.\n크 + 와르르 → crowd, 그 무리로 가득한 상태 → crowded = 붐비는.","dialogue":"A: Is the market crowded on weekends?\nB: Yes. It is quieter early in the morning.","caution":"crowded는 사람이 많아 붐비는 상태. busy는 장소가 분주하다는 뜻으로도 씁니다.","dialogues":["A: Is the market crowded on weekends?\nB: Yes. It is quieter early in the morning.","A: Is the market always this crowded on weekends?\nB: Yes, mornings are usually a little quieter."],"similar":"busy = 붐비는 / packed = 꽉 찬 / empty = 비어 있는","note":"crowded는 사람이 많아 붐비는 상태. busy는 장소가 분주하다는 뜻으로도 씁니다.","ko_dialogue":"A: 주말에 시장이 붐비나요?\nB: 네. 이른 아침에는 더 한산해요.","dialogue_pairs":[{"en":"A: Is the market crowded on weekends?\nB: Yes. It is quieter early in the morning.","ko":"A: 주말에 시장이 붐비나요?\nB: 네. 이른 아침에는 더 한산해요."},{"en":"A: Is the market always this crowded on weekends?\nB: Yes, mornings are usually a little quieter.","ko":"A: 주말에는 시장이 항상 이렇게 붐비나요?\nB: 네, 보통 아침이 조금 덜 붐빕니다."}],"pronunciation":"크라우디드","id":90},{"day":10,"num":2,"word":"celebrate","meaning":"축하하다, 기념하다","hint":"","mnemonic":"celebrate [셀러브레이트] → “셀럽의 생일을 다 같이 축하!”\n셀럽이 생일 케이크 앞에 서자 사람들이 박수를 치고 축하 노래를 부릅니다. 케이크의 촛불이 번쩍입니다.\n셀럽을 향한 축하 → 셀러브… → celebrate = 축하하다, 기념하다.","dialogue":"A: We are here to celebrate our anniversary.\nB: Congratulations! Would you like a table by the window?","caution":"","dialogues":["A: We are here to celebrate our anniversary.\nB: Congratulations! Would you like a table by the window?","A: We are here to celebrate our anniversary.\nB: Congratulations. I can arrange a small dessert for you."],"similar":"","note":"","ko_dialogue":"A: 기념일을 축하하러 왔어요.\nB: 축하드려요! 창가 자리를 원하시나요?","dialogue_pairs":[{"en":"A: We are here to celebrate our anniversary.\nB: Congratulations! Would you like a table by the window?","ko":"A: 기념일을 축하하러 왔어요.\nB: 축하드려요! 창가 자리를 원하시나요?"},{"en":"A: We are here to celebrate our anniversary.\nB: Congratulations. I can arrange a small dessert for you.","ko":"A: 저희는 결혼기념일을 기념하러 왔어요.\nB: 축하드립니다. 작은 디저트를 준비해드릴 수 있어요."}],"pronunciation":"셀러브레이트","id":91},{"day":10,"num":3,"word":"be in the mood","meaning":"~할 기분이다","hint":"","mnemonic":"be in the mood [비 인 더 무드] → 그 기분(mood) 안에 있다.\n→ be in the mood = ~할 기분이다","dialogue":"A: What are you in the mood for?\nB: I am in the mood for some noodles.","caution":"","dialogues":["A: What are you in the mood for?\nB: I am in the mood for some noodles.","A: I am in the mood for something spicy tonight.\nB: Then you should try the curry place nearby."],"similar":"","note":"","ko_dialogue":"A: 무엇을 먹고 싶은 기분이에요?\nB: 국수가 먹고 싶어요.","dialogue_pairs":[{"en":"A: What are you in the mood for?\nB: I am in the mood for some noodles.","ko":"A: 무엇을 먹고 싶은 기분이에요?\nB: 국수가 먹고 싶어요."},{"en":"A: I am in the mood for something spicy tonight.\nB: Then you should try the curry place nearby.","ko":"A: 오늘 저녁은 매운 게 당겨요.\nB: 그럼 근처 카레집을 가보세요."}],"pronunciation":"비 인 더 무드","id":92},{"day":10,"num":4,"word":"walking distance","meaning":"걸어서 갈 수 있는 거리","hint":"","mnemonic":"walking distance [워킹 디스턴스]\nwalking = 걸어서, distance = 거리.\n→ walking distance = 걸어서 갈 수 있는 거리","dialogue":"A: Is the beach within walking distance?\nB: Yes, it is about ten minutes on foot.","caution":"within walking distance = 걸어서 갈 수 있는 거리. 호텔 위치 설명에서 자주 나옵니다.","dialogues":["A: Is the beach within walking distance?\nB: Yes, it is about ten minutes on foot.","A: Is the night market within walking distance?\nB: Yes, it is about fifteen minutes on foot."],"similar":"","note":"within walking distance = 걸어서 갈 수 있는 거리. 호텔 위치 설명에서 자주 나옵니다.","ko_dialogue":"A: 해변은 걸어서 갈 수 있는 거리인가요?\nB: 네, 걸어서 약 10분이에요.","dialogue_pairs":[{"en":"A: Is the beach within walking distance?\nB: Yes, it is about ten minutes on foot.","ko":"A: 해변은 걸어서 갈 수 있는 거리인가요?\nB: 네, 걸어서 약 10분이에요."},{"en":"A: Is the night market within walking distance?\nB: Yes, it is about fifteen minutes on foot.","ko":"A: 야시장이 걸어서 갈 수 있는 거리인가요?\nB: 네, 걸어서 약 15분입니다."}],"pronunciation":"워킹 디스턴스","id":93},{"day":10,"num":5,"word":"down the street","meaning":"길 따라 조금 내려가면","hint":"","mnemonic":"down the street [다운 더 스트리트] → 길(street)을 따라 쭉 내려간다.\n→ down the street = 길을 따라 조금 내려가서","dialogue":"A: Where is the bakery?\nB: Just down the street, on your left.","caution":"","dialogues":["A: Where is the bakery?\nB: Just down the street, on your left.","A: There is a bakery just down the street.\nB: Great, let us stop there for breakfast."],"similar":"","note":"","ko_dialogue":"A: 빵집은 어디에 있나요?\nB: 길을 따라 조금 가시면 왼쪽에 있어요.","dialogue_pairs":[{"en":"A: Where is the bakery?\nB: Just down the street, on your left.","ko":"A: 빵집은 어디에 있나요?\nB: 길을 따라 조금 가시면 왼쪽에 있어요."},{"en":"A: There is a bakery just down the street.\nB: Great, let us stop there for breakfast.","ko":"A: 길 따라 조금 내려가면 빵집이 있어요.\nB: 좋아요, 아침 먹으러 들러요."}],"pronunciation":"다운 더 스트리트","id":94},{"day":10,"num":6,"word":"want to","meaning":"~하고 싶다","hint":"","mnemonic":"want to [원트 투] → want(원하다) + to(할).\n→ want to = ~하고 싶다","dialogue":"A: Do you want to visit the museum today?\nB: Yes, but let us have lunch first.","caution":"want to + 동사원형. 더 공손하게는 I'd like to ~.","dialogues":["A: Do you want to visit the museum today?\nB: Yes, but let us have lunch first.","A: I want to see the city from the river.\nB: Then you should take the evening boat tour."],"similar":"","note":"want to + 동사원형. 더 공손하게는 I'd like to ~.","ko_dialogue":"A: 오늘 박물관에 가고 싶으세요?\nB: 네. 그런데 먼저 점심을 먹어요.","dialogue_pairs":[{"en":"A: Do you want to visit the museum today?\nB: Yes, but let us have lunch first.","ko":"A: 오늘 박물관에 가고 싶으세요?\nB: 네. 그런데 먼저 점심을 먹어요."},{"en":"A: I want to see the city from the river.\nB: Then you should take the evening boat tour.","ko":"A: 강에서 도시를 보고 싶어요.\nB: 그럼 저녁 보트 투어를 타보세요."}],"pronunciation":"원트 투","id":95},{"day":10,"num":7,"word":"public transportation","meaning":"대중교통","hint":"","mnemonic":"public transportation [퍼블릭 트랜스포테이션]\npublic = 공공, transportation = 교통/운송.\n→ public transportation = 대중교통","dialogue":"A: Can I get to the airport by public transportation?\nB: Yes. The subway goes straight there.","caution":"미국에서는 public transportation, 영국에서는 public transport가 더 흔합니다.","dialogues":["A: Can I get to the airport by public transportation?\nB: Yes. The subway goes straight there.","A: Is public transportation easy to use here?\nB: Yes, one travel card works on buses and trains."],"similar":"","note":"미국에서는 public transportation, 영국에서는 public transport가 더 흔합니다.","ko_dialogue":"A: 대중교통으로 공항에 갈 수 있나요?\nB: 네. 지하철이 바로 갑니다.","dialogue_pairs":[{"en":"A: Can I get to the airport by public transportation?\nB: Yes. The subway goes straight there.","ko":"A: 대중교통으로 공항에 갈 수 있나요?\nB: 네. 지하철이 바로 갑니다."},{"en":"A: Is public transportation easy to use here?\nB: Yes, one travel card works on buses and trains.","ko":"A: 여기 대중교통 이용하기 쉬운가요?\nB: 네, 교통카드 하나로 버스와 기차를 모두 탈 수 있어요."}],"pronunciation":"퍼블릭 트랜스포테이션","id":96},{"day":10,"num":8,"word":"station","meaning":"역, 정거장","hint":"","mnemonic":"station [스테이션] → “잠깐 스테이하고 다시 가는 곳!”\n기차가 잠시 머무르자 사람들이 내리고 올라탑니다. 잠깐의 스테이(stay)가 끝나면 다시 출발합니다.\n기차가 머무르는 곳 → 스테이션 → 역.\n※ stay는 기억을 돕는 소리 연결입니다.","dialogue":"A: How far is the station?\nB: About five minutes on foot.","caution":"","dialogues":["A: How far is the station?\nB: About five minutes on foot.","A: Which station is closest to the old town?\nB: Central Station. It is about a ten-minute walk."],"similar":"station = 역 / stop = 정류장 / terminal = 터미널","note":"","ko_dialogue":"A: 역은 얼마나 먼가요?\nB: 걸어서 약 5분이에요.","dialogue_pairs":[{"en":"A: How far is the station?\nB: About five minutes on foot.","ko":"A: 역은 얼마나 먼가요?\nB: 걸어서 약 5분이에요."},{"en":"A: Which station is closest to the old town?\nB: Central Station. It is about a ten-minute walk.","ko":"A: 구시가지에서 가장 가까운 역은 어디인가요?\nB: 중앙역입니다. 걸어서 약 10분이에요."}],"pronunciation":"스테이션","id":97},{"day":10,"num":9,"word":"stop","meaning":"정류장, 멈추다","hint":"","mnemonic":"stop [스탑] = 멈추다.\n버스가 멈추는 곳도 bus stop.\n→ stop = 멈추다 / 정류장","dialogue":"A: Which stop should I get off at?\nB: The next stop, Central Market.","caution":"","dialogues":["A: Which stop should I get off at?\nB: The next stop, Central Market.","A: Is this the right stop for the museum?\nB: No, get off at the next stop."],"similar":"stop = 정류장 / station = 역 / terminal = 터미널","note":"","ko_dialogue":"A: 어느 정류장에서 내려야 하나요?\nB: 다음 정류장인 센트럴 마켓에서요.","dialogue_pairs":[{"en":"A: Which stop should I get off at?\nB: The next stop, Central Market.","ko":"A: 어느 정류장에서 내려야 하나요?\nB: 다음 정류장인 센트럴 마켓에서요."},{"en":"A: Is this the right stop for the museum?\nB: No, get off at the next stop.","ko":"A: 박물관 가려면 이 정류장에서 내리나요?\nB: 아니요, 다음 정류장에서 내리세요."}],"pronunciation":"스탑","id":98},{"day":10,"num":10,"word":"catch","meaning":"잡다, (버스·기차를) 타다","hint":"","mnemonic":"catch [캐치] = 잡다.\n떠나기 전 버스·기차를 ‘잡아탄다’.\n→ catch = 잡다 / (교통편을) 타다","dialogue":"A: Can we still catch the nine o’clock train?\nB: Yes, if we leave now.","caution":"","dialogues":["A: Can we still catch the nine o’clock train?\nB: Yes, if we leave now.","A: We need to catch the last train back to the city.\nB: Then we should leave by ten."],"similar":"","note":"","ko_dialogue":"A: 9시 기차를 아직 탈 수 있을까요?\nB: 네, 지금 출발하면요.","dialogue_pairs":[{"en":"A: Can we still catch the nine o’clock train?\nB: Yes, if we leave now.","ko":"A: 9시 기차를 아직 탈 수 있을까요?\nB: 네, 지금 출발하면요."},{"en":"A: We need to catch the last train back to the city.\nB: Then we should leave by ten.","ko":"A: 시내로 돌아가는 막차를 타야 해요.\nB: 그럼 10시까지는 출발해야겠네요."}],"pronunciation":"캐치","id":99},{"day":11,"num":1,"word":"head to","meaning":"~로 향하다","hint":"","mnemonic":"head to [헤드 투] → 머리(head)와 몸의 방향을 목적지 쪽으로 둔다.\n→ head to = ~로 향하다","dialogue":"A: Shall we head to the hotel?\nB: Yes. I would like to drop off my bags.","caution":"head to + 장소. head for도 가능하지만 head to가 더 배우기 쉽고 흔합니다.","dialogues":["A: Shall we head to the hotel?\nB: Yes. I would like to drop off my bags.","A: We are heading to the airport after breakfast.\nB: I can call a taxi for you at eight."],"similar":"","note":"head to + 장소. head for도 가능하지만 head to가 더 배우기 쉽고 흔합니다.","ko_dialogue":"A: 호텔로 갈까요?\nB: 네. 짐을 맡기고 싶어요.","dialogue_pairs":[{"en":"A: Shall we head to the hotel?\nB: Yes. I would like to drop off my bags.","ko":"A: 호텔로 갈까요?\nB: 네. 짐을 맡기고 싶어요."},{"en":"A: We are heading to the airport after breakfast.\nB: I can call a taxi for you at eight.","ko":"A: 아침 먹고 공항으로 갈 거예요.\nB: 8시에 택시를 불러드릴게요."}],"pronunciation":"헤드 투","id":100},{"day":11,"num":2,"word":"cost","meaning":"비용이 들다, 비용","hint":"","mnemonic":"cost [코스트] → “여행 코스마다 돈이 든다!”\n박물관 코스, 배 타는 코스, 식사 코스를 하나씩 고를 때마다 지갑에서 돈이 나갑니다.\n코스마다 드는 돈 → 코스트 → 비용 / 비용이 들다.","dialogue":"A: How much does the airport shuttle cost?\nB: Twelve dollars each way.","caution":"","dialogues":["A: How much does the airport shuttle cost?\nB: Twelve dollars each way.","A: How much does it cost to rent a bike for the day?\nB: It is eighteen dollars including a helmet."],"similar":"fee = 수수료·서비스 요금 / fare = 교통요금 / price = 가격 / cost = 비용","note":"","ko_dialogue":"A: 공항 셔틀 요금은 얼마인가요?\nB: 편도 12달러입니다.","dialogue_pairs":[{"en":"A: How much does the airport shuttle cost?\nB: Twelve dollars each way.","ko":"A: 공항 셔틀 요금은 얼마인가요?\nB: 편도 12달러입니다."},{"en":"A: How much does it cost to rent a bike for the day?\nB: It is eighteen dollars including a helmet.","ko":"A: 자전거를 하루 빌리는 데 얼마예요?\nB: 헬멧 포함 18달러입니다."}],"pronunciation":"코스트","id":101},{"day":11,"num":3,"word":"keep","meaning":"유지하다, 보관하다","hint":"","mnemonic":"keep [킵] → 계속 가지고 있는다.\n계속 가진다 → 유지한다 / 보관한다.\n→ keep = 유지하다 / 보관하다","dialogue":"A: Should I keep this receipt?\nB: Yes, you need it to collect your luggage.","caution":"","dialogues":["A: Should I keep this receipt?\nB: Yes, you need it to collect your luggage.","A: Can I keep this key until tomorrow morning?\nB: Yes, just return it when you check out."],"similar":"store = 보관하다 / keep = 보관하다 / storage = 보관","note":"","ko_dialogue":"A: 이 영수증을 보관해야 하나요?\nB: 네, 짐을 찾을 때 필요합니다.","dialogue_pairs":[{"en":"A: Should I keep this receipt?\nB: Yes, you need it to collect your luggage.","ko":"A: 이 영수증을 보관해야 하나요?\nB: 네, 짐을 찾을 때 필요합니다."},{"en":"A: Can I keep this key until tomorrow morning?\nB: Yes, just return it when you check out.","ko":"A: 이 열쇠를 내일 아침까지 가지고 있어도 되나요?\nB: 네, 체크아웃할 때 반납하시면 됩니다."}],"pronunciation":"킵","id":102},{"day":11,"num":4,"word":"rent","meaning":"빌리다, 임대하다","hint":"","mnemonic":"렌터카를 빌릴 때의 rent.\nrent a car = 차를 빌리다. 돈을 내고 일정 기간 사용하는 뜻이에요.","dialogue":"A: I would like to rent a bicycle for two hours.\nB: Sure. Please choose one over here.","caution":"","dialogues":["A: I would like to rent a bicycle for two hours.\nB: Sure. Please choose one over here.","A: Where can we rent two bicycles?\nB: There is a rental shop beside the park."],"similar":"","note":"","ko_dialogue":"A: 자전거를 두 시간 빌리고 싶어요.\nB: 네. 이쪽에서 한 대 고르세요.","dialogue_pairs":[{"en":"A: I would like to rent a bicycle for two hours.\nB: Sure. Please choose one over here.","ko":"A: 자전거를 두 시간 빌리고 싶어요.\nB: 네. 이쪽에서 한 대 고르세요."},{"en":"A: Where can we rent two bicycles?\nB: There is a rental shop beside the park.","ko":"A: 자전거 두 대를 어디에서 빌릴 수 있나요?\nB: 공원 옆에 대여점이 있습니다."}],"pronunciation":"렌트","id":103},{"day":11,"num":5,"word":"rate","meaning":"요금, 비율, 평가하다","hint":"","mnemonic":"rate [레이트] → “하루가 늦어지니 하루 요금이 더!”\n호텔에서 하루 더 머물기로 했습니다. 출발이 하루 늦어져(late) 하루치 숙박 요금을 더 계산합니다.\n늦어진 하루 ↔ 하루당 얼마인지 정해진 rate → 요금.\nlate는 소리 연상일 뿐이며, rate 자체가 ‘늦다’라는 뜻은 아닙니다.","dialogue":"A: What is the nightly rate?\nB: Eighty dollars, including tax.","caution":"","dialogues":["A: What is the nightly rate?\nB: Eighty dollars, including tax.","A: What is the nightly rate for a double room?\nB: It is one hundred and forty dollars before tax."],"similar":"rate = 요율·객실요금 / price = 가격 / fare = 교통요금","note":"","ko_dialogue":"A: 1박 요금이 얼마인가요?\nB: 세금을 포함해서 80달러입니다.","dialogue_pairs":[{"en":"A: What is the nightly rate?\nB: Eighty dollars, including tax.","ko":"A: 1박 요금이 얼마인가요?\nB: 세금을 포함해서 80달러입니다."},{"en":"A: What is the nightly rate for a double room?\nB: It is one hundred and forty dollars before tax.","ko":"A: 더블룸 1박 요금이 얼마인가요?\nB: 세금 전 140달러입니다."}],"pronunciation":"레이트","id":104},{"day":11,"num":6,"word":"get to","meaning":"도착하다, ~에 이르다","hint":"","mnemonic":"get to [겟 투] → get(이르다) + to(~에).\n→ get to = ~에 도착하다","dialogue":"A: How do I get to the old town?\nB: Take bus number five from this stop.","caution":"이 표현 뒤에는 보통 동사원형이 옵니다. 여행에서 바로 문장으로 붙여 쓰는 연습을 하세요.","dialogues":["A: How do I get to the old town?\nB: Take bus number five from this stop.","A: What is the easiest way to get to the airport?\nB: Take the express train from Central Station."],"similar":"arrive = 도착하다 / reach = 도착하다 / get to = ~에 도착하다","note":"이 표현 뒤에는 보통 동사원형이 옵니다. 여행에서 바로 문장으로 붙여 쓰는 연습을 하세요.","ko_dialogue":"A: 구시가지에는 어떻게 가나요?\nB: 이 정류장에서 5번 버스를 타세요.","dialogue_pairs":[{"en":"A: How do I get to the old town?\nB: Take bus number five from this stop.","ko":"A: 구시가지에는 어떻게 가나요?\nB: 이 정류장에서 5번 버스를 타세요."},{"en":"A: What is the easiest way to get to the airport?\nB: Take the express train from Central Station.","ko":"A: 공항까지 가장 쉽게 가는 방법이 무엇인가요?\nB: 중앙역에서 급행열차를 타세요."}],"pronunciation":"겟 투","id":105},{"day":11,"num":7,"word":"come with","meaning":"함께 오다, 포함되다","hint":"","mnemonic":"come with [컴 위드] → 함께(with) 온다(come).\n→ come with = ~이 딸려오다 / 함께 오다","dialogue":"A: Does this sandwich come with fries?\nB: Yes, and a small drink.","caution":"","dialogues":["A: Does this sandwich come with fries?\nB: Yes, and a small drink.","A: Does this room come with breakfast?\nB: Yes, breakfast for two is included."],"similar":"","note":"","ko_dialogue":"A: 이 샌드위치에는 감자튀김이 같이 나오나요?\nB: 네, 작은 음료도 함께 나옵니다.","dialogue_pairs":[{"en":"A: Does this sandwich come with fries?\nB: Yes, and a small drink.","ko":"A: 이 샌드위치에는 감자튀김이 같이 나오나요?\nB: 네, 작은 음료도 함께 나옵니다."},{"en":"A: Does this room come with breakfast?\nB: Yes, breakfast for two is included.","ko":"A: 이 객실에는 조식이 포함되나요?\nB: 네, 2인 조식이 포함되어 있습니다."}],"pronunciation":"컴 위드","id":106},{"day":11,"num":8,"word":"driver's license","meaning":"운전면허증","hint":"","mnemonic":"driver's license [드라이버즈 라이선스]\ndriver = 운전자, license = 면허.\n→ driver's license = 운전면허증","dialogue":"A: May I see your driver’s license?\nB: Yes. Here it is, along with my passport.","caution":"미국에서는 driver’s license, 영국에서는 driving licence라고 씁니다.","dialogues":["A: May I see your driver’s license?\nB: Yes. Here it is, along with my passport.","A: Do I need an international driver's license to rent a car?\nB: Yes, please bring it with your passport."],"similar":"","note":"미국에서는 driver’s license, 영국에서는 driving licence라고 씁니다.","ko_dialogue":"A: 운전면허증을 보여주시겠어요?\nB: 네. 여권과 함께 여기 있습니다.","dialogue_pairs":[{"en":"A: May I see your driver’s license?\nB: Yes. Here it is, along with my passport.","ko":"A: 운전면허증을 보여주시겠어요?\nB: 네. 여권과 함께 여기 있습니다."},{"en":"A: Do I need an international driver's license to rent a car?\nB: Yes, please bring it with your passport.","ko":"A: 렌터카를 빌리려면 국제운전면허증이 필요한가요?\nB: 네, 여권과 함께 가져오세요."}],"pronunciation":"드라이버즈 라이선스","id":107},{"day":11,"num":9,"word":"include","meaning":"포함하다","hint":"","mnemonic":"include [인클루드]\nin = 안에\nclude [클루드] → “끌어둬!”\n안으로 끌어다가 같이 둡니다.\n→ include = 포함하다","dialogue":"A: Does the room price include breakfast?\nB: Yes, for two people.","caution":"","dialogues":["A: Does the room price include breakfast?\nB: Yes, for two people.","A: Does the price include the ferry ticket?\nB: Yes, the ferry and lunch are both included."],"similar":"","note":"","ko_dialogue":"A: 객실 요금에 아침 식사가 포함되나요?\nB: 네, 두 분 조식이 포함됩니다.","dialogue_pairs":[{"en":"A: Does the room price include breakfast?\nB: Yes, for two people.","ko":"A: 객실 요금에 아침 식사가 포함되나요?\nB: 네, 두 분 조식이 포함됩니다."},{"en":"A: Does the price include the ferry ticket?\nB: Yes, the ferry and lunch are both included.","ko":"A: 가격에 페리 표가 포함되나요?\nB: 네, 페리와 점심 모두 포함되어 있습니다."}],"pronunciation":"인클루드","id":108},{"day":11,"num":10,"word":"insert","meaning":"넣다","hint":"","mnemonic":"insert [인서트] → 영상의 ‘인서트 컷’처럼 중간에 끼워 넣는다.\n→ insert = 삽입하다 / 넣다","dialogue":"A: Where should I insert my card?\nB: In the slot at the bottom.","caution":"","dialogues":["A: Where should I insert my card?\nB: In the slot at the bottom.","A: Insert your ticket into the machine here.\nB: Do I get the same ticket back?"],"similar":"","note":"","ko_dialogue":"A: 카드는 어디에 넣어야 하나요?\nB: 아래쪽 투입구에 넣으세요.","dialogue_pairs":[{"en":"A: Where should I insert my card?\nB: In the slot at the bottom.","ko":"A: 카드는 어디에 넣어야 하나요?\nB: 아래쪽 투입구에 넣으세요."},{"en":"A: Insert your ticket into the machine here.\nB: Do I get the same ticket back?","ko":"A: 여기에 표를 기계에 넣으세요.\nB: 같은 표가 다시 나오나요?"}],"pronunciation":"인서트","id":109},{"day":12,"num":1,"word":"fine","meaning":"좋은, 괜찮은 / 벌금","hint":"","mnemonic":"fine [파인] → “파인 곳에 주차했다가 벌금!”\n주차 금지 구역의 움푹 파인 자리에도 차를 세웠습니다. 돌아오니 벌금 고지서가 붙어 있습니다.\n파인 곳에 세웠다가 벌금 → fine = 벌금.\n익숙한 I am fine.의 fine은 ‘괜찮은’이라는 별도의 뜻입니다.","dialogue":"A: Is this table okay?\nB: Yes, it is fine. Thank you.","caution":"","dialogues":["A: Is this table okay?\nB: Yes, it is fine. Thank you.","A: What is this fine for?\nB: For parking in a restricted area."],"similar":"","note":"","ko_dialogue":"A: 이 자리 괜찮으세요?\nB: 네, 괜찮아요. 감사합니다.","dialogue_pairs":[{"en":"A: Is this table okay?\nB: Yes, it is fine. Thank you.","ko":"A: 이 자리 괜찮으세요?\nB: 네, 괜찮아요. 감사합니다."},{"en":"A: What is this fine for?\nB: For parking in a restricted area.","ko":"A: 이 벌금은 무엇 때문인가요?\nB: 주차 제한 구역에 주차하셨기 때문입니다."}],"pronunciation":"파인","id":110},{"day":12,"num":2,"word":"get on","meaning":"타다","hint":"","mnemonic":"get on [겟 온] → 탈것 위(on)로 올라간다.\n→ get on = 타다","dialogue":"A: Where do we get on the airport bus?\nB: Outside exit three.","caution":"","dialogues":["A: Where do we get on the airport bus?\nB: Outside exit three.","A: Where do I get on the airport bus?\nB: At stop number five outside the terminal."],"similar":"","note":"","ko_dialogue":"A: 공항버스는 어디에서 타나요?\nB: 3번 출구 밖에서요.","dialogue_pairs":[{"en":"A: Where do we get on the airport bus?\nB: Outside exit three.","ko":"A: 공항버스는 어디에서 타나요?\nB: 3번 출구 밖에서요."},{"en":"A: Where do I get on the airport bus?\nB: At stop number five outside the terminal.","ko":"A: 공항버스는 어디에서 타나요?\nB: 터미널 밖 5번 정류장에서 타세요."}],"pronunciation":"겟 온","id":111},{"day":12,"num":3,"word":"miss","meaning":"놓치다, 그리워하다","hint":"","mnemonic":"miss [미스] → 목표를 맞히지 못하고 놓친다.\n버스·기차도 놓치면 miss.\n→ miss = 놓치다 / 그리워하다","dialogue":"A: I missed my train. Can I use this ticket on the next one?\nB: Let me check your ticket type.","caution":"","dialogues":["A: I missed my train. Can I use this ticket on the next one?\nB: Let me check your ticket type.","A: I think we are going to miss our connection.\nB: Let us ask the airline desk for help."],"similar":"","note":"","ko_dialogue":"A: 기차를 놓쳤어요. 이 표로 다음 기차를 탈 수 있나요?\nB: 표 종류를 확인해볼게요.","dialogue_pairs":[{"en":"A: I missed my train. Can I use this ticket on the next one?\nB: Let me check your ticket type.","ko":"A: 기차를 놓쳤어요. 이 표로 다음 기차를 탈 수 있나요?\nB: 표 종류를 확인해볼게요."},{"en":"A: I think we are going to miss our connection.\nB: Let us ask the airline desk for help.","ko":"A: 환승편을 놓칠 것 같아요.\nB: 항공사 데스크에 도움을 요청해봐요."}],"pronunciation":"미스","id":112},{"day":12,"num":4,"word":"transfer","meaning":"갈아타다, 환승하다","hint":"","mnemonic":"transfer [트랜스퍼] → trans-(건너) + fer(나르다).\n한 곳에서 다른 곳으로 옮겨 탄다.\n→ transfer = 환승하다 / 옮기다","dialogue":"A: Do I need to transfer?\nB: Yes. Change to the blue line at Central Station.","caution":"","dialogues":["A: Do I need to transfer?\nB: Yes. Change to the blue line at Central Station.","A: Do I need to transfer to another line at City Hall?\nB: Yes, change to the blue line there."],"similar":"","note":"","ko_dialogue":"A: 환승해야 하나요?\nB: 네. 중앙역에서 파란색 노선으로 갈아타세요.","dialogue_pairs":[{"en":"A: Do I need to transfer?\nB: Yes. Change to the blue line at Central Station.","ko":"A: 환승해야 하나요?\nB: 네. 중앙역에서 파란색 노선으로 갈아타세요."},{"en":"A: Do I need to transfer to another line at City Hall?\nB: Yes, change to the blue line there.","ko":"A: 시청역에서 다른 노선으로 갈아타야 하나요?\nB: 네, 거기서 파란색 노선으로 갈아타세요."}],"pronunciation":"트랜스퍼","id":113},{"day":12,"num":5,"word":"behind schedule","meaning":"예정보다 늦은","hint":"","mnemonic":"behind schedule [비하인드 스케줄]\nbehind = 뒤에, schedule = 일정.\n일정보다 뒤처져 있다.\n→ behind schedule = 예정보다 늦게","dialogue":"A: Are we behind schedule?\nB: Yes, about fifteen minutes because of traffic.","caution":"behind schedule = 지연, ahead of schedule = 예정보다 빠름, on schedule = 예정대로.","dialogues":["A: Are we behind schedule?\nB: Yes, about fifteen minutes because of traffic.","A: The tour bus is running behind schedule.\nB: We should arrive about twenty minutes late."],"similar":"","note":"behind schedule = 지연, ahead of schedule = 예정보다 빠름, on schedule = 예정대로.","ko_dialogue":"A: 예정보다 늦어지고 있나요?\nB: 네, 교통 체증 때문에 약 15분 늦어지고 있어요.","dialogue_pairs":[{"en":"A: Are we behind schedule?\nB: Yes, about fifteen minutes because of traffic.","ko":"A: 예정보다 늦어지고 있나요?\nB: 네, 교통 체증 때문에 약 15분 늦어지고 있어요."},{"en":"A: The tour bus is running behind schedule.\nB: We should arrive about twenty minutes late.","ko":"A: 투어 버스가 예정보다 늦게 운행되고 있어요.\nB: 약 20분 늦게 도착할 것 같습니다."}],"pronunciation":"비하인드 스케줄","id":114},{"day":12,"num":6,"word":"right on schedule","meaning":"정시에","hint":"","mnemonic":"right on schedule [라이트 온 스케줄]\nright = 정확히, on schedule = 일정대로.\n→ right on schedule = 정확히 예정대로","dialogue":"A: Is the tour leaving late?\nB: No, we are right on schedule.","caution":"","dialogues":["A: Is the tour leaving late?\nB: No, we are right on schedule.","A: The train left right on schedule.\nB: Good, we should reach the airport on time."],"similar":"","note":"","ko_dialogue":"A: 투어가 늦게 출발하나요?\nB: 아니요, 정확히 예정대로 진행되고 있어요.","dialogue_pairs":[{"en":"A: Is the tour leaving late?\nB: No, we are right on schedule.","ko":"A: 투어가 늦게 출발하나요?\nB: 아니요, 정확히 예정대로 진행되고 있어요."},{"en":"A: The train left right on schedule.\nB: Good, we should reach the airport on time.","ko":"A: 기차가 정확히 정시에 출발했어요.\nB: 좋아요, 공항에 제시간에 도착하겠네요."}],"pronunciation":"라이트 온 스케줄","id":115},{"day":12,"num":7,"word":"ahead of schedule","meaning":"예정보다 빠른","hint":"","mnemonic":"ahead of schedule [어헤드 어브 스케줄]\nahead = 앞서, schedule = 일정.\n→ ahead of schedule = 예정보다 일찍","dialogue":"A: We arrived ahead of schedule.\nB: Great. We have time for coffee.","caution":"","dialogues":["A: We arrived ahead of schedule.\nB: Great. We have time for coffee.","A: We arrived ahead of schedule.\nB: Great, we have time for coffee before check-in."],"similar":"","note":"","ko_dialogue":"A: 예정보다 일찍 도착했네요.\nB: 좋아요. 커피 마실 시간이 있겠어요.","dialogue_pairs":[{"en":"A: We arrived ahead of schedule.\nB: Great. We have time for coffee.","ko":"A: 예정보다 일찍 도착했네요.\nB: 좋아요. 커피 마실 시간이 있겠어요."},{"en":"A: We arrived ahead of schedule.\nB: Great, we have time for coffee before check-in.","ko":"A: 예정보다 일찍 도착했어요.\nB: 잘됐네요, 체크인 전에 커피 마실 시간이 있어요."}],"pronunciation":"어헤드 어브 스케줄","id":116},{"day":12,"num":8,"word":"available","meaning":"이용 가능한, 남아 있는","hint":"","mnemonic":"available [어베일러블] → “어, 비어! 빌릴 수 있네!”\n숙소를 찾다가 빈방 하나를 발견했습니다. 직원이 열쇠를 내밀자 “어, 비어 있네! 오늘 빌릴 수 있겠네!” 합니다.\n어 + 비어 + 빌릴 → 어베일러블 → 이용 가능한, 남아 있는.\n사람에게 쓰면 그 시간에 다른 일정이 없어 시간을 낼 수 있다는 뜻도 됩니다.","dialogue":"A: Do you have any rooms available tonight?\nB: Yes, we have one double room left.","caution":"available은 방·좌석·상품·사람의 시간까지 넓게 씁니다. vacant는 주로 방·좌석처럼 ‘비어 있음’에 가깝습니다.","dialogues":["A: Do you have any rooms available tonight?\nB: Yes, we have one double room left.","A: Are any window seats still available?\nB: Yes, there is one in row eighteen."],"similar":"vacant = 비어 있는 / free = 무료인·시간이 비는 / open = 열려 있는 / in stock = 재고가 있는","note":"available은 방·좌석·상품·사람의 시간까지 넓게 씁니다. vacant는 주로 방·좌석처럼 ‘비어 있음’에 가깝습니다.","ko_dialogue":"A: 오늘 밤 이용 가능한 객실이 있나요?\nB: 네, 더블룸 하나가 남아 있어요.","dialogue_pairs":[{"en":"A: Do you have any rooms available tonight?\nB: Yes, we have one double room left.","ko":"A: 오늘 밤 이용 가능한 객실이 있나요?\nB: 네, 더블룸 하나가 남아 있어요."},{"en":"A: Are any window seats still available?\nB: Yes, there is one in row eighteen.","ko":"A: 창가 좌석이 아직 남아 있나요?\nB: 네, 18열에 한 자리 있습니다."}],"pronunciation":"어베일러블","id":117},{"day":12,"num":9,"word":"request","meaning":"요청하다, 요청","hint":"","mnemonic":"request [리퀘스트] → “우리, 이거 해주겠어?”\n상대에게 무언가를 해달라고 부탁합니다.\n리…해주겠어? → 리퀘스트 소리와 요청하는 말을 연결.\n→ request = 요청하다 / 요청","dialogue":"A: Could I request a quiet room?\nB: Certainly. I will check what is available.","caution":"","dialogues":["A: Could I request a quiet room?\nB: Certainly. I will check what is available.","A: I would like to request a room away from the elevator.\nB: I will add that request to your booking."],"similar":"","note":"","ko_dialogue":"A: 조용한 객실을 요청해도 될까요?\nB: 네. 가능한 객실을 확인해볼게요.","dialogue_pairs":[{"en":"A: Could I request a quiet room?\nB: Certainly. I will check what is available.","ko":"A: 조용한 객실을 요청해도 될까요?\nB: 네. 가능한 객실을 확인해볼게요."},{"en":"A: I would like to request a room away from the elevator.\nB: I will add that request to your booking.","ko":"A: 엘리베이터에서 먼 객실을 요청하고 싶어요.\nB: 예약에 그 요청을 추가해드릴게요."}],"pronunciation":"리퀘스트","id":118},{"day":12,"num":10,"word":"if possible","meaning":"가능하다면","hint":"","mnemonic":"if possible [이프 파서블] → if(만약) + possible(가능한).\n→ if possible = 가능하다면","dialogue":"A: I would like a window seat, if possible.\nB: Let me see if we have one.","caution":"","dialogues":["A: I would like a window seat, if possible.\nB: Let me see if we have one.","A: Could we sit outside, if possible?\nB: Certainly. A patio table will be free in a few minutes."],"similar":"","note":"","ko_dialogue":"A: 가능하다면 창가 좌석으로 부탁드려요.\nB: 남아 있는지 확인해볼게요.","dialogue_pairs":[{"en":"A: I would like a window seat, if possible.\nB: Let me see if we have one.","ko":"A: 가능하다면 창가 좌석으로 부탁드려요.\nB: 남아 있는지 확인해볼게요."},{"en":"A: Could we sit outside, if possible?\nB: Certainly. A patio table will be free in a few minutes.","ko":"A: 가능하다면 밖에 앉을 수 있을까요?\nB: 물론입니다. 몇 분 뒤 야외 자리가 납니다."}],"pronunciation":"이프 파서블","id":119},{"day":13,"num":1,"word":"run out of","meaning":"~이 떨어지다","hint":"","mnemonic":"run out of [런 아웃 어브] → 안에 있던 것이 전부 밖으로(run out) 빠져나가 없다.\n→ run out of = ~이 떨어지다 / 다 써버리다","dialogue":"A: We have run out of toilet paper.\nB: Sorry about that. I will send some up now.","caution":"run out of water = 물이 떨어지다. 사람이 다 떨어지는 게 아니라 ‘재고가 없어짐’.","dialogues":["A: We have run out of toilet paper.\nB: Sorry about that. I will send some up now.","A: We ran out of cash at the night market.\nB: There is an ATM near the entrance."],"similar":"","note":"run out of water = 물이 떨어지다. 사람이 다 떨어지는 게 아니라 ‘재고가 없어짐’.","ko_dialogue":"A: 화장지가 다 떨어졌어요.\nB: 죄송합니다. 지금 객실로 보내드릴게요.","dialogue_pairs":[{"en":"A: We have run out of toilet paper.\nB: Sorry about that. I will send some up now.","ko":"A: 화장지가 다 떨어졌어요.\nB: 죄송합니다. 지금 객실로 보내드릴게요."},{"en":"A: We ran out of cash at the night market.\nB: There is an ATM near the entrance.","ko":"A: 야시장에서 현금이 다 떨어졌어요.\nB: 입구 근처에 ATM이 있습니다."}],"pronunciation":"런 아웃 어브","id":120},{"day":13,"num":2,"word":"work","meaning":"일하다, 작동하다","hint":"","mnemonic":"work [워크] → “워크숍에서 사람도 일하고 기계도 돌아간다!”\n워크숍의 작업대에서 사람이 일을 합니다. 옆 기계도
