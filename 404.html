<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여행영단어 331 · 연상 수정본</title>
<style>
:root{
  --bg:#120b07;--panel:#21130c;--card:#fffaf6;--text:#2a221e;--muted:#8c7467;
  --accent:#ff8150;--soft:#fff0e7;--line:#efd9cd;--darktext:#f6e8df;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--text)}
body{overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.top{padding:calc(env(safe-area-inset-top) + 8px) 10px 7px;background:#15100d;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.brand{font-size:14px;font-weight:900;color:var(--accent);margin-right:2px}
.iconbtn{border:0;background:#29221e;color:white;border-radius:12px;min-width:42px;height:42px;padding:0 9px;font-size:16px;font-weight:900}
.iconbtn.active{background:var(--accent)}
.progressbox{flex:1;min-width:120px}
.pt{font-size:11px;color:#d5c2b7;text-align:center;margin-bottom:4px;font-weight:700}
.progress{height:6px;background:#342821;border-radius:99px;overflow:hidden}
.bar{height:100%;width:0;background:var(--accent)}
.main{flex:1;overflow:hidden;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px)}
.card{height:100%;max-width:900px;margin:auto;background:var(--card);border-radius:24px;overflow:auto;box-shadow:0 10px 38px #0008;padding:20px 18px;position:relative}
.day{font-size:13px;font-weight:900;color:var(--accent)}
.word{font-size:clamp(34px,7vw,62px);font-weight:900;line-height:1.07;margin:5px 0 4px;word-break:keep-all}.pronunciation{font-size:18px;font-weight:800;color:#9a6f59;margin:0 0 12px;letter-spacing:.01em}
.meaning{font-size:clamp(20px,4vw,29px);font-weight:850;line-height:1.4;margin-bottom:12px}
.hiddenMeaning{border:2px dashed #e6c7b5;background:#fff5ef;border-radius:18px;padding:18px;text-align:center;color:#a47a65;font-weight:800;font-size:18px;margin-bottom:12px}
.reveal{border:0;background:var(--accent);color:white;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:900;margin-top:8px}
.sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.lab{font-size:13px;font-weight:900;color:var(--accent);margin-bottom:7px}
.box{background:var(--soft);border-radius:16px;padding:13px;font-size:16px;line-height:1.55;white-space:pre-line}
.dialogue{border-left:4px solid #f2c2a7;padding:8px 11px;margin:8px 0;background:#fffdfb;border-radius:0 12px 12px 0;font-size:15.5px;line-height:1.58;white-space:pre-line}
.note{font-size:15px;line-height:1.55;color:#5b4c44}
.actionrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.action{border:0;border-radius:12px;padding:10px 13px;font-size:14px;font-weight:900;background:#f4e6df;color:#4b3b33}
.action.wrong{background:#ffe3e3;color:#a52f2f}
.action.wrong.on{background:#d84b4b;color:#fff}
.action.next{background:var(--accent);color:#fff;margin-left:auto}
.book{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:0;overflow:hidden}
.book .half{padding:20px;height:100%;overflow:auto}
.book .left{background:#fff5ee;border-right:1px solid #e7ccbd;display:flex;flex-direction:column;justify-content:center}
.book .right{background:#fffdfb}
.book .word{font-size:clamp(32px,6vw,54px)}
.searchPanel,.addPanel,.wrongPanel{height:100%;max-width:900px;margin:auto;background:#fffaf6;border-radius:24px;overflow:auto;padding:18px}
.panelTitle{font-size:24px;font-weight:900;margin-bottom:12px}
.input{width:100%;border:1px solid #ddc9bd;border-radius:14px;padding:13px 14px;font-size:16px;background:#fff}
.result{padding:12px;border-bottom:1px solid #eee0d8;cursor:pointer}
.result b{font-size:18px}
.small{font-size:13px;color:#876f62;margin-top:4px}
.formgrid{display:grid;grid-template-columns:1fr;gap:10px}
textarea.input{min-height:85px;resize:vertical}
.primary{border:0;background:var(--accent);color:white;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:900}
.secondary{border:0;background:#eee1da;color:#493d36;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900}
.empty{text-align:center;color:#8d776b;padding:40px 10px}
@media(max-width:650px){
  .brand{width:100%;font-size:13px}
  .book{grid-template-columns:1fr 1fr}
  .book .half{padding:14px 12px}
  .book .right .box,.book .right .dialogue,.book .right .note{font-size:13.5px}
  .book .right .lab{font-size:12px}
}

.tap-toggle{
  position:relative;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:pan-y;
}
.tap-toggle.blurred{
  filter:blur(7px);
  opacity:.72;
  user-select:none;
}
.ko-dialogue{
  border-left:4px solid #f2c2a7;
  padding:8px 11px;
  margin:8px 0 10px;
  background:#fffdfb;
  border-radius:0 12px 12px 0;
  font-size:15.5px;
  line-height:1.58;
  white-space:pre-line;
}
.swipe-hint{
  margin-top:14px;
  text-align:center;
  color:#9d7d6a;
  font-size:12px;
  font-weight:800;
}

.dialogue-example + .dialogue-example{border-top:1px dashed rgba(242,194,167,.28);padding-top:4px}

.dialogue-line-pair{margin-top:10px}
.dialogue-line-pair .dialogue{margin-bottom:5px}
.ko-line{
  font-size:15.5px;
  line-height:1.55;
  color:#5b4c44;
  padding:0 10px 7px 10px;
  white-space:pre-wrap;
}

.card.spread{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-content:start}
.spread .study-left{border-right:1px solid var(--line);padding-right:20px}
.spread .actionrow{grid-column:1/-1}
.spread .word{font-size:clamp(25px,4vw,48px)}
.spread .box,.spread .dialogue,.spread .ko-line{font-size:14px}
.card{padding-bottom:85px}
.top .iconbtn{cursor:pointer}
.ko-line{font-weight:500}
@media(max-width:650px){.card.spread{gap:12px;padding:16px 12px 85px}.spread .study-left{padding-right:10px}.spread .box{padding:9px}.spread .word{overflow-wrap:anywhere}.spread .dialogue,.spread .ko-line{padding-left:6px;padding-right:2px;font-size:13px}.spread .pronunciation{font-size:14px}}

/* Voice selection and speed */
.voice-controls{margin:10px 0 15px;padding:12px;border:1px solid #d8cabe;border-radius:12px;min-width:0}
.voice-buttons{display:flex;gap:8px;margin-bottom:12px}
.voice-buttons button{flex:1;background:#ece4dc;color:#3b3028;border:2px solid transparent}
.voice-buttons button[aria-pressed="true"]{background:var(--accent);color:white;border-color:#3b3028}
.voice-speed{display:block;font-size:13px;font-weight:700}
.speech-rate-value{float:right;font-variant-numeric:tabular-nums}
.voice-speed input{display:block;width:100%;margin:12px 0;accent-color:var(--accent);min-height:24px}
.speed-limits{display:flex;justify-content:space-between;font-size:11px;font-weight:400}
.voice-controls summary{cursor:pointer;font-size:12px;padding:8px 0}
.voice-controls select{display:block;width:100%;max-width:100%;min-height:40px;margin:4px 0 8px;font-size:12px}
/* V3 speech support */
.word-audio-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 7px}
.speak-btn{
  border:0;background:#2d241f;color:#fff;border-radius:999px;
  min-height:34px;padding:7px 11px;font-size:13px;font-weight:900;
  cursor:pointer;-webkit-tap-highlight-color:transparent
}
.speak-btn.primary-speak{background:var(--accent)}
.speak-btn:active{transform:scale(.97)}
.dialogue-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dialogue-line-wrap{position:relative}
.dialogue-line-wrap .dialogue{padding-right:48px}
.line-speak{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border:0;border-radius:50%;
  background:#2d241f;color:#fff;font-size:15px;font-weight:900;cursor:pointer;
  z-index:3
}
.line-speak:active{transform:translateY(-50%) scale(.96)}
.voice-note{font-size:11px;color:#9a7563;font-weight:750;margin-top:4px}
@media(max-width:650px){
  .speak-btn{min-height:32px;padding:6px 9px;font-size:12px}
  .line-speak{width:32px;height:32px;font-size:14px}
}


/* V7 AI autofill */
.ai-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ai-row .input{flex:1;min-width:180px}
.ai-btn{border:0;background:#6f4dff;color:#fff;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:900;cursor:pointer}
.ai-btn:disabled{opacity:.55;cursor:wait}
.ai-status{font-size:13px;line-height:1.45;color:#745f53;background:#fff3e9;border-radius:12px;padding:10px 12px;display:none}
.ai-settings{border:1px solid #ead7ca;border-radius:14px;padding:10px 12px;background:#fffdfb}
.ai-settings summary{cursor:pointer;font-weight:900;color:#6d5549}
.ai-help{font-size:12px;line-height:1.5;color:#8b7468;margin-top:7px}

</style>

<script>
const baseCards=[{"day":1,"num":1,"word":"check in","meaning":"체크인하다, 입실 수속하다","hint":"","mnemonic":"check in [체크 인]\ncheck = 확인하다, in = 안으로.\n정보를 확인하고 안으로 들어가는 절차.\n→ check in = 체크인하다 / 입실·탑승 수속하다","dialogue":"A: Hi, I would like to check in.\nB: Of course. May I see your passport?","caution":"","dialogues":["A: Hi, I would like to check in.\nB: Of course. May I see your passport?","A: Can we check in early if the room is ready?\nB: Yes, early check-in is possible after eleven."],"similar":"check out = 체크아웃하다 / register = 등록하다 / sign in = 이름을 적고 들어가다","note":"","ko_dialogue":"A: 안녕하세요. 체크인하고 싶어요.\nB: 네. 여권을 보여주시겠어요?","dialogue_pairs":[{"en":"A: Hi, I would like to check in.\nB: Of course. May I see your passport?","ko":"A: 안녕하세요. 체크인하고 싶어요.\nB: 네. 여권을 보여주시겠어요?"},{"en":"A: Can we check in early if the room is ready?\nB: Yes, early check-in is possible after eleven.","ko":"A: 객실이 준비됐으면 일찍 체크인할 수 있나요?\nB: 네, 오전 11시 이후에는 조기 체크인이 가능합니다."}],"pronunciation":"체크 인","id":0},{"day":1,"num":2,"word":"check out","meaning":"체크아웃하다, 퇴실하다","hint":"","mnemonic":"check out [체크 아웃]\ncheck = 확인하다, out = 밖으로.\n마지막 확인을 끝내고 밖으로 나가는 절차.\n→ check out = 체크아웃하다 / 퇴실하다","dialogue":"A: Can I check out at noon?\nB: Yes, noon is fine.","caution":"","dialogues":["A: Can I check out at noon?\nB: Yes, noon is fine.","A: We need to check out before our morning tour.\nB: You can leave the key at the front desk."],"similar":"check in = 체크인하다 / leave = 떠나다 / settle the bill = 계산을 끝내다","note":"","ko_dialogue":"A: 정오에 체크아웃해도 될까요?\nB: 네, 정오에 하셔도 됩니다.","dialogue_pairs":[{"en":"A: Can I check out at noon?\nB: Yes, noon is fine.","ko":"A: 정오에 체크아웃해도 될까요?\nB: 네, 정오에 하셔도 됩니다."},{"en":"A: We need to check out before our morning tour.\nB: You can leave the key at the front desk.","ko":"A: 아침 투어 전에 체크아웃해야 해요.\nB: 열쇠는 프런트 데스크에 두시면 됩니다."}],"pronunciation":"체크 아웃","id":1},{"day":1,"num":3,"word":"boarding","meaning":"탑승","hint":"","mnemonic":"boarding [보딩] → “보드 위에 올라타!”\n스노보드에 발을 올려 타듯, 비행기에도 발을 올려 탑니다. 보드에 올라타는 동작에서 비행기에 올라타는 동작으로 연결합니다.\n→ boarding = 탑승","dialogue":"A: When does boarding start?\nB: In twenty minutes, at gate twelve.","caution":"","dialogues":["A: When does boarding start?\nB: In twenty minutes, at gate twelve.","A: Has boarding for flight 218 started yet?\nB: Yes, passengers in group three are boarding now."],"similar":"","note":"","ko_dialogue":"A: 탑승은 언제 시작하나요?\nB: 20분 뒤에 12번 탑승구에서 시작합니다.","dialogue_pairs":[{"en":"A: When does boarding start?\nB: In twenty minutes, at gate twelve.","ko":"A: 탑승은 언제 시작하나요?\nB: 20분 뒤에 12번 탑승구에서 시작합니다."},{"en":"A: Has boarding for flight 218 started yet?\nB: Yes, passengers in group three are boarding now.","ko":"A: 218편 탑승이 벌써 시작됐나요?\nB: 네, 지금 3번 그룹 승객들이 탑승 중입니다."}],"pronunciation":"보딩","id":2},{"day":1,"num":4,"word":"fragile","meaning":"깨지기 쉬운","hint":"","mnemonic":"fragile [프래절] → “프래절? 깨질!”\n프래절 소리를 들으면 바로 ‘깨질!’을 붙입니다.\n→ fragile = 깨지기 쉬운 / 파손주의","dialogue":"A: These cups are fragile. Could you wrap them carefully?\nB: Of course. I will wrap each one separately.","caution":"","dialogues":["A: These cups are fragile. Could you wrap them carefully?\nB: Of course. I will wrap each one separately.","A: This bottle is fragile, so I want to carry it on.\nB: That is fine if it meets the security rules."],"similar":"","note":"","ko_dialogue":"A: 이 컵들은 깨지기 쉬워요. 조심해서 포장해주시겠어요?\nB: 물론이죠. 하나씩 따로 포장해드릴게요.","dialogue_pairs":[{"en":"A: These cups are fragile. Could you wrap them carefully?\nB: Of course. I will wrap each one separately.","ko":"A: 이 컵들은 깨지기 쉬워요. 조심해서 포장해주시겠어요?\nB: 물론이죠. 하나씩 따로 포장해드릴게요."},{"en":"A: This bottle is fragile, so I want to carry it on.\nB: That is fine if it meets the security rules.","ko":"A: 이 병은 깨지기 쉬워서 기내에 들고 타고 싶어요.\nB: 보안 규정에 맞으면 괜찮습니다."}],"pronunciation":"프래절","id":3},{"day":1,"num":5,"word":"one-way","meaning":"편도","hint":"","mnemonic":"one-way [원 웨이] → one(하나) + way(방향).\n“한 방향으로만 간다.”\n→ one-way = 편도 / 일방통행","dialogue":"A: One-way or round trip?\nB: One-way, please. I am flying back.","caution":"one-way ticket = 편도표, one-way street = 일방통행 도로. 같은 one-way가 두 상황에서 모두 쓰입니다.","dialogues":["A: One-way or round trip?\nB: One-way, please. I am flying back.","A: I only need a one-way ticket to the airport.\nB: That will be twelve dollars."],"similar":"","note":"one-way ticket = 편도표, one-way street = 일방통행 도로. 같은 one-way가 두 상황에서 모두 쓰입니다.","ko_dialogue":"A: 편도인가요, 왕복인가요?\nB: 편도로 주세요. 돌아올 때는 비행기를 탈 거예요.","dialogue_pairs":[{"en":"A: One-way or round trip?\nB: One-way, please. I am flying back.","ko":"A: 편도인가요, 왕복인가요?\nB: 편도로 주세요. 돌아올 때는 비행기를 탈 거예요."},{"en":"A: I only need a one-way ticket to the airport.\nB: That will be twelve dollars.","ko":"A: 공항까지 편도표만 필요해요.\nB: 12달러입니다."}],"pronunciation":"원 웨이","id":4},{"day":1,"num":6,"word":"round trip","meaning":"왕복","hint":"","mnemonic":"round trip [라운드 트립] → round(한 바퀴 돌아) + trip(여행).\n갔다가 다시 돌아오는 한 바퀴 여행.\n→ round trip = 왕복 여행 / 왕복","dialogue":"A: How much is a round trip to the island?\nB: It is thirty dollars per person.","caution":"미국식은 round-trip ticket, 영국식은 return ticket이 흔합니다.","dialogues":["A: How much is a round trip to the island?\nB: It is thirty dollars per person.","A: Is a round trip cheaper than buying two single tickets?\nB: Yes, you save about five dollars."],"similar":"","note":"미국식은 round-trip ticket, 영국식은 return ticket이 흔합니다.","ko_dialogue":"A: 섬까지 왕복 요금이 얼마인가요?\nB: 1인당 30달러입니다.","dialogue_pairs":[{"en":"A: How much is a round trip to the island?\nB: It is thirty dollars per person.","ko":"A: 섬까지 왕복 요금이 얼마인가요?\nB: 1인당 30달러입니다."},{"en":"A: Is a round trip cheaper than buying two single tickets?\nB: Yes, you save about five dollars.","ko":"A: 왕복표가 편도표 두 장 사는 것보다 싼가요?\nB: 네, 약 5달러 절약됩니다."}],"pronunciation":"라운드 트립","id":5},{"day":1,"num":7,"word":"travel","meaning":"여행하다, 여행","hint":"","mnemonic":"트래블백(travel bag)은 여행 가방.\n익숙한 ‘트래블백’에서 travel = 여행을 연결하세요.","dialogue":"A: Do you travel alone often?\nB: No, I usually travel with my wife.","caution":"","dialogues":["A: Do you travel alone often?\nB: No, I usually travel with my wife.","A: Do you travel with just a carry-on?\nB: Usually, unless I am away for more than a week."],"similar":"trip = 한 번의 여행 / journey = 이동 과정 / tour = 관광","note":"","ko_dialogue":"A: 혼자 여행을 자주 하세요?\nB: 아니요, 보통 아내와 함께 여행해요.","dialogue_pairs":[{"en":"A: Do you travel alone often?\nB: No, I usually travel with my wife.","ko":"A: 혼자 여행을 자주 하세요?\nB: 아니요, 보통 아내와 함께 여행해요."},{"en":"A: Do you travel with just a carry-on?\nB: Usually, unless I am away for more than a week.","ko":"A: 여행할 때 보통 기내용 가방만 가져가세요?\nB: 네, 일주일 넘게 떠나는 경우가 아니면요."}],"pronunciation":"트래블","id":6},{"day":1,"num":8,"word":"trip","meaning":"여행, 이동","hint":"","mnemonic":"trip [트립] → “로드트립”, “여행 트립”의 트립.\n한 번 갔다 오는 하나의 여행 덩어리.\n→ trip = 여행 / 한 번의 여행","dialogue":"A: How was your trip to Kyoto?\nB: It was great. The food was delicious.","caution":"","dialogues":["A: How was your trip to Kyoto?\nB: It was great. The food was delicious.","A: Are you taking a day trip to the island?\nB: Yes, we will be back before dinner."],"similar":"travel = 여행 전반 / journey = 여정 / tour = 관광","note":"","ko_dialogue":"A: 교토 여행은 어땠어요?\nB: 좋았어요. 음식이 맛있었어요.","dialogue_pairs":[{"en":"A: How was your trip to Kyoto?\nB: It was great. The food was delicious.","ko":"A: 교토 여행은 어땠어요?\nB: 좋았어요. 음식이 맛있었어요."},{"en":"A: Are you taking a day trip to the island?\nB: Yes, we will be back before dinner.","ko":"A: 그 섬으로 당일치기 여행 가세요?\nB: 네, 저녁 먹기 전에는 돌아올 거예요."}],"pronunciation":"트립","id":7},{"day":1,"num":9,"word":"tour","meaning":"관광, 투어","hint":"","mnemonic":"tour [투어] → “두어 곳 둘러보자!”\n한 곳만 보는 게 아니라 두어 곳을 차례로 둘러봅니다.\n두어 ≈ 투어.\n→ tour = 관광 / 투어","dialogue":"A: Does the city tour include lunch?\nB: No, but we stop at a market.","caution":"","dialogues":["A: Does the city tour include lunch?\nB: No, but we stop at a market.","A: What time does the walking tour leave?\nB: It starts from the main square at ten."],"similar":"trip = 여행 / sightseeing = 관광 / guided tour = 가이드 투어","note":"","ko_dialogue":"A: 시티 투어에 점심이 포함되나요?\nB: 아니요. 하지만 시장에 들릅니다.","dialogue_pairs":[{"en":"A: Does the city tour include lunch?\nB: No, but we stop at a market.","ko":"A: 시티 투어에 점심이 포함되나요?\nB: 아니요. 하지만 시장에 들릅니다."},{"en":"A: What time does the walking tour leave?\nB: It starts from the main square at ten.","ko":"A: 도보 투어는 몇 시에 출발하나요?\nB: 10시에 중앙 광장에서 시작합니다."}],"pronunciation":"투어","id":8},{"day":1,"num":10,"word":"flight","meaning":"비행, 항공편","hint":"","mnemonic":"flight [플라이트] → “플라이, 뜬다!”\n야구에서 플라이볼이 하늘로 높이 뜨듯, 활주로를 달린 비행기가 하늘로 뜹니다.\n플라이 + 뜨다 → 플라이트 → 비행. 그렇게 운항하는 한 편이 ‘항공편’입니다.","dialogue":"A: What time is your flight?\nB: At ten, so I need to leave soon.","caution":"","dialogues":["A: What time is your flight?\nB: At ten, so I need to leave soon.","A: My flight was moved to a later time.\nB: You can check the new gate on the app."],"similar":"","note":"","ko_dialogue":"A: 비행기가 몇 시예요?\nB: 10시라서 곧 출발해야 해요.","dialogue_pairs":[{"en":"A: What time is your flight?\nB: At ten, so I need to leave soon.","ko":"A: 비행기가 몇 시예요?\nB: 10시라서 곧 출발해야 해요."},{"en":"A: My flight was moved to a later time.\nB: You can check the new gate on the app.","ko":"A: 제 항공편 시간이 더 늦게 바뀌었어요.\nB: 앱에서 새 탑승구를 확인하실 수 있습니다."}],"pronunciation":"플라이트","id":9},{"day":2,"num":1,"word":"delay","meaning":"지연, 지연되다","hint":"","mnemonic":"delay [딜레이] → “방송이 딜레이됐다” = 늦어졌다.\n→ delay = 지연 / 지연시키다","dialogue":"A: Is there a delay?\nB: Yes, your flight is delayed by thirty minutes.","caution":"","dialogues":["A: Is there a delay?\nB: Yes, your flight is delayed by thirty minutes.","A: The delay is getting longer. Do you know why?\nB: The plane is waiting for better weather."],"similar":"late = 늦은 상태 / postponed = 연기된 / canceled = 취소된","note":"","ko_dialogue":"A: 지연이 있나요?\nB: 네, 고객님의 항공편이 30분 지연됐습니다.","dialogue_pairs":[{"en":"A: Is there a delay?\nB: Yes, your flight is delayed by thirty minutes.","ko":"A: 지연이 있나요?\nB: 네, 고객님의 항공편이 30분 지연됐습니다."},{"en":"A: The delay is getting longer. Do you know why?\nB: The plane is waiting for better weather.","ko":"A: 지연 시간이 계속 길어지네요. 이유를 아시나요?\nB: 날씨가 좋아지기를 기다리고 있습니다."}],"pronunciation":"딜레이","id":10},{"day":2,"num":2,"word":"destination","meaning":"목적지","hint":"","mnemonic":"destination [데스티네이션] → “됐어! 이 네비에 찍은 곳!”\n네비에 마지막으로 찍힌 곳이 최종으로 가는 곳입니다.\n됐어-이-네비… ≈ destination.\n→ destination = 목적지","dialogue":"A: What is your final destination?\nB: Paris. I am changing planes in London.","caution":"","dialogues":["A: What is your final destination?\nB: Paris. I am changing planes in London.","A: Please check that Bangkok is the destination on this tag.\nB: Yes, your bag is tagged through to Bangkok."],"similar":"","note":"","ko_dialogue":"A: 최종 목적지가 어디인가요?\nB: 파리요. 런던에서 비행기를 갈아타요.","dialogue_pairs":[{"en":"A: What is your final destination?\nB: Paris. I am changing planes in London.","ko":"A: 최종 목적지가 어디인가요?\nB: 파리요. 런던에서 비행기를 갈아타요."},{"en":"A: Please check that Bangkok is the destination on this tag.\nB: Yes, your bag is tagged through to Bangkok.","ko":"A: 이 태그의 목적지가 방콕인지 확인해 주세요.\nB: 네, 수하물은 방콕까지 바로 연결되어 있습니다."}],"pronunciation":"데스티네이션","id":11},{"day":2,"num":3,"word":"pack","meaning":"짐을 싸다","hint":"","mnemonic":"pack [팩] → 가방 안에 물건을 “빽빽”하게 넣는다.\n팩 ↔ 빽빽하게 넣는다.\n→ pack = 짐을 싸다 / 포장하다","dialogue":"A: Have you packed your suitcase?\nB: Almost. I just need to pack my charger.","caution":"","dialogues":["A: Have you packed your suitcase?\nB: Almost. I just need to pack my charger.","A: I need to pack a light jacket for the mountains.\nB: Good idea. It gets cold after sunset."],"similar":"","note":"","ko_dialogue":"A: 여행가방은 다 쌌어요?\nB: 거의요. 충전기만 넣으면 돼요.","dialogue_pairs":[{"en":"A: Have you packed your suitcase?\nB: Almost. I just need to pack my charger.","ko":"A: 여행가방은 다 쌌어요?\nB: 거의요. 충전기만 넣으면 돼요."},{"en":"A: I need to pack a light jacket for the mountains.\nB: Good idea. It gets cold after sunset.","ko":"A: 산에 갈 때 얇은 재킷을 챙겨야겠어요.\nB: 좋아요. 해가 지면 추워집니다."}],"pronunciation":"팩","id":12},{"day":2,"num":4,"word":"unpack","meaning":"짐을 풀다","hint":"","mnemonic":"unpack [언팩] → un-(반대로/풀다) + pack(짐 싸다).\n싸 놓은 짐을 반대로 풀어낸다.\n→ unpack = 짐을 풀다","dialogue":"A: Shall we go out now?\nB: Give me ten minutes to unpack first.","caution":"","dialogues":["A: Shall we go out now?\nB: Give me ten minutes to unpack first.","A: I will unpack after we come back from dinner.\nB: Okay, let us leave the bags by the bed for now."],"similar":"","note":"","ko_dialogue":"A: 지금 나갈까요?\nB: 먼저 짐을 풀게 10분만 주세요.","dialogue_pairs":[{"en":"A: Shall we go out now?\nB: Give me ten minutes to unpack first.","ko":"A: 지금 나갈까요?\nB: 먼저 짐을 풀게 10분만 주세요."},{"en":"A: I will unpack after we come back from dinner.\nB: Okay, let us leave the bags by the bed for now.","ko":"A: 저녁 먹고 돌아와서 짐을 풀게요.\nB: 좋아요, 일단 가방은 침대 옆에 둬요."}],"pronunciation":"언팩","id":13},{"day":2,"num":5,"word":"extra","meaning":"추가의, 여분의","hint":"","mnemonic":"extra [엑스트라] → “엑스트라로 하나 더 주세요.”\n원래 것에 더 붙는 추가분.\n→ extra = 추가의 / 여분의","dialogue":"A: Could I have an extra towel?\nB: Certainly. I will bring one to your room.","caution":"","dialogues":["A: Could I have an extra towel?\nB: Certainly. I will bring one to your room.","A: Is there an extra blanket in the room?\nB: Yes, there is one in the closet."],"similar":"","note":"","ko_dialogue":"A: 수건 한 장 더 받을 수 있을까요?\nB: 네. 객실로 가져다드릴게요.","dialogue_pairs":[{"en":"A: Could I have an extra towel?\nB: Certainly. I will bring one to your room.","ko":"A: 수건 한 장 더 받을 수 있을까요?\nB: 네. 객실로 가져다드릴게요."},{"en":"A: Is there an extra blanket in the room?\nB: Yes, there is one in the closet.","ko":"A: 객실에 여분 담요가 있나요?\nB: 네, 옷장 안에 하나 있습니다."}],"pronunciation":"엑스트라","id":14},{"day":2,"num":6,"word":"contact","meaning":"연락하다, 연락처","hint":"","mnemonic":"contact [콘택트] → “콩! 택! 문 두드려 연락!”\n문을 콩, 택 하고 두드려 안에 있는 사람에게 연락합니다.\n콩택트 ≈ contact.\n→ contact = 연락하다 / 접촉하다","dialogue":"A: How can I contact the hotel after midnight?\nB: Call this number. The front desk is open all night.","caution":"","dialogues":["A: How can I contact the hotel after midnight?\nB: Call this number. The front desk is open all night.","A: Please contact me if the tour time changes.\nB: Sure. What number should we use?"],"similar":"","note":"","ko_dialogue":"A: 자정 이후에는 호텔에 어떻게 연락하나요?\nB: 이 번호로 전화하세요. 프런트는 밤새 운영합니다.","dialogue_pairs":[{"en":"A: How can I contact the hotel after midnight?\nB: Call this number. The front desk is open all night.","ko":"A: 자정 이후에는 호텔에 어떻게 연락하나요?\nB: 이 번호로 전화하세요. 프런트는 밤새 운영합니다."},{"en":"A: Please contact me if the tour time changes.\nB: Sure. What number should we use?","ko":"A: 투어 시간이 바뀌면 저에게 연락해 주세요.\nB: 네. 어느 번호로 연락드리면 될까요?"}],"pronunciation":"콘택트","id":15},{"day":2,"num":7,"word":"put on","meaning":"입다, 착용하다","hint":"","mnemonic":"put on [풋 온] → put(놓다) + on(몸 위에).\n옷·모자·안경을 몸 위에 올려 놓는다.\n→ put on = 입다 / 착용하다","dialogue":"A: Do I need to put on a life jacket?\nB: Yes, please wear one before getting on the boat.","caution":"","dialogues":["A: Do I need to put on a life jacket?\nB: Yes, please wear one before getting on the boat.","A: It is cold outside. Put on your jacket.\nB: Good idea. I will get it."],"similar":"","note":"","ko_dialogue":"A: 구명조끼를 입어야 하나요?\nB: 네. 배에 타기 전에 입어주세요.","dialogue_pairs":[{"en":"A: Do I need to put on a life jacket?\nB: Yes, please wear one before getting on the boat.","ko":"A: 구명조끼를 입어야 하나요?\nB: 네. 배에 타기 전에 입어주세요."},{"en":"A: It is cold outside. Put on your jacket.\nB: Good idea. I will get it.","ko":"A: 밖이 추워요. 재킷을 입으세요.\nB: 좋은 생각이에요. 가져올게요."}],"pronunciation":"풋 온","id":16},{"day":2,"num":8,"word":"lose","meaning":"잃어버리다","hint":"","mnemonic":"lose [루즈] → “루즈하게 풀린 주머니 때문에 잃어버렸네!”\n주머니 입구가 헐겁게 벌어진 줄 모르고 다니다가 열쇠가 빠졌습니다. 주머니에 손을 넣어보니 열쇠가 없습니다.\n루즈하게 헐거움 → 물건이 빠짐 → 잃어버리다.\n※ loose(헐거운)의 익숙한 소리를 빌린 연상입니다. lose는 끝이 /z/, loose는 /s/로 다릅니다.","dialogue":"A: I lost my room key.\nB: May I have your name and room number?","caution":"","dialogues":["A: I lost my room key.\nB: May I have your name and room number?","A: What should I do if I lose my passport abroad?\nB: Contact your embassy as soon as possible."],"similar":"","note":"","ko_dialogue":"A: 객실 열쇠를 잃어버렸어요.\nB: 성함과 객실 번호를 알려주시겠어요?","dialogue_pairs":[{"en":"A: I lost my room key.\nB: May I have your name and room number?","ko":"A: 객실 열쇠를 잃어버렸어요.\nB: 성함과 객실 번호를 알려주시겠어요?"},{"en":"A: What should I do if I lose my passport abroad?\nB: Contact your embassy as soon as possible.","ko":"A: 해외에서 여권을 잃어버리면 어떻게 해야 하나요?\nB: 가능한 한 빨리 대사관에 연락하세요."}],"pronunciation":"루즈","id":17},{"day":2,"num":9,"word":"seat","meaning":"좌석","hint":"","mnemonic":"seat [시트]\n“시트에 앉아!”\n비행기나 차에서 사람이 앉는 자리를 떠올린다.\n→ seat = 좌석 / 자리","dialogue":"A: Is this seat taken?\nB: No, you can sit here.","caution":"","dialogues":["A: Is this seat taken?\nB: No, you can sit here.","A: Is there a seat near the front of the bus?\nB: Yes, seat six is still available."],"similar":"chair = 일반 의자 / seat = 지정 좌석 / spot = 자리","note":"","ko_dialogue":"A: 여기 자리 있나요?\nB: 아니요, 여기 앉으셔도 돼요.","dialogue_pairs":[{"en":"A: Is this seat taken?\nB: No, you can sit here.","ko":"A: 여기 자리 있나요?\nB: 아니요, 여기 앉으셔도 돼요."},{"en":"A: Is there a seat near the front of the bus?\nB: Yes, seat six is still available.","ko":"A: 버스 앞쪽에 자리가 있나요?\nB: 네, 6번 좌석이 아직 비어 있습니다."}],"pronunciation":"시트","id":18},{"day":2,"num":10,"word":"aisle","meaning":"통로","hint":"","mnemonic":"aisle [아일] → “아, 일어나기 쉽네!”\n통로 쪽 좌석이면 바로 일어나 밖으로 나가기 쉽습니다.\n아일 → 아, 일어나기 쉽다.\n→ aisle = 통로","dialogue":"A: Could I have an aisle seat?\nB: Yes, there is one in row twenty.","caution":"","dialogues":["A: Could I have an aisle seat?\nB: Yes, there is one in row twenty.","A: Please keep your bag out of the aisle.\nB: Sorry, I will put it under my seat."],"similar":"window seat = 창가 좌석 / middle seat = 가운데 좌석 / aisle seat = 통로 좌석","note":"","ko_dialogue":"A: 통로 쪽 좌석으로 받을 수 있을까요?\nB: 네, 20열에 한 자리 있습니다.","dialogue_pairs":[{"en":"A: Could I have an aisle seat?\nB: Yes, there is one in row twenty.","ko":"A: 통로 쪽 좌석으로 받을 수 있을까요?\nB: 네, 20열에 한 자리 있습니다."},{"en":"A: Please keep your bag out of the aisle.\nB: Sorry, I will put it under my seat.","ko":"A: 가방을 통로에 두지 말아 주세요.\nB: 죄송합니다. 제 좌석 아래에 넣을게요."}],"pronunciation":"아일","id":19},{"day":3,"num":1,"word":"I'm good.","meaning":"괜찮아요, 전 됐어요","hint":"","mnemonic":"I'm good [아임 굿] → “난 괜찮아.”\n상대가 더 필요하냐고 물을 때 “저는 괜찮습니다.”\n→ I'm good. = 괜찮습니다 / 됐습니다","dialogue":"A: Would you like more coffee?\nB: No, I am good. Thank you.","caution":"제안을 정중히 거절할 때 ‘괜찮아요’ 의미. 상황에 따라 ‘나는 잘 지내’ 뜻도 됩니다.","dialogues":["A: Would you like more coffee?\nB: No, I am good. Thank you.","A: Do you need a bag for that?\nB: No, I am good. I can carry it."],"similar":"","note":"제안을 정중히 거절할 때 ‘괜찮아요’ 의미. 상황에 따라 ‘나는 잘 지내’ 뜻도 됩니다.","ko_dialogue":"A: 커피 더 드릴까요?\nB: 아니요, 괜찮아요. 감사합니다.","dialogue_pairs":[{"en":"A: Would you like more coffee?\nB: No, I am good. Thank you.","ko":"A: 커피 더 드릴까요?\nB: 아니요, 괜찮아요. 감사합니다."},{"en":"A: Do you need a bag for that?\nB: No, I am good. I can carry it.","ko":"A: 그거 담을 봉투 필요하세요?\nB: 아니요, 괜찮아요. 제가 들고 갈 수 있어요."}],"pronunciation":"아임 굿","id":20},{"day":3,"num":2,"word":"flight attendant","meaning":"승무원","hint":"","mnemonic":"flight attendant [플라이트 어텐던트]\nflight = 비행, attendant = 곁에서 돌보는 사람.\n비행 중 승객을 돌보는 사람.\n→ flight attendant = 승무원","dialogue":"A: How do I call a flight attendant?\nB: Press the button above your seat.","caution":"","dialogues":["A: How do I call a flight attendant?\nB: Press the button above your seat.","A: A flight attendant said we should remain seated.\nB: There must be some turbulence ahead."],"similar":"","note":"","ko_dialogue":"A: 승무원은 어떻게 부르나요?\nB: 좌석 위에 있는 버튼을 누르세요.","dialogue_pairs":[{"en":"A: How do I call a flight attendant?\nB: Press the button above your seat.","ko":"A: 승무원은 어떻게 부르나요?\nB: 좌석 위에 있는 버튼을 누르세요."},{"en":"A: A flight attendant said we should remain seated.\nB: There must be some turbulence ahead.","ko":"A: 승무원이 계속 앉아 있으라고 했어요.\nB: 앞쪽에 난기류가 있나 봐요."}],"pronunciation":"플라이트 어텐던트","id":21},{"day":3,"num":3,"word":"take off","meaning":"이륙하다, 벗다","hint":"","mnemonic":"take off [테이크 오프] → off = 붙어 있던 곳에서 떨어짐.\n비행기가 땅에서 떨어져 올라간다.\n→ take off = 이륙하다\n※ 옷을 몸에서 떼어내면 ‘벗다’ 뜻도 됨.","dialogue":"A: When do we take off?\nB: In about fifteen minutes.","caution":"비행기는 take off, 사람은 clothes를 take off하면 ‘벗다’가 됩니다.","dialogues":["A: When do we take off?\nB: In about fifteen minutes.","A: Do I need to take off my shoes here?\nB: Yes, please leave them by the door."],"similar":"","note":"비행기는 take off, 사람은 clothes를 take off하면 ‘벗다’가 됩니다.","ko_dialogue":"A: 언제 이륙하나요?\nB: 약 15분 뒤에요.","dialogue_pairs":[{"en":"A: When do we take off?\nB: In about fifteen minutes.","ko":"A: 언제 이륙하나요?\nB: 약 15분 뒤에요."},{"en":"A: Do I need to take off my shoes here?\nB: Yes, please leave them by the door.","ko":"A: 여기에서 신발을 벗어야 하나요?\nB: 네, 문 옆에 두세요."}],"pronunciation":"테이크 오프","id":22},{"day":3,"num":4,"word":"switch","meaning":"바꾸다, 전환하다","hint":"","mnemonic":"switch [스위치] → “스윽, 위치 바꿔!”\n두 사람이 자리를 스윽 옮겨 서로 위치를 바꿉니다.\n스 + 위치 ≈ 스위치.\n→ switch = 바꾸다 / 전환하다","dialogue":"A: Would you mind switching seats with me?\nB: Sure. Which seat is yours?","caution":"","dialogues":["A: Would you mind switching seats with me?\nB: Sure. Which seat is yours?","A: Can we switch to a later train?\nB: Yes, but there is a small change fee."],"similar":"change = 바꾸다 / swap = 서로 바꾸다 / exchange = 교환하다","note":"","ko_dialogue":"A: 저와 자리를 바꿔주시겠어요?\nB: 네. 어느 자리가 본인 자리인가요?","dialogue_pairs":[{"en":"A: Would you mind switching seats with me?\nB: Sure. Which seat is yours?","ko":"A: 저와 자리를 바꿔주시겠어요?\nB: 네. 어느 자리가 본인 자리인가요?"},{"en":"A: Can we switch to a later train?\nB: Yes, but there is a small change fee.","ko":"A: 더 늦은 기차로 바꿀 수 있나요?\nB: 네, 다만 소액의 변경 수수료가 있습니다."}],"pronunciation":"스위치","id":23},{"day":3,"num":5,"word":"need a hand","meaning":"도움이 필요하다","hint":"","mnemonic":"need a hand [니드 어 핸드] → “손 하나가 더 필요해!”\n혼자 하기 힘들어 다른 사람 손을 빌린다.\n→ need a hand = 도움이 필요하다","dialogue":"A: Do you need a hand with that suitcase?\nB: Yes, please. It is quite heavy.","caution":"","dialogues":["A: Do you need a hand with that suitcase?\nB: Yes, please. It is quite heavy.","A: You look like you need a hand with those bags.\nB: Thanks. Could you hold this one for a second?"],"similar":"help = 돕다 / give a hand = 도와주다 / need a hand = 도움이 필요하다","note":"","ko_dialogue":"A: 그 여행가방 드는 것 좀 도와드릴까요?\nB: 네, 부탁드려요. 꽤 무겁네요.","dialogue_pairs":[{"en":"A: Do you need a hand with that suitcase?\nB: Yes, please. It is quite heavy.","ko":"A: 그 여행가방 드는 것 좀 도와드릴까요?\nB: 네, 부탁드려요. 꽤 무겁네요."},{"en":"A: You look like you need a hand with those bags.\nB: Thanks. Could you hold this one for a second?","ko":"A: 그 가방들 때문에 도움이 필요해 보이네요.\nB: 고마워요. 이거 잠깐 들어주실래요?"}],"pronunciation":"니드 어 핸드","id":24},{"day":3,"num":6,"word":"give a hand","meaning":"도와주다","hint":"","mnemonic":"give a hand [기브 어 핸드] → 내 손을 하나 보태준다.\n손을 보태는 것 = 도와주는 것.\n→ give a hand = 도와주다","dialogue":"A: Could you give me a hand with my bag?\nB: Of course. Where would you like it?","caution":"","dialogues":["A: Could you give me a hand with my bag?\nB: Of course. Where would you like it?","A: Could you give me a hand finding this address?\nB: Sure, let me check the map."],"similar":"help = 돕다 / give a hand = 도와주다 / need a hand = 도움이 필요하다","note":"","ko_dialogue":"A: 제 가방 드는 것 좀 도와주시겠어요?\nB: 물론이죠. 어디에 놓아드릴까요?","dialogue_pairs":[{"en":"A: Could you give me a hand with my bag?\nB: Of course. Where would you like it?","ko":"A: 제 가방 드는 것 좀 도와주시겠어요?\nB: 물론이죠. 어디에 놓아드릴까요?"},{"en":"A: Could you give me a hand finding this address?\nB: Sure, let me check the map.","ko":"A: 이 주소 찾는 것 좀 도와주시겠어요?\nB: 네, 지도를 확인해볼게요."}],"pronunciation":"기브 어 핸드","id":25},{"day":3,"num":7,"word":"store","meaning":"가게, 저장하다","hint":"","mnemonic":"store [스토어] → “쓰고 남은 건 싸 두어!”\n당장 안 쓰는 물건은 잘 싸서 두어 보관합니다.\n스토어 ≈ 싸 두어.\n→ store = 보관하다\n물건을 보관해 두고 파는 곳 → store = 가게","dialogue":"A: Can you store my bags until this evening?\nB: Yes. Please collect them before ten.","caution":"","dialogues":["A: Can you store my bags until this evening?\nB: Yes. Please collect them before ten.","A: Is there a grocery store nearby?\nB: Yes, next to the bank."],"similar":"","note":"","ko_dialogue":"A: 오늘 저녁까지 제 짐을 보관해주실 수 있나요?\nB: 네. 10시 전에 찾아가세요.","dialogue_pairs":[{"en":"A: Can you store my bags until this evening?\nB: Yes. Please collect them before ten.","ko":"A: 오늘 저녁까지 제 짐을 보관해주실 수 있나요?\nB: 네. 10시 전에 찾아가세요."},{"en":"A: Is there a grocery store nearby?\nB: Yes, next to the bank.","ko":"A: 근처에 식료품점이 있나요?\nB: 네, 은행 옆에 있어요."}],"pronunciation":"스토어","id":26},{"day":3,"num":8,"word":"limit","meaning":"한도, 제한","hint":"","mnemonic":"limit [리밋] → “이 밑까지만!”\n선을 하나 긋고 그 밑까지만 허용합니다.\n리밋 ≈ 이 밑.\n→ limit = 한도 / 제한","dialogue":"A: What is the weight limit for this bag?\nB: Twenty-three kilos.","caution":"","dialogues":["A: What is the weight limit for this bag?\nB: Twenty-three kilos.","A: Is there a time limit for the luggage lockers?\nB: Yes, you can use them for up to twenty-four hours."],"similar":"","note":"","ko_dialogue":"A: 이 가방의 무게 한도는 얼마인가요?\nB: 23킬로그램입니다.","dialogue_pairs":[{"en":"A: What is the weight limit for this bag?\nB: Twenty-three kilos.","ko":"A: 이 가방의 무게 한도는 얼마인가요?\nB: 23킬로그램입니다."},{"en":"A: Is there a time limit for the luggage lockers?\nB: Yes, you can use them for up to twenty-four hours.","ko":"A: 수하물 보관함 사용 시간 제한이 있나요?\nB: 네, 최대 24시간까지 이용할 수 있습니다."}],"pronunciation":"리밋","id":27},{"day":3,"num":9,"word":"extra charge","meaning":"추가 요금","hint":"","mnemonic":"extra charge [엑스트라 차지]\nextra = 추가, charge = 청구되는 돈.\n원래 금액에 더 붙는 돈.\n→ extra charge = 추가 요금","dialogue":"A: Is there an extra charge for breakfast?\nB: Yes, it is fifteen dollars per person.","caution":"extra charge와 additional fee는 거의 비슷하지만 fee는 정해진 수수료 느낌이 더 강합니다.","dialogues":["A: Is there an extra charge for breakfast?\nB: Yes, it is fifteen dollars per person.","A: Is there an extra charge for a sea-view room?\nB: Yes, it is twenty dollars more per night."],"similar":"fee = 수수료 / surcharge = 추가 요금 / fare = 교통요금","note":"extra charge와 additional fee는 거의 비슷하지만 fee는 정해진 수수료 느낌이 더 강합니다.","ko_dialogue":"A: 아침 식사는 추가 요금이 있나요?\nB: 네, 1인당 15달러입니다.","dialogue_pairs":[{"en":"A: Is there an extra charge for breakfast?\nB: Yes, it is fifteen dollars per person.","ko":"A: 아침 식사는 추가 요금이 있나요?\nB: 네, 1인당 15달러입니다."},{"en":"A: Is there an extra charge for a sea-view room?\nB: Yes, it is twenty dollars more per night.","ko":"A: 바다 전망 객실은 추가 요금이 있나요?\nB: 네, 1박에 20달러가 더 듭니다."}],"pronunciation":"엑스트라 차지","id":28},{"day":3,"num":10,"word":"change","meaning":"바꾸다, 변화, 잔돈","hint":"","mnemonic":"change [체인지]\n“자리 체인지!”\n두 사람이 서로 자리를 바꾼다.\n→ change = 바꾸다 / 변화 / 잔돈","dialogue":"A: Do you have change for a twenty-dollar bill?\nB: Yes. Would two tens be okay?","caution":"","dialogues":["A: Do you have change for a twenty-dollar bill?\nB: Yes. Would two tens be okay?","A: Could I change my seat?\nB: Let me see what is available."],"similar":"","note":"","ko_dialogue":"A: 20달러 지폐를 잔돈으로 바꿀 수 있나요?\nB: 네. 10달러 두 장이면 될까요?","dialogue_pairs":[{"en":"A: Do you have change for a twenty-dollar bill?\nB: Yes. Would two tens be okay?","ko":"A: 20달러 지폐를 잔돈으로 바꿀 수 있나요?\nB: 네. 10달러 두 장이면 될까요?"},{"en":"A: Could I change my seat?\nB: Let me see what is available.","ko":"A: 좌석을 바꿀 수 있을까요?\nB: 어떤 자리가 남아 있는지 확인해볼게요."}],"pronunciation":"체인지","id":29},{"day":4,"num":1,"word":"domestic","meaning":"국내의","hint":"","mnemonic":"국내선 비행기가 집 모양의 커다란 울타리 안에서만 오갑니다. 울타리를 넘어 다른 나라로는 가지 않습니다.\ndomestic의 ‘집·가정의’ 뜻과 ‘우리나라 안의’ 뜻을 같은 울타리로 연결합니다.\n집 안 → 나라 안 → domestic = 국내의. international은 그 울타리 밖, 국가 사이를 오갑니다.","dialogue":"A: Where do I check in for domestic flights?\nB: At the counters on the first floor.","caution":"","dialogues":["A: Where do I check in for domestic flights?\nB: At the counters on the first floor.","A: Do domestic flights leave from this terminal?\nB: Yes, gates one through twenty are for domestic flights."],"similar":"","note":"","ko_dialogue":"A: 국내선은 어디에서 체크인하나요?\nB: 1층 카운터에서 하시면 됩니다.","dialogue_pairs":[{"en":"A: Where do I check in for domestic flights?\nB: At the counters on the first floor.","ko":"A: 국내선은 어디에서 체크인하나요?\nB: 1층 카운터에서 하시면 됩니다."},{"en":"A: Do domestic flights leave from this terminal?\nB: Yes, gates one through twenty are for domestic flights.","ko":"A: 국내선도 이 터미널에서 출발하나요?\nB: 네, 1번부터 20번 탑승구가 국내선입니다."}],"pronunciation":"더메스틱","id":30},{"day":4,"num":2,"word":"international","meaning":"국제의","hint":"","mnemonic":"international [인터내셔널] → inter-(사이) + national(국가의).\n국가와 국가 사이.\n→ international = 국제의","dialogue":"A: Is this the international terminal?\nB: No, you need terminal two.","caution":"international flight = 국제선, domestic flight = 국내선으로 한 쌍으로 외우세요.","dialogues":["A: Is this the international terminal?\nB: No, you need terminal two.","A: How early should I arrive for an international flight?\nB: About three hours before departure."],"similar":"","note":"international flight = 국제선, domestic flight = 국내선으로 한 쌍으로 외우세요.","ko_dialogue":"A: 여기가 국제선 터미널인가요?\nB: 아니요, 2번 터미널로 가셔야 해요.","dialogue_pairs":[{"en":"A: Is this the international terminal?\nB: No, you need terminal two.","ko":"A: 여기가 국제선 터미널인가요?\nB: 아니요, 2번 터미널로 가셔야 해요."},{"en":"A: How early should I arrive for an international flight?\nB: About three hours before departure.","ko":"A: 국제선은 얼마나 일찍 도착해야 하나요?\nB: 출발 약 3시간 전이 좋습니다."}],"pronunciation":"인터내셔널","id":31},{"day":4,"num":3,"word":"baggage","meaning":"수하물, 짐","hint":"","mnemonic":"baggage [배기지] → “백이지! 내 여행 백이지!”\n수하물 벨트에서 내 가방을 발견하고 손가락으로 가리킵니다. “저거 내 백이지!” 가방 손잡이를 잡아 끌어내립니다.\n백이지 → 배기지 → 여행 짐, 수하물.","dialogue":"A: Where can I collect my baggage?\nB: At carousel five, downstairs.","caution":"baggage와 luggage는 대부분 바꿔 써도 되는 셀 수 없는 명사입니다. 짐 한 개는 a piece of baggage/luggage라고 합니다.","dialogues":["A: Where can I collect my baggage?\nB: At carousel five, downstairs.","A: My baggage did not arrive on the carousel.\nB: Please report it at the service counter."],"similar":"luggage = 여행 짐·수하물 / carry-on = 기내 반입 수하물 / checked baggage = 위탁 수하물","note":"baggage와 luggage는 대부분 바꿔 써도 되는 셀 수 없는 명사입니다. 짐 한 개는 a piece of baggage/luggage라고 합니다.","ko_dialogue":"A: 수하물은 어디에서 찾나요?\nB: 아래층 5번 수하물 벨트에서요.","dialogue_pairs":[{"en":"A: Where can I collect my baggage?\nB: At carousel five, downstairs.","ko":"A: 수하물은 어디에서 찾나요?\nB: 아래층 5번 수하물 벨트에서요."},{"en":"A: My baggage did not arrive on the carousel.\nB: Please report it at the service counter.","ko":"A: 제 수하물이 벨트에 나오지 않았어요.\nB: 서비스 카운터에 신고해 주세요."}],"pronunciation":"배기지","id":32},{"day":4,"num":4,"word":"passport","meaning":"여권","hint":"","mnemonic":"passport [패스포트] → “여권을 내밀면 패스!”\n국경 앞에서 길이 막혔습니다. 여권을 펼쳐 내밀자 확인 도장이 찍히고 문이 열립니다.\n여권을 보여주고 패스(pass·통과) → passport = 여권.","dialogue":"A: May I see your passport?\nB: Yes, here you are.","caution":"","dialogues":["A: May I see your passport?\nB: Yes, here you are.","A: I left my passport in the hotel safe.\nB: We have time to go back before the flight."],"similar":"ID = 신분증 / visa = 비자 / boarding pass = 탑승권","note":"","ko_dialogue":"A: 여권을 보여주시겠어요?\nB: 네, 여기 있습니다.","dialogue_pairs":[{"en":"A: May I see your passport?\nB: Yes, here you are.","ko":"A: 여권을 보여주시겠어요?\nB: 네, 여기 있습니다."},{"en":"A: I left my passport in the hotel safe.\nB: We have time to go back before the flight.","ko":"A: 여권을 호텔 금고에 두고 왔어요.\nB: 비행기 타기 전에 돌아갈 시간이 있어요."}],"pronunciation":"패스포트","id":33},{"day":4,"num":5,"word":"arrive","meaning":"도착하다","hint":"","mnemonic":"arrive [어라이브] → “어! 라이브로 도착했네!”\n마중 나온 사람이 도착 순간을 생방송으로 찍고 있습니다. 내가 출구로 나오자 카메라를 보고 “어! 라이브네!” 하고 손을 흔듭니다.\n어 + 라이브 → 어라이브 → 도착하다.","dialogue":"A: What time will we arrive in Osaka?\nB: At about six this evening.","caution":"","dialogues":["A: What time will we arrive in Osaka?\nB: At about six this evening.","A: We should arrive at the hotel before midnight.\nB: I will message them with our arrival time."],"similar":"get to = 도착하다 / reach = 도착하다 / depart = 출발하다","note":"","ko_dialogue":"A: 오사카에 몇 시에 도착하나요?\nB: 오늘 저녁 6시쯤입니다.","dialogue_pairs":[{"en":"A: What time will we arrive in Osaka?\nB: At about six this evening.","ko":"A: 오사카에 몇 시에 도착하나요?\nB: 오늘 저녁 6시쯤입니다."},{"en":"A: We should arrive at the hotel before midnight.\nB: I will message them with our arrival time.","ko":"A: 자정 전에 호텔에 도착할 것 같아요.\nB: 도착 시간을 호텔에 메시지로 알려둘게요."}],"pronunciation":"어라이브","id":34},{"day":4,"num":6,"word":"depart","meaning":"출발하다","hint":"","mnemonic":"depart [디파트] → “뒤에 아파트!”\n여행 가려고 버스에 올라 출발합니다. 창밖을 보니 살던 아파트가 뒤로 멀어집니다. “이제 출발했네! 아파트가 뒤에 있네!”\n뒤 + 아파트 → 디파트 → 아파트를 뒤로 두고 출발하다.\n→ depart = 출발하다, 떠나다","dialogue":"A: When does the next train depart?\nB: At seven ten, from platform three.","caution":"","dialogues":["A: When does the next train depart?\nB: At seven ten, from platform three.","A: Does this ferry depart from pier four?\nB: Yes, boarding begins ten minutes before departure."],"similar":"leave = 떠나다 / take off = 이륙하다 / arrive = 도착하다","note":"","ko_dialogue":"A: 다음 기차는 언제 출발하나요?\nB: 7시 10분에 3번 승강장에서 출발합니다.","dialogue_pairs":[{"en":"A: When does the next train depart?\nB: At seven ten, from platform three.","ko":"A: 다음 기차는 언제 출발하나요?\nB: 7시 10분에 3번 승강장에서 출발합니다."},{"en":"A: Does this ferry depart from pier four?\nB: Yes, boarding begins ten minutes before departure.","ko":"A: 이 페리는 4번 부두에서 출발하나요?\nB: 네, 출발 10분 전에 탑승이 시작됩니다."}],"pronunciation":"디파트","id":35},{"day":4,"num":7,"word":"permitted","meaning":"허용된","hint":"","mnemonic":"permitted [퍼미티드] → “퍼도 됩니다!” 하고 허락받은 상태.\n뷔페에서 음식을 더 떠도 되냐고 묻자 직원이 빈 접시를 내밀며 “더 퍼도 됩니다!”라고 합니다. 허락받았으니 마음 놓고 음식을 풉니다.\n퍼도 됩니다 → 퍼미티드 → 허용된.","dialogue":"A: Is photography permitted inside?\nB: Yes, but please do not use flash.","caution":"permitted와 allowed는 모두 허용된다는 뜻입니다. not permitted는 허용되지 않는다는 뜻입니다.","dialogues":["A: Is photography permitted inside?\nB: Yes, but please do not use flash.","A: Are small backpacks permitted inside the museum?\nB: Yes, but large bags must be checked."],"similar":"allowed = 허용된 / authorized = 승인된 / prohibited = 금지된","note":"permitted와 allowed는 모두 허용된다는 뜻입니다. not permitted는 허용되지 않는다는 뜻입니다.","ko_dialogue":"A: 안에서 사진 촬영이 허용되나요?\nB: 네. 하지만 플래시는 사용하지 마세요.","dialogue_pairs":[{"en":"A: Is photography permitted inside?\nB: Yes, but please do not use flash.","ko":"A: 안에서 사진 촬영이 허용되나요?\nB: 네. 하지만 플래시는 사용하지 마세요."},{"en":"A: Are small backpacks permitted inside the museum?\nB: Yes, but large bags must be checked.","ko":"A: 박물관 안에 작은 배낭은 허용되나요?\nB: 네, 큰 가방은 맡기셔야 합니다."}],"pronunciation":"퍼미티드","id":36},{"day":4,"num":8,"word":"prohibited","meaning":"금지된","hint":"","mnemonic":"prohibited [프로히비티드]\nprohibit [프로히빗] → “프로도 입에 빗장!” = 못 하게 막다.\n이미 못 하도록 막아 놓은 상태가 prohibited.\n→ prohibited = 금지된","dialogue":"A: Is smoking prohibited on the balcony too?\nB: Yes, the whole hotel is smoke-free.","caution":"prohibited는 강한 금지 표현입니다. 일상 대화에서는 not allowed도 자연스럽습니다.","dialogues":["A: Is smoking prohibited on the balcony too?\nB: Yes, the whole hotel is smoke-free.","A: Outside food is prohibited in this theater.\nB: Okay, we will finish our drinks first."],"similar":"forbidden = 금지된 / not allowed = 허용되지 않은 / permitted = 허용된","note":"prohibited는 강한 금지 표현입니다. 일상 대화에서는 not allowed도 자연스럽습니다.","ko_dialogue":"A: 발코니에서도 흡연이 금지되나요?\nB: 네, 호텔 전체가 금연입니다.","dialogue_pairs":[{"en":"A: Is smoking prohibited on the balcony too?\nB: Yes, the whole hotel is smoke-free.","ko":"A: 발코니에서도 흡연이 금지되나요?\nB: 네, 호텔 전체가 금연입니다."},{"en":"A: Outside food is prohibited in this theater.\nB: Okay, we will finish our drinks first.","ko":"A: 이 극장에서는 외부 음식 반입이 금지되어 있습니다.\nB: 알겠습니다. 음료부터 다 마실게요."}],"pronunciation":"프로히비티드","id":37},{"day":4,"num":9,"word":"throw","meaning":"던지다, 버리다","hint":"","mnemonic":"throw [쓰로우] → “쓰러뜨려!”\n공을 힘껏 던져 앞의 깡통을 쓰러뜨립니다.\n쓰러뜨려 → 쓰로우 소리로 연결.\n→ throw = 던지다","dialogue":"A: Where can I throw this away?\nB: There is a bin beside the door.","caution":"","dialogues":["A: Where can I throw this away?\nB: There is a bin beside the door.","A: Do not throw away that train ticket yet.\nB: Why? Do I need it to exit the station?"],"similar":"","note":"","ko_dialogue":"A: 이건 어디에 버리면 되나요?\nB: 문 옆에 쓰레기통이 있어요.","dialogue_pairs":[{"en":"A: Where can I throw this away?\nB: There is a bin beside the door.","ko":"A: 이건 어디에 버리면 되나요?\nB: 문 옆에 쓰레기통이 있어요."},{"en":"A: Do not throw away that train ticket yet.\nB: Why? Do I need it to exit the station?","ko":"A: 그 기차표 아직 버리지 마세요.\nB: 왜요? 역에서 나갈 때 필요한가요?"}],"pronunciation":"쓰로우","id":38},{"day":4,"num":10,"word":"Do you mind ~?","meaning":"~해도 괜찮을까요?","hint":"","mnemonic":"Do you mind [두 유 마인드] → mind = 신경 쓰다/꺼리다.\n“제가 ~하면 신경 쓰이세요?” → “~해도 괜찮으세요?”\n→ Do you mind ~? = ~해도 괜찮으세요?","dialogue":"A: Do you mind if I sit here?\nB: Not at all. Go ahead.","caution":"Do you mind if ...?에 괜찮다고 답할 때는 Not at all. / No, go ahead.가 자연스럽습니다.","dialogues":["A: Do you mind if I sit here?\nB: Not at all. Go ahead.","A: Do you mind if I open the window?\nB: Not at all. Go ahead."],"similar":"","note":"Do you mind if ...?에 괜찮다고 답할 때는 Not at all. / No, go ahead.가 자연스럽습니다.","ko_dialogue":"A: 여기 앉아도 괜찮을까요?\nB: 물론이죠. 앉으세요.","dialogue_pairs":[{"en":"A: Do you mind if I sit here?\nB: Not at all. Go ahead.","ko":"A: 여기 앉아도 괜찮을까요?\nB: 물론이죠. 앉으세요."},{"en":"A: Do you mind if I open the window?\nB: Not at all. Go ahead.","ko":"A: 창문을 열어도 괜찮을까요?\nB: 괜찮아요. 여세요."}],"pronunciation":"두 유 마인드","id":39},{"day":5,"num":1,"word":"After you.","meaning":"먼저 하세요","hint":"","mnemonic":"After you [애프터 유] → “당신 뒤(after)에 제가 갈게요.”\n그러니 상대가 먼저 간다.\n→ After you. = 먼저 가세요","dialogue":"A: After you.\nB: Thank you. That is very kind.","caution":"문이나 엘리베이터에서 상대에게 먼저 가라고 양보할 때 씁니다.","dialogues":["A: After you.\nB: Thank you. That is very kind.","A: After you. The elevator is almost full.\nB: Thanks. I will hold the door for you."],"similar":"","note":"문이나 엘리베이터에서 상대에게 먼저 가라고 양보할 때 씁니다.","ko_dialogue":"A: 먼저 가세요.\nB: 감사합니다. 친절하시네요.","dialogue_pairs":[{"en":"A: After you.\nB: Thank you. That is very kind.","ko":"A: 먼저 가세요.\nB: 감사합니다. 친절하시네요."},{"en":"A: After you. The elevator is almost full.\nB: Thanks. I will hold the door for you.","ko":"A: 먼저 타세요. 엘리베이터가 거의 찼네요.\nB: 고마워요. 문 잡아드릴게요."}],"pronunciation":"애프터 유","id":40},{"day":5,"num":2,"word":"Sounds good.","meaning":"좋네요, 좋아요","hint":"","mnemonic":"Sounds good [사운즈 굿] → “좋게 들린다.”\n상대 제안이 마음에 든다.\n→ Sounds good. = 좋아요 / 괜찮네요","dialogue":"A: Shall we meet in the lobby at nine?\nB: Sounds good. See you there.","caution":"제안에 동의할 때 아주 자연스러운 표현. sound는 여기서 ‘소리’가 아니라 ‘~하게 들리다’.","dialogues":["A: Shall we meet in the lobby at nine?\nB: Sounds good. See you there.","A: Let us take the early train and have lunch there.\nB: Sounds good. I will book the tickets."],"similar":"","note":"제안에 동의할 때 아주 자연스러운 표현. sound는 여기서 ‘소리’가 아니라 ‘~하게 들리다’.","ko_dialogue":"A: 9시에 로비에서 만날까요?\nB: 좋아요. 거기서 봐요.","dialogue_pairs":[{"en":"A: Shall we meet in the lobby at nine?\nB: Sounds good. See you there.","ko":"A: 9시에 로비에서 만날까요?\nB: 좋아요. 거기서 봐요."},{"en":"A: Let us take the early train and have lunch there.\nB: Sounds good. I will book the tickets.","ko":"A: 이른 기차 타고 거기서 점심 먹어요.\nB: 좋아요. 제가 표를 예매할게요."}],"pronunciation":"사운즈 굿","id":41},{"day":5,"num":3,"word":"appreciate","meaning":"고맙게 여기다, 감사하다","hint":"","mnemonic":"appreciate [어프리시에이트] → “어, 프리 시트! 감사해요!”\n추가 비용 없이 좋은 좌석으로 바꿔줬습니다. “어! 프리(free·무료) 시트(seat·좌석)를 주셨네요. 정말 감사해요!”\n어 + 프리 + 시트 → 어프리시에이트 → 고맙게 여기다.\n※ ‘무료 좌석’ 이야기는 발음 기억용입니다.","dialogue":"A: I can help you carry that upstairs.\nB: Thank you. I really appreciate it.","caution":"","dialogues":["A: I can help you carry that upstairs.\nB: Thank you. I really appreciate it.","A: I appreciate you calling a taxi for us.\nB: No problem. It should be here in five minutes."],"similar":"","note":"","ko_dialogue":"A: 그거 위층까지 옮기는 걸 도와드릴게요.\nB: 감사합니다. 정말 감사해요.","dialogue_pairs":[{"en":"A: I can help you carry that upstairs.\nB: Thank you. I really appreciate it.","ko":"A: 그거 위층까지 옮기는 걸 도와드릴게요.\nB: 감사합니다. 정말 감사해요."},{"en":"A: I appreciate you calling a taxi for us.\nB: No problem. It should be here in five minutes.","ko":"A: 저희를 위해 택시 불러주셔서 감사해요.\nB: 별말씀을요. 5분 안에 올 거예요."}],"pronunciation":"어프리시에이트","id":42},{"day":5,"num":4,"word":"I'll have ~.","meaning":"~로 할게요","hint":"","mnemonic":"I'll have [아일 해브] → “저는 ~를 가질게요.”\n메뉴를 고르고 내가 가질 것을 말한다.\n→ I'll have ~. = ~로 주세요 / ~로 할게요","dialogue":"A: What would you like to order?\nB: I will have the chicken, please.","caution":"식당 주문에서 자연스럽습니다. I'll take ~. / I'd like ~.도 가능.","dialogues":["A: What would you like to order?\nB: I will have the chicken, please.","A: I will have the pasta and a sparkling water.\nB: Great. Would you like anything else?"],"similar":"","note":"식당 주문에서 자연스럽습니다. I'll take ~. / I'd like ~.도 가능.","ko_dialogue":"A: 무엇을 주문하시겠어요?\nB: 닭고기 요리로 할게요.","dialogue_pairs":[{"en":"A: What would you like to order?\nB: I will have the chicken, please.","ko":"A: 무엇을 주문하시겠어요?\nB: 닭고기 요리로 할게요."},{"en":"A: I will have the pasta and a sparkling water.\nB: Great. Would you like anything else?","ko":"A: 파스타와 탄산수로 할게요.\nB: 좋습니다. 더 필요한 건 있으세요?"}],"pronunciation":"아일 해브","id":43},{"day":5,"num":5,"word":"have a problem with","meaning":"~에 문제가 있다","hint":"","mnemonic":"have a problem with [해브 어 프라블럼 위드]\nhave(가지고 있다) + problem(문제) + with(~에).\n→ have a problem with = ~에 문제가 있다","dialogue":"A: I have a problem with my room key.\nB: Let me check it for you.","caution":"","dialogues":["A: I have a problem with my room key.\nB: Let me check it for you.","A: I have a problem with the shower in my room.\nB: I will send someone up to check it."],"similar":"","note":"","ko_dialogue":"A: 객실 키에 문제가 있어요.\nB: 제가 확인해드릴게요.","dialogue_pairs":[{"en":"A: I have a problem with my room key.\nB: Let me check it for you.","ko":"A: 객실 키에 문제가 있어요.\nB: 제가 확인해드릴게요."},{"en":"A: I have a problem with the shower in my room.\nB: I will send someone up to check it.","ko":"A: 제 객실 샤워기에 문제가 있어요.\nB: 확인할 직원을 보내드리겠습니다."}],"pronunciation":"해브 어 프라블럼 위드","id":44},{"day":5,"num":6,"word":"coach","meaning":"장거리버스 / (항공기) 일반석","hint":"","mnemonic":"coach [코치] → “코치님과 선수단이 큰 버스에!”\n운동 코치가 선수들을 데리고 장거리 원정을 갑니다. 선수와 짐이 한꺼번에 큰 버스에 올라탑니다.\n코치가 타고 가는 큰 버스 → coach = 장거리버스.\n항공기에서는 coach가 일반석을 뜻하기도 합니다.","dialogue":"A: Does this coach go to the airport?\nB: Yes, and it leaves in five minutes.","caution":"","dialogues":["A: Does this coach go to the airport?\nB: Yes, and it leaves in five minutes.","A: Is there a direct coach from here to the city center?\nB: Yes, it leaves every thirty minutes."],"similar":"","note":"","ko_dialogue":"A: 이 버스가 공항으로 가나요?\nB: 네, 5분 뒤에 출발해요.","dialogue_pairs":[{"en":"A: Does this coach go to the airport?\nB: Yes, and it leaves in five minutes.","ko":"A: 이 버스가 공항으로 가나요?\nB: 네, 5분 뒤에 출발해요."},{"en":"A: Is there a direct coach from here to the city center?\nB: Yes, it leaves every thirty minutes.","ko":"A: 여기서 시내 중심까지 직행 버스가 있나요?\nB: 네, 30분마다 출발합니다."}],"pronunciation":"코치","id":45},{"day":5,"num":7,"word":"turn on","meaning":"켜다","hint":"","mnemonic":"turn on [턴 온] → 스위치를 돌려(turn) ON 상태로 만든다.\n→ turn on = 켜다","dialogue":"A: How do I turn on the air conditioner?\nB: Press the green button on the remote.","caution":"","dialogues":["A: How do I turn on the air conditioner?\nB: Press the green button on the remote.","A: Could you turn on the reading light, please?\nB: Sure, the switch is right above you."],"similar":"","note":"","ko_dialogue":"A: 에어컨은 어떻게 켜나요?\nB: 리모컨의 초록색 버튼을 누르세요.","dialogue_pairs":[{"en":"A: How do I turn on the air conditioner?\nB: Press the green button on the remote.","ko":"A: 에어컨은 어떻게 켜나요?\nB: 리모컨의 초록색 버튼을 누르세요."},{"en":"A: Could you turn on the reading light, please?\nB: Sure, the switch is right above you.","ko":"A: 독서등 좀 켜주시겠어요?\nB: 네, 스위치는 바로 위에 있습니다."}],"pronunciation":"턴 온","id":46},{"day":5,"num":8,"word":"turn up","meaning":"도착하다, 나타나다, 소리를 키우다","hint":"","mnemonic":"turn up [턴 업] → 조절기를 돌려(turn) 수치를 UP(위로).\n→ turn up = 볼륨·온도 등을 높이다","dialogue":"A: Could you turn up the volume a little?\nB: Sure. Is that better?","caution":"","dialogues":["A: Could you turn up the volume a little?\nB: Sure. Is that better?","A: My friend did not turn up for the tour.\nB: We can wait five more minutes before we leave."],"similar":"arrive = 도착하다 / reach = 도착하다 / get to = ~에 도착하다","note":"","ko_dialogue":"A: 소리를 조금 키워주시겠어요?\nB: 네. 이제 더 잘 들리나요?","dialogue_pairs":[{"en":"A: Could you turn up the volume a little?\nB: Sure. Is that better?","ko":"A: 소리를 조금 키워주시겠어요?\nB: 네. 이제 더 잘 들리나요?"},{"en":"A: My friend did not turn up for the tour.\nB: We can wait five more minutes before we leave.","ko":"A: 제 친구가 투어에 나타나지 않았어요.\nB: 출발 전에 5분 더 기다릴 수 있습니다."}],"pronunciation":"턴 업","id":47},{"day":5,"num":9,"word":"immigration","meaning":"출입국 심사","hint":"","mnemonic":"immigration [이미그레이션] → “이미 그 나라에 왔지만, 심사부터!”\n비행기는 이미 다른 나라에 내렸습니다. 신나서 나가려는데 심사관이 여권과 방문 목적을 확인합니다.\n이미 그 나라에 왔다 → 이미그… → 입국 심사를 거쳐야 한다.\n→ immigration = 출입국 심사 / 이민","dialogue":"A: Where do we go through immigration?\nB: Follow this hallway to the passport control area.","caution":"","dialogues":["A: Where do we go through immigration?\nB: Follow this hallway to the passport control area.","A: The line at immigration is very long today.\nB: Yes, several flights arrived at the same time."],"similar":"passport control = 여권 심사 / customs = 세관 / border control = 출입국 심사","note":"","ko_dialogue":"A: 입국 심사는 어디에서 받나요?\nB: 이 복도를 따라 여권 심사 구역으로 가세요.","dialogue_pairs":[{"en":"A: Where do we go through immigration?\nB: Follow this hallway to the passport control area.","ko":"A: 입국 심사는 어디에서 받나요?\nB: 이 복도를 따라 여권 심사 구역으로 가세요."},{"en":"A: The line at immigration is very long today.\nB: Yes, several flights arrived at the same time.","ko":"A: 오늘 입국 심사 줄이 정말 기네요.\nB: 네, 여러 항공편이 동시에 도착했어요."}],"pronunciation":"이미그레이션","id":48},{"day":5,"num":10,"word":"customs","meaning":"세관","hint":"","mnemonic":"customs [커스텀즈] → “커스텀 가방도 열어보세요!”\n내 취향대로 꾸민 커스텀 가방을 들고 국경을 넘습니다. 직원이 가방을 열어 어떤 물건을 가져왔는지 확인합니다.\n커스텀 가방 속 물건을 검사하는 곳 → 커스텀즈 → 세관.\n사람의 입국을 심사하는 immigration과 물건을 확인하는 customs를 구별합니다.","dialogue":"A: Where is customs?\nB: Just past the baggage claim area.","caution":"","dialogues":["A: Where is customs?\nB: Just past the baggage claim area.","A: Do I need to open my suitcase at customs?\nB: Only if an officer asks you to."],"similar":"immigration = 출입국 심사 / declaration = 세관 신고 / duty = 관세","note":"","ko_dialogue":"A: 세관은 어디인가요?\nB: 수하물 찾는 곳을 지나면 바로 있어요.","dialogue_pairs":[{"en":"A: Where is customs?\nB: Just past the baggage claim area.","ko":"A: 세관은 어디인가요?\nB: 수하물 찾는 곳을 지나면 바로 있어요."},{"en":"A: Do I need to open my suitcase at customs?\nB: Only if an officer asks you to.","ko":"A: 세관에서 여행가방을 열어야 하나요?\nB: 직원이 요청할 때만 여시면 됩니다."}],"pronunciation":"커스텀즈","id":49},{"day":6,"num":1,"word":"duty-free","meaning":"면세의, 면세점의","hint":"","mnemonic":"duty-free [듀티 프리] → duty(관세) + free(없는).\n관세가 없는 것.\n→ duty-free = 면세의","dialogue":"A: Where is the duty-free shop?\nB: There is one near gate ten.","caution":"duty-free는 관세 면제. tax-free는 세금 면제라는 더 넓은 표현입니다.","dialogues":["A: Where is the duty-free shop?\nB: There is one near gate ten.","A: Can I buy duty-free perfume after security?\nB: Yes, the shop is near gate twenty."],"similar":"","note":"duty-free는 관세 면제. tax-free는 세금 면제라는 더 넓은 표현입니다.","ko_dialogue":"A: 면세점이 어디인가요?\nB: 10번 탑승구 근처에 있어요.","dialogue_pairs":[{"en":"A: Where is the duty-free shop?\nB: There is one near gate ten.","ko":"A: 면세점이 어디인가요?\nB: 10번 탑승구 근처에 있어요."},{"en":"A: Can I buy duty-free perfume after security?\nB: Yes, the shop is near gate twenty.","ko":"A: 보안 검색 후에 면세 향수를 살 수 있나요?\nB: 네, 20번 탑승구 근처에 매장이 있습니다."}],"pronunciation":"듀티 프리","id":50},{"day":6,"num":2,"word":"make sure to","meaning":"반드시 ~하다, 꼭 ~하다","hint":"","mnemonic":"make sure to [메이크 슈어 투]\nmake sure = 확실하게 만들다.\n“확실하게 ~하도록 해.”\n→ make sure to = 꼭 ~하다 / 반드시 ~하다","dialogue":"A: Make sure to bring your ticket tomorrow.\nB: Okay. I will put it in my bag now.","caution":"make sure to + 동사 = 꼭 ~하세요. make sure that + 문장 형태도 가능합니다.","dialogues":["A: Make sure to bring your ticket tomorrow.\nB: Okay. I will put it in my bag now.","A: Make sure to keep your boarding pass until you land.\nB: Okay, I will keep it in my passport holder."],"similar":"","note":"make sure to + 동사 = 꼭 ~하세요. make sure that + 문장 형태도 가능합니다.","ko_dialogue":"A: 내일 표를 꼭 가져오세요.\nB: 네. 지금 가방에 넣어둘게요.","dialogue_pairs":[{"en":"A: Make sure to bring your ticket tomorrow.\nB: Okay. I will put it in my bag now.","ko":"A: 내일 표를 꼭 가져오세요.\nB: 네. 지금 가방에 넣어둘게요."},{"en":"A: Make sure to keep your boarding pass until you land.\nB: Okay, I will keep it in my passport holder.","ko":"A: 착륙할 때까지 탑승권을 꼭 보관하세요.\nB: 네, 여권 지갑에 넣어둘게요."}],"pronunciation":"메이크 슈어 투","id":51},{"day":6,"num":3,"word":"first (given) name","meaning":"이름","hint":"","mnemonic":"first/given name [퍼스트 기븐 네임]\ngiven = ‘주어진’. 태어나며 개인에게 주어진 이름.\n→ first name / given name = 이름","dialogue":"A: What is your first name?\nB: Sungwoo. My family name is Son.","caution":"","dialogues":["A: What is your first name?\nB: Sungwoo. My family name is Son.","A: What should I write for my first name?\nB: Write the given name exactly as it appears on your passport."],"similar":"","note":"","ko_dialogue":"A: 이름이 어떻게 되세요?\nB: 성우입니다. 성은 손입니다.","dialogue_pairs":[{"en":"A: What is your first name?\nB: Sungwoo. My family name is Son.","ko":"A: 이름이 어떻게 되세요?\nB: 성우입니다. 성은 손입니다."},{"en":"A: What should I write for my first name?\nB: Write the given name exactly as it appears on your passport.","ko":"A: 이름란에는 무엇을 적어야 하나요?\nB: 여권에 적힌 이름을 그대로 쓰세요."}],"pronunciation":"퍼스트 기븐 네임","id":52},{"day":6,"num":4,"word":"last (family) name","meaning":"성","hint":"","mnemonic":"last/family name [래스트 패밀리 네임]\nfamily = 가족. 가족이 함께 쓰는 이름.\n→ last name / family name = 성","dialogue":"A: What is your last name?\nB: Son. S-O-N.","caution":"","dialogues":["A: What is your last name?\nB: Son. S-O-N.","A: Is this box for my last name?\nB: Yes, enter your family name there."],"similar":"","note":"","ko_dialogue":"A: 성이 어떻게 되세요?\nB: 손입니다. S-O-N이에요.","dialogue_pairs":[{"en":"A: What is your last name?\nB: Son. S-O-N.","ko":"A: 성이 어떻게 되세요?\nB: 손입니다. S-O-N이에요."},{"en":"A: Is this box for my last name?\nB: Yes, enter your family name there.","ko":"A: 이 칸에 성을 쓰는 건가요?\nB: 네, 거기에 성을 입력하세요."}],"pronunciation":"래스트 패밀리 네임","id":53},{"day":6,"num":5,"word":"declare","meaning":"신고하다, 선언하다","hint":"","mnemonic":"declare [디클레어] → “클리어하게 다 밝혀!”\n세관 직원 앞에서 가방을 열고 가져온 물건을 하나씩 꺼내 밝힙니다. 숨기지 않고 내용을 분명하게 신고합니다.\n클리어(clear·분명하게)하게 밝히기 → 디클레어 → 신고하다, 선언하다.\n※ clear는 소리와 뜻을 연결하기 위한 말입니다.","dialogue":"A: Do you have anything to declare?\nB: Yes, I have some food. Where should I list it?","caution":"","dialogues":["A: Do you have anything to declare?\nB: Yes, I have some food. Where should I list it?","A: Do I have to declare this bottle of wine?\nB: It depends on the amount you are bringing in."],"similar":"","note":"","ko_dialogue":"A: 신고할 물품이 있나요?\nB: 네, 음식이 조금 있어요. 어디에 적으면 되나요?","dialogue_pairs":[{"en":"A: Do you have anything to declare?\nB: Yes, I have some food. Where should I list it?","ko":"A: 신고할 물품이 있나요?\nB: 네, 음식이 조금 있어요. 어디에 적으면 되나요?"},{"en":"A: Do I have to declare this bottle of wine?\nB: It depends on the amount you are bringing in.","ko":"A: 이 와인 한 병을 신고해야 하나요?\nB: 반입하는 양에 따라 달라집니다."}],"pronunciation":"디클레어","id":54},{"day":6,"num":6,"word":"occupation","meaning":"직업","hint":"","mnemonic":"occupation [아큐페이션] → “하루의 시간을 차지하는 일!”\n하루 시간표 한가운데를 치과기공 작업이 크게 차지하고 있습니다. 그 시간에 내가 하는 일이 내 직업입니다.\noccupy(차지하다) → 하루의 많은 시간을 차지하는 일 → occupation(직업).\n‘점유’라는 뜻도 같은 ‘차지함’에서 연결합니다.","dialogue":"A: What is your occupation?\nB: I am a dental technician.","caution":"","dialogues":["A: What is your occupation?\nB: I am a dental technician.","A: What should I put for occupation on this form?\nB: Write your current job title."],"similar":"","note":"","ko_dialogue":"A: 직업이 무엇인가요?\nB: 치과기공사입니다.","dialogue_pairs":[{"en":"A: What is your occupation?\nB: I am a dental technician.","ko":"A: 직업이 무엇인가요?\nB: 치과기공사입니다."},{"en":"A: What should I put for occupation on this form?\nB: Write your current job title.","ko":"A: 이 서류의 직업란에는 무엇을 적어야 하나요?\nB: 현재 직업을 적으시면 됩니다."}],"pronunciation":"아큐페이션","id":55},{"day":6,"num":7,"word":"nationality","meaning":"국적","hint":"","mnemonic":"nationality [내셔낼리티] → national(국가의) + -ity(상태).\n어느 국가에 속한 상태인가?\n→ nationality = 국적","dialogue":"A: What is your nationality?\nB: I am South Korean.","caution":"입국신고서 nationality는 국적. country of residence는 거주국이라 다릅니다.","dialogues":["A: What is your nationality?\nB: I am South Korean.","A: The form asks for my nationality, not my country of residence.\nB: Right, enter the country of your citizenship."],"similar":"","note":"입국신고서 nationality는 국적. country of residence는 거주국이라 다릅니다.","ko_dialogue":"A: 국적이 어디인가요?\nB: 대한민국입니다.","dialogue_pairs":[{"en":"A: What is your nationality?\nB: I am South Korean.","ko":"A: 국적이 어디인가요?\nB: 대한민국입니다."},{"en":"A: The form asks for my nationality, not my country of residence.\nB: Right, enter the country of your citizenship.","ko":"A: 이 서류에는 거주 국가가 아니라 국적을 적으라고 하네요.\nB: 맞아요, 시민권 국가를 적으세요."}],"pronunciation":"내셔낼리티","id":56},{"day":6,"num":8,"word":"purpose","meaning":"목적","hint":"","mnemonic":"purpose [퍼퍼스] → “퍼! 퍼! 왜 퍼?”\n친구가 모래를 계속 퍼 나릅니다. “왜 그렇게 퍼?” 하고 물으니 “모래성을 만들려고!”라고 답합니다.\n퍼, 퍼 → 퍼퍼스 → 왜 하는지, 그 목적.\n→ purpose = 목적","dialogue":"A: What is the purpose of your visit?\nB: I am here on vacation.","caution":"","dialogues":["A: What is the purpose of your visit?\nB: I am here on vacation.","A: What is the purpose of your visit?\nB: Tourism. I am here for one week."],"similar":"","note":"","ko_dialogue":"A: 방문 목적이 무엇인가요?\nB: 휴가로 왔습니다.","dialogue_pairs":[{"en":"A: What is the purpose of your visit?\nB: I am here on vacation.","ko":"A: 방문 목적이 무엇인가요?\nB: 휴가로 왔습니다."},{"en":"A: What is the purpose of your visit?\nB: Tourism. I am here for one week.","ko":"A: 방문 목적이 무엇인가요?\nB: 관광입니다. 일주일 동안 머물 예정입니다."}],"pronunciation":"퍼퍼스","id":57},{"day":6,"num":9,"word":"bring","meaning":"가져오다, 가져가다","hint":"","mnemonic":"bring [브링] → “벨이 브링! 물건을 가져왔네!”\n문 앞에서 벨이 ‘브링!’ 하고 울립니다. 문을 열자 친구가 부탁한 여행가방을 들고 와 있습니다.\n브링 하고 벨이 울림 → 필요한 물건을 이쪽으로 가져옴 → bring = 가져오다.","dialogue":"A: Should I bring my passport on the tour?\nB: Yes, please bring it with you.","caution":"","dialogues":["A: Should I bring my passport on the tour?\nB: Yes, please bring it with you.","A: Should I bring a jacket on the boat tour?\nB: Yes, it can get windy on the water."],"similar":"","note":"","ko_dialogue":"A: 투어에 여권을 가져가야 하나요?\nB: 네, 가지고 오세요.","dialogue_pairs":[{"en":"A: Should I bring my passport on the tour?\nB: Yes, please bring it with you.","ko":"A: 투어에 여권을 가져가야 하나요?\nB: 네, 가지고 오세요."},{"en":"A: Should I bring a jacket on the boat tour?\nB: Yes, it can get windy on the water.","ko":"A: 보트 투어에 재킷을 가져가야 하나요?\nB: 네, 물 위에서는 바람이 많이 불 수 있어요."}],"pronunciation":"브링","id":58},{"day":6,"num":10,"word":"stay","meaning":"머무르다, 머무름","hint":"","mnemonic":"stay [스테이] → homestay의 stay = 집에 머묾.\n→ stay = 머무르다 / 숙박하다","dialogue":"A: How long will you stay?\nB: Five nights. I leave on Monday.","caution":"","dialogues":["A: How long will you stay?\nB: Five nights. I leave on Monday.","A: How long are you going to stay in Rome?\nB: Four nights, then we are taking a train to Florence."],"similar":"","note":"","ko_dialogue":"A: 얼마나 머무르실 건가요?\nB: 5박이요. 월요일에 떠납니다.","dialogue_pairs":[{"en":"A: How long will you stay?\nB: Five nights. I leave on Monday.","ko":"A: 얼마나 머무르실 건가요?\nB: 5박이요. 월요일에 떠납니다."},{"en":"A: How long are you going to stay in Rome?\nB: Four nights, then we are taking a train to Florence.","ko":"A: 로마에 얼마나 머무를 예정이에요?\nB: 4박하고 피렌체로 기차를 탈 거예요."}],"pronunciation":"스테이","id":59},{"day":7,"num":1,"word":"plan to","meaning":"~할 계획이다","hint":"","mnemonic":"plan to [플랜 투] → plan(계획) + to(할).\n→ plan to = ~할 계획이다","dialogue":"A: What do you plan to do tomorrow?\nB: I plan to visit the old town.","caution":"plan to + 동사원형. plan on + -ing 형태도 가능합니다.","dialogues":["A: What do you plan to do tomorrow?\nB: I plan to visit the old town.","A: We plan to visit the museum first thing tomorrow.\nB: Then you should book the first time slot."],"similar":"","note":"plan to + 동사원형. plan on + -ing 형태도 가능합니다.","ko_dialogue":"A: 내일 무엇을 할 계획이에요?\nB: 구시가지를 방문할 계획이에요.","dialogue_pairs":[{"en":"A: What do you plan to do tomorrow?\nB: I plan to visit the old town.","ko":"A: 내일 무엇을 할 계획이에요?\nB: 구시가지를 방문할 계획이에요."},{"en":"A: We plan to visit the museum first thing tomorrow.\nB: Then you should book the first time slot.","ko":"A: 내일 아침에 제일 먼저 박물관에 갈 계획이에요.\nB: 그럼 첫 시간대를 예약하시는 게 좋겠습니다."}],"pronunciation":"플랜 투","id":60},{"day":7,"num":2,"word":"itinerary","meaning":"여행 일정","hint":"","mnemonic":"itinerary [아이티너러리] → “아이, 티켓을 날짜대로 나란히!”\n비행기표·기차표·박물관 표를 날짜와 시간 순으로 나란히 펼칩니다. 그 사이에 호텔과 식사 시간을 적으니 여행 전체의 순서가 완성됩니다.\n아이 + 티켓 + 나란히 → 아이티너러리 → 여행 일정표.\n한 번의 이동 시각만이 아니라 여행의 여러 일정을 모아놓은 것입니다.","dialogue":"A: Could you email me the itinerary?\nB: Of course. It includes all the meeting times.","caution":"","dialogues":["A: Could you email me the itinerary?\nB: Of course. It includes all the meeting times.","A: I changed our itinerary because of the rain.\nB: That makes sense. We can do the outdoor tour tomorrow."],"similar":"","note":"","ko_dialogue":"A: 여행 일정표를 이메일로 보내주시겠어요?\nB: 물론이죠. 모임 시간이 모두 적혀 있어요.","dialogue_pairs":[{"en":"A: Could you email me the itinerary?\nB: Of course. It includes all the meeting times.","ko":"A: 여행 일정표를 이메일로 보내주시겠어요?\nB: 물론이죠. 모임 시간이 모두 적혀 있어요."},{"en":"A: I changed our itinerary because of the rain.\nB: That makes sense. We can do the outdoor tour tomorrow.","ko":"A: 비 때문에 여행 일정을 바꿨어요.\nB: 잘했어요. 야외 투어는 내일 하면 되겠네요."}],"pronunciation":"아이티너레리","id":61},{"day":7,"num":3,"word":"sightseeing","meaning":"관광","hint":"","mnemonic":"sightseeing [사이트시잉] → sight(볼거리) + seeing(보기).\n볼거리를 보러 다닌다.\n→ sightseeing = 관광","dialogue":"A: Are you here for business?\nB: No, I am here for sightseeing.","caution":"","dialogues":["A: Are you here for business?\nB: No, I am here for sightseeing.","A: We spent the whole afternoon sightseeing in the old town.\nB: Did you visit the cathedral too?"],"similar":"","note":"","ko_dialogue":"A: 출장으로 오셨나요?\nB: 아니요, 관광하러 왔습니다.","dialogue_pairs":[{"en":"A: Are you here for business?\nB: No, I am here for sightseeing.","ko":"A: 출장으로 오셨나요?\nB: 아니요, 관광하러 왔습니다."},{"en":"A: We spent the whole afternoon sightseeing in the old town.\nB: Did you visit the cathedral too?","ko":"A: 오후 내내 구시가지에서 관광했어요.\nB: 대성당도 가봤어요?"}],"pronunciation":"사이트시잉","id":62},{"day":7,"num":4,"word":"repeat","meaning":"반복하다, 다시 말하다","hint":"","mnemonic":"repeat [리피트] → “같은 비트를 다시!”\n음악이 끝나자 처음의 비트가 다시 나옵니다. 같은 구간이 몇 번이고 반복됩니다. 못 들은 말도 처음부터 다시 들려달라고 합니다.\n다시 돌아오는 비트 → 리피트 → 반복하다, 다시 말하다.","dialogue":"A: Could you repeat the room number, please?\nB: Certainly. It is eight twelve.","caution":"","dialogues":["A: Could you repeat the room number, please?\nB: Certainly. It is eight twelve.","A: Could you repeat the gate number, please?\nB: Gate twenty-six."],"similar":"","note":"","ko_dialogue":"A: 객실 번호를 다시 말씀해주시겠어요?\nB: 네. 812호입니다.","dialogue_pairs":[{"en":"A: Could you repeat the room number, please?\nB: Certainly. It is eight twelve.","ko":"A: 객실 번호를 다시 말씀해주시겠어요?\nB: 네. 812호입니다."},{"en":"A: Could you repeat the gate number, please?\nB: Gate twenty-six.","ko":"A: 탑승구 번호를 다시 말씀해주시겠어요?\nB: 26번 탑승구입니다."}],"pronunciation":"리피트","id":63},{"day":7,"num":5,"word":"write down","meaning":"적어두다","hint":"","mnemonic":"write down [라이트 다운] → write(쓰다) + down(아래에 내려 적다).\n→ write down = 적어두다","dialogue":"A: Could you write down the address?\nB: Sure. I will write it on this card.","caution":"","dialogues":["A: Could you write down the address?\nB: Sure. I will write it on this card.","A: Could you write down the hotel address for the driver?\nB: Sure, I will write it on this card."],"similar":"","note":"","ko_dialogue":"A: 주소를 적어주시겠어요?\nB: 네. 이 카드에 적어드릴게요.","dialogue_pairs":[{"en":"A: Could you write down the address?\nB: Sure. I will write it on this card.","ko":"A: 주소를 적어주시겠어요?\nB: 네. 이 카드에 적어드릴게요."},{"en":"A: Could you write down the hotel address for the driver?\nB: Sure, I will write it on this card.","ko":"A: 기사님을 위해 호텔 주소를 적어주시겠어요?\nB: 네, 이 카드에 적어드릴게요."}],"pronunciation":"라이트 다운","id":64},{"day":7,"num":6,"word":"spell out","meaning":"철자를 하나씩 말하다","hint":"","mnemonic":"spell out [스펠 아웃] → spell(철자) + out(끝까지 풀어내다).\n철자를 하나씩 끝까지 말한다.\n→ spell out = 철자를 하나씩 말하다","dialogue":"A: Could you spell out your last name?\nB: Yes. S-O-N.","caution":"","dialogues":["A: Could you spell out your last name?\nB: Yes. S-O-N.","A: Could you spell out the street name for me?\nB: Sure. It is B-R-O-O-K Street."],"similar":"","note":"","ko_dialogue":"A: 성의 철자를 하나씩 말씀해주시겠어요?\nB: 네. S-O-N입니다.","dialogue_pairs":[{"en":"A: Could you spell out your last name?\nB: Yes. S-O-N.","ko":"A: 성의 철자를 하나씩 말씀해주시겠어요?\nB: 네. S-O-N입니다."},{"en":"A: Could you spell out the street name for me?\nB: Sure. It is B-R-O-O-K Street.","ko":"A: 거리 이름 철자를 하나씩 말해주시겠어요?\nB: 네. B-R-O-O-K Street입니다."}],"pronunciation":"스펠 아웃","id":65},{"day":7,"num":7,"word":"nearest","meaning":"가장 가까운","hint":"","mnemonic":"nearest [니어리스트] → near(가까운) + -est(가장).\n→ nearest = 가장 가까운","dialogue":"A: Where is the nearest subway station?\nB: It is two blocks from here.","caution":"","dialogues":["A: Where is the nearest subway station?\nB: It is two blocks from here.","A: Where is the nearest place to buy a SIM card?\nB: There is a phone shop in the station."],"similar":"nearby = 근처의 / close = 가까운 / nearest = 가장 가까운","note":"","ko_dialogue":"A: 가장 가까운 지하철역이 어디인가요?\nB: 여기에서 두 블록 거리에 있어요.","dialogue_pairs":[{"en":"A: Where is the nearest subway station?\nB: It is two blocks from here.","ko":"A: 가장 가까운 지하철역이 어디인가요?\nB: 여기에서 두 블록 거리에 있어요."},{"en":"A: Where is the nearest place to buy a SIM card?\nB: There is a phone shop in the station.","ko":"A: 가장 가까운 유심 판매점이 어디인가요?\nB: 역 안에 휴대폰 매장이 있습니다."}],"pronunciation":"니어리스트","id":66},{"day":7,"num":8,"word":"reserve","meaning":"예약하다","hint":"","mnemonic":"reserve [리저브] → “미리, 저 자리 비워둬!”\n사람이 몰려오기 전에 식당에 전화합니다. “저녁에 갈 테니 저 자리 미리 비워주세요.” 직원이 내 자리를 남겨둡니다.\n미리 + 저 자리 + 비워둬 → 리저브 → 예약하다.","dialogue":"A: Could I reserve a table for two at seven?\nB: Certainly. May I have your name?","caution":"","dialogues":["A: Could I reserve a table for two at seven?\nB: Certainly. May I have your name?","A: I would like to reserve a table by the window.\nB: Certainly. What time would you like to come?"],"similar":"book = 예약하다 / reservation = 예약(명사) / hold = 잠시 잡아두다","note":"","ko_dialogue":"A: 7시에 두 명 자리를 예약할 수 있을까요?\nB: 네. 성함을 알려주시겠어요?","dialogue_pairs":[{"en":"A: Could I reserve a table for two at seven?\nB: Certainly. May I have your name?","ko":"A: 7시에 두 명 자리를 예약할 수 있을까요?\nB: 네. 성함을 알려주시겠어요?"},{"en":"A: I would like to reserve a table by the window.\nB: Certainly. What time would you like to come?","ko":"A: 창가 자리로 예약하고 싶어요.\nB: 네. 몇 시에 오시겠어요?"}],"pronunciation":"리저브","id":67},{"day":7,"num":9,"word":"ticket booth","meaning":"매표소","hint":"","mnemonic":"ticket booth [티켓 부스]\nticket = 표, booth = 작은 칸막이 부스.\n표를 파는 작은 부스.\n→ ticket booth = 매표소","dialogue":"A: Where is the ticket booth?\nB: Beside the main entrance.","caution":"","dialogues":["A: Where is the ticket booth?\nB: Beside the main entrance.","A: Is the ticket booth still open?\nB: Yes, it closes at six."],"similar":"","note":"","ko_dialogue":"A: 매표소는 어디인가요?\nB: 정문 옆에 있어요.","dialogue_pairs":[{"en":"A: Where is the ticket booth?\nB: Beside the main entrance.","ko":"A: 매표소는 어디인가요?\nB: 정문 옆에 있어요."},{"en":"A: Is the ticket booth still open?\nB: Yes, it closes at six.","ko":"A: 매표소 아직 열려 있나요?\nB: 네, 6시에 문을 닫습니다."}],"pronunciation":"티켓 부스","id":68},{"day":7,"num":10,"word":"admission fee","meaning":"입장료","hint":"","mnemonic":"admission fee [어드미션 피] → “문을 통과하는 미션에는 비용!”\n관광지 입구의 문이 닫혀 있습니다. 입장료를 내자 문이 열리고, 안으로 들어가는 미션을 완료합니다.\n어드미션의 ‘미션’ 소리 + fee(비용) → 입구를 통과하려고 내는 돈 → 입장료.\n※ mission은 소리를 붙이기 위한 이야기입니다.","dialogue":"A: How much is the admission fee?\nB: Ten dollars for adults. Children enter free.","caution":"admission = 입장, fee = 요금. admission free는 ‘입장 무료’라는 뜻이라 철자 하나 차이를 주의하세요.","dialogues":["A: How much is the admission fee?\nB: Ten dollars for adults. Children enter free.","A: Does the admission fee include the audio guide?\nB: No, the audio guide is five dollars extra."],"similar":"","note":"admission = 입장, fee = 요금. admission free는 ‘입장 무료’라는 뜻이라 철자 하나 차이를 주의하세요.","ko_dialogue":"A: 입장료가 얼마인가요?\nB: 성인은 10달러이고, 어린이는 무료입니다.","dialogue_pairs":[{"en":"A: How much is the admission fee?\nB: Ten dollars for adults. Children enter free.","ko":"A: 입장료가 얼마인가요?\nB: 성인은 10달러이고, 어린이는 무료입니다."},{"en":"A: Does the admission fee include the audio guide?\nB: No, the audio guide is five dollars extra.","ko":"A: 입장료에 오디오 가이드가 포함되나요?\nB: 아니요, 오디오 가이드는 5달러 추가입니다."}],"pronunciation":"어드미션 피","id":69},{"day":8,"num":1,"word":"souvenir","meaning":"기념품","hint":"","mnemonic":"souvenir [수버니어] → “수북이 넣어!”\n여행지에서 산 기념품을 가방에 수북이 넣습니다.\n수버니어 ≈ 수북이 넣어.\n→ souvenir = 기념품","dialogue":"A: I am looking for a small souvenir.\nB: These magnets are easy to carry home.","caution":"","dialogues":["A: I am looking for a small souvenir.\nB: These magnets are easy to carry home.","A: I want to buy a small souvenir for my parents.\nB: These local tea sets are very popular."],"similar":"","note":"","ko_dialogue":"A: 작은 기념품을 찾고 있어요.\nB: 이 자석들은 집에 가져가기 편해요.","dialogue_pairs":[{"en":"A: I am looking for a small souvenir.\nB: These magnets are easy to carry home.","ko":"A: 작은 기념품을 찾고 있어요.\nB: 이 자석들은 집에 가져가기 편해요."},{"en":"A: I want to buy a small souvenir for my parents.\nB: These local tea sets are very popular.","ko":"A: 부모님께 드릴 작은 기념품을 사고 싶어요.\nB: 이 지역 찻잔 세트가 아주 인기 있어요."}],"pronunciation":"수버니어","id":70},{"day":8,"num":2,"word":"get some information","meaning":"정보를 얻다","hint":"","mnemonic":"get some information [겟 썸 인포메이션]\nget = 얻다, information = 정보.\n→ get some information = 정보를 얻다","dialogue":"A: Where can I get some information about local buses?\nB: Try the visitor center across the street.","caution":"","dialogues":["A: Where can I get some information about local buses?\nB: Try the visitor center across the street.","A: Where can I get some information about local buses?\nB: Try the tourist desk beside the exit."],"similar":"","note":"","ko_dialogue":"A: 지역 버스에 관한 정보는 어디에서 얻을 수 있나요?\nB: 길 건너 관광 안내소에 가보세요.","dialogue_pairs":[{"en":"A: Where can I get some information about local buses?\nB: Try the visitor center across the street.","ko":"A: 지역 버스에 관한 정보는 어디에서 얻을 수 있나요?\nB: 길 건너 관광 안내소에 가보세요."},{"en":"A: Where can I get some information about local buses?\nB: Try the tourist desk beside the exit.","ko":"A: 지역 버스 정보를 어디에서 얻을 수 있나요?\nB: 출구 옆 관광 안내 데스크에 가보세요."}],"pronunciation":"겟 썸 인포메이션","id":71},{"day":8,"num":3,"word":"sign up","meaning":"신청하다, 등록하다","hint":"","mnemonic":"sign up [사인 업] → sign(서명)하고 명단에 올라간다(up).\n→ sign up = 신청하다 / 등록하다","dialogue":"A: Can I sign up for the walking tour here?\nB: Yes. Please write your name on this list.","caution":"","dialogues":["A: Can I sign up for the walking tour here?\nB: Yes. Please write your name on this list.","A: Can I sign up for tomorrow's cooking class?\nB: Yes, there are still three places left."],"similar":"","note":"","ko_dialogue":"A: 여기에서 도보 투어를 신청할 수 있나요?\nB: 네. 이 명단에 이름을 적어주세요.","dialogue_pairs":[{"en":"A: Can I sign up for the walking tour here?\nB: Yes. Please write your name on this list.","ko":"A: 여기에서 도보 투어를 신청할 수 있나요?\nB: 네. 이 명단에 이름을 적어주세요."},{"en":"A: Can I sign up for tomorrow's cooking class?\nB: Yes, there are still three places left.","ko":"A: 내일 요리 수업에 신청할 수 있나요?\nB: 네, 아직 세 자리 남아 있습니다."}],"pronunciation":"사인 업","id":72},{"day":8,"num":4,"word":"business hours","meaning":"영업시간","hint":"","mnemonic":"business hour [비즈니스 아워]\nbusiness = 영업, hour = 시간.\n→ business hours = 영업시간","dialogue":"A: What are your business hours on Sunday?\nB: We open at ten and close at six.","caution":"영업시간은 보통 복수형 business hours로 씁니다.","dialogues":["A: What are your business hours on Sunday?\nB: We open at ten and close at six.","A: What are your business hours on Sundays?\nB: We are open from ten to four."],"similar":"","note":"영업시간은 보통 복수형 business hours로 씁니다.","ko_dialogue":"A: 일요일 영업시간이 어떻게 되나요?\nB: 10시에 열고 6시에 닫습니다.","dialogue_pairs":[{"en":"A: What are your business hours on Sunday?\nB: We open at ten and close at six.","ko":"A: 일요일 영업시간이 어떻게 되나요?\nB: 10시에 열고 6시에 닫습니다."},{"en":"A: What are your business hours on Sundays?\nB: We are open from ten to four.","ko":"A: 일요일 영업시간은 어떻게 되나요?\nB: 오전 10시부터 오후 4시까지입니다."}],"pronunciation":"비즈니스 아워즈","id":73},{"day":8,"num":5,"word":"discount","meaning":"할인","hint":"","mnemonic":"discount [디스카운트] → 한국에서도 “디스카운트 해주세요” = 깎아주세요.\n→ discount = 할인","dialogue":"A: Is there a discount for students?\nB: Yes. Please show your student ID.","caution":"","dialogues":["A: Is there a discount for students?\nB: Yes. Please show your student ID.","A: Is there a discount for students?\nB: Yes, show your student ID at the counter."],"similar":"sale = 할인 판매 / coupon = 할인 쿠폰 / promotion = 프로모션","note":"","ko_dialogue":"A: 학생 할인이 있나요?\nB: 네. 학생증을 보여주세요.","dialogue_pairs":[{"en":"A: Is there a discount for students?\nB: Yes. Please show your student ID.","ko":"A: 학생 할인이 있나요?\nB: 네. 학생증을 보여주세요."},{"en":"A: Is there a discount for students?\nB: Yes, show your student ID at the counter.","ko":"A: 학생 할인 있나요?\nB: 네, 카운터에서 학생증을 보여주세요."}],"pronunciation":"디스카운트","id":74},{"day":8,"num":6,"word":"allowed","meaning":"허용된","hint":"","mnemonic":"allowed [얼라우드] → “얼라, 와도 돼!”\n아이를 데리고 들어가도 되는지 묻자 주인이 문을 열어줍니다. “얼라(아이)도 와도 돼요!”\n얼라 + 와도 돼 → 얼라우드 → 허용된.\n아이뿐 아니라 어떤 행동이나 물건이 허용되는 경우에도 씁니다.","dialogue":"A: Are drinks allowed inside?\nB: Only water in a closed bottle.","caution":"","dialogues":["A: Are drinks allowed inside?\nB: Only water in a closed bottle.","A: Are drinks allowed on the train?\nB: Yes, as long as you keep the area clean."],"similar":"","note":"","ko_dialogue":"A: 안에 음료를 가져가도 되나요?\nB: 뚜껑을 닫은 물병만 가능합니다.","dialogue_pairs":[{"en":"A: Are drinks allowed inside?\nB: Only water in a closed bottle.","ko":"A: 안에 음료를 가져가도 되나요?\nB: 뚜껑을 닫은 물병만 가능합니다."},{"en":"A: Are drinks allowed on the train?\nB: Yes, as long as you keep the area clean.","ko":"A: 기차 안에서 음료를 마셔도 되나요?\nB: 네, 주변을 깨끗하게 사용하시면 됩니다."}],"pronunciation":"얼라우드","id":75},{"day":8,"num":7,"word":"place to ~","meaning":"~할 장소","hint":"","mnemonic":"place to [플레이스 투] → place(장소) + to(~할).\nplace to eat = 먹을 곳, place to stay = 머물 곳.\n→ place to ~ = ~할 장소","dialogue":"A: Is there a place to charge my
