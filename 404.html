How much is the bus fare?\nB: Two dollars per person.","dialogues":["A: How much is the bus fare?\nB: Two dollars per person.","A: What is the bus fare to the airport?\nB: It is eight dollars if you pay by card."],"caution":"","past":true,"similar":"fare = 교통요금 / fee = 수수료 / price = 일반 가격","note":"","ko_dialogue":"A: 버스 요금은 얼마인가요?\nB: 1인당 2달러입니다.","dialogue_pairs":[{"en":"A: How much is the bus fare?\nB: Two dollars per person.","ko":"A: 버스 요금은 얼마인가요?\nB: 1인당 2달러입니다."},{"en":"A: What is the bus fare to the airport?\nB: It is eight dollars if you pay by card.","ko":"A: 공항까지 버스 요금이 얼마인가요?\nB: 카드로 결제하면 8달러입니다."}],"pronunciation":"페어","id":218},{"day":22,"num":10,"word":"gate","meaning":"탑승구, 문","hint":"","mnemonic":"gate [게이트] → “게임 게이트가 열리면 다음 공간으로!”\n게임에서 커다란 게이트 앞에 서 있다가 문이 열리면 안으로 들어갑니다. 공항에서도 탑승구를 통과해 비행기로 들어갑니다.\n익숙한 게이트의 통과 동작 → gate = 문 / 탑승구.","dialogue":"A: Has our gate changed?\nB: Yes. Your flight now leaves from gate eighteen.","dialogues":["A: Has our gate changed?\nB: Yes. Your flight now leaves from gate eighteen.","A: Has the gate for our flight changed?\nB: Yes, it moved from gate twelve to gate eighteen."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 저희 탑승구가 바뀌었나요?\nB: 네. 지금은 18번 탑승구에서 출발합니다.","dialogue_pairs":[{"en":"A: Has our gate changed?\nB: Yes. Your flight now leaves from gate eighteen.","ko":"A: 저희 탑승구가 바뀌었나요?\nB: 네. 지금은 18번 탑승구에서 출발합니다."},{"en":"A: Has the gate for our flight changed?\nB: Yes, it moved from gate twelve to gate eighteen.","ko":"A: 우리 항공편 탑승구가 바뀌었나요?\nB: 네, 12번에서 18번으로 바뀌었습니다."}],"pronunciation":"게이트","id":219},{"day":23,"num":1,"word":"voucher","meaning":"바우처, 이용권","hint":"","mnemonic":"voucher [바우처] → “바로 바꿔주는 쿠폰!”\n조식 이용권 한 장을 내밀자 직원이 돈 대신 그 종이를 받고 아침 식사를 내줍니다. 종이가 서비스로 바뀝니다.\n바우처를 내면 바로 서비스로 바꿈 → voucher = 이용권, 교환권.","dialogue":"A: Where can I use this breakfast voucher?\nB: At the restaurant on the second floor.","dialogues":["A: Where can I use this breakfast voucher?\nB: At the restaurant on the second floor.","A: Can I use this meal voucher at any restaurant in the terminal?\nB: Only at the restaurants listed on the back."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 조식 이용권은 어디에서 사용할 수 있나요?\nB: 2층 식당에서요.","dialogue_pairs":[{"en":"A: Where can I use this breakfast voucher?\nB: At the restaurant on the second floor.","ko":"A: 이 조식 이용권은 어디에서 사용할 수 있나요?\nB: 2층 식당에서요."},{"en":"A: Can I use this meal voucher at any restaurant in the terminal?\nB: Only at the restaurants listed on the back.","ko":"A: 이 식사 바우처를 터미널 안 아무 식당에서나 쓸 수 있나요?\nB: 뒷면에 적힌 식당에서만 사용할 수 있습니다."}],"pronunciation":"바우처","id":220},{"day":23,"num":2,"word":"schedule","meaning":"일정, 시간표","hint":"","mnemonic":"schedule [스케줄] → “시간마다 약속이 줄줄이!”\n아침 비행기, 점심 식사, 오후 투어를 달력의 시간 칸마다 차례로 넣습니다. 스케줄이 차면서 하루에 어디서 무엇을 할지 정해집니다.\n익숙한 스케줄 + 시간 칸에 약속이 들어가는 모습 → 일정, 시간표.","dialogue":"A: Could I see the ferry schedule?\nB: Yes. The next ferry leaves at two.","dialogues":["A: Could I see the ferry schedule?\nB: Yes. The next ferry leaves at two.","A: Has the ferry schedule changed for winter?\nB: Yes, there are fewer departures after October."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 페리 시간표를 볼 수 있을까요?\nB: 네. 다음 페리는 2시에 출발합니다.","dialogue_pairs":[{"en":"A: Could I see the ferry schedule?\nB: Yes. The next ferry leaves at two.","ko":"A: 페리 시간표를 볼 수 있을까요?\nB: 네. 다음 페리는 2시에 출발합니다."},{"en":"A: Has the ferry schedule changed for winter?\nB: Yes, there are fewer departures after October.","ko":"A: 겨울에는 페리 시간표가 바뀌나요?\nB: 네, 10월 이후에는 운항 횟수가 줄어듭니다."}],"pronunciation":"스케줄","id":221},{"day":23,"num":3,"word":"laundry","meaning":"세탁물, 세탁","hint":"","mnemonic":"laundry [론드리] → “러닝셔츠도 돌려!”\n땀에 젖은 러닝셔츠를 벗어 세탁기에 넣습니다. “러닝셔츠도 돌려!” 하며 버튼을 누르자 셔츠가 빙빙 돌면서 빨립니다.\n러닝 + 돌려 → 론드리 → 세탁, 세탁물.","dialogue":"A: Does the hotel have a laundry service?\nB: Yes. Put your clothes in the bag in your closet.","dialogues":["A: Does the hotel have a laundry service?\nB: Yes. Put your clothes in the bag in your closet.","A: Is there a self-service laundry near the hotel?\nB: Yes, one is open late two blocks away."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 호텔에 세탁 서비스가 있나요?\nB: 네. 옷장 안의 봉투에 세탁물을 넣어주세요.","dialogue_pairs":[{"en":"A: Does the hotel have a laundry service?\nB: Yes. Put your clothes in the bag in your closet.","ko":"A: 호텔에 세탁 서비스가 있나요?\nB: 네. 옷장 안의 봉투에 세탁물을 넣어주세요."},{"en":"A: Is there a self-service laundry near the hotel?\nB: Yes, one is open late two blocks away.","ko":"A: 호텔 근처에 셀프 세탁실이 있나요?\nB: 네, 두 블록 떨어진 곳에 늦게까지 하는 곳이 있습니다."}],"pronunciation":"론드리","id":222},{"day":23,"num":4,"word":"luggage storage","meaning":"수하물 보관소","hint":"","mnemonic":"luggage storage [러기지 스토리지]\nluggage [러기지] = 여행 짐, storage = 보관.\n→ luggage storage = 수하물 보관소","dialogue":"A: Is there luggage storage at the station?\nB: Yes, beside the ticket office.","dialogues":["A: Is there luggage storage at the station?\nB: Yes, beside the ticket office.","A: How much does luggage storage cost for six hours?\nB: It is five dollars per bag."],"caution":"","past":true,"similar":"store = 보관하다 / keep = 보관하다 / storage = 보관","note":"","ko_dialogue":"A: 역에 수하물 보관소가 있나요?\nB: 네, 매표소 옆에 있어요.","dialogue_pairs":[{"en":"A: Is there luggage storage at the station?\nB: Yes, beside the ticket office.","ko":"A: 역에 수하물 보관소가 있나요?\nB: 네, 매표소 옆에 있어요."},{"en":"A: How much does luggage storage cost for six hours?\nB: It is five dollars per bag.","ko":"A: 짐을 6시간 보관하는 데 얼마인가요?\nB: 가방 하나당 5달러입니다."}],"pronunciation":"러기지 스토리지","id":223},{"day":23,"num":5,"word":"currency","meaning":"통화, 화폐","hint":"","mnemonic":"currency [커런시] → “그 나라 안에서 돌고 도는 돈!”\n내가 식당에서 낸 돈이 직원에게 가고, 직원이 빵집에 내고, 빵집이 다시 시장에 냅니다. 같은 돈이 그 나라 안에서 계속 흐릅니다.\ncurrent의 ‘흐름’과 모양을 연결 → 유통되어 흐르는 돈 → currency = 통화, 화폐.","dialogue":"A: Which currency do you accept?\nB: We only accept euros.","dialogues":["A: Which currency do you accept?\nB: We only accept euros.","A: What currency do they use on the island?\nB: They use the euro."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 어떤 화폐를 받나요?\nB: 유로만 받습니다.","dialogue_pairs":[{"en":"A: Which currency do you accept?\nB: We only accept euros.","ko":"A: 어떤 화폐를 받나요?\nB: 유로만 받습니다."},{"en":"A: What currency do they use on the island?\nB: They use the euro.","ko":"A: 그 섬에서는 어떤 화폐를 사용하나요?\nB: 유로를 사용합니다."}],"pronunciation":"커런시","id":224},{"day":23,"num":6,"word":"spicy","meaning":"매운","hint":"","mnemonic":"spicy [스파이시] → spice(향신료) + -y(~한).\n향신료 맛이 강한 것.\n→ spicy = 매운 / 향신료가 강한","dialogue":"A: Is this dish very spicy?\nB: A little. We can make it less spicy.","dialogues":["A: Is this dish very spicy?\nB: A little. We can make it less spicy.","A: Is this curry very spicy?\nB: It is medium spicy, but we can make it milder."],"caution":"","past":true,"similar":"spicy = 매운 / hot = 뜨거운·매운 / mild = 순한","note":"","ko_dialogue":"A: 이 요리는 많이 매운가요?\nB: 조금 매워요. 덜 맵게 만들어드릴 수 있어요.","dialogue_pairs":[{"en":"A: Is this dish very spicy?\nB: A little. We can make it less spicy.","ko":"A: 이 요리는 많이 매운가요?\nB: 조금 매워요. 덜 맵게 만들어드릴 수 있어요."},{"en":"A: Is this curry very spicy?\nB: It is medium spicy, but we can make it milder.","ko":"A: 이 카레는 많이 매운가요?\nB: 중간 정도 맵지만 덜 맵게 해드릴 수 있어요."}],"pronunciation":"스파이시","id":225},{"day":23,"num":7,"word":"vegetarian","meaning":"채식주의자, 채식의","hint":"","mnemonic":"vegetarian [베지테리언] → “베지터블 접시를 고르는 사람!”\n식탁에 고기 접시와 채소 접시가 나란히 있습니다. 베지터블(vegetable·채소) 접시를 골라 담고 채식으로 식사를 합니다.\n베지터블 → 베지테리언 → 채식주의자.\n채식 메뉴는 vegetarian food라고 합니다.","dialogue":"A: Do you have any vegetarian dishes?\nB: Yes, the vegetable curry contains no meat or fish.","dialogues":["A: Do you have any vegetarian dishes?\nB: Yes, the vegetable curry contains no meat or fish.","A: Do you have a vegetarian breakfast option?\nB: Yes, we have eggs, fruit, and vegetable sandwiches."],"caution":"","past":true,"similar":"vegetarian = 채식주의자 / vegan = 완전 채식주의자 / meat-free = 고기 없는","note":"","ko_dialogue":"A: 채식 메뉴가 있나요?\nB: 네, 채소 카레에는 고기나 생선이 들어가지 않아요.","dialogue_pairs":[{"en":"A: Do you have any vegetarian dishes?\nB: Yes, the vegetable curry contains no meat or fish.","ko":"A: 채식 메뉴가 있나요?\nB: 네, 채소 카레에는 고기나 생선이 들어가지 않아요."},{"en":"A: Do you have a vegetarian breakfast option?\nB: Yes, we have eggs, fruit, and vegetable sandwiches.","ko":"A: 채식 아침 메뉴가 있나요?\nB: 네, 달걀과 과일, 채소 샌드위치가 있습니다."}],"pronunciation":"베지테리언","id":226},{"day":23,"num":8,"word":"verify","meaning":"확인하다, 검증하다","hint":"","mnemonic":"verify [베러파이] → “베낀 파일, 맞나 봐!”\n여권 내용을 파일에 옮겨 적은 뒤 원본과 한 글자씩 맞는지 확인합니다.\n베낀 파일 맞나 봐 → 베러파이.\n→ verify = 확인하다 / 검증하다","dialogue":"A: Could you verify my booking details?\nB: Certainly. May I have your booking number?","dialogues":["A: Could you verify my booking details?\nB: Certainly. May I have your booking number?","A: Could you verify the departure time for me?\nB: Yes, the train leaves at 8:45."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 제 예약 내용을 확인해주시겠어요?\nB: 네. 예약 번호를 알려주시겠어요?","dialogue_pairs":[{"en":"A: Could you verify my booking details?\nB: Certainly. May I have your booking number?","ko":"A: 제 예약 내용을 확인해주시겠어요?\nB: 네. 예약 번호를 알려주시겠어요?"},{"en":"A: Could you verify the departure time for me?\nB: Yes, the train leaves at 8:45.","ko":"A: 출발 시간을 확인해주시겠어요?\nB: 네, 기차는 8시 45분에 출발합니다."}],"pronunciation":"베러파이","id":227},{"day":23,"num":9,"word":"fit","meaning":"맞다, 맞추다","hint":"","mnemonic":"옷의 ‘핏’이 딱 맞다 → fit = 크기·모양이 맞다.\nfit은 크기, suit는 어울림에 초점을 둡니다.","dialogue":"A: Do these shoes fit?\nB: They are a little tight. Can I try a larger size?","dialogues":["A: Do these shoes fit?\nB: They are a little tight. Can I try a larger size?","A: Does this suitcase fit in the overhead bin?\nB: Yes, it should fit without a problem."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 신발이 맞나요?\nB: 조금 끼네요. 더 큰 사이즈를 신어봐도 될까요?","dialogue_pairs":[{"en":"A: Do these shoes fit?\nB: They are a little tight. Can I try a larger size?","ko":"A: 이 신발이 맞나요?\nB: 조금 끼네요. 더 큰 사이즈를 신어봐도 될까요?"},{"en":"A: Does this suitcase fit in the overhead bin?\nB: Yes, it should fit without a problem.","ko":"A: 이 여행가방이 머리 위 수납칸에 들어가나요?\nB: 네, 문제없이 들어갈 겁니다."}],"pronunciation":"핏","id":228},{"day":23,"num":10,"word":"broken","meaning":"고장 난, 깨진","hint":"","mnemonic":"broken [브로큰] → “브레이크가 고장 나 멈추질 않네!”\n손수레의 브레이크 부품이 부러졌습니다. 손잡이를 잡아도 브레이크가 일을 못 합니다.\n브레이크가 부러짐 → break(깨뜨리다)의 결과 broken → 깨진, 고장 난.\n브레이크(brake)는 소리 연결용이며 break와 철자가 다릅니다.","dialogue":"A: The lock on my door is broken.\nB: I am sorry. We will arrange another room for you.","dialogues":["A: The lock on my door is broken.\nB: I am sorry. We will arrange another room for you.","A: The air conditioner in my room is broken.\nB: I am sorry. We will send someone to fix it."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 객실 문 잠금장치가 고장 났어요.\nB: 죄송합니다. 다른 객실을 마련해드릴게요.","dialogue_pairs":[{"en":"A: The lock on my door is broken.\nB: I am sorry. We will arrange another room for you.","ko":"A: 객실 문 잠금장치가 고장 났어요.\nB: 죄송합니다. 다른 객실을 마련해드릴게요."},{"en":"A: The air conditioner in my room is broken.\nB: I am sorry. We will send someone to fix it.","ko":"A: 제 객실 에어컨이 고장 났어요.\nB: 죄송합니다. 수리할 직원을 보내드리겠습니다."}],"pronunciation":"브로큰","id":229},{"day":24,"num":1,"word":"elevator","meaning":"엘리베이터","hint":"","mnemonic":"elevator [엘리베이터] → “엘리베이터 바닥이 나를 위로 올린다!”\n버튼을 누르자 바닥이 나를 받친 채 위층으로 올라갑니다. 계단을 걷지 않아도 몸이 통째로 들어 올려집니다.\nelevate(높이 올리다)하는 장치 → elevator = 엘리베이터.","dialogue":"A: Where is the elevator?\nB: Just past the front desk, on your left.","dialogues":["A: Where is the elevator?\nB: Just past the front desk, on your left.","A: Is there an elevator to the observation deck?\nB: Yes, it is at the end of the hall."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 엘리베이터가 어디에 있나요?\nB: 프런트를 지나면 바로 왼쪽에 있어요.","dialogue_pairs":[{"en":"A: Where is the elevator?\nB: Just past the front desk, on your left.","ko":"A: 엘리베이터가 어디에 있나요?\nB: 프런트를 지나면 바로 왼쪽에 있어요."},{"en":"A: Is there an elevator to the observation deck?\nB: Yes, it is at the end of the hall.","ko":"A: 전망대로 가는 엘리베이터가 있나요?\nB: 네, 복도 끝에 있습니다."}],"pronunciation":"엘리베이터","id":230},{"day":24,"num":2,"word":"lift","meaning":"엘리베이터, 들어 올리다","hint":"","mnemonic":"lift [리프트] → 위로 들어 올린다.\n사람을 위로 올려주는 장치도 영국에서는 lift.\n→ lift = 들다 / 엘리베이터","dialogue":"A: Could you help me lift this bag?\nB: Sure. Let us put it on the rack.","dialogues":["A: Could you help me lift this bag?\nB: Sure. Let us put it on the rack.","A: Is there a lift in this building?\nB: Yes, just behind the stairs."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 가방 들어 올리는 걸 도와주시겠어요?\nB: 네. 선반에 올려놓아요.","dialogue_pairs":[{"en":"A: Could you help me lift this bag?\nB: Sure. Let us put it on the rack.","ko":"A: 이 가방 들어 올리는 걸 도와주시겠어요?\nB: 네. 선반에 올려놓아요."},{"en":"A: Is there a lift in this building?\nB: Yes, just behind the stairs.","ko":"A: 이 건물에 엘리베이터가 있나요?\nB: 네, 계단 바로 뒤에 있어요."}],"pronunciation":"리프트","id":231},{"day":24,"num":3,"word":"restock","meaning":"재입고하다","hint":"","mnemonic":"restock [리스탁]\nre- = 다시\nstock [스탁] → “싹 다 쌓아둬!” = 재고.\n다시 재고를 쌓아 채웁니다.\n→ restock = 재입고하다 / 재고를 채우다","dialogue":"A: When will you restock this size?\nB: We expect more on Friday.","dialogues":["A: When will you restock this size?\nB: We expect more on Friday.","A: When will you restock these travel bottles?\nB: We expect more tomorrow morning."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 사이즈는 언제 재입고되나요?\nB: 금요일에 더 들어올 예정이에요.","dialogue_pairs":[{"en":"A: When will you restock this size?\nB: We expect more on Friday.","ko":"A: 이 사이즈는 언제 재입고되나요?\nB: 금요일에 더 들어올 예정이에요."},{"en":"A: When will you restock these travel bottles?\nB: We expect more tomorrow morning.","ko":"A: 이 여행용 용기는 언제 재입고되나요?\nB: 내일 아침에 더 들어올 예정입니다."}],"pronunciation":"리스탁","id":232},{"day":24,"num":4,"word":"changing room","meaning":"탈의실","hint":"","mnemonic":"changing room [체인징 룸]\nchange = 바꾸다, room = 방.\n옷을 바꾸는 방.\n→ changing room = 탈의실","dialogue":"A: Where is the changing room?\nB: At the back of the shop.","dialogues":["A: Where is the changing room?\nB: At the back of the shop.","A: Where is the changing room?\nB: It is behind the mirrors on the left."],"caution":"미국 쇼핑에서는 fitting room도 매우 흔합니다.","past":true,"similar":"","note":"미국 쇼핑에서는 fitting room도 매우 흔합니다.","ko_dialogue":"A: 탈의실은 어디인가요?\nB: 매장 안쪽에 있어요.","dialogue_pairs":[{"en":"A: Where is the changing room?\nB: At the back of the shop.","ko":"A: 탈의실은 어디인가요?\nB: 매장 안쪽에 있어요."},{"en":"A: Where is the changing room?\nB: It is behind the mirrors on the left.","ko":"A: 탈의실이 어디인가요?\nB: 왼쪽 거울 뒤쪽에 있습니다."}],"pronunciation":"체인징 룸","id":233},{"day":24,"num":5,"word":"luggage rack","meaning":"짐 선반","hint":"","mnemonic":"luggage rack [러기지 랙]\nluggage = 여행 짐, rack = 선반.\n→ luggage rack = 짐 선반","dialogue":"A: Can I put my suitcase on the luggage rack?\nB: Yes, if it fits securely.","dialogues":["A: Can I put my suitcase on the luggage rack?\nB: Yes, if it fits securely.","A: Is there space on the luggage rack for this suitcase?\nB: Yes, put it on the lower shelf."],"caution":"기차·버스의 짐 선반. 비행기 위쪽 수납공간은 overhead bin이 더 흔합니다.","past":true,"similar":"","note":"기차·버스의 짐 선반. 비행기 위쪽 수납공간은 overhead bin이 더 흔합니다.","ko_dialogue":"A: 여행가방을 짐 선반에 올려도 될까요?\nB: 네, 안정적으로 들어가면 됩니다.","dialogue_pairs":[{"en":"A: Can I put my suitcase on the luggage rack?\nB: Yes, if it fits securely.","ko":"A: 여행가방을 짐 선반에 올려도 될까요?\nB: 네, 안정적으로 들어가면 됩니다."},{"en":"A: Is there space on the luggage rack for this suitcase?\nB: Yes, put it on the lower shelf.","ko":"A: 이 여행가방을 놓을 짐 선반 공간이 있나요?\nB: 네, 아래 선반에 놓으세요."}],"pronunciation":"러기지 랙","id":234},{"day":24,"num":6,"word":"occupied","meaning":"사용 중인, 점유된","hint":"","mnemonic":"occupied [아큐파이드]\noccupy = 자리를 꽉 차지하다.\n이미 누군가가 차지해 쓰고 있는 상태가 occupied입니다.\n→ occupied = 사용 중인 / 점유된","dialogue":"A: Is this room occupied?\nB: Yes, please use the room next door.","dialogues":["A: Is this room occupied?\nB: Yes, please use the room next door.","A: Is this restroom occupied?\nB: Yes, someone is inside."],"caution":"화장실 문에서는 VACANT ↔ OCCUPIED가 자주 보입니다. 좌석에는 Is this seat taken?도 매우 자연스럽습니다.","past":true,"similar":"taken = 좌석 등이 차지된 / vacant = 비어 있는 / available = 이용 가능한","note":"화장실 문에서는 VACANT ↔ OCCUPIED가 자주 보입니다. 좌석에는 Is this seat taken?도 매우 자연스럽습니다.","ko_dialogue":"A: 이 방은 사용 중인가요?\nB: 네, 옆방을 이용해주세요.","dialogue_pairs":[{"en":"A: Is this room occupied?\nB: Yes, please use the room next door.","ko":"A: 이 방은 사용 중인가요?\nB: 네, 옆방을 이용해주세요."},{"en":"A: Is this restroom occupied?\nB: Yes, someone is inside.","ko":"A: 이 화장실 사용 중인가요?\nB: 네, 안에 사람이 있습니다."}],"pronunciation":"아큐파이드","id":235},{"day":24,"num":7,"word":"charger","meaning":"충전기","hint":"","mnemonic":"charger [차저] → charge(충전하다) + -er(도구).\n→ charger = 충전기","dialogue":"A: Do you sell phone chargers?\nB: Yes. What type of phone do you have?","dialogues":["A: Do you sell phone chargers?\nB: Yes. What type of phone do you have?","A: I forgot my phone charger. Do you sell one here?\nB: Yes, we have several types near the register."],"caution":"charger는 충전기, adapter는 플러그 모양/전압 연결용 어댑터라 서로 다릅니다.","past":true,"similar":"","note":"charger는 충전기, adapter는 플러그 모양/전압 연결용 어댑터라 서로 다릅니다.","ko_dialogue":"A: 휴대전화 충전기를 판매하나요?\nB: 네. 어떤 종류의 휴대전화를 쓰시나요?","dialogue_pairs":[{"en":"A: Do you sell phone chargers?\nB: Yes. What type of phone do you have?","ko":"A: 휴대전화 충전기를 판매하나요?\nB: 네. 어떤 종류의 휴대전화를 쓰시나요?"},{"en":"A: I forgot my phone charger. Do you sell one here?\nB: Yes, we have several types near the register.","ko":"A: 휴대폰 충전기를 두고 왔어요. 여기서 파나요?\nB: 네, 계산대 근처에 여러 종류가 있습니다."}],"pronunciation":"차저","id":236},{"day":24,"num":8,"word":"hurry","meaning":"서두르다","hint":"","mnemonic":"hurry [허리] → “허리 펴! 빨리 뛰어!”\n늦었다는 말을 듣자 허리를 펴고 바로 뛰어갑니다.\n허리 → 빨리 움직이며 서두르는 동작.\n→ hurry = 서두르다","dialogue":"A: Do we need to hurry?\nB: Yes, the bus leaves in five minutes.","dialogues":["A: Do we need to hurry?\nB: Yes, the bus leaves in five minutes.","A: We need to hurry or we will miss boarding.\nB: The gate is just around the corner."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 서둘러야 하나요?\nB: 네, 버스가 5분 뒤에 출발해요.","dialogue_pairs":[{"en":"A: Do we need to hurry?\nB: Yes, the bus leaves in five minutes.","ko":"A: 서둘러야 하나요?\nB: 네, 버스가 5분 뒤에 출발해요."},{"en":"A: We need to hurry or we will miss boarding.\nB: The gate is just around the corner.","ko":"A: 서두르지 않으면 탑승을 놓치겠어요.\nB: 탑승구는 바로 모퉁이 너머에 있어요."}],"pronunciation":"허리","id":237},{"day":24,"num":9,"word":"vacant","meaning":"비어 있는, 빈","hint":"","mnemonic":"vacant [베이컨트] → “베이컨 통이 텅!”\n조식 식당의 베이컨 통을 열었더니 다 먹고 아무것도 남지 않았습니다. 통 안이 텅 비었습니다.\n베이컨 + 텅 → 베이컨트 → 비어 있는.\n방이나 자리 등이 비어 있다는 뜻에 사용합니다.","dialogue":"A: Is the restroom vacant now?\nB: Yes, you can go in.","dialogues":["A: Is the restroom vacant now?\nB: Yes, you can go in.","A: Is there a vacant room for tonight?\nB: Yes, we have one double room left."],"caution":"","past":true,"similar":"available = 이용 가능한 / empty = 내용물이 없는 / occupied = 사용 중인","note":"","ko_dialogue":"A: 지금 화장실이 비어 있나요?\nB: 네, 들어가셔도 돼요.","dialogue_pairs":[{"en":"A: Is the restroom vacant now?\nB: Yes, you can go in.","ko":"A: 지금 화장실이 비어 있나요?\nB: 네, 들어가셔도 돼요."},{"en":"A: Is there a vacant room for tonight?\nB: Yes, we have one double room left.","ko":"A: 오늘 밤 빈 객실이 있나요?\nB: 네, 더블룸 한 개 남아 있습니다."}],"pronunciation":"베이컨트","id":238},{"day":24,"num":10,"word":"reservation","meaning":"예약","hint":"","mnemonic":"reservation [레저베이션] → “미리 저 자리를 비워둔 기록!”\n식당에 “저 자리를 미리 비워주세요”라고 부탁했습니다. 직원이 이름과 시간을 적어 자리를 남겨놓았습니다. 그 예약 기록이 reservation입니다.\n미리 저 자리 비워둬 → reserve(예약하다) → reservation(예약).","dialogue":"A: Do you have a reservation?\nB: Yes, for two people under Son.","dialogues":["A: Do you have a reservation?\nB: Yes, for two people under Son.","A: I have a reservation for two nights under Lee.\nB: Yes, I found your booking."],"caution":"","past":true,"similar":"reserve = 예약하다 / book = 예약하다 / reservation = 예약(명사)","note":"","ko_dialogue":"A: 예약하셨나요?\nB: 네, 손이라는 이름으로 두 명 예약했어요.","dialogue_pairs":[{"en":"A: Do you have a reservation?\nB: Yes, for two people under Son.","ko":"A: 예약하셨나요?\nB: 네, 손이라는 이름으로 두 명 예약했어요."},{"en":"A: I have a reservation for two nights under Lee.\nB: Yes, I found your booking.","ko":"A: Lee 이름으로 2박 예약이 되어 있어요.\nB: 네, 예약을 찾았습니다."}],"pronunciation":"레저베이션","id":239},{"day":25,"num":1,"word":"baggage claim","meaning":"수하물 찾는 곳","hint":"","mnemonic":"baggage(수하물) + claim(자기 것을 찾아가다).\n내 짐을 찾아가는 곳 → baggage claim.","dialogue":"A: Where is baggage claim?\nB: Downstairs. Follow the signs for arrivals.","dialogues":["A: Where is baggage claim?\nB: Downstairs. Follow the signs for arrivals.","A: Which baggage claim is for flight 402?\nB: Carousel seven on the lower level."],"caution":"claim은 여기서 ‘주장하다’보다 ‘내 것이라고 찾아가다’의 느낌입니다.","past":true,"similar":"","note":"claim은 여기서 ‘주장하다’보다 ‘내 것이라고 찾아가다’의 느낌입니다.","ko_dialogue":"A: 수하물 찾는 곳은 어디인가요?\nB: 아래층이에요. 도착 안내 표지를 따라가세요.","dialogue_pairs":[{"en":"A: Where is baggage claim?\nB: Downstairs. Follow the signs for arrivals.","ko":"A: 수하물 찾는 곳은 어디인가요?\nB: 아래층이에요. 도착 안내 표지를 따라가세요."},{"en":"A: Which baggage claim is for flight 402?\nB: Carousel seven on the lower level.","ko":"A: 402편 수하물 찾는 곳이 어디인가요?\nB: 아래층 7번 벨트입니다."}],"pronunciation":"배기지 클레임","id":240},{"day":25,"num":2,"word":"preference","meaning":"선호, 취향","hint":"","mnemonic":"preference [프레퍼런스] → “프리한 여행 쪽으로 기우는 취향!”\n같은 두 여행 상품을 보여줘도 나는 늘 자유여행 쪽을 고릅니다. 한 번의 선택이 아니라 내가 더 좋아하는 쪽, 내 취향입니다.\n프리하게 다니는 여행을 prefer(선호하다) → 그 선호가 preference.","dialogue":"A: Do you have a seating preference?\nB: A table outside, if possible.","dialogues":["A: Do you have a seating preference?\nB: A table outside, if possible.","A: Do you have a seating preference?\nB: A window seat would be great."],"caution":"preference는 취향/선호. prefer는 동사 ‘더 좋아하다’.","past":true,"similar":"","note":"preference는 취향/선호. prefer는 동사 ‘더 좋아하다’.","ko_dialogue":"A: 선호하시는 자리가 있나요?\nB: 가능하다면 야외 테이블로 부탁드려요.","dialogue_pairs":[{"en":"A: Do you have a seating preference?\nB: A table outside, if possible.","ko":"A: 선호하시는 자리가 있나요?\nB: 가능하다면 야외 테이블로 부탁드려요."},{"en":"A: Do you have a seating preference?\nB: A window seat would be great.","ko":"A: 선호하는 좌석이 있으신가요?\nB: 창가 자리면 좋겠습니다."}],"pronunciation":"프레퍼런스","id":241},{"day":25,"num":3,"word":"belongings","meaning":"소지품","hint":"","mnemonic":"belongings [빌롱잉즈] → “내 이름표가 줄줄이 달린 내 물건들!”\n가방·우산·휴대전화에 모두 내 이름표가 붙어 있습니다. 다른 사람 것은 남기고 나에게 속한 물건만 한데 모아 챙깁니다.\nbelong to me(나에게 속하다) → 나에게 속한 물건들 → belongings = 소지품.","dialogue":"A: Please take all your belongings with you.\nB: Thank you. I nearly forgot my phone.","dialogues":["A: Please take all your belongings with you.\nB: Thank you. I nearly forgot my phone.","A: Please check that you have all your belongings before leaving.\nB: Thanks. I almost forgot my umbrella."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 소지품을 모두 챙겨주세요.\nB: 감사합니다. 휴대전화를 두고 갈 뻔했어요.","dialogue_pairs":[{"en":"A: Please take all your belongings with you.\nB: Thank you. I nearly forgot my phone.","ko":"A: 소지품을 모두 챙겨주세요.\nB: 감사합니다. 휴대전화를 두고 갈 뻔했어요."},{"en":"A: Please check that you have all your belongings before leaving.\nB: Thanks. I almost forgot my umbrella.","ko":"A: 나가기 전에 소지품을 모두 챙겼는지 확인해 주세요.\nB: 감사합니다. 우산을 두고 갈 뻔했네요."}],"pronunciation":"빌롱잉즈","id":242},{"day":25,"num":4,"word":"refill","meaning":"리필, 다시 채우다","hint":"","mnemonic":"refill [리필] → re-(다시) + fill(채우다).\n→ refill = 리필 / 다시 채우다","dialogue":"A: Is the first refill free?\nB: Yes, for coffee and tea.","dialogues":["A: Is the first refill free?\nB: Yes, for coffee and tea.","A: Could you refill my water bottle?\nB: Sure, the fountain is right here."],"caution":"","past":true,"similar":"refill = 다시 채우기 / top up = 보충하다 / replace = 교체하다","note":"","ko_dialogue":"A: 첫 리필은 무료인가요?\nB: 네, 커피와 차는 무료입니다.","dialogue_pairs":[{"en":"A: Is the first refill free?\nB: Yes, for coffee and tea.","ko":"A: 첫 리필은 무료인가요?\nB: 네, 커피와 차는 무료입니다."},{"en":"A: Could you refill my water bottle?\nB: Sure, the fountain is right here.","ko":"A: 제 물병에 물을 다시 채워주시겠어요?\nB: 네, 급수대가 바로 여기 있습니다."}],"pronunciation":"리필","id":243},{"day":25,"num":5,"word":"portion","meaning":"1인분, 양","hint":"","mnemonic":"portion [포션] → “수프 한 포, 내 몫 한 그릇!”\n여럿이 먹을 큰 수프 냄비에서 내 몫을 덜어 한 포장에 담습니다. 모두가 자기 몫 하나씩 받아갑니다.\n한 포에 나눈 한 몫 → 포션 → portion = 음식의 한 몫, 분량.\n항상 정해진 크기의 1인분이라는 뜻은 아니며 large portion처럼 양을 말할 수도 있습니다.","dialogue":"A: Is one portion enough for two people?\nB: It is quite large, so you could share it.","dialogues":["A: Is one portion enough for two people?\nB: It is quite large, so you could share it.","A: Is this portion large enough to share?\nB: Yes, two people can easily share it."],"caution":"","past":true,"similar":"portion = 1인분 양 / serving = 1회 제공량 / size = 크기","note":"","ko_dialogue":"A: 1인분으로 두 사람이 먹기에 충분한가요?\nB: 양이 꽤 많아서 나눠 드셔도 돼요.","dialogue_pairs":[{"en":"A: Is one portion enough for two people?\nB: It is quite large, so you could share it.","ko":"A: 1인분으로 두 사람이 먹기에 충분한가요?\nB: 양이 꽤 많아서 나눠 드셔도 돼요."},{"en":"A: Is this portion large enough to share?\nB: Yes, two people can easily share it.","ko":"A: 이 양은 나눠 먹기에 충분히 큰가요?\nB: 네, 두 분이 충분히 나눠 드실 수 있어요."}],"pronunciation":"포션","id":244},{"day":25,"num":6,"word":"platform","meaning":"승강장","hint":"","mnemonic":"platform [플랫폼] → 사람들이 올라서는 평평한 단.\n기차역에서는 열차를 타는 승강장.\n→ platform = 승강장 / 플랫폼","dialogue":"A: Which platform does the airport train leave from?\nB: Platform four. Take the stairs on your right.","dialogues":["A: Which platform does the airport train leave from?\nB: Platform four. Take the stairs on your right.","A: Which platform does the airport train leave from?\nB: Platform nine."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 공항행 열차는 몇 번 승강장에서 출발하나요?\nB: 4번입니다. 오른쪽 계단으로 가세요.","dialogue_pairs":[{"en":"A: Which platform does the airport train leave from?\nB: Platform four. Take the stairs on your right.","ko":"A: 공항행 열차는 몇 번 승강장에서 출발하나요?\nB: 4번입니다. 오른쪽 계단으로 가세요."},{"en":"A: Which platform does the airport train leave from?\nB: Platform nine.","ko":"A: 공항 열차는 어느 승강장에서 출발하나요?\nB: 9번 승강장입니다."}],"pronunciation":"플랫폼","id":245},{"day":25,"num":7,"word":"toward","meaning":"~쪽으로","hint":"","mnemonic":"toward [투워드] → to(~로) + -ward(방향).\n→ toward = ~쪽으로","dialogue":"A: Which way should I walk?\nB: Head toward the river, then turn left.","dialogues":["A: Which way should I walk?\nB: Head toward the river, then turn left.","A: Walk toward the river and turn left at the bridge.\nB: Got it. Thank you."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 어느 쪽으로 걸어가야 하나요?\nB: 강 쪽으로 가다가 왼쪽으로 도세요.","dialogue_pairs":[{"en":"A: Which way should I walk?\nB: Head toward the river, then turn left.","ko":"A: 어느 쪽으로 걸어가야 하나요?\nB: 강 쪽으로 가다가 왼쪽으로 도세요."},{"en":"A: Walk toward the river and turn left at the bridge.\nB: Got it. Thank you.","ko":"A: 강 쪽으로 걸어가서 다리에서 왼쪽으로 도세요.\nB: 알겠습니다. 감사합니다."}],"pronunciation":"투워드","id":246},{"day":25,"num":8,"word":"included","meaning":"포함된","hint":"","mnemonic":"included [인클루디드] → “안으로 끌어 넣어둔 상태!”\n숙박 상자 안에 아침 식사권도, 수영장 이용권도 함께 끌어 넣어뒀습니다. 상자를 받으면 그 안의 이용권도 함께 받습니다.\n안에 끌어 둠 → include(포함하다) → included(포함된).","dialogue":"A: Is breakfast included?\nB: Yes, it is served from seven to ten.","dialogues":["A: Is breakfast included?\nB: Yes, it is served from seven to ten.","A: Is breakfast included in the room price?\nB: Yes, breakfast and Wi-Fi are included."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 아침 식사가 포함되어 있나요?\nB: 네, 7시부터 10시까지 제공됩니다.","dialogue_pairs":[{"en":"A: Is breakfast included?\nB: Yes, it is served from seven to ten.","ko":"A: 아침 식사가 포함되어 있나요?\nB: 네, 7시부터 10시까지 제공됩니다."},{"en":"A: Is breakfast included in the room price?\nB: Yes, breakfast and Wi-Fi are included.","ko":"A: 객실 요금에 아침 식사가 포함되어 있나요?\nB: 네, 조식과 와이파이가 포함되어 있습니다."}],"pronunciation":"인클루디드","id":247},{"day":25,"num":9,"word":"wrong","meaning":"틀린, 잘못된","hint":"","mnemonic":"wrong [롱] → “롱~하게 갔는데 길을 잘못 들었네!”\n잘못된 길로 한참 길게 가버립니다.\n롱~ 멀리 감 → 방향을 잘못 잡음.\n→ wrong = 틀린 / 잘못된","dialogue":"A: I think we are on the wrong bus.\nB: Let us ask the driver at the next stop.","dialogues":["A: I think we are on the wrong bus.\nB: Let us ask the driver at the next stop.","A: I think we are on the wrong platform.\nB: Yes, our train leaves from platform four."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 저희가 버스를 잘못 탄 것 같아요.\nB: 다음 정류장에서 기사님께 물어봐요.","dialogue_pairs":[{"en":"A: I think we are on the wrong bus.\nB: Let us ask the driver at the next stop.","ko":"A: 저희가 버스를 잘못 탄 것 같아요.\nB: 다음 정류장에서 기사님께 물어봐요."},{"en":"A: I think we are on the wrong platform.\nB: Yes, our train leaves from platform four.","ko":"A: 저희가 잘못된 승강장에 온 것 같아요.\nB: 맞아요, 우리 기차는 4번 승강장에서 출발해요."}],"pronunciation":"롱","id":248},{"day":25,"num":10,"word":"owe","meaning":"빚지다, 지불할 의무가 있다","hint":"","mnemonic":"owe [오우] → “오우! 외상값 아직 안 갚았네!”\n남이 먼저 내준 돈을 아직 돌려주지 못했습니다.\n오우 → 외상값이 남아 있음.\n→ owe = 빚지다 / 돈을 갚아야 하다","dialogue":"A: How much do I owe you for the taxi?\nB: Ten dollars. We are splitting it equally.","dialogues":["A: How much do I owe you for the taxi?\nB: Ten dollars. We are splitting it equally.","A: How much do I owe you for the tickets?\nB: Twenty dollars is fine."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 택시비로 얼마를 드리면 되나요?\nB: 10달러요. 똑같이 나누면 돼요.","dialogue_pairs":[{"en":"A: How much do I owe you for the taxi?\nB: Ten dollars. We are splitting it equally.","ko":"A: 택시비로 얼마를 드리면 되나요?\nB: 10달러요. 똑같이 나누면 돼요."},{"en":"A: How much do I owe you for the tickets?\nB: Twenty dollars is fine.","ko":"A: 표값으로 제가 얼마 드리면 되나요?\nB: 20달러면 됩니다."}],"pronunciation":"오우","id":249},{"day":26,"num":1,"word":"allergic","meaning":"알레르기가 있는","hint":"","mnemonic":"allergic [얼러직] → “먹으면 앓지!”\n안 맞는 음식을 먹으면 몸이 심하게 반응해 앓습니다.\n얼러직 ≈ 앓지.\n→ allergic = 알레르기가 있는","dialogue":"A: Are you allergic to any foods?\nB: Yes, shellfish. Could you check with the kitchen?","dialogues":["A: Are you allergic to any foods?\nB: Yes, shellfish. Could you check with the kitchen?","A: I am allergic to nuts. Can you recommend something safe?\nB: Yes, I will show you the nut-free dishes."],"caution":"","past":true,"similar":"allergic = 알레르기가 있는 / allergy = 알레르기 / sensitive to = ~에 민감한","note":"","ko_dialogue":"A: 알레르기가 있는 음식이 있나요?\nB: 네, 조개류와 갑각류요. 주방에 확인해주시겠어요?","dialogue_pairs":[{"en":"A: Are you allergic to any foods?\nB: Yes, shellfish. Could you check with the kitchen?","ko":"A: 알레르기가 있는 음식이 있나요?\nB: 네, 조개류와 갑각류요. 주방에 확인해주시겠어요?"},{"en":"A: I am allergic to nuts. Can you recommend something safe?\nB: Yes, I will show you the nut-free dishes.","ko":"A: 저는 견과류 알레르기가 있어요. 안전한 메뉴를 추천해주시겠어요?\nB: 네, 견과류가 없는 메뉴를 보여드릴게요."}],"pronunciation":"얼러직","id":250},{"day":26,"num":2,"word":"tap","meaning":"가볍게 두드리다, 갖다 대다","hint":"","mnemonic":"tap [탭]\n“탭!” 하고 가볍게 톡 건드린다.\n→ tap = 가볍게 두드리다 / 갖다 대다","dialogue":"A: Should I insert my card?\nB: You can just tap it here.","dialogues":["A: Should I insert my card?\nB: You can just tap it here.","A: Just tap your card on the reader.\nB: Okay, I see the contactless symbol."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 카드를 넣어야 하나요?\nB: 여기에 가볍게 대시면 돼요.","dialogue_pairs":[{"en":"A: Should I insert my card?\nB: You can just tap it here.","ko":"A: 카드를 넣어야 하나요?\nB: 여기에 가볍게 대시면 돼요."},{"en":"A: Just tap your card on the reader.\nB: Okay, I see the contactless symbol.","ko":"A: 카드를 단말기에 가볍게 대기만 하세요.\nB: 네, 비접촉 결제 표시가 보이네요."}],"pronunciation":"탭","id":251},{"day":26,"num":3,"word":"drop off","meaning":"내려주다, 맡기다","hint":"","mnemonic":"drop off [드롭 오프] → drop(내려놓다) + off(떨어져).\n차가 사람을 내려놓고 떠난다.\n→ drop off = 내려주다","dialogue":"A: Could you drop me off at the hotel entrance?\nB: Sure. It is just around the corner.","dialogues":["A: Could you drop me off at the hotel entrance?\nB: Sure. It is just around the corner.","A: Can the taxi drop us off at the museum entrance?\nB: Yes, there is a drop-off zone there."],"caution":"drop off는 사람을 내려주다/물건을 맡기다. pick up은 데리러 가다/찾아가다.","past":true,"similar":"","note":"drop off는 사람을 내려주다/물건을 맡기다. pick up은 데리러 가다/찾아가다.","ko_dialogue":"A: 호텔 입구에서 내려주시겠어요?\nB: 네. 모퉁이를 돌면 바로 있어요.","dialogue_pairs":[{"en":"A: Could you drop me off at the hotel entrance?\nB: Sure. It is just around the corner.","ko":"A: 호텔 입구에서 내려주시겠어요?\nB: 네. 모퉁이를 돌면 바로 있어요."},{"en":"A: Can the taxi drop us off at the museum entrance?\nB: Yes, there is a drop-off zone there.","ko":"A: 택시가 박물관 입구에 내려줄 수 있나요?\nB: 네, 거기에 하차 구역이 있습니다."}],"pronunciation":"드롭 오프","id":252},{"day":26,"num":4,"word":"pick up","meaning":"데리러 가다, 집다, 찾아가다","hint":"","mnemonic":"pick up [픽 업] → pick(집다) + up(위로).\n사람·짐을 집어 데려온다.\n→ pick up = 데리러 가다 / 찾아오다","dialogue":"A: Where will you pick us up tomorrow?\nB: Outside the hotel at eight thirty.","dialogues":["A: Where will you pick us up tomorrow?\nB: Outside the hotel at eight thirty.","A: What time will the shuttle pick us up?\nB: At six forty-five in front of the hotel."],"caution":"pick up은 ‘집다, 데리러 가다, 찾아가다’ 등 뜻이 많습니다. 여행에서는 사람·짐을 데리러/찾으러 가는 뜻이 자주 나옵니다.","past":true,"similar":"","note":"pick up은 ‘집다, 데리러 가다, 찾아가다’ 등 뜻이 많습니다. 여행에서는 사람·짐을 데리러/찾으러 가는 뜻이 자주 나옵니다.","ko_dialogue":"A: 내일 저희를 어디로 데리러 오시나요?\nB: 8시 30분에 호텔 밖으로 갈게요.","dialogue_pairs":[{"en":"A: Where will you pick us up tomorrow?\nB: Outside the hotel at eight thirty.","ko":"A: 내일 저희를 어디로 데리러 오시나요?\nB: 8시 30분에 호텔 밖으로 갈게요."},{"en":"A: What time will the shuttle pick us up?\nB: At six forty-five in front of the hotel.","ko":"A: 셔틀이 몇 시에 저희를 데리러 오나요?\nB: 6시 45분에 호텔 앞에서요."}],"pronunciation":"픽 업","id":253},{"day":26,"num":5,"word":"spare","meaning":"여분의","hint":"","mnemonic":"spare [스페어] → “쓰고 남은 건 빼어!”\n필요한 만큼 쓰고 남는 것은 따로 빼어 둡니다.\n스 + 페어 ≈ 쓰고 + 빼어.\n→ spare = 여분의 / 남는","dialogue":"A: Do you have a spare room key?\nB: Yes. I can make another one for you.","dialogues":["A: Do you have a spare room key?\nB: Yes. I can make another one for you.","A: Do you have a spare umbrella I could borrow?\nB: Yes, we keep a few at the front desk."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 여분의 객실 키가 있나요?\nB: 네. 하나 더 만들어드릴 수 있어요.","dialogue_pairs":[{"en":"A: Do you have a spare room key?\nB: Yes. I can make another one for you.","ko":"A: 여분의 객실 키가 있나요?\nB: 네. 하나 더 만들어드릴 수 있어요."},{"en":"A: Do you have a spare umbrella I could borrow?\nB: Yes, we keep a few at the front desk.","ko":"A: 빌릴 수 있는 여분 우산이 있나요?\nB: 네, 프런트 데스크에 몇 개 있습니다."}],"pronunciation":"스페어","id":254},{"day":26,"num":6,"word":"avoid","meaning":"피하다","hint":"","mnemonic":"avoid [어보이드] → “어, 보이네! 피해!”\n앞에 큰 물웅덩이가 보입니다. “어, 보이네!” 하고 발을 옆으로 옮겨 물웅덩이를 피해 갑니다.\n어 + 보이네 + 피해 → 어보이드 → 피하다.","dialogue":"A: When should we go to avoid the crowds?\nB: Before nine in the morning.","dialogues":["A: When should we go to avoid the crowds?\nB: Before nine in the morning.","A: Take the side street to avoid the traffic.\nB: Good idea. The main road looks packed."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 인파를 피하려면 언제 가는 게 좋을까요?\nB: 오전 9시 전에요.","dialogue_pairs":[{"en":"A: When should we go to avoid the crowds?\nB: Before nine in the morning.","ko":"A: 인파를 피하려면 언제 가는 게 좋을까요?\nB: 오전 9시 전에요."},{"en":"A: Take the side street to avoid the traffic.\nB: Good idea. The main road looks packed.","ko":"A: 교통 체증을 피하려면 골목길로 가세요.\nB: 좋은 생각이에요. 큰길이 많이 막혀 보이네요."}],"pronunciation":"어보이드","id":255},{"day":26,"num":7,"word":"damage","meaning":"손상, 손상시키다","hint":"","mnemonic":"damage [대미지] → 게임에서 ‘데미지 입었다’ = 손상됐다.\n→ damage = 손상 / 손상시키다","dialogue":"A: There is some damage to my suitcase.\nB: Please bring it to the baggage service desk.","dialogues":["A: There is some damage to my suitcase.\nB: Please bring it to the baggage service desk.","A: I noticed damage on my suitcase after the flight.\nB: Please report it before leaving the baggage area."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 제 여행가방에 손상이 있어요.\nB: 수하물 서비스 데스크로 가져와주세요.","dialogue_pairs":[{"en":"A: There is some damage to my suitcase.\nB: Please bring it to the baggage service desk.","ko":"A: 제 여행가방에 손상이 있어요.\nB: 수하물 서비스 데스크로 가져와주세요."},{"en":"A: I noticed damage on my suitcase after the flight.\nB: Please report it before leaving the baggage area.","ko":"A: 비행 후에 여행가방이 손상된 걸 발견했어요.\nB: 수하물 구역을 나가기 전에 신고해 주세요."}],"pronunciation":"대미지","id":256},{"day":26,"num":8,"word":"enough","meaning":"충분한","hint":"","mnemonic":"enough [이너프] → “이 안에 푹 찼어, 이제 충분해!”\n여행가방 안에 필요한 물건을 다 넣었습니다. 더 넣으려 하자 “이 안에 필요한 건 다 있어. 충분해!” 하고 지퍼를 닫습니다.\n이 안에 푹 채움 → 이너프 → 필요한 만큼 충분한.\n가득 참 자체보다 ‘필요한 만큼 있다’는 데 뜻의 중심이 있습니다.","dialogue":"A: Do we have enough time for lunch?\nB: Yes, boarding does not start for another hour.","dialogues":["A: Do we have enough time for lunch?\nB: Yes, boarding does not start for another hour.","A: Do we have enough time to visit the market before our train?\nB: Yes, we have almost two hours."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 점심 먹을 시간이 충분한가요?\nB: 네, 탑승 시작까지 한 시간이나 남았어요.","dialogue_pairs":[{"en":"A: Do we have enough time for lunch?\nB: Yes, boarding does not start for another hour.","ko":"A: 점심 먹을 시간이 충분한가요?\nB: 네, 탑승 시작까지 한 시간이나 남았어요."},{"en":"A: Do we have enough time to visit the market before our train?\nB: Yes, we have almost two hours.","ko":"A: 기차 타기 전에 시장에 갈 시간이 충분한가요?\nB: 네, 거의 두 시간 남았습니다."}],"pronunciation":"이너프","id":257},{"day":26,"num":9,"word":"refund","meaning":"환불, 환불하다","hint":"","mnemonic":"refund [리펀드] → “리! 푼돈 다시 돌려줘!”\n냈던 돈이 다시 내 쪽으로 돌아옵니다.\n리(다시) + 푼돈 ≈ 리펀드.\n→ refund = 환불 / 환불하다","dialogue":"A: Could I get a refund for this canceled tour?\nB: Yes. We will return the payment to your card.","dialogues":["A: Could I get a refund for this canceled tour?\nB: Yes. We will return the payment to your card.","A: Can I get a refund if the tour is canceled?\nB: Yes, you will receive a full refund."],"caution":"return은 물건을 돌려주는 행동, refund는 돈을 돌려받는 결과에 초점이 있습니다.","past":true,"similar":"return = 물건을 돌려주다 / exchange = 교환하다 / refund = 돈을 돌려받다","note":"return은 물건을 돌려주는 행동, refund는 돈을 돌려받는 결과에 초점이 있습니다.","ko_dialogue":"A: 취소된 이 투어를 환불받을 수 있을까요?\nB: 네. 결제하신 카드로 환불해드릴게요.","dialogue_pairs":[{"en":"A: Could I get a refund for this canceled tour?\nB: Yes. We will return the payment to your card.","ko":"A: 취소된 이 투어를 환불받을 수 있을까요?\nB: 네. 결제하신 카드로 환불해드릴게요."},{"en":"A: Can I get a refund if the tour is canceled?\nB: Yes, you will receive a full refund.","ko":"A: 투어가 취소되면 환불받을 수 있나요?\nB: 네, 전액 환불됩니다."}],"pronunciation":"리펀드","id":258},{"day":26,"num":10,"word":"fund","meaning":"자금, 기금","hint":"","mnemonic":"fund [펀드] → “푼돈을 모아 큰돈으로!”\n조금씩 모은 푼돈이 여행에 쓸 자금이 됩니다.\n펀드 ≈ 푼돈.\n→ fund = 자금 / 기금 / 자금을 대다","dialogue":"A: What is this donation box for?\nB: It is for the museum’s restoration fund.","dialogues":["A: What is this donation box for?\nB: It is for the museum’s restoration fund.","A: The city uses this tax to fund public transportation.\nB: That explains why the buses are so affordable."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 기부함은 무엇을 위한 건가요?\nB: 박물관 복원 기금을 위한 거예요.","dialogue_pairs":[{"en":"A: What is this donation box for?\nB: It is for the museum’s restoration fund.","ko":"A: 이 기부함은 무엇을 위한 건가요?\nB: 박물관 복원 기금을 위한 거예요."},{"en":"A: The city uses this tax to fund public transportation.\nB: That explains why the buses are so affordable.","ko":"A: 이 도시는 이 세금으로 대중교통에 자금을 댑니다.\nB: 그래서 버스 요금이 저렴한 거군요."}],"pronunciation":"펀드","id":259},{"day":27,"num":1,"word":"display","meaning":"보여주다, 진열하다, 화면","hint":"","mnemonic":"display [디스플레이] → “디스(this), 플레이(play)! 이거 재생해서 보여줘!”\n친구가 여행 영상을 가리킵니다. “이거 플레이해줘!” 재생 버튼을 누르자 큰 화면에 영상이 나타나 모두에게 보입니다.\n디스 + 플레이 → 디스플레이 → 보여주다 / 보여주는 화면.\n가게에서 물건을 사람들에게 보이게 펼쳐놓는 것도 display → 진열하다.\n※ this와 play는 발음을 연결하는 암기용 말이며 실제 어원 분해는 아닙니다.","dialogue":"A: Can I buy the bag on display?\nB: Yes. Let me get it down for you.","dialogues":["A: Can I buy the bag on display?\nB: Yes. Let me get it down for you.","A: The screen will display your gate number after check-in.\nB: Great, I will check it again later."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 진열된 가방을 살 수 있나요?\nB: 네. 내려드릴게요.","dialogue_pairs":[{"en":"A: Can I buy the bag on display?\nB: Yes. Let me get it down for you.","ko":"A: 진열된 가방을 살 수 있나요?\nB: 네. 내려드릴게요."},{"en":"A: The screen will display your gate number after check-in.\nB: Great, I will check it again later.","ko":"A: 체크인 후 화면에 탑승구 번호가 표시됩니다.\nB: 좋아요, 나중에 다시 확인할게요."}],"pronunciation":"디스플레이","id":260},{"day":27,"num":2,"word":"attraction","meaning":"관광명소, 매력","hint":"","mnemonic":"attraction [어트랙션] → “트랙터처럼 관광객을 끌어당기는 명소!”\n멋진 성이 커다란 트랙터처럼 관광객들의 관심을 자기 쪽으로 끌어당깁니다. 사람들이 성을 보려고 모여듭니다.\n트랙터의 끌어당기는 힘 → attract(끌다) → attraction(매력·명소).","dialogue":"A: What is the main attraction in this town?\nB: The old castle by the river.","dialogues":["A: What is the main attraction in this town?\nB: The old castle by the river.","A: Is the castle the main attraction in this town?\nB: Yes, most visitors go there first."],"caution":"tourist attraction = 관광명소. attraction 단독으로는 매력이라는 뜻도 있습니다.","past":true,"similar":"","note":"tourist attraction = 관광명소. attraction 단독으로는 매력이라는 뜻도 있습니다.","ko_dialogue":"A: 이 마을의 주요 명소는 어디인가요?\nB: 강 옆의 오래된 성이에요.","dialogue_pairs":[{"en":"A: What is the main attraction in this town?\nB: The old castle by the river.","ko":"A: 이 마을의 주요 명소는 어디인가요?\nB: 강 옆의 오래된 성이에요."},{"en":"A: Is the castle the main attraction in this town?\nB: Yes, most visitors go there first.","ko":"A: 이 마을의 대표 관광명소가 그 성인가요?\nB: 네, 대부분의 방문객이 먼저 그곳에 갑니다."}],"pronunciation":"어트랙션","id":261},{"day":27,"num":3,"word":"attract","meaning":"끌어당기다","hint":"","mnemonic":"attract [어트랙트] → “어, 트랙터가 끌어당긴다!”\n트랙터가 무거운 짐을 힘껏 끌어당깁니다. 멋진 여행 사진도 같은 힘으로 내 관심을 끌어당겨 그곳에 가고 싶게 만듭니다.\n어 + 트랙터 → 어트랙트 → 끌어당기다, 관심을 끌다.","dialogue":"A: Why does this beach attract so many visitors?\nB: The water is clear, and it is easy to reach.","dialogues":["A: Why does this beach attract so many visitors?\nB: The water is clear, and it is easy to reach.","A: What attracts so many visitors to this island?\nB: The beaches and hiking trails are the main reasons."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 해변에는 왜 방문객이 많이 오나요?\nB: 물이 맑고 오기 쉬워서요.","dialogue_pairs":[{"en":"A: Why does this beach attract so many visitors?\nB: The water is clear, and it is easy to reach.","ko":"A: 이 해변에는 왜 방문객이 많이 오나요?\nB: 물이 맑고 오기 쉬워서요."},{"en":"A: What attracts so many visitors to this island?\nB: The beaches and hiking trails are the main reasons.","ko":"A: 무엇이 이렇게 많은 방문객을 이 섬으로 끌어들이나요?\nB: 해변과 등산로가 가장 큰 이유입니다."}],"pronunciation":"어트랙트","id":262},{"day":27,"num":4,"word":"crowd","meaning":"군중, 사람들이 몰리다","hint":"","mnemonic":"crowd [크라우드] → “크~ 와르르 몰렸다!”\n거리 공연이 시작되자 사람들이 사방에서 와르르 몰려옵니다. 조용하던 자리가 순식간에 사람 무리로 가득 찹니다.\n크 + 와르르 → 크라우드 → 군중.\n그렇게 사람으로 붐비는 상태는 crowded입니다.","dialogue":"A: There is a big crowd at the entrance.\nB: Let us come back after lunch.","dialogues":["A: There is a big crowd at the entrance.\nB: Let us come back after lunch.","A: A large crowd is gathering near the stage.\nB: The festival parade must be starting soon."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 입구에 사람이 많이 모여 있네요.\nB: 점심 먹고 다시 와요.","dialogue_pairs":[{"en":"A: There is a big crowd at the entrance.\nB: Let us come back after lunch.","ko":"A: 입구에 사람이 많이 모여 있네요.\nB: 점심 먹고 다시 와요."},{"en":"A: A large crowd is gathering near the stage.\nB: The festival parade must be starting soon.","ko":"A: 무대 근처에 많은 군중이 모이고 있어요.\nB: 축제 퍼레이드가 곧 시작하나 봐요."}],"pronunciation":"크라우드","id":263},{"day":27,"num":5,"word":"breakable","meaning":"깨지기 쉬운","hint":"","mnemonic":"breakable [브레이커블] → break(깨지다) + able(~할 수 있는).\n깨질 수 있는.\n→ breakable = 깨지기 쉬운","dialogue":"A: Is there anything breakable in this bag?\nB: Yes, two glass bottles.","dialogues":["A: Is there anything breakable in this bag?\nB: Yes, two glass bottles.","A: Are there any breakable items in your suitcase?\nB: Yes, there are two glass bottles inside."],"caution":"fragile과 비슷하지만 breakable은 ‘깨질 수 있음’, fragile은 ‘깨지기 쉬워 조심해야 함’ 뉘앙스가 더 강합니다.","past":true,"similar":"","note":"fragile과 비슷하지만 breakable은 ‘깨질 수 있음’, fragile은 ‘깨지기 쉬워 조심해야 함’ 뉘앙스가 더 강합니다.","ko_dialogue":"A: 이 가방에 깨지기 쉬운 것이 있나요?\nB: 네, 유리병 두 개가 있어요.","dialogue_pairs":[{"en":"A: Is there anything breakable in this bag?\nB: Yes, two glass bottles.","ko":"A: 이 가방에 깨지기 쉬운 것이 있나요?\nB: 네, 유리병 두 개가 있어요."},{"en":"A: Are there any breakable items in your suitcase?\nB: Yes, there are two glass bottles inside.","ko":"A: 여행가방 안에 깨지기 쉬운 물건이 있나요?\nB: 네, 유리병 두 개가 들어 있습니다."}],"pronunciation":"브레이커블","id":264},{"day":27,"num":6,"word":"fragile items","meaning":"깨지기 쉬운 물건들","hint":"","mnemonic":"fragile items [프래절 아이템즈]\nfragile [프래절] → “프래절? 깨질!”\n깨질 수 있는 물건들.\n→ fragile items = 깨지기 쉬운 물건들","dialogue":"A: I have some fragile items in this suitcase.\nB: We can add a fragile tag for you.","dialogues":["A: I have some fragile items in this suitcase.\nB: We can add a fragile tag for you.","A: Please pack fragile items in the center of the suitcase.\nB: I will wrap them in clothes first."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 여행가방에 깨지기 쉬운 물건이 있어요.\nB: 파손주의 태그를 붙여드릴 수 있어요.","dialogue_pairs":[{"en":"A: I have some fragile items in this suitcase.\nB: We can add a fragile tag for you.","ko":"A: 이 여행가방에 깨지기 쉬운 물건이 있어요.\nB: 파손주의 태그를 붙여드릴 수 있어요."},{"en":"A: Please pack fragile items in the center of the suitcase.\nB: I will wrap them in clothes first.","ko":"A: 깨지기 쉬운 물건은 여행가방 가운데에 넣으세요.\nB: 먼저 옷으로 감싸둘게요."}],"pronunciation":"프래절 아이템즈","id":265},{"day":27,"num":7,"word":"fragile sticker","meaning":"파손주의 스티커","hint":"","mnemonic":"fragile sticker [프래절 스티커]\nfragile [프래절] → “프래절? 깨질!”\n깨질 물건에 붙이는 sticker.\n→ fragile sticker = 파손주의 스티커","dialogue":"A: Could you put a fragile sticker on this box?\nB: Of course. Please place it on the counter.","dialogues":["A: Could you put a fragile sticker on this box?\nB: Of course. Please place it on the counter.","A: Could you put a fragile sticker on this box?\nB: Sure, I will mark it on two sides."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 이 상자에 파손주의 스티커를 붙여주시겠어요?\nB: 네. 카운터에 올려주세요.","dialogue_pairs":[{"en":"A: Could you put a fragile sticker on this box?\nB: Of course. Please place it on the counter.","ko":"A: 이 상자에 파손주의 스티커를 붙여주시겠어요?\nB: 네. 카운터에 올려주세요."},{"en":"A: Could you put a fragile sticker on this box?\nB: Sure, I will mark it on two sides.","ko":"A: 이 상자에 파손주의 스티커를 붙여주시겠어요?\nB: 네, 양쪽 면에 표시해드릴게요."}],"pronunciation":"프래절 스티커","id":266},{"day":27,"num":8,"word":"boarding gate","meaning":"탑승구","hint":"","mnemonic":"boarding gate [보딩 게이트]\nboarding = 탑승, gate = 문/게이트.\n→ boarding gate = 탑승구","dialogue":"A: Where is boarding gate twenty?\nB: Past the café, on the right.","dialogues":["A: Where is boarding gate twenty?\nB: Past the café, on the right.","A: Where is the boarding gate for flight 615?\nB: Gate C14, about five minutes from here."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 20번 탑승구는 어디인가요?\nB: 카페를 지나 오른쪽에 있어요.","dialogue_pairs":[{"en":"A: Where is boarding gate twenty?\nB: Past the café, on the right.","ko":"A: 20번 탑승구는 어디인가요?\nB: 카페를 지나 오른쪽에 있어요."},{"en":"A: Where is the boarding gate for flight 615?\nB: Gate C14, about five minutes from here.","ko":"A: 615편 탑승구가 어디인가요?\nB: C14번이며 여기서 약 5분 거리입니다."}],"pronunciation":"보딩 게이트","id":267},{"day":27,"num":9,"word":"boarding time","meaning":"탑승 시간","hint":"","mnemonic":"boarding time [보딩 타임]\nboarding = 탑승, time = 시간.\n→ boarding time = 탑승 시간","dialogue":"A: What is the boarding time?\nB: Nine twenty. Please be at the gate before then.","dialogues":["A: What is the boarding time?\nB: Nine twenty. Please be at the gate before then.","A: What is the boarding time on my ticket?\nB: Boarding starts at 6:20."],"caution":"","past":true,"similar":"","note":"","ko_dialogue":"A: 탑승 시간은 언제인가요?\nB: 9시 20분입니다. 그 전에 탑승구에 와주세요.","dialogue_pairs":[{"en":"A: What is the boarding time?\nB: Nine twenty. Please be at the gate before then.","ko":"A: 탑승 시간은 언제인가요?\nB: 9시 20분입니다. 그 전에 탑승구에 와주세요."},{"en":"A: What is the boarding time on my ticket?\nB: Boarding starts at 6:20.","ko":"A: 제 표에 적힌 탑승 시간이 몇 시인가요?\nB: 6시 20분에 탑승이 시작됩니다."}],"pronunciation":"보딩 타임","id":268},{"day":27,"num":10,"word":"Now boarding","meaning":"지금 탑승 중","hint":"","mnemonic":"now(지금) + boarding(탑승 중).\nNow boarding = 지금 탑승 중이라는 안내 표현.","dialogue":"A: Is our flight now boarding?\nB: Yes. Please have your boarding pass ready.","dialogues":["A: Is our flight now boarding?\nB: Yes. Please have your boarding pass ready.","A: The screen says, “Now boarding.” Should we line up?\nB: Yes, our group has just been called."],"caution":"Now boarding은 주로 탑승 안내에 쓰이는 표현입니다.","past":true,"similar":"","note":"Now boarding은 주로 탑승 안내에 쓰이는 표현입니다.","ko_dialogue":"A: 저희 항공편이 지금 탑승 중인가요?\nB: 네. 탑승권을 준비해주세요.","dialogue_pairs":[{"en":"A: Is our flight now boarding?\nB: Yes. Please have your boarding pass ready.","ko":"A: 저희 항공편이 지금 탑승 중인가요?\nB: 네. 탑승권을 준비해주세요."},{"en":"A: The screen says, “Now boarding.” Should we line up?\nB: Yes, our group has just been called.","ko":"A: 화면에 ‘지금 탑승 중’이라고 나오는데 줄 서야 하나요?\nB: 네, 방금 저희 그룹이 호출됐어요."}],"pronunciation":"나우 보딩","id":269},{"day":28,"num":1,"word":"hold my luggage","meaning":"제 짐을 맡아두다","hint":"","mnemonic":"hold(맡아두다) + my luggage(제 짐).\nCould you hold my luggage?처럼 부탁 문장에 넣어 쓰세요.","dialogue":"A: Could you hold my luggage until three?\nB: Certainly. Here is your claim ticket.","dialogues":["A: Could you hold my luggage until three?\nB: Certainly. Here is your claim ticket.","A: Could you hold my luggage after I check out?\nB: Of course, you can pick it up this evening."],"caution":"hold my luggage만 말하면 명령처럼 들릴 수 있습니다. Could you hold my luggage?로 부탁하세요.","past":true,"similar":"","note":"hold my luggage만 말하면 명령처럼 들릴 수 있습니다. Could you hold my luggage?로 부탁하세요.","ko_dialogue":"A: 3시까지 제 짐을 맡아주시겠어요?\nB: 네. 여기 짐 찾는 표입니다.","dialogue_pairs":[{"en":"A: Could you hold my luggage until three?\nB: Certainly. Here is your claim ticket.","ko":"A: 3시까지 제 짐을 맡아주시겠어요?\nB: 네. 여기 짐 찾는 표입니다."},{"en":"A: Could you hold my luggage after I check out?\nB: Of course, you can pick it up this evening.","ko":"A: 체크아웃 후에 제 짐을 맡아
